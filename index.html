 {id:"freedomhouse-ira-satelite",who:[],theme:"tec",fmt:"text",src:"Freedom House",date:"2026-11-12",lang:"EN",title:"Defeating Authoritarian Digital Blackouts",sum_en:"Freedom House recalls that Iran shut down the internet for nearly three months during last winter’s protests, the longest nationwide blackout on record, and argues that democracies, donors and satellite companies should resist Tehran’s campaign to block satellite internet, which it calls a “tool of war”.",sum:"A Freedom House lembra que o Irã cortou a internet por quase três meses durante os protestos do inverno passado, o mais longo apagão nacional já registrado, e argumenta que democracias, doadores e empresas de satélite devem resistir à campanha de Teerã para bloquear a internet por satélite, que o regime chama de “ferramenta de guerra”.",url:"https://freedomhouse.org/article/defeating-authoritarian-digital-blackouts-countering-internet-shutdowns-through-satellite"},
 {id:"freedomhouse-us-democracy-tracker",who:[],theme:"dem",fmt:"text",src:"Freedom House",date:"2026-11-12",lang:"EN",title:"Freedom House Launches New US Democracy Tracker, Identifies Serious Concerns",sum_en:"Freedom House and the Kettering Foundation launched a quarterly assessment of American democracy built on the method of Freedom in the World. The first edition, covering July to mid-October, places government accountability and media freedom in the range of serious concern. For CEO Jamie Fly, near-record turnout is not enough, because democracy is measured by how freedoms are protected in practice.",sum:"A Freedom House e a Fundação Kettering lançaram uma avaliação trimestral da democracia americana com o método do relatório Freedom in the World. A primeira edição, que cobre de julho a meados de outubro, põe a responsabilização do governo e a liberdade de imprensa na faixa de preocupação séria. Para Jamie Fly, presidente da organização, o comparecimento quase recorde não basta, porque a democracia se mede pela proteção prática das liberdades.",url:"https://freedomhouse.org/article/freedom-house-launches-new-us-democracy-tracker-identifies-serious-concerns"},
 {id:"gzero-kliment-mississippi",who:[],by:"Alex Kliment",theme:"dem",fmt:"text",src:"GZERO Media",date:"2026-11-12",lang:"EN",title:"Mississippi blue(s)",sum_en:"Alex Kliment notes that Democrat Scott Colom's Senate win makes him the first Black senator Mississippi has sent to Washington since 1875, during Reconstruction.",sum:"Alex Kliment registra que a vitória do democrata Scott Colom para o Senado faz dele o primeiro senador negro que o Mississippi manda a Washington desde 1875, durante a Reconstrução.",url:"https://www.gzeromedia.com/news/hard-numbers/mississippi-blue-s"},
 {id:"contrarian-rubin-colom",who:[],by:"Jennifer Rubin",theme:"dem",fmt:"text",src:"The Contrarian",date:"2026-11-12",lang:"EN",title:"History Has Been Made: Mississippi Picked Sen. Scott Colom",sum_en:"Jennifer Rubin describes how Republican Cindy Hyde-Smith conceded once the count left her no path, which Rubin calls a decent response in a party plagued by election denial, and places Colom's victory in the history of a state where Emmett Till and Medgar Evers were murdered.",sum:"Jennifer Rubin conta que a republicana Cindy Hyde-Smith reconheceu a derrota quando a apuração não lhe deixou saída, gesto que a autora chama de decente num partido marcado pela negação de eleições, e põe a vitória de Colom na história de um estado onde Emmett Till e Medgar Evers foram assassinados.",url:"https://www.contrariannews.org/p/history-has-been-made-meet-sen-scott"},
 {id:"hayderecho-teruel-contrapesos",who:[],by:"Germán Teruel",theme:"dem",fmt:"text",src:"Fundación Hay Derecho",date:"2026-11-12",lang:"ES",title:"Gobierne quien gobierne, unos contrapesos robustos",sum_en:"Ahead of Spain's 29 November election, Germán Teruel argues that whoever governs, oversight bodies such as the Constitutional Court, the judicial council, the Bank of Spain, the CNMV, AIReF and public broadcasting must stop being shared out among parties, and proposes open competitions and expert evaluation before any political appointment.",sum:"Antes da eleição espanhola de 29 de novembro, Germán Teruel defende que, seja quem for o governo, órgãos de controle como o Tribunal Constitucional, o Conselho do Poder Judiciário, o Banco de España, a CNMV, a AIReF e a TV pública deixem de ser loteados entre partidos, e propõe concurso público e avaliação técnica antes de qualquer indicação política.",url:"https://www.hayderecho.com/2026/11/12/gobierne-quien-gobierne-unos-contrapesos-robustos/"},
 {id:"kyiv-fenbert-dublin",who:[],by:"Abbey Fenbert",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-12",lang:"EN",title:"Zelensky meets with Trump's envoys in Dublin after their summit with Putin",sum_en:"Hours after meeting Putin at the Kremlin, Steve Witkoff and Jared Kushner met Zelensky near Dublin. Zelensky said Europe would be represented in the next round of talks and that the coming prisoner exchange would be the largest of the war.",sum:"Horas depois de encontrar Putin no Kremlin, Steve Witkoff e Jared Kushner se reuniram com Zelensky perto de Dublin. Zelensky disse que a Europa estará representada na próxima rodada e que a troca de prisioneiros prevista será a maior da guerra.",url:"https://kyivindependent.com/zelensky-meets-with-trumps-envoys-in-dublin-after-their-summit-with-putin/"},
 {id:"kyiv-sorokin-europa-mesa",who:[],by:"Oleksiy Sorokin",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-12",lang:"EN",title:"Europe wants a seat at the table with Russia. It can't agree on who gets it",sum_en:"Oleksiy Sorokin shows that Europeans agree their security must be represented in the US-brokered talks but cannot agree on who speaks for them. Kaja Kallas points to herself and António Costa, while Macron and Merz stop short of backing that pair, and Moscow shows little interest in a European role.",sum:"Oleksiy Sorokin mostra que os europeus concordam que a segurança do continente precisa estar representada nas negociações mediadas pelos EUA, mas não decidem quem fala por eles. Kaja Kallas aponta para ela mesma e António Costa, Macron e Merz não apoiam essa dupla, e Moscou mostra pouco interesse num papel europeu.",url:"https://kyivindependent.com/endless-us-russia-talks-leave-europe-scrambling-for-a-role-in-ukraine-peace-push/"},
 {id:"kyiv-leaver-voluntarios-chineses",who:[],by:"James Leaver",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-12",lang:"EN",title:"'We have nothing left to fear' — Chinese volunteer soldiers in Ukraine",sum_en:"James Leaver profiles Luo Haizhou, who recruits Chinese volunteers for Ukraine's army despite warnings from Chinese state security officers to his family in Shenzhen. About 50 Chinese fight for Ukraine in defiance of Beijing's tacit support for Moscow, and most cannot go home.",sum:"James Leaver conta a história de Luo Haizhou, que recruta voluntários chineses para o exército ucraniano apesar dos avisos da segurança do Estado chinesa à família dele em Shenzhen. Cerca de 50 chineses lutam pela Ucrânia contra o apoio tácito de Pequim a Moscou, e a maioria não pode voltar para casa.",url:"https://kyivindependent.com/we-have-nothing-left-to-fear-chinese-volunteer-soldiers-in-ukraine-2/"},
 {id:"dispatch-lincicome-populismo",who:[],by:"Scott Lincicome",theme:"eco",fmt:"text",src:"The Dispatch",date:"2026-11-12",lang:"EN",title:"Economic Populism Lost, Again",sum_en:"Scott Lincicome admits he was wrong to predict that Trump would not build a global tariff regime, and argues that voters again rejected the high-price agenda both parties sold for a decade. For him, Vance blaming only the Iran war and others blaming only tariffs both miss the point.",sum:"Scott Lincicome admite que errou ao prever que Trump não criaria um regime global de tarifas e diz que os eleitores voltaram a rejeitar a agenda de preços altos que os dois partidos venderam por uma década. Para ele, erra Vance ao culpar só a guerra com o Irã e erra quem culpa só as tarifas.",url:"https://thedispatch.com/newsletter/dispatch-markets/midterm-blue-wave-economic-populism-tariffs-corruption/"},
 {id:"contrarian-oneill-huang",who:[],by:"Brian O'Neill",theme:"tec",fmt:"text",src:"The Contrarian",date:"2026-11-12",lang:"EN",title:"The Huang Affair and Trump’s Indefatigable Disregard for U.S. Intelligence Agencies",sum_en:"Brian O'Neill, former executive editor of the President's Daily Brief, writes that the bigger scandal of Jensen Huang's affair with a suspected Chinese intelligence asset is that Trump was warned months earlier, reminded by Marco Rubio aboard Air Force One, and gave Huang no defensive briefing.",sum:"Brian O'Neill, ex-editor do briefing diário de inteligência da Casa Branca, escreve que o escândalo maior no caso de Jensen Huang com uma suposta agente da inteligência chinesa é que Trump foi avisado meses antes, inclusive por Marco Rubio no Air Force One, e não alertou Huang.",url:"https://www.contrariannews.org/p/the-huang-affair-and-trumps-indefatigable"},
 {id:"bulwark-last-spies-trump",who:["jonathan-v-last"],theme:"tec",fmt:"text",src:"The Bulwark",date:"2026-11-12",lang:"EN",title:"Spies Like Trump",sum_en:"Jonathan V. Last argues that the Huang case holds secrets but no mystery: Trump brought aboard Air Force One an executive he had been told was compromised, and then gave him the chip sales to China that the Chinese agent wanted.",sum:"Jonathan V. Last diz que o caso Huang tem segredos, mas nenhum mistério. Trump levou no Air Force One um executivo que sabia estar comprometido e depois liberou a venda de chips à China que a agente chinesa queria.",url:"https://www.thebulwark.com/p/spies-like-trump"},
 {id:"dispatch-fedasiuk-nvidia",who:[],by:"Ryan Fedasiuk",theme:"tec",fmt:"text",src:"The Dispatch",date:"2026-11-12",lang:"EN",title:"Nvidia Is Bigger Than Jensen Huang",sum_en:"Ryan Fedasiuk, of the Foundation for American Innovation, calls the founder's resignation a sad moment for American tech and an important opportunity to reform the company he built.",sum:"Ryan Fedasiuk, da Foundation for American Innovation, vê a renúncia do fundador como um momento triste para a tecnologia americana e uma chance importante de reformar a empresa que ele criou.",url:"https://thedispatch.com/article/nvidia-jensen-huang-china-resignation-affair/"},
 {id:"dm-schutters-africa-digital",who:[],by:"Lindsey Schutters",theme:"tec",fmt:"text",src:"Daily Maverick",date:"2026-11-12",lang:"EN",title:"US-China battle for African connectivity comes to Cape Town",sum_en:"Lindsey Schutters reads the US Development Finance Corporation's largest direct stake to date, in the African cable and data centre firm WIOCC, as Washington returning to economic statecraft to contest Beijing's hold on the continent's digital backbone.",sum:"Lindsey Schutters lê a maior participação direta já feita pela agência americana de financiamento ao desenvolvimento (DFC), na WIOCC, empresa africana de cabos e data centers, como a volta de Washington à diplomacia econômica para disputar com Pequim a espinha dorsal digital do continente.",url:"https://www.dailymaverick.co.za/article/2026-11-12-digital-statecraft-us-china-tech-backbone-battle-for-africa-comes-to-cape-town/"},
 {id:"bulwark-rampell-ameaca-congresso",who:[],by:"Catherine Rampell",theme:"dem",fmt:"video",src:"The Bulwark",date:"2026-11-11",lang:"EN",title:"Former DOJ Official Tears Apart Trump Admin’s Threat to Congress",sum_en:"Catherine Rampell and Elliot Williams, a former Justice Department official under Obama, argue that the White House threat to treat Democratic investigations as crimes is largely empty, because the Constitution protects congressional oversight, but warn that the administration can use investigations and lawsuits to slow Democrats down.",sum:"Catherine Rampell e Elliot Williams, ex-funcionário do Departamento de Justiça de Obama, argumentam que a ameaça da Casa Branca de tratar como crime as investigações dos democratas é quase vazia, porque a Constituição protege a fiscalização do Congresso, mas alertam que o governo pode usar inquéritos e ações judiciais para atrasar os democratas.",url:"https://www.thebulwark.com/p/former-doj-official-tears-apart-trump"},
 {id:"contrarian-rubin-hegseth-impeachment",who:[],by:"Jennifer Rubin",theme:"dem",fmt:"text",src:"The Contrarian",date:"2026-11-11",lang:"EN",title:"Hegseth Escapes Impeachment; Vets Deserve Better",sum_en:"Jennifer Rubin criticises the 211 to 204 House vote that sent eight articles of impeachment against Defense Secretary Pete Hegseth to committee, with only Republican Thomas Massie joining Democrats, and argues the articles, from the Iran war to the killings in the Caribbean, were fully warranted.",sum:"Jennifer Rubin critica a votação de 211 a 204 em que a Câmara mandou para comissão oito artigos de impeachment contra o secretário da Defesa, Pete Hegseth, com só o republicano Thomas Massie ao lado dos democratas, e argumenta que os artigos, da guerra no Irã às mortes no Caribe, eram plenamente justificados.",url:"https://www.contrariannews.org/p/hegseth-escapes-impeachment-vets"},
 {id:"walsh-jim-jordan",who:["joe-walsh"],theme:"dem",fmt:"text",src:"The Social Contract",date:"2026-11-11",lang:"EN",title:"A Story About Jim Jordan",sum_en:"Joe Walsh, who served in Congress with Jim Jordan, recalls that Jordan once told him Democrats are “evil”, and reads the choice of Jordan as House Republican leader as proof that the party learned nothing from its midterm defeat.",sum:"Joe Walsh, que foi deputado com Jim Jordan, lembra que Jordan lhe disse certa vez que os democratas são “maus”, e lê a escolha de Jordan para liderar os republicanos na Câmara como prova de que o partido não aprendeu nada com a derrota nas urnas.",url:"https://socialcontractwithjoewalsh.substack.com/p/a-story-about-jim-jordan"},
 {id:"eiu-midterms-resultados",who:[],theme:"dem",fmt:"text",src:"EIU",date:"2026-11-11",lang:"EN",title:"US midterms: assessing the results and implications",sum_en:"The Economist Intelligence Unit reads the blue wave as a sharp rebuke of Trump driven by inflation, the economy and the Iran war, giving Democrats a mandate to block his agenda and appointments and to investigate, but without the two-thirds needed to override vetoes.",sum:"A Economist Intelligence Unit lê a onda azul como um repúdio duro a Trump, puxado pela inflação, pela economia e pela guerra com o Irã, que dá aos democratas mandato para barrar a agenda e as nomeações dele e para investigar, mas sem os dois terços necessários para derrubar vetos.",url:"https://www.eiu.com/n/global-themes/blog/us-midterms-assessing-the-results-and-implications/"},
 {id:"dispatch-goldberg-vance-culpa",who:[],by:"Jonah Goldberg",theme:"dem",fmt:"text",src:"The Dispatch",date:"2026-11-11",lang:"EN",title:"Vance’s Midterm Blame Game Is Full of Lies by Omission",sum_en:"Jonah Goldberg writes that the 2028 race began a week after the midterms, with each faction shaping its own story of the result, and argues that Vice President J.D. Vance’s explanation for the Republican defeat leaves out what matters.",sum:"Jonah Goldberg escreve que a corrida de 2028 começou uma semana depois das eleições, com cada facção moldando a sua versão do resultado, e argumenta que a explicação do vice-presidente J.D. Vance para a derrota republicana deixa de fora o que importa.",url:"https://thedispatch.com/article/vance-midterms-excuses-iran-israel-independents/"},
 {id:"kyiv-abu-dhabi-moscou",who:[],by:"Kate Tsurkan e Martin Fornusek",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-11",lang:"EN",title:"Trump's envoys to travel to Moscow as Abu Dhabi talks end without breakthrough",sum_en:"The first trilateral talks since February ended in Abu Dhabi with a new prisoner exchange and no breakthrough, and U.S. envoys Jared Kushner and Steve Witkoff said they would go to Moscow to seek Putin’s “blessing” to bring Europeans into the negotiations.",sum:"A primeira rodada trilateral desde fevereiro terminou em Abu Dhabi com uma nova troca de prisioneiros e sem avanço, e os enviados americanos Jared Kushner e Steve Witkoff disseram que iriam a Moscou pedir a “bênção” de Putin para incluir os europeus nas negociações.",url:"https://kyivindependent.com/2nd-day-of-trilateral-peace-talks-begins-between-ukraine-russia-us-in-abu-dhabi/"},
 {id:"pra-negociacoes-russos",who:["paulo-roberto-de-almeida"],theme:"geo",fmt:"text",src:"Diplomatizzando",date:"2026-11-11",lang:"PT",title:"Negociações com os russos não são negociações: apenas imposições",sum_en:"Paulo Roberto de Almeida reproduces Zelensky’s account of the Abu Dhabi talks and argues that Russia does not negotiate but imposes, while Ukraine stands firm in defence of its sovereignty with the help of the EU and of countries that uphold the UN Charter.",sum:"Paulo Roberto de Almeida reproduz o relato de Zelensky sobre a rodada de Abu Dhabi e argumenta que a Rússia não negocia, só impõe, enquanto a Ucrânia se mantém firme na defesa da soberania com ajuda da União Europeia e dos países que defendem a Carta da ONU.",url:"https://diplomatizzando.blogspot.com/2026/11/negociacoes-com-os-russos-nao-sao.html"},
 {id:"techdirt-joshua-wong",who:[],by:"Timothy Geigner",theme:"tec",fmt:"text",src:"Techdirt",date:"2026-11-11",lang:"EN",title:"Chinese Govt. Stacks Charges On Jailed Joshua Wong To Keep Him Imprisoned Another Decade",sum_en:"Timothy Geigner argues that the new ten-year sentence for pro-democracy activist Joshua Wong, who was due for release in January 2027, shows how the 2020 National Security Law, which broke the deal under which Britain handed Hong Kong back to China, is used to jail and silence critics.",sum:"Timothy Geigner argumenta que a nova pena de dez anos para o ativista pró-democracia Joshua Wong, que sairia da prisão em janeiro de 2027, mostra como a Lei de Segurança Nacional de 2020, que rompeu o acordo pelo qual o Reino Unido devolveu Hong Kong à China, serve para prender e calar críticos.",url:"https://www.techdirt.com/2026/11/10/chinese-govt-stacks-charges-on-jailed-joshua-wong-to-keep-him-imprisoned-another-decade/"},
 {id:"grandcontinent-leicht-ia-europa",who:[],by:"Anton Leicht",theme:"tec",fmt:"text",src:"Le Grand Continent",date:"2026-11-11",lang:"FR",title:"L’Europe détient la clef de la course à l’IA",sum_en:"Anton Leicht argues that the most critical bottleneck in the AI chain is European, since only the Dutch firm ASML makes the machines for advanced chips, but that Europe barely uses this leverage while Washington sets export policy and American companies reap the gains.",sum:"Anton Leicht argumenta que o gargalo mais crítico da cadeia da inteligência artificial é europeu, porque só a holandesa ASML fabrica as máquinas dos chips avançados, mas que a Europa quase não usa essa vantagem, enquanto Washington dita a política de exportação e as empresas americanas colhem os ganhos.",url:"https://legrandcontinent.eu/fr/2026/11/11/leurope-detient-la-clef-de-la-course-a-lia/"},
 {id:"bulwark-saletan-fraude-a-prova",who:[],by:"Will Saletan",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-10",lang:"EN",title:"Trump’s Electoral Fraud Claims Are Now Evidence-Proof",sum_en:"Will Saletan argues that Trump’s new story about the midterms, posted almost a week after the defeat, completes a fraud narrative built to survive any evidence, so that any loss can be called stolen.",sum:"Will Saletan argumenta que a nova versão de Trump sobre as eleições, publicada quase uma semana depois da derrota, completa uma narrativa de fraude feita para resistir a qualquer evidência, de modo que toda derrota possa ser chamada de roubo.",url:"https://www.thebulwark.com/p/donald-trump-electoral-fraud-claims-after-2026-midterms-are-evidence-proof"},
 {id:"bulwark-charen-republica-consertar",who:[],by:"Mona Charen",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-10",lang:"EN",title:"A Republic, If We Can Fix It",sum_en:"Mona Charen notes that the 3 November vote ran normally, with no agents at the polls, no major lawsuits and quick concessions, and argues that the defeat of Trump does not repair the institutions that enabled him.",sum:"Mona Charen observa que a votação de 3 de novembro correu com normalidade, sem agentes nas seções, sem grandes ações judiciais e com concessões rápidas, e argumenta que a derrota de Trump não conserta as instituições que permitiram a ascensão dele.",url:"https://www.thebulwark.com/p/a-republic-if-we-can-fix-it-midterms-2026-new-day"},
 {id:"assunto-giannetti-lula-4",who:["renata-lo-prete"],theme:"eco",fmt:"podcast",src:"O Assunto",date:"2026-11-10",lang:"PT",title:"O futuro da economia brasileira no quarto mandato de Lula",sum_en:"Renata Lo Prete talks with economist Eduardo Giannetti about the economic course Lula signalled in his first address after re-election, after markets reacted badly to the result.",sum:"Renata Lo Prete conversa com o economista Eduardo Giannetti sobre o rumo econômico que Lula sinalizou no primeiro pronunciamento depois da reeleição, depois de o mercado reagir mal ao resultado.",url:"https://omny.fm/shows/o-assunto-1/o-futuro-da-economia-brasileira-no-quarto-mandato-de-lula"},
 {id:"confidencial-ortega-reaparece",who:[],by:"Iván Olivares",theme:"dem",fmt:"text",src:"Confidencial",date:"2026-11-10",lang:"ES",title:"Ortega reaparece para acto exprés de 25 minutos",sum_en:"Iván Olivares reports that Daniel Ortega, absent for 66 days, reappeared looking gaunt for less than 25 minutes at the tomb of Sandinista founder Carlos Fonseca, beside Rosario Murillo and with no officials or diplomats present.",sum:"Iván Olivares relata que Daniel Ortega, ausente havia 66 dias, reapareceu abatido por menos de 25 minutos no mausoléu de Carlos Fonseca, fundador da Frente Sandinista, ao lado de Rosario Murillo e sem funcionários nem diplomatas.",url:"https://confidencial.digital/noticias/ortega-reaparece-para-acto-expres-de-25-minutos/"},
 {id:"kyiv-abu-dhabi-retomada",who:[],by:"Yevgeniya Doluda",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-10",lang:"EN",title:"Ukraine, Russia, US resume trilateral peace talks in Abu Dhabi after 9-month pause",sum_en:"The Kyiv Independent reports that Ukrainian, Russian and US delegations began talks in Abu Dhabi, the first trilateral round since Geneva in February, with Kyiv seeking prisoner exchanges and a maritime and energy truce.",sum:"O Kyiv Independent relata que as delegações da Ucrânia, da Rússia e dos EUA começaram a negociar em Abu Dhabi, na primeira rodada trilateral desde Genebra, em fevereiro, com Kiev em busca de troca de prisioneiros e de uma trégua marítima e energética.",url:"https://kyivindependent.com/ukraine-russia-us-resume-trilateral-peace-talks-in-abu-dhabi-after-9-month-pause/"},
 {id:"kyiv-rubio-garantias-russia",who:[],by:"Olena Goncharova",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-10",lang:"EN",title:"Security guarantees for Ukraine must also be acceptable to Russia, Rubio says",sum_en:"Marco Rubio said that any postwar security guarantees for Ukraine would need to be acceptable to Russia, and that Washington has not settled on a final plan, ahead of the Abu Dhabi talks.",sum:"Marco Rubio disse que qualquer garantia de segurança para a Ucrânia no pós-guerra precisará ser aceitável também para a Rússia e que Washington ainda não fechou um plano, às vésperas da negociação de Abu Dhabi.",url:"https://kyivindependent.com/security-guarantees-for-ukraine-must-also-be-acceptable-to-russia-rubio-says/"},
 {id:"lepoint-chevallier-melenchon-1940",who:[],by:"Arthur Chevallier",theme:"geo",fmt:"text",src:"Le Point",date:"2026-11-10",lang:"FR",title:"Poutine, Mélenchon et le spectre de 1940 : la tragédie du pacifisme français",sum_en:"Arthur Chevallier argues that Jean-Luc Mélenchon’s proposal to let the people of Donbas vote on whether the region goes to Kyiv or Moscow rewards the armed invasion of a sovereign country, and links the stance of Mélenchon and Marine Le Pen to the interwar pacifism that left France unprepared in 1940.",sum:"Arthur Chevallier argumenta que a proposta de Jean-Luc Mélenchon de deixar a população do Donbass votar se a região fica com Kiev ou com Moscou premia a invasão armada de um país soberano, e liga a posição de Mélenchon e de Marine Le Pen ao pacifismo do entreguerras que deixou a França despreparada em 1940.",url:"https://www.lepoint.fr/debats/poutine-melenchon-et-le-spectre-de-1940-la-tragedie-du-pacifisme-francais-6V5M7KLE6NC7BJQQO6PI27IPDU/"},
 {id:"bulwark-saletan-blanche-cnn",who:[],by:"Will Saletan e Catherine Rampell",theme:"dem",fmt:"video",src:"The Bulwark",date:"2026-11-09",lang:"EN",title:"Todd Blanche’s CNN Interview Could Come Back to Bite Him",sum_en:"Will Saletan and Catherine Rampell break down the attorney general’s CNN interview defending Trump’s threats to imprison Democrats and promising to shield Stephen Miller from congressional scrutiny, and argue that it may give Democrats more reasons to investigate him.",sum:"Will Saletan e Catherine Rampell analisam a entrevista em que o procurador-geral defendeu as ameaças de Trump de prender democratas e prometeu proteger Stephen Miller das investigações do Congresso, e argumentam que ela pode dar aos democratas mais motivos para investigá-lo.",url:"https://www.thebulwark.com/p/todd-blanches-cnn-interview-could"},
 {id:"bulwark-rotner-no-kings-act",who:[],by:"Philip Rotner",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-09",lang:"EN",title:"To Rein In Trump, Pass a ‘No Kings Act’",sum_en:"Philip Rotner argues that Trump’s veto will block most of the Democratic agenda and that the new majority should instead pass a law curbing the emergency and war powers Congress has ceded to the presidency over decades.",sum:"Philip Rotner argumenta que o veto de Trump vai barrar quase toda a agenda democrata e que a nova maioria deveria aprovar uma lei que limite os poderes de emergência e de guerra que o Congresso cedeu à Presidência ao longo de décadas.",url:"https://www.thebulwark.com/p/to-rein-in-trump-pass-a-no-kings-act-emergency-power-war-making"},
 {id:"confidencial-tovar-trump-america-latina",who:[],by:"Jesús Tovar",theme:"geo",fmt:"text",src:"Confidencial",date:"2026-11-09",lang:"ES",title:"Trump derrotado: ¿más débil o más peligroso para América Latina?",sum_en:"Jesús Tovar argues that the midterm defeat narrows Trump’s room at home but could intensify his pressure on Latin America, and that the Iran war and its economic costs were decisive for voters.",sum:"Jesús Tovar argumenta que a derrota nas eleições de meio de mandato reduz a margem de Trump em casa, mas pode aumentar a pressão dele sobre a América Latina, e que a guerra com o Irã e o custo dela pesaram no voto.",url:"https://confidencial.digital/opinion/trump-derrotado-mas-debil-o-mas-peligroso-para-america-latina/"},
 {id:"kyiv-europa-abu-dhabi",who:[],by:"Chris Powers",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-09",lang:"EN",title:"Europe's attendance at Abu Dhabi peace talks, clarified",sum_en:"An EU diplomat confirms that Germany, France, the UK, NATO and the EU will take part in the Abu Dhabi talks with Russia that open on 10 November, which were planned as a three-way meeting of Ukraine, Russia and the US. The exact format is still unclear.",sum:"Um diplomata europeu confirma que Alemanha, França, Reino Unido, Otan e União Europeia participarão das negociações com a Rússia em Abu Dhabi, que começam em 10 de novembro e estavam previstas só entre Ucrânia, Rússia e Estados Unidos. O formato ainda não está definido.",url:"https://kyivindependent.com/europes-attendance-at-abu-dhabi-peace-talks-clarified/"},
 {id:"kyiv-trump-60-minutes-forma",who:[],by:"Lachlan Hyatt",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-09",lang:"EN",title:"Ukraine will likely 'end up with a little bit different shape' after war, Trump tells 60 Minutes",sum_en:"In a 60 Minutes interview after the midterm defeat, Trump said a deal is very close and that Ukraine will end the war with “a little bit different shape”, and said he does not know who slowed Starlink in Ukraine.",sum:"Numa entrevista ao 60 Minutes depois da derrota nas urnas, Trump disse que um acordo está muito perto e que a Ucrânia vai terminar a guerra com “uma forma um pouco diferente”, e afirmou não saber quem reduziu a velocidade da Starlink no país.",url:"https://kyivindependent.com/ukraine-will-likely-end-up-with-a-little-bit-different-shape-after-war-trump-tells-60-minutes/"},
 {id:"kyiv-inverno-brutal",who:[],by:"Yevgeniya Doluda",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-09",lang:"EN",title:"'Kyiv is not ready for this' — Ukraine's capital braces for another 'brutal' winter",sum_en:"Kyiv residents fear a winter harsher than the last, as Russia’s jet-powered drones, faster and harder to intercept, threaten electricity, heating, sewage and food supply.",sum:"Os moradores de Kiev temem um inverno pior que o anterior, porque os drones russos a jato, mais rápidos e difíceis de interceptar, ameaçam a eletricidade, o aquecimento, o esgoto e o abastecimento de comida.",url:"https://kyivindependent.com/kyiv-is-not-ready-for-this-ukraines-capital-braces-for-another-brutal-winter/"},
 {id:"bulwark-kristol-fase-debater",who:["bill-kristol", "tim-miller"],theme:"dem",fmt:"podcast",src:"The Bulwark",date:"2026-11-09",lang:"EN",title:"Bill Kristol: This Is the Trump Flailing Phase",sum_en:"Bill Kristol and Tim Miller read Trump’s first week after the midterm rout as a flailing phase, with a feeble claim of a rigged election and an immigration offer to Democrats they see as a way to dodge congressional oversight.",sum:"Bill Kristol e Tim Miller leem a primeira semana de Trump depois da derrota nas urnas como uma fase em que ele se debate, com uma alegação fraca de eleição fraudada e uma oferta de acordo migratório aos democratas que eles veem como manobra para fugir da fiscalização do Congresso.",url:"https://www.thebulwark.com/p/bill-kristol-this-is-the-trump-flailing"},
 {id:"contrarian-rubin-presidente-sao",who:[],by:"Jennifer Rubin",theme:"dem",fmt:"text",src:"The Contrarian",date:"2026-11-09",lang:"EN",title:"Stop Pretending We Have a Sane President",sum_en:"Jennifer Rubin calls Ross Douthat’s 60 Minutes interview with Trump inept, saying it asked nothing about the deaths of Renee Good and Alex Pretti or about naming Stephen Miller chief of staff, and argues that the press and Republicans keep treating an unstable president as normal.",sum:"Jennifer Rubin chama de inepta a entrevista de Ross Douthat com Trump no 60 Minutes, que não perguntou nada sobre as mortes de Renee Good e Alex Pretti nem sobre a escolha de Stephen Miller para chefe de gabinete, e argumenta que a imprensa e os republicanos seguem tratando como normal um presidente instável.",url:"https://www.contrariannews.org/p/stop-pretending-we-have-a-sane-president"},
 {id:"techdirt-doj-desiste-california",who:[],by:"Tim Cushing",theme:"dem",fmt:"text",src:"Techdirt",date:"2026-11-09",lang:"EN",title:"DOJ Drops ‘Illegal Voters’ Lawsuit Against California After Getting Smoked In The Mid-Terms",sum_en:"Tim Cushing reports that the Justice Department dropped its lawsuit against California over supposed illegal voters right after the midterm defeat, and reads the move as a sign that the case was a pre-election tactic.",sum:"Tim Cushing relata que o Departamento de Justiça desistiu da ação contra a Califórnia por supostos eleitores ilegais logo depois da derrota nas urnas, e lê o recuo como sinal de que o processo era uma tática pré-eleitoral.",url:"https://www.techdirt.com/2026/11/09/doj-drops-illegal-voters-lawsuit-against-california-after-getting-smoked-in-the-mid-terms/"},
 {id:"unpopulist-craig-gabinete",who:[],by:"Andy Craig",theme:"dem",fmt:"text",src:"The UnPopulist",date:"2026-11-09",lang:"EN",title:"Democrats Should Do What’s Necessary to Stop Trump From Reassembling a Rogue Cabinet",sum_en:"Andy Craig argues that, after the Supreme Court’s Trump v. Slaughter ruling freed the president to fire members of independent agencies, the Senate’s confirmation vote is the main remaining check, and that the new Democratic majority should use it to block loyalists who ignore the law.",sum:"Andy Craig argumenta que, depois que a decisão Trump v. Slaughter, da Suprema Corte, liberou o presidente para demitir membros de agências independentes, o voto de confirmação do Senado virou o principal freio restante, e que a nova maioria democrata deve usá-lo para barrar leais que ignoram a lei.",url:"https://www.theunpopulist.net/p/democrats-should-do-whats-necessary"},
 {id:"persuasion-linker-miller",who:[],by:"Damon Linker",theme:"dem",fmt:"text",src:"Persuasion",date:"2026-11-09",lang:"EN",title:"The True Believer",sum_en:"Damon Linker writes that the naming of Stephen Miller as White House chief of staff ended the hope that a defeated Trump would seek bipartisanship or step back, and put his most zealous soldier in the most powerful post around him.",sum:"Damon Linker escreve que a escolha de Stephen Miller para chefe de gabinete da Casa Branca acabou com a esperança de que um Trump derrotado buscasse acordos ou se afastasse, e pôs o soldado mais zeloso dele no cargo mais poderoso ao seu redor.",url:"https://www.persuasion.community/p/the-true-believer"},
 {id:"confidencial-zovatto-derrota-trump",who:[],by:"Daniel Zovatto",theme:"dem",fmt:"text",src:"Confidencial",date:"2026-11-09",lang:"ES",title:"La derrota que Trump se buscó",sum_en:"Daniel Zovatto argues that Trump turned the midterms into a referendum on himself and lost it, with Democrats taking both chambers, and that the result rejects a president who read his 2024 win as permission to govern without limits.",sum:"Daniel Zovatto argumenta que Trump transformou as eleições de meio de mandato num referendo sobre si mesmo e perdeu, com os democratas ganhando as duas casas, e que o resultado rejeita um presidente que leu a vitória de 2024 como licença para governar sem limites.",url:"https://confidencial.digital/opinion/la-derrota-que-trump-se-busco/"},
 {id:"meio-doria-proximo-lula",who:["pedro-doria"],theme:"eco",fmt:"text",src:"Meio",date:"2026-11-09",lang:"PT",title:"O próximo Lula",sum_en:"Pedro Doria reads Lula’s first address after re-election as a list of benefits for salaried workers and a debt pardon for the self-employed, and argues that a state designed to protect formal employment only knows how to forgive those it cannot help grow.",sum:"Pedro Doria lê o primeiro pronunciamento de Lula depois da reeleição como uma lista de benefícios para quem tem carteira assinada e um perdão de dívidas para os microempreendedores, e argumenta que um Estado desenhado para proteger o emprego formal só sabe perdoar quem ele não consegue fazer crescer.",url:"https://www.canalmeio.com.br/2026/11/09/o-proximo-lula/"},
 {id:"occrp-irmao-orban-preso",who:[],theme:"dem",fmt:"text",src:"OCCRP",date:"2026-11-09",lang:"EN",title:"High-Profile Smuggling Raids in Hungary Point to Former PM's Brother",sum_en:"OCCRP reports that Hungarian police arrested several suspects in coordinated raids over an alleged visa fraud and people smuggling scheme, and that local media link the operation to Áron Orbán, the younger brother of former prime minister Viktor Orbán.",sum:"O OCCRP relata que a polícia húngara prendeu vários suspeitos em buscas coordenadas sobre um suposto esquema de fraude de vistos e tráfico de pessoas, e que a imprensa local liga a operação a Áron Orbán, irmão mais novo do ex-primeiro-ministro Viktor Orbán.",url:"https://www.occrp.org/en/news/high-profile-smuggling-raids-in-hungary-point-to-former-pms-brother"},
 {id:"lgc-delegacao-russa-abu-dhabi",who:[],by:"Marin Saillofest",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-09",lang:"FR",title:"Négociations Ukraine-Russie à Abou Dhabi : que révèle la composition de la délégation russe ?",sum_en:"Marin Saillofest shows that the Russian delegation in Abu Dhabi keeps the hardline core that has shared Putin’s maximalist aims since direct talks resumed in May 2025, and that nothing in it signals a change in Moscow’s position.",sum:"Marin Saillofest mostra que a delegação russa em Abu Dhabi mantém o núcleo duro que compartilha os objetivos maximalistas de Putin desde a retomada das conversas diretas, em maio de 2025, e que nada nela sinaliza mudança na posição de Moscou.",url:"https://legrandcontinent.eu/fr/2026/11/09/negociations-ukraine-russie-a-abou-dhabi-que-revele-la-composition-de-la-delegation-russe/"},
 {id:"gzero-eisenkot-nvidia",who:[],by:"Alex Kliment",theme:"geo",fmt:"text",src:"GZERO Media",date:"2026-11-09",lang:"EN",title:"Nvidia CEO admits affair with suspected Chinese spy, Gadi Eisenkot tapped to form government in Israel",sum_en:"Alex Kliment reports that Isaac Herzog gave Gadi Eisenkot up to six weeks to gather 61 of the Knesset’s 120 seats, with Arab parties as kingmakers after winning a record 19, and lists the national security questions raised by Jensen Huang’s affair with a suspected Chinese spy.",sum:"Alex Kliment relata que Isaac Herzog deu a Gadi Eisenkot até seis semanas para reunir 61 das 120 cadeiras do Knesset, com os partidos árabes como fiel da balança depois de um recorde de 19 cadeiras, e lista as dúvidas de segurança nacional abertas pelo caso de Jensen Huang com uma suposta espiã chinesa.",url:"https://www.gzeromedia.com/news/watching/nvidia-ceo-admits-affair-with-suspected-chinese-spy-gadi-eisenkot-tapped-to-form-government-in-israel-myanmars-military-government-announces-special-elections"},
 {id:"cpj-equador-beltran-morto",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-09",lang:"EN",title:"Ecuador journalist Tomás Beltrán Conforme, who denounced local gov corruption, killed outside home",sum_en:"CPJ reports that armed men killed Tomás Beltrán Conforme, founder of the local news site Calcetines, outside his home in Calceta after repeated threats over his reporting on local corruption, and calls for a full investigation.",sum:"O CPJ relata que homens armados mataram Tomás Beltrán Conforme, fundador do site local Calcetines, na porta de casa em Calceta, depois de repetidas ameaças por reportagens sobre corrupção local, e pede uma investigação completa.",url:"https://cpj.org/2026/11/ecuador-journalist-tomas-beltran-conforme-who-denounced-local-gov-corruption-killed-outside-home/"},
 {id:"cpj-argelia-mezghiche-condenado",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-09",lang:"EN",title:"Algerian journalist Abdelali Mezghiche sentenced to 3 years in prison",sum_en:"CPJ reports that a court near Algiers sentenced journalist Abdelali Mezghiche to three years in prison on charges that include publishing content harmful to the national interest, and calls the verdict a weaponization of the judiciary to silence critics.",sum:"O CPJ relata que um tribunal perto de Argel condenou o jornalista Abdelali Mezghiche a três anos de prisão por acusações que incluem publicar conteúdo nocivo ao interesse nacional, e chama o veredito de uso da Justiça para calar críticos.",url:"https://cpj.org/2026/11/algerian-journalist-abdelali-mezghiche-sentenced-to-3-years-in-prison/"},
 {id:"fukuyama-mundo-mais-perigoso",who:["francis-fukuyama"],theme:"geo",fmt:"text",src:"Persuasion",date:"2026-11-08",lang:"EN",title:"The Midterms Just Made the World More Dangerous",sum_en:"Francis Fukuyama argues that Trump, now a lame duck, will double down rather than change course, as the choice of Stephen Miller shows, and that Xi, Putin and Kim may see their window closing and act before January 2029.",sum:"Para Francis Fukuyama, Trump, agora em fim de mandato e enfraquecido, vai dobrar a aposta em vez de mudar de rumo, como mostra a escolha de Stephen Miller, e Xi, Putin e Kim podem ver a janela se fechando e agir antes de janeiro de 2029.",url:"https://www.persuasion.community/p/the-next-two-years-might-be-more"},
 {id:"confidencial-martinez-queda-pena",who:[],by:"Christopher Martínez",theme:"dem",fmt:"text",src:"Confidencial",date:"2026-11-08",lang:"ES",title:"La caída de Peña en Paraguay",sum_en:"Christopher Martínez places Santiago Peña among the Latin American presidents who failed to finish their terms without a democratic breakdown, and notes that, as in earlier Paraguayan crises, the fall began inside the ruling Colorado Party.",sum:"Christopher Martínez inclui Santiago Peña entre os presidentes latino-americanos que não terminaram o mandato sem que houvesse ruptura democrática e observa que, como em crises paraguaias anteriores, a queda começou dentro do próprio Partido Colorado.",url:"https://confidencial.digital/opinion/la-caida-de-pena-en-paraguay/"},
 {id:"dm-sidley-big-tech-midterms",who:[],by:"Steven Boykey Sidley",theme:"tec",fmt:"text",src:"Daily Maverick",date:"2026-11-08",lang:"EN",title:"Crossed Wires: What happens to Big Tech now, post-midterms?",sum_en:"Steven Boykey Sidley reads last week’s tech sell-off as the sum of the Democratic wave and unease over AI spending, and argues that tighter oversight will not stop the industry’s expansion.",sum:"Steven Boykey Sidley lê a queda das ações de tecnologia na semana passada como a soma da onda democrata com o desconforto diante dos gastos com IA e argumenta que mais fiscalização não vai frear a expansão do setor.",url:"https://www.dailymaverick.co.za/article/2026-11-08-crossed-wires-what-happens-to-big-tech-now-after-the-midterms/"},
 {id:"dm-gumede-coalizoes-municipais",who:[],by:"William Gumede",theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-11-08",lang:"EN",title:"Over 100 hung councils, 14 days: A negotiator’s rulebook for coalitions that last",sum_en:"With more than 100 South African councils left without a majority after the 4 November local elections, William Gumede argues that lasting coalitions require putting citizens before patronage and using the Constitution as a guide.",sum:"Com mais de 100 câmaras municipais sul-africanas sem maioria depois das eleições locais de 4 de novembro, William Gumede argumenta que coalizões duradouras exigem pôr o cidadão à frente do clientelismo e usar a Constituição como guia.",url:"https://www.dailymaverick.co.za/opinionista/2026-11-08-over-100-hung-councils-14-days-a-negotiators-rulebook-for-coalitions-that-last/"},
 {id:"dm-haffajee-sacp-alianca",who:[],by:"Ferial Haffajee",theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-11-08",lang:"EN",title:"SACP’s strong showing signals end of the Tripartite Alliance",sum_en:"Ferial Haffajee reports that the South African Communist Party won 271 seats in its first local election on its own, and argues that the result ends 32 years of the alliance in which its members voted for the ANC.",sum:"Ferial Haffajee relata que o Partido Comunista Sul-Africano conquistou 271 cadeiras na primeira eleição local que disputou sozinho e argumenta que o resultado encerra 32 anos da aliança em que seus filiados votavam no CNA.",url:"https://www.dailymaverick.co.za/article/2026-11-08-sacps-strong-showing-signals-end-of-the-tripartite-alliance/"},
 {id:"lgc-russia-indenizacoes-regioes",who:[],by:"Ramona Bloj",theme:"eco",fmt:"text",src:"Le Grand Continent",date:"2026-11-08",lang:"FR",title:"Économie russe : les pertes élevées en Ukraine pèsent sur le budget de l’État et des régions",sum_en:"Le Grand Continent reports that at least ten Russian regions cut, delayed or scrapped payments to families of soldiers killed in Ukraine this year, with Belgorod’s falling from 3 million to 1 million roubles, while 71 of 83 regions ran budget deficits in 2025.",sum:"O Le Grand Continent relata que pelo menos dez regiões russas cortaram, adiaram ou suspenderam neste ano a indenização às famílias de soldados mortos na Ucrânia, com Belgorod baixando de 3 milhões para 1 milhão de rublos, enquanto 71 das 83 regiões fecharam 2025 com déficit.",url:"https://legrandcontinent.eu/fr/2026/11/08/economie-russe-les-pertes-elevees-en-ukraine-pesent-sur-le-budget-de-letat-et-des-regions/"},
 {id:"bulwark-kristol-miller-de-fato",who:[],by:"William Kristol e Sarah Matthews",theme:"dem",fmt:"video",src:"The Bulwark",date:"2026-11-07",lang:"EN",title:"Stephen Miller May Now Be the De Facto President",sum_en:"Bill Kristol and Sarah Matthews, who worked with Stephen Miller in Trump’s first term, discuss why the new chief of staff could become the de facto president and whether Pete Hegseth can keep his job as the Iran war drags on.",sum:"Bill Kristol e Sarah Matthews, que trabalhou com Stephen Miller no primeiro governo Trump, discutem por que o novo chefe de gabinete pode virar o presidente de fato e se Pete Hegseth consegue manter o cargo com a guerra do Irã se arrastando.",url:"https://www.thebulwark.com/p/stephen-miller-may-now-be-the-de"},
 {id:"unpopulist-olson-interferencia-real",who:[],by:"Walter Olson",theme:"dem",fmt:"text",src:"The UnPopulist",date:"2026-11-07",lang:"EN",title:"The WSJ Is Wrong: Trump’s Attempted Election Interference Was Dangerously Real",sum_en:"Walter Olson rejects the Wall Street Journal editorial that called fears of election theft a partisan panic, recalls 18 months of Trump’s efforts to meddle with the midterms, and says the Justice Department should drop its suit against Alaska’s certification of its Senate race.",sum:"Walter Olson rejeita o editorial do Wall Street Journal que chamou de pânico partidário o medo de fraude, lembra 18 meses de tentativas de Trump de interferir nas eleições e diz que o Departamento de Justiça deveria desistir da ação contra a certificação do Senado no Alasca.",url:"https://www.theunpopulist.net/p/the-wsj-is-wrong-trumps-attempted"},
 {id:"occrp-paraguai-pena-preso",who:[],theme:"dem",fmt:"text",src:"OCCRP",date:"2026-11-07",lang:"EN",title:"Paraguayan President Impeached and Arrested Amid Financial Meltdown and Mass Protests",sum_en:"OCCRP reports that Santiago Peña was removed from office and arrested, accused among other things of trying to protect a digital bank he once co-owned, after authorities ordered it into insolvency and millions of Paraguayans lost access to their accounts.",sum:"O OCCRP relata que Santiago Peña foi destituído e preso, acusado entre outras coisas de tentar proteger um banco digital do qual foi sócio, depois que as autoridades decretaram a insolvência do banco e milhões de paraguaios ficaram sem acesso às contas.",url:"https://www.occrp.org/en/news/paraguayan-president-impeached-and-arrested-amid-financial-meltdown-and-mass-protests"},
 {id:"lgc-qanon-miller",who:[],by:"Ramona Bloj",theme:"dem",fmt:"text",src:"Le Grand Continent",date:"2026-11-07",lang:"FR",title:"L’administration Trump réactive-t-elle les réseaux complotistes du 6 janvier ?",sum_en:"Le Grand Continent notes that Stephen Miller’s appointment came with messages that specialists read as coded signals to QAnon, such as Pete Hegseth’s “Patriots in control” post on 6 November.",sum:"O Le Grand Continent registra que a nomeação de Stephen Miller veio acompanhada de mensagens que especialistas leem como sinais codificados para o QAnon, como o post “Patriots in control” de Pete Hegseth em 6 de novembro.",url:"https://legrandcontinent.eu/fr/2026/11/07/ladministration-trump-reactive-t-elle-les-reseaux-complotistes-du-6-janvier/"},
 {id:"noah-democratas-parte-dificil",who:["noah-smith"],theme:"dem",fmt:"text",src:"Noahpinion",date:"2026-11-06",lang:"EN",title:"For the Democrats, now comes the hard part",sum_en:"Noah Smith recalls that the waves of 1974 and 1976 did not give Democrats lasting dominance, and argues that, with Trump still holding the veto, the party must show a clear ideology and a plan for using its victory.",sum:"Noah Smith lembra que as ondas de 1974 e 1976 não deram aos democratas um domínio duradouro e argumenta que, com Trump ainda dono do veto, o partido precisa mostrar uma ideologia clara e um plano para usar a vitória.",url:"https://www.noahpinion.blog/p/for-the-democrats-now-comes-the-hard"},
 {id:"dispatch-nelson-fim-guerra-ira",who:[],by:"Mike Nelson",theme:"geo",fmt:"text",src:"The Dispatch",date:"2026-11-06",lang:"EN",title:"The Countdown to the End of the War in Iran",sum_en:"Mike Nelson, a retired Special Forces officer, argues that the blue wave was a rebuke of the administration and that, if Trump does not end the war in Iran, the new Congress will.",sum:"Mike Nelson, oficial reformado das Forças Especiais, argumenta que a onda democrata foi uma reprovação ao governo e que, se Trump não encerrar a guerra no Irã, o novo Congresso encerra.",url:"https://thedispatch.com/article/midterms-iran-war-trump-congress/"},
 {id:"leonard-ira-depois-midterms",who:["mark-leonard"],theme:"geo",fmt:"podcast",src:"ECFR",date:"2026-11-06",lang:"EN",title:"The Iran war after the midterms",sum_en:"Mark Leonard talks with Ellie Geranmayeh and Jeremy Shapiro about the midterm results and what they mean for the war in Iran.",sum:"Mark Leonard conversa com Ellie Geranmayeh e Jeremy Shapiro sobre o resultado das midterms e o que ele significa para a guerra no Irã.",url:"https://ecfr.eu/podcasts/episode/the-iran-war-after-the-midterms/"},
 {id:"lo-prete-paraguai-ueno",who:["renata-lo-prete"],theme:"eco",fmt:"podcast",src:"O Assunto",date:"2026-11-06",lang:"PT",title:"Paraguai: o escândalo financeiro que deixou o país sem comando",sum_en:"On O Assunto, Renata Lo Prete talks with political scientist Eduardo Heleno about the Ueno bank fraud, which left more than half of Paraguay’s adults without access to their money, and the protests demanding Peña’s impeachment.",sum:"No O Assunto, Renata Lo Prete conversa com o cientista político Eduardo Heleno sobre a fraude do banco Ueno, que deixou mais da metade dos adultos do Paraguai sem acesso ao próprio dinheiro, e os protestos pelo impeachment de Peña.",url:"https://omny.fm/shows/o-assunto-1/paraguai-o-esc-ndalo-financeiro-que-deixou-o-pa-s-sem-comando"},
 {id:"dispatch-ia-perdeu-midterms",who:[],by:"Jack Kubinec",theme:"tec",fmt:"text",src:"The Dispatch",date:"2026-11-06",lang:"EN",title:"The Midterms’ Other Big Loser: AI",sum_en:"Jack Kubinec reports that the deep-pocketed AI super PAC backed by Silicon Valley leaders could not overcome the industry’s image problem, and that almost everything went wrong for corporate AI interests in the midterms.",sum:"Jack Kubinec relata que o super PAC da inteligência artificial, bancado por líderes do Vale do Silício, não superou a má imagem do setor, e que quase tudo deu errado para os interesses das empresas de IA nas midterms.",url:"https://thedispatch.com/article/midterms-super-pacs-ai-spending/"},
 {id:"lgc-china-estatisticas",who:[],by:"Marin Saillofest",theme:"tec",fmt:"text",src:"Le Grand Continent",date:"2026-11-06",lang:"FR",title:"Pourquoi la Chine publie-t-elle 7 fois moins de séries statistiques qu’il y a dix ans ?",sum_en:"Le Grand Continent shows how China’s statistics bureau went from more than 80,000 published series in 2012 to a fraction of that, and argues that the opacity helps Beijing control the story of its economy. It also lists the series Trump has stopped publishing.",sum:"O Le Grand Continent mostra como o órgão de estatística da China passou de mais de 80 mil séries publicadas em 2012 a uma fração disso e argumenta que a opacidade ajuda Pequim a controlar a narrativa sobre a economia. O texto também lista as séries que Trump deixou de publicar.",url:"https://legrandcontinent.eu/fr/2026/11/06/pourquoi-la-chine-publie-t-elle-7-fois-moins-de-series-statistiques-quil-y-a-dix-ans/"},
 {id:"gzero-paraguai-renuncia",who:[],by:"Alex Kliment",theme:"dem",fmt:"text",src:"GZERO Media",date:"2026-11-06",lang:"EN",title:"Paraguayan president’s resignation, UAE’s Colombian mercenary ties in Sudan, Wiretapping scandal in Indonesia",sum_en:"GZERO reports that Santiago Peña offered his resignation on 5 November amid the political and financial crisis set off by the intervention of Ueno Bank, linked to the president’s former business partners.",sum:"O GZERO relata que Santiago Peña apresentou a renúncia em 5 de novembro, em meio à crise política e financeira aberta pela intervenção no Ueno Bank, ligado a ex-sócios do presidente.",url:"https://www.gzeromedia.com/news/watching/paraguayan-presidents-resignation-uaes-colombian-mercenary-ties-in-sudan-wiretapping-scandal-in-indonesia"},
 {id:"gzero-bildt-servia-estudantes",who:[],by:"Carl Bildt",theme:"dem",fmt:"video",src:"GZERO Media",date:"2026-11-06",lang:"EN",title:"Serbia’s Student List faces a difficult road ahead",sum_en:"Carl Bildt says Serbia’s Student List, which ended Aleksandar Vučić’s 14 years in power, must now organize as a government and take on judicial reform, media freedom, corruption and the stalled EU accession.",sum:"Carl Bildt diz que a Lista dos Estudantes, que encerrou os 14 anos de Aleksandar Vučić no poder, agora precisa se organizar como governo e enfrentar a reforma do Judiciário, a liberdade de imprensa, a corrupção e a adesão travada à União Europeia.",url:"https://www.gzeromedia.com/video/gzero-europe/serbias-student-list-faces-a-difficult-road-ahead"},
 {id:"techdirt-trujillo-dados-federais",who:[],by:"Mario Trujillo",theme:"tec",fmt:"text",src:"Techdirt",date:"2026-11-06",lang:"EN",title:"Resisting The Menace Of Federal Data Consolidation",sum_en:"Mario Trujillo argues that the federal government unlawfully pooled Americans’ personal data over two years, first through DOGE, then through data sharing with ICE and finally in attempts to purge state voter rolls.",sum:"Mario Trujillo argumenta que o governo federal juntou ilegalmente dados pessoais dos americanos em dois anos, primeiro pelo DOGE, depois pelo compartilhamento com o ICE e por fim nas tentativas de expurgar as listas de eleitores dos estados.",url:"https://www.techdirt.com/2026/11/06/resisting-the-menace-of-federal-data-consolidation/"},
 {id:"cato-ia-midterms",who:[],theme:"tec",fmt:"text",src:"Cato Institute",date:"2026-11-06",lang:"EN",title:"Three Things the Midterm Election Tells Us About AI and the Likely Future of AI Policy",sum_en:"The Cato Institute looks at how AI figured in the campaign and in the ballot questions, notes that feared AI-driven election disruption did not materialize, and expects the fight over AI rules to continue in Congress and the states.",sum:"O Cato Institute examina o papel da inteligência artificial na campanha e nas consultas populares, nota que a temida interferência eleitoral por IA não aconteceu e prevê que a disputa sobre as regras da IA continue no Congresso e nos estados.",url:"https://www.cato.org/blog/3-things-2026-midterm-election-tells-us-about-ai-likely-future-ai-policy"},
 {id:"article19-meta-cma",who:[],theme:"tec",fmt:"text",src:"Article 19",date:"2026-11-06",lang:"EN",title:"United Kingdom: CMA must take action on Meta’s new business terms",sum_en:"Article 19 and a coalition of UK civil society groups urge the Competition and Markets Authority to act against Meta’s new commercial terms, which allow the company to crawl and reuse content from the websites of businesses that use its services.",sum:"A Article 19 e uma coalizão de organizações britânicas pedem à autoridade de concorrência do Reino Unido que aja contra os novos termos comerciais da Meta, que permitem à empresa rastrear e reutilizar o conteúdo dos sites dos negócios que usam seus serviços.",url:"https://www.article19.org/resources/uk-cma-must-take-action-on-metas-new-business-terms/"},
 {id:"cpj-novaya-gazeta-fecha",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-06",lang:"EN",title:"Post-mortem of a ‘killing’: How the Russian state forced Novaya Gazeta to close",sum_en:"CPJ reports that Novaya Gazeta, one of Russia’s last independent outlets, ceases to exist on 9 November after more than 30 years of repression that cost the lives of five of its journalists, and says its closure shows Putin’s determination to cut Russians off from anything but Kremlin propaganda.",sum:"O CPJ relata que a Novaya Gazeta, um dos últimos veículos independentes da Rússia, deixa de existir em 9 de novembro depois de mais de 30 anos de repressão que custaram a vida de cinco de seus jornalistas, e diz que o fechamento mostra a determinação de Putin de isolar os russos de tudo que não seja propaganda do Kremlin.",url:"https://cpj.org/2026/11/post-mortem-of-a-killing-how-the-russian-state-forced-novaya-gazeta-to-close/"},
 {id:"cpj-servia-novo-governo",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-06",lang:"EN",title:"After historic election, Serbia's new government must prioritize journalist safety and accountability",sum_en:"CPJ says Aleksandar Vučić’s defeat on 25 October is a chance to reverse 14 years of media backsliding, and urges the incoming Student List government to investigate past attacks on journalists and reform state media.",sum:"O CPJ diz que a derrota de Aleksandar Vučić em 25 de outubro é a chance de reverter 14 anos de retrocesso na liberdade de imprensa e pede ao novo governo da Lista dos Estudantes que investigue os ataques a jornalistas e reforme a mídia estatal.",url:"https://cpj.org/2026/11/after-historic-election-serbias-new-government-must-prioritize-journalist-safety-and-accountability/"},
 {id:"cpj-hungria-reformas-midia",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-06",lang:"EN",title:"CPJ, partners welcome initial media reforms in Hungary, call for further safeguards",sum_en:"After a mission to Budapest, CPJ and 12 partner groups welcome the new government’s first steps to dismantle institutions captured under Viktor Orbán, including the Sovereignty Protection Office, and warn that the real test is still to come.",sum:"Depois de uma missão a Budapeste, o CPJ e 12 organizações parceiras saúdam os primeiros passos do novo governo para desmontar as instituições capturadas sob Viktor Orbán, como o Escritório de Proteção da Soberania, e avisam que o teste de verdade ainda está por vir.",url:"https://cpj.org/2026/11/cpj-partners-welcome-initial-media-reforms-in-hungary-call-for-further-safeguards/"},
 {id:"wathi-licoes-midterms",who:[],theme:"geo",fmt:"text",src:"WATHI",date:"2026-11-06",lang:"FR",title:"Petites leçons des élections de mi-mandat aux Etats-Unis : scruter les nuances de gris",sum_en:"WATHI’s chronicle says the US results offer some hope of slowing the rush toward the abyss and the advance of extremist ideas, and insists that the words are “slow” and “brake”, not reverse.",sum:"A crônica do WATHI diz que o resultado americano dá alguma esperança de frear a corrida para o abismo e o avanço das ideias extremistas, e insiste que as palavras certas são frear e desacelerar, não reverter.",url:"https://www.wathi.org/podcast-les-voix-de-wathi/petites-lecons-des-elections-de-mi-mandat-aux-etats-unis-scruter-les-nuances-de-gris/"},
 {id:"heath-segundo-melhor",who:[],by:"Joseph Heath",theme:"dem",fmt:"text",src:"Persuasion",date:"2026-11-06",lang:"EN",title:"Civilization Is About Settling for Second-Best",sum_en:"Philosopher Joseph Heath argues that our moral intuitions are poor guides to the complex institutions of modern society, and that much of the work of civilization is keeping in place the arrangements that work, even when they feel second-best.",sum:"O filósofo Joseph Heath argumenta que nossas intuições morais são guias ruins para as instituições complexas da sociedade moderna e que boa parte do trabalho da civilização é manter os arranjos que funcionam, mesmo quando parecem o segundo melhor.",url:"https://www.persuasion.community/p/civilization-is-about-settling-for"},
 {id:"nordlinger-congresso-ucrania",who:[],by:"Jay Nordlinger",theme:"geo",fmt:"text",src:"The Next Move",date:"2026-11-06",lang:"EN",title:"The New Congress and Ukraine",sum_en:"Jay Nordlinger recalls the cold shoulder Republican leaders gave Zelenskyy after 2022 and argues that, even if it takes the administration to deliver aid, the new Democratic Congress can take a firm moral stand for Ukraine.",sum:"Jay Nordlinger lembra a frieza dos líderes republicanos com Zelensky depois de 2022 e argumenta que, mesmo que a ajuda dependa do governo, o novo Congresso democrata pode assumir uma posição moral firme a favor da Ucrânia.",url:"https://www.thenextmove.org/p/the-new-congress-and-ukraine"},
 {id:"brookings-israel-eua-eleicoes",who:[],theme:"geo",fmt:"video",src:"Brookings Institution",date:"2026-11-06",lang:"EN",title:"Israel after the elections: What’s next for US-Israel relations?",sum_en:"Brookings’ Center for Middle East Policy discusses how Israel’s election results may shape the Trump administration’s approach to Israel and what the midterms reveal about American opinion on Israel and Palestine.",sum:"O Centro de Política do Oriente Médio da Brookings discute como o resultado da eleição em Israel pode mudar a postura do governo Trump em relação ao país e o que as eleições de meio de mandato revelam sobre a opinião americana a respeito de Israel e da Palestina.",url:"https://www.youtube.com/watch?v=krbfWXcnwkc"},
 {id:"lgc-janela-transatlantica",who:[],by:"Louis Puel",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-05",lang:"FR",title:"Après les midterms, une fenêtre pour la relation transatlantique ?",sum_en:"Le Grand Continent sees a window for Europe: the new senators serve six years, outlasting Trump’s term, and Congress now has more means to check his foreign policy.",sum:"O Le Grand Continent vê uma janela para a Europa: os novos senadores ficam seis anos, mais que o resto do mandato de Trump, e o Congresso passa a ter mais meios de controlar sua política externa.",url:"https://legrandcontinent.eu/fr/2026/11/05/apres-les-midterms-une-fenetre-pour-la-relation-transatlantique/"},
 {id:"dm-tlhabi-sem-mandato",who:[],by:"Redi Tlhabi",theme:"geo",fmt:"text",src:"Daily Maverick",date:"2026-11-05",lang:"EN",title:"US voters have not handed us a mandate, we have work to do",sum_en:"Redi Tlhabi warns the South African government not to mistake relief at Trump’s defeat for a mandate, since some of the disagreements with Washington predate him and cross party lines.",sum:"Redi Tlhabi adverte o governo sul-africano a não confundir o alívio com a derrota de Trump com um mandato, porque parte das divergências com Washington é anterior a ele e atravessa os dois partidos.",url:"https://www.dailymaverick.co.za/opinionista/2026-11-05-us-voters-have-not-handed-us-a-mandate-we-have-work-to-do/"},
 {id:"confidencial-castaneda-mexico",who:[],by:"Jorge Castañeda",theme:"geo",fmt:"text",src:"Confidencial",date:"2026-11-05",lang:"ES",title:"Elecciones en EE. UU. y las mentiras en torno a México",sum_en:"Former Mexican foreign minister Jorge Castañeda argues that a weakened Trump will be limited in the pressure he can put on Mexico, and that none of the predictions about Mexico before the vote came true.",sum:"O ex-chanceler mexicano Jorge Castañeda argumenta que um Trump enfraquecido fica limitado para pressionar o México e que nenhuma das previsões sobre o país antes do voto se cumpriu.",url:"https://confidencial.digital/opinion/elecciones-en-ee-uu-y-las-mentiras-en-torno-a-mexico/"},
 {id:"theprint-trump-derrotado-perigoso",who:["shekhar-gupta"],theme:"geo",fmt:"video",src:"ThePrint",date:"2026-11-05",lang:"EN",title:"CutTheClutter: Defeated, lame-duck, dangerous — what Trump’s midterms setback means for India, West Asia, the world",sum_en:"Shekhar Gupta describes a defeated but dangerous president and what two more years of Trump mean for India and the Middle East.",sum:"Shekhar Gupta descreve um presidente derrotado e perigoso e o que mais dois anos de Trump significam para a Índia e o Oriente Médio.",url:"https://theprint.podbean.com/e/cuttheclutter-defeated-lame-duck-dangerous-what-trump-s-midterms-setback-means-for-india-west-asia-the-world/"},
 {id:"dm-anc-campo-minado",who:[],theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-11-05",lang:"EN",title:"ANC on the rack: coalition minefield could unleash biggest internal ructions yet",sum_en:"Daily Maverick shows that the ANC’s national leadership must decide within three weeks on coalitions in six or seven metros, a choice that could split the party before the 2029 national election.",sum:"O Daily Maverick mostra que a direção nacional do ANC precisa decidir em três semanas as coalizões em seis ou sete metrópoles, escolha que pode rachar o partido antes da eleição nacional de 2029.",url:"https://www.dailymaverick.co.za/article/2026-11-05-anc-on-the-rack-coalition-minefield-could-unleash-biggest-internal-ructions-yet/"},
 {id:"dm-vick-desprezo-anc",who:[],by:"Chris Vick",theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-11-05",lang:"EN",title:"The ANC’s problem isn’t communication, it’s contempt",sum_en:"Former ANC communicator Chris Vick argues that the party’s failures in the local election campaign reflect contempt for criticism that has turned into contempt for voters.",sum:"Chris Vick, ex-assessor de comunicação do ANC, argumenta que as falhas do partido na campanha municipal revelam um desprezo pela crítica que virou desprezo pelo eleitor.",url:"https://www.dailymaverick.co.za/opinionista/2026-11-05-the-ancs-problem-isnt-communication-its-contempt/"},
 {id:"diamond-reformas-novo-congresso",who:[],by:"Larry Diamond",theme:"dem",fmt:"text",src:"The UnPopulist",date:"2026-11-05",lang:"EN",title:"Top Reforms for the New Democratic Congress: End Corruption, Restore Democracy",sum_en:"Larry Diamond argues that the new Democratic majority must fight corruption and repair the damage to democracy while answering voters on prices, jobs and housing, and asks whether Democrats will build coalitions from the center or end the Senate filibuster.",sum:"Larry Diamond argumenta que a nova maioria democrata precisa combater a corrupção e consertar os danos à democracia enquanto responde aos eleitores sobre preços, empregos e moradia, e pergunta se o partido vai buscar coalizões a partir do centro ou acabar com o filibuster no Senado.",url:"https://www.theunpopulist.net/p/top-reforms-for-the-new-democratic"},
 {id:"contrarian-ornstein-e-agora",who:[],by:"Norman Ornstein",theme:"dem",fmt:"text",src:"The Contrarian",date:"2026-11-05",lang:"EN",title:"Now What?",sum_en:"Norman Ornstein says that before any agenda, Democrats in Congress must change how they work and communicate, naming those responsible for corruption and the reckless war and holding them accountable without retribution.",sum:"Norman Ornstein diz que, antes de qualquer agenda, os democratas no Congresso precisam mudar o jeito de trabalhar e de se comunicar, apontando os responsáveis pela corrupção e pela guerra e cobrando contas deles sem revanche.",url:"https://www.contrariannews.org/p/now-what"},
 {id:"cpj-congresso-liberdade-imprensa",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-05",lang:"EN",title:"120th Congress must protect the First Amendment right to a free press",sum_en:"CPJ urges the newly elected Congress to restore press freedom protections at home and abroad by immediately strengthening oversight of federal agencies.",sum:"O CPJ pede que o Congresso recém-eleito restaure a proteção à liberdade de imprensa dentro e fora do país, começando por reforçar a fiscalização das agências federais.",url:"https://cpj.org/2026/11/120th-congress-must-protect-the-first-amendment-right-to-a-free-press/"},
 {id:"last-vance-empurrar-trump",who:["jonathan-v-last"],theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-05",lang:"EN",title:"The Conspiracy to Push Donald Trump Aside",sum_en:"Jonathan V. Last reads JD Vance’s post blaming the Iran war, inflation and closeness to Israel for the defeat as the soft launch of his 2028 campaign and an attempt, coordinated with allies, to box Trump in.",sum:"Jonathan V. Last lê o post em que JD Vance culpa a guerra do Irã, a inflação e a proximidade com Israel pela derrota como o lançamento informal da candidatura dele em 2028 e uma tentativa, combinada com aliados, de encurralar Trump.",url:"https://www.thebulwark.com/p/jd-vance-replace-donald-trump-conspiracy"},
 {id:"bulwark-saletan-boca-de-urna",who:[],by:"Will Saletan",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-05",lang:"EN",title:"Exit Polls: Trump Is Why Republicans Lost",sum_en:"Will Saletan uses exit polls to argue that Trump sank his own party, with 44% of House voters saying they voted to oppose him and only 16% to support him, more than twice the gap of 2018 and 2022.",sum:"Will Saletan usa as pesquisas de boca de urna para argumentar que Trump afundou o próprio partido, com 44% dos eleitores dizendo que votaram contra ele e só 16% a favor, mais que o dobro da diferença de 2018 e 2022.",url:"https://www.thebulwark.com/p/exit-polls-trump-is-why-republicans-lost-midterms-2026-blue-wave"},
 {id:"dispatch-magness-tarifas",who:[],by:"Phillip W. Magness",theme:"eco",fmt:"text",src:"The Dispatch",date:"2026-11-05",lang:"EN",title:"How Tariffs Became the Millstone That Sank the GOP",sum_en:"Phillip W. Magness says Vance’s war theory is wrong. In the NBC exit poll, 66% said tariffs hurt the economy and only 4% named foreign policy their top issue, and Trump’s economic approval had been sinking since “Liberation Day” in April 2025.",sum:"Phillip W. Magness diz que a tese de Vance sobre a guerra está errada. Na boca de urna da NBC, 66% disseram que as tarifas prejudicaram a economia e só 4% apontaram a política externa como tema principal, e a aprovação econômica de Trump vinha caindo desde o “Dia da Libertação”, em abril de 2025.",url:"https://thedispatch.com/article/tariffs-midterms-j-d-vance-donald-trump-republicans/"},
 {id:"dispatch-catoggio-maos-limpas",who:[],by:"Nick Catoggio",theme:"dem",fmt:"text",src:"The Dispatch",date:"2026-11-05",lang:"EN",title:"Clean Hands",sum_en:"Nick Catoggio criticizes JD Vance for blaming the war, and Israel, for the Republican wipeout, days after Trump said on Fox News that the United States will end all military aid to Israel at the end of the year.",sum:"Nick Catoggio critica JD Vance por culpar a guerra, e Israel, pelo desastre republicano, dias depois de Trump dizer na Fox News que os Estados Unidos encerrarão toda a ajuda militar a Israel no fim do ano.",url:"https://thedispatch.com/newsletter/boilingfrogs/vance-midterms-blame-republican-losses-iran-war-israel/"},
 {id:"cato-interferencia-fracassada",who:[],theme:"dem",fmt:"text",src:"Cato Institute",date:"2026-11-05",lang:"EN",title:"It Was Failed Election Meddling, Not Absence of Election Meddling",sum_en:"The Cato Institute rejects the Wall Street Journal’s claim that fears of election theft were a partisan panic, recalling 18 months of executive orders, lawsuits over voter rolls and last-minute suits in California and Alaska that courts almost all blocked.",sum:"O Cato Institute rejeita a tese do Wall Street Journal de que o medo de fraude foi pânico partidário e lembra 18 meses de decretos, processos para obter cadastros de eleitores e ações de última hora na Califórnia e no Alasca, quase todos barrados pela Justiça.",url:"https://www.cato.org/blog/it-was-failed-election-meddling-not-absence-election-meddling"},
 {id:"cato-isencoes-nao-compraram-votos",who:[],theme:"eco",fmt:"text",src:"Cato Institute",date:"2026-11-05",lang:"EN",title:"Tax Carve-Outs Didn’t Buy Republicans the Midterms",sum_en:"The Cato Institute argues that tax breaks aimed at constituencies, such as no tax on tips and the new senior deduction, did not help Republicans, and that the result is no mandate for much higher taxes either.",sum:"O Cato Institute argumenta que as isenções feitas para agradar grupos de eleitores, como gorjetas sem imposto e a nova dedução para idosos, não ajudaram os republicanos, e que o resultado também não é um mandato para impostos bem mais altos.",url:"https://www.cato.org/blog/tax-carve-outs-didnt-buy-republicans-midterms"},
 {id:"freedomhouse-joshua-wong",who:[],theme:"dem",fmt:"text",src:"Freedom House",date:"2026-11-05",lang:"EN",title:"Hong Kong: Human Rights Organizations Condemn Unjust Sentencing of Joshua Wong",sum_en:"Freedom House and other groups condemn the 10-year sentence given to Joshua Wong under the National Security Law, his second, and warn that citing his meetings with US officials such as Marco Rubio shows Beijing trying to control who foreign governments may talk to.",sum:"A Freedom House e outras organizações condenam a pena de 10 anos dada a Joshua Wong pela Lei de Segurança Nacional, a segunda contra ele, e alertam que o uso de encontros dele com autoridades americanas como Marco Rubio mostra Pequim tentando controlar com quem governos estrangeiros podem falar.",url:"https://freedomhouse.org/article/hong-kong-human-rights-organizations-condemn-unjust-sentencing-joshua-wong"},
 {id:"cpj-israel-detencoes-jornalistas",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-05",lang:"EN",title:"CPJ alarmed by surge in Israeli detentions, alleged abuse of journalists",sum_en:"CPJ reports four journalists detained by Israeli authorities in the first four days of November, among them Arab48’s Abed Abu Shehadeh, accused of “contacting a foreign agent” after interviewing Azmi Bishara.",sum:"O CPJ registra quatro jornalistas detidos por autoridades israelenses nos primeiros quatro dias de novembro, entre eles Abed Abu Shehadeh, do Arab48, acusado de “contato com agente estrangeiro” depois de entrevistar Azmi Bishara.",url:"https://cpj.org/2026/11/cpj-alarmed-by-surge-in-israeli-detentions-alleged-abuse-of-journalists/"},
 {id:"lgc-petroleo-golfo",who:[],by:"Marin Saillofest",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-05",lang:"FR",title:"Téhéran peine à bloquer les exportations de pétrole du Golfe",sum_en:"Le Grand Continent shows that, despite pressure from the Revolutionary Guards, oil flows from the Gulf were back in October to a level close to their pre-war one.",sum:"O Le Grand Continent mostra que, apesar da pressão da Guarda Revolucionária, o fluxo de petróleo do Golfo voltou em outubro a um nível próximo do de antes da guerra.",url:"https://legrandcontinent.eu/fr/2026/11/05/teheran-peine-a-bloquer-les-exportations-de-petrole-du-golfe/"},
 {id:"lgc-mudanca-de-rumo-trump",who:[],by:"Marin Saillofest",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-05",lang:"FR",title:"Iran, Israël, Russie : après la défaite lors des midterms, vers un changement de cap de Trump ?",sum_en:"Le Grand Continent notes that Vance blames the defeat on the cost of living, the Iran war, the abandonment of America First and the relationship with Israel, and gathers signs that Trump may shift course on foreign policy.",sum:"O Le Grand Continent registra que Vance atribui a derrota ao custo de vida, à guerra do Irã, ao abandono do America First e à relação com Israel, e reúne sinais de que Trump pode mudar de rumo na política externa.",url:"https://legrandcontinent.eu/fr/2026/11/05/iran-israel-russie-apres-la-defaite-lors-des-midterms-vers-un-changement-de-cap-de-trump/"},
 {id:"carnegie-congresso-politica-externa",who:[],theme:"geo",fmt:"text",src:"Carnegie Endowment for International Peace",date:"2026-11-05",lang:"EN",title:"What the New Democratic Congress Can (and Can’t) Do on Foreign Policy",sum_en:"Carnegie scholars note that Democrats now hold the gavel and the purse while the executive still pulls the levers, and look at where Congress can push, from oversight of Africa policy and democracy promotion to AI.",sum:"Pesquisadores do Carnegie lembram que os democratas agora controlam a pauta e o orçamento, mas é o Executivo quem conduz a política externa, e mostram onde o Congresso pode pressionar, da fiscalização da política para a África e da defesa da democracia à inteligência artificial.",url:"https://carnegieendowment.org/emissary/2026/11/democratic-congress-midterms-foreign-policy-ai-iran-russia"},
 {id:"moisi-licoes-derrota-trump",who:["dominique-moisi"],theme:"geo",fmt:"text",src:"Les Echos",date:"2026-11-05",lang:"FR",title:"Trump : les leçons d'une déroute",sum_en:"Dominique Moïsi argues that “normal” America said no to Trump’s message of fear and hatred. The economy weighed, above all diesel prices driven up by the Iran war, but not only that.",sum:"Dominique Moïsi argumenta que a América “normal” disse não à mensagem de medo e ódio de Trump. A economia pesou, sobretudo o preço do diesel puxado pela guerra do Irã, mas não só ela.",url:"https://www.lesechos.fr/idees-debats/editos-analyses/trump-les-lecons-dune-deroute-2261152"},
 {id:"aq-paraguai-pena-renuncia",who:[],theme:"eco",fmt:"text",src:"Americas Quarterly",date:"2026-11-05",lang:"EN",title:"REACTION: Paraguay’s Peña Resigns Amid a Banking Crisis",sum_en:"Americas Quarterly reports that Santiago Peña resigned and the lower house impeached him unanimously after the collapse of the digital bank Ueno froze the savings of some 3 million people. Peña held shares in its holding company until last year, and public entities had deposited heavily in it.",sum:"A Americas Quarterly relata que Santiago Peña renunciou e a Câmara aprovou o impeachment por unanimidade depois que o colapso do banco digital Ueno congelou as economias de cerca de 3 milhões de pessoas. Peña tinha ações da holding até o ano passado, e entes públicos haviam depositado muito dinheiro no banco.",url:"https://www.americasquarterly.org/article/reaction-paraguays-pena-resigns-amid-a-banking-crisis/"},
 {id:"cpj-yoani-sanchez",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-05",lang:"EN",title:"Cuban journalist Yoani Sánchez, director of 14ymedio, arrested amid wider crackdown on independent reporting",sum_en:"CPJ condemns the arrest of Yoani Sánchez by State Security in Havana and links it to a week of detentions of independent journalists, including Camila Acosta and CubaNet’s Adelth Bonne Gamboa.",sum:"O CPJ condena a prisão de Yoani Sánchez pela Segurança do Estado em Havana e a liga a uma semana de detenções de jornalistas independentes, entre eles Camila Acosta e Adelth Bonne Gamboa, do CubaNet.",url:"https://cpj.org/2026/11/cuban-journalist-yoani-sanchez-director-of-14ymedio-arrested-amid-wider-crackdown-on-independent-reporting/"},
 {id:"14ymedio-yoani-sanchez-liberada",who:[],theme:"tec",fmt:"text",src:"14ymedio",date:"2026-11-05",lang:"ES",title:"Secuestrada durante nueve horas por la policía política, Yoani Sánchez es acusada de atentar contra el orden constitucional",sum_en:"14ymedio reports that its director was released after nine hours in the hands of State Security and charged with “attacking the constitutional order”, after warning colleagues in four words that the police had taken her.",sum:"O 14ymedio relata que sua diretora foi solta depois de nove horas nas mãos da Segurança do Estado e acusada de “atentado contra a ordem constitucional”, depois de avisar os colegas em quatro palavras que a polícia a havia levado.",url:"https://www.14ymedio.com/cuba/yoani-sanchez-secuestrada-policia-politica-habana_1_1132860.html"},
 {id:"masnick-tech-bros-perderam",who:["mike-masnick"],theme:"tec",fmt:"text",src:"Techdirt",date:"2026-11-05",lang:"EN",title:"The Tech Bros Who Bet On Fascism Lost. Don’t Let The Internet Pay For It.",sum_en:"Mike Masnick says the tech billionaires who went all in on MAGA “played themselves”, and warns that the backlash against them should not turn into laws that punish the open internet.",sum:"Mike Masnick diz que os bilionários da tecnologia que apostaram tudo no trumpismo se deram mal e alerta que a reação contra eles não deve virar leis que punam a internet aberta.",url:"https://www.techdirt.com/2026/11/05/the-tech-bros-who-bet-on-fascism-lost-dont-let-the-internet-pay-for-it/"},
