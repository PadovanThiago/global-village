<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Global Village curates analysis of the contemporary world through the lens of liberal democracy.">
<!-- Fase de teste. Retirar no lançamento (20/11/2026) para o site voltar às buscas. -->
<meta name="robots" content="noindex, nofollow">
<title>Global Village</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Prévia de link (WhatsApp, redes sociais). A imagem precisa de endereço absoluto; trocar ao mudar de domínio. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Global Village">
<meta property="og:title" content="Global Village">
<meta property="og:description" content="Analysis of the contemporary world through the lens of liberal democracy, summarised in five languages.">
<meta property="og:url" content="https://padovanthiago.github.io/global-village/">
<meta property="og:image" content="https://padovanthiago.github.io/global-village/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Global Village. Understand the world through the lens of liberal democracy.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Layout: jornal internacional em azul-noite sobre papel. Faixa de navegação fixa, colunas editoriais, faixas de pausa (números, assistir) e uma única cor de sinal, o terracota da praça no centro do símbolo. */
:root{
  color-scheme:light;
  --paper:#F5F2EA; --surface:#FFFDF8; --soft:#ECE7DB; --ink:#14213D; --ink-2:#4A5068; --rule:#D6D0C2;
  --band:#ECE7DB; --band-2:#FFFDF8; --band-ink:#14213D; --band-muted:#4A5068; --band-rule:#CFC8B8;
  --signal:#C4411F; --signal-ink:#FFFDF8; --signal-text:#A3361A; --ok:#1F6B3A; --bad:#9A2A12; --focus:#1A56DB;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --wrap:1240px;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:inherit}
a:hover{color:var(--signal-text)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* logos */
.logo{display:block;height:44px;width:auto}
.logo-w{display:none}

/* top strip + header */
.strip{background:var(--soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--rule)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:6px}
.langs{display:flex;gap:4px}
.langs button{min-width:40px;min-height:32px;font:inherit;font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
header.site .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
header.site .brand{display:flex;align-items:center;text-decoration:none}
nav.main{display:flex;gap:4px 20px;flex-wrap:wrap;font-weight:600;font-size:15px;margin-left:auto}
nav.main a{text-decoration:none;padding:6px 0;border-bottom:3px solid transparent}
nav.main a[aria-current="page"]{border-bottom-color:var(--signal)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--ink);color:var(--paper)}
.menu-btn{display:none}
@media (max-width:900px){
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:2px solid var(--ink);flex-direction:column;gap:0;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:12px 0;border-bottom:1px solid var(--rule);font-size:17px}
  .menu-btn{display:inline-flex}
  .hdr-actions{margin-left:auto}
}

/* type */
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.display{font-family:var(--f-display);font-weight:600;line-height:1;letter-spacing:-.015em;margin:0}
.h-xl{font-size:clamp(48px,8vw,104px)}
.h-l{font-size:clamp(34px,5vw,56px)}
.h-m{font-size:clamp(26px,3.4vw,38px)}
.serif{font-family:var(--f-serif)}
.lede{font-family:var(--f-serif);font-size:clamp(18px,2vw,21px);line-height:1.5;max-width:44em;margin:0}
.muted{color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--ink)}
.tag.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn:hover{color:inherit}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.band .pill{border-color:var(--band-rule);color:var(--band-ink)}
.band .pill[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.field{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--surface);min-height:48px;padding:0 12px}
.field input,.field select{border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:15px;width:100%;min-width:0}
.filters{display:flex;flex-direction:column;gap:14px;padding-block:16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.filter-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filter-row>.kicker{min-width:88px}
.count{font-size:14px;color:var(--ink-2)}

/* sections */
section.block{padding-block:48px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.rule-top{border-top:6px solid var(--ink);padding-top:14px}
.band{background:var(--band);color:var(--band-ink)}
.band .muted{color:var(--band-muted)}
.band a:hover{color:var(--signal-text)}
.band{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.split{display:flex;flex-wrap:wrap;gap:40px}
.split>.main-col{flex:999 1 560px;min-width:0}
.split>.side-col{flex:1 1 300px;min-width:0}

/* cards */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1.5px solid var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-family:var(--f-serif);font-size:23px;line-height:1.22;font-weight:700}
.card .meta{font-size:14px;color:var(--ink-2);margin:0}
.card .meta a{font-weight:700;color:var(--ink);text-decoration:none}
.card .meta a:hover{color:var(--signal-text)}
.card p.sum{margin:0;font-size:15px;line-height:1.55}
.card .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.card .tags{display:inline-flex;gap:6px;flex-wrap:wrap}
.card .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;min-height:44px}
.paywall{margin:0;font-size:14px;line-height:1.5;padding:10px 12px;background:var(--soft);display:flex;gap:8px;align-items:flex-start}
.empty{padding:28px;border:1.5px dashed var(--ink);font-size:16px;line-height:1.5}

/* hero */
.hero{display:flex;flex-wrap:wrap;gap:40px;padding-block:40px 32px}
.hero .lead{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.hero h1{font-family:var(--f-serif);font-weight:700;font-size:clamp(36px,5.4vw,64px);line-height:1.03;letter-spacing:-.01em;margin:0}
.sumbox{background:var(--surface);border:1.5px solid var(--ink);padding:20px 22px;display:flex;flex-direction:column;gap:10px;max-width:780px}
.sumbox p{margin:0;font-family:var(--f-serif);font-size:20px;line-height:1.5}
.radar{flex:1 1 320px;min-width:0}
.radar ol{list-style:none;margin:0;padding:0}
.radar li a{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.radar .n{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--signal);min-width:22px}
.radar .t{font-family:var(--f-serif);font-size:19px;line-height:1.3;font-weight:600}

/* stats */
.stats{display:grid;gap:20px 32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));padding-block:28px}
.stat{display:flex;align-items:baseline;gap:12px}
.stat b{font-family:var(--f-display);font-weight:600;font-size:52px;line-height:1;color:var(--signal);font-variant-numeric:tabular-nums}
.stat span{font-size:15px;line-height:1.35;color:var(--band-muted)}

/* people */
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.person{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);background:var(--surface);text-decoration:none;min-height:68px}
.person:hover{border-color:var(--ink);color:inherit}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:18px}
.avatar.pub{background:var(--signal);color:var(--signal-ink);border-radius:0}
.avatar.xl{width:132px;height:132px;font-size:52px}
.person .nm{font-weight:700;font-size:15px;display:block}
.person .ar{font-size:13px;color:var(--ink-2);display:block}
.person .ct{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.person .ct.pending{color:var(--ink-2);font-weight:500}

/* profile */
.profile{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-start;padding-block:24px 32px;border-bottom:2px solid var(--ink)}
.profile .info{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px 24px;margin:0}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.facts dd{margin:2px 0 0;font-weight:600}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;flex-wrap:wrap;gap:8px 24px;padding:22px 0;border-top:1px solid var(--rule)}
.timeline .when{flex:0 0 110px}
.timeline .when b{display:block;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1}
.timeline .body{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:8px}
.timeline h3{margin:0;font-family:var(--f-serif);font-size:23px;line-height:1.25}
.src{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--rule)}
.status-ok{font-size:12px;font-weight:700;padding:5px 9px;background:var(--ink);color:var(--paper);white-space:nowrap}
.status-pend{font-size:12px;font-weight:700;padding:4px 8px;border:1.5px dashed var(--ink);white-space:nowrap}
.side-stack{display:flex;flex-direction:column;gap:28px}
.side-stack h2{margin:0 0 10px;font-size:18px;font-weight:700}
.crumbs{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;padding-top:20px}

/* watch */
.posters{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.poster{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:330px}
.poster h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.poster .orig{font-size:13px;font-style:italic;color:var(--band-muted)}
.poster .foot{border-top:1px solid var(--band-rule);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.avail i{width:9px;height:9px;border-radius:50%;display:inline-block}
.av-sub i,.av-free i{background:var(--ok)}
.av-rent i{background:var(--signal)}
.av-none i,.av-nf i{background:transparent;border:1.5px solid var(--band-muted)}
.poster a.see{font-weight:700;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.soc{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.soc article{background:var(--surface);border:1px solid var(--rule);color:var(--ink);padding:18px;display:flex;flex-direction:column;gap:8px}
.soc h3{margin:0;font-family:var(--f-serif);font-size:21px}

/* orgs */
.orgs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.org{display:flex;flex-direction:column;gap:6px;padding:16px;border:1.5px solid var(--ink);background:var(--surface);text-decoration:none}
.org b{font-size:16px}
.org span{font-size:14px;color:var(--ink-2);line-height:1.4}

/* newsletter */
.nl{background:var(--signal);color:var(--signal-ink)}
.nl .wrap{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;padding-block:48px}
.nl form{flex:1 1 380px;display:flex;flex-wrap:wrap;gap:10px}
.nl input{flex:1 1 240px;min-height:52px;border:2px solid var(--ink);padding:0 16px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.nl button{min-height:52px;padding:0 24px;background:var(--ink);color:var(--paper);border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.nl a{color:var(--signal-ink)}
.nl .nl-cta{flex:1 1 380px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.nl .nl-go{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;background:var(--ink);color:var(--paper);font-weight:700;font-size:16px;text-decoration:none}
.ok-msg{font-weight:700}
.err-msg{font-weight:700;margin:0 0 8px}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--ink);cursor:pointer;font-weight:600;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--ink)}

/* about */
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{border-top:6px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-size:40px;line-height:1;color:var(--signal)}
.prose{max-width:44em;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.6}
.prose p{margin:0}

/* search overlay */
.overlay{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 56px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.overlay .panel{background:var(--paper);border:2px solid var(--ink);width:min(760px,100%);max-height:80vh;display:flex;flex-direction:column}
.overlay .panel .field{border:0;border-bottom:2px solid var(--ink)}
.overlay .res{overflow:auto;padding:8px 16px 16px}
.overlay .res h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.overlay .res a{display:block;padding:10px 0;border-bottom:1px solid var(--rule);text-decoration:none}


/* value proposition */
.vp{border-bottom:1px solid var(--rule)}
.vp-grid{display:flex;flex-wrap:wrap;gap:32px 56px;padding-block:44px 28px;align-items:flex-start}
.vp-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.vp-title{font-size:clamp(40px,6vw,78px)}
#feed{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.vp-pillars{flex:1 1 340px;min-width:0;list-style:none;margin:0;padding:0;display:grid;gap:0}
.vp-pillars li{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--rule)}
.vp-pillars li:first-child{border-top:6px solid var(--ink)}
.vp-pillars b{font-size:17px}
.vp-pillars span{font-size:15px;color:var(--ink-2);line-height:1.5}
.vp-stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));padding-block:0 32px}
.vp-stats .stat{background:var(--surface);border:1px solid var(--rule);padding:14px 16px}
.vp-stats .stat b{font-size:44px}
.vp-stats .stat span{color:var(--ink-2)}
.soft-band{background:var(--soft);border-top:1px solid var(--rule)}

/* feed */
.feed-grid{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.feed-col{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:760px}
.feed-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
@media (max-width:1000px){.feed-side{position:static}.feed-col{max-width:none}}
.feed-head{display:flex;flex-direction:column;gap:6px}
.feed-controls{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{min-height:46px;padding:0 18px;font:inherit;font-weight:700;font-size:15px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.feed{display:flex;flex-direction:column;gap:16px}
.day{margin:12px 0 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.post{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column}
.post:hover{border-color:var(--ink)}
.post-head{display:flex;gap:12px;align-items:center;padding:16px 18px 0}
.pname{display:block;font-weight:700;font-size:15px;text-decoration:none;line-height:1.3}
.pmeta{display:block;font-size:13px;color:var(--ink-2);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptime{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);white-space:nowrap}
.post-body{padding:14px 18px 6px;display:flex;flex-direction:column;gap:10px}
.post-body h3{margin:0;font-family:var(--f-serif);font-size:24px;line-height:1.22;font-weight:700}
.post-body h3 a{text-decoration:none}
.post-body .sum{margin:0;font-size:16px;line-height:1.55}
.ed-note{margin:0;font-size:14px;line-height:1.5;padding:10px 12px;background:var(--soft)}
.ed-note b{color:var(--signal-text)}
.media{display:flex;gap:12px;align-items:center;padding:12px;background:var(--soft);text-decoration:none;font-size:14px}
.play{width:44px;height:44px;flex:none;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center}
.post-actions{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 10px 10px;border-top:1px solid var(--soft);margin-top:8px}
.act{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;font:inherit;font-size:14px;font-weight:600;background:transparent;border:0;color:var(--ink-2);cursor:pointer;text-decoration:none}
.act:hover{color:var(--ink);background:var(--soft)}
.act.strong{color:var(--ink);font-weight:700}
.act[aria-pressed="true"]{color:var(--ink)}
.side-box{background:var(--surface);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:4px}
.side-box h2{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.side-box .more{font-weight:700;font-size:14px;margin-top:8px}
.frow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--soft)}
.frow .avatar{width:38px;height:38px;font-size:15px}
.mini{min-height:36px;padding:0 12px;font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.mini[aria-pressed="true"],.act[data-follow][aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bars a{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 28px;gap:10px;align-items:center;text-decoration:none;font-size:14px;min-height:32px}
.bt{height:8px;background:var(--soft);display:block}
.bt i{display:block;height:100%;background:var(--ink)}
.bn{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.wrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--soft);text-decoration:none;font-size:14px}
.nl-mini{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.nl-mini input{min-height:46px;border:2px solid var(--ink);padding:0 12px;font:inherit;background:var(--surface);color:var(--ink)}
.nl-mini .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;font-weight:700;font-size:14px;z-index:90}
footer.site{border-top:2px solid var(--ink);margin-top:24px}
footer.site .cols{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));padding-block:40px}
footer.site h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
footer.site ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
footer.site a{text-decoration:none}
.proto{font-size:13px;line-height:1.5;color:var(--ink-2);padding:10px 12px;border:1px dashed var(--ink-2)}
.notice{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
@media (prefers-reduced-motion: no-preference){ main{animation:fade .25s ease-out} @keyframes fade{from{opacity:.4}to{opacity:1}} }
</style>

  about_lens_t:"A lente",about_lens:["Há quase vinte anos o mundo perde democracias. Os relatórios do V-Dem e da Freedom House registram esse recuo ano após ano, e hoje já existem mais autocracias do que democracias no planeta. Boa parte dessa virada veio pelas urnas, com populismos autoritários de direita e de esquerda que chegam ao poder pelo voto e depois desmontam, por dentro, as regras que permitiriam tirá-los de lá.", "A perda é grande porque a democracia liberal funciona como uma infraestrutura. Foi sobre ela que se construíram algumas das maiores conquistas da humanidade, como a ampliação das liberdades individuais, a queda da mortalidade infantil, o acesso à educação, a liberdade acadêmica e um longo período com menos guerras entre países. Quando essa infraestrutura se desgasta, os efeitos aparecem depressa. As liberdades encolhem e as guerras voltam, enquanto a política se transforma numa disputa entre inimigos.", "Acompanhar quem pensa com clareza sobre tudo isso também ficou mais difícil. As redes estão tomadas pela desinformação que os dois polos produzem, e os algoritmos premiam o que gera raiva. Encontrar análises sérias, de quem rejeita o autoritarismo venha de onde vier, virou um trabalho que quase ninguém tem tempo de fazer.", "O Global Village nasce desse diagnóstico. Acompanhamos pensadores, economistas, jornalistas e políticos de diversos países, em todos os continentes, reunimos o que eles publicam em textos, vídeos e podcasts e entregamos cada análise com um resumo curto no seu idioma e o link para o original. É para quem quer entender política, geopolítica, economia e tecnologia pela lente da democracia liberal sem depender do algoritmo das redes nem visitar dezenas de sites por dia."],about_cur_t:"A curadoria",about_cur:["A curadoria responde a uma pergunta, quem vale a pena acompanhar. Ela nunca decide o que cada autor diz, e por isso o Global Village mostra vozes que discordam entre si.", "Para entrar, uma pessoa ou organização precisa defender de forma consistente eleições livres, Estado de direito, liberdade de expressão, imprensa independente e direitos individuais, e criticar publicamente os autoritários dos dois campos, inclusive o mais próximo do seu meio. Apoiar ou relativizar um golpe desqualifica.", "Cada nome passa por dois curadores de perfis diferentes, que avaliam sem ver o voto um do outro. Quando eles discordam, um terceiro desempata. As aprovações vencem em doze meses e voltam para nova avaliação. Quem financia o projeto não indica curadores nem participa das decisões.", "Quando uma análise curada lê um país de um jeito que os curadores daquela região consideram equivocado, o resumo continua fiel ao autor e o Global Village acrescenta uma nota do editor com o contexto que falta. A meta é ter um curador para cada região do mundo."],step0_t:"Curadoria",step0:"Um conselho de curadores de diferentes tradições políticas decide quem o Global Village acompanha. Só entram vozes que defendem a democracia liberal e criticam autoritários de qualquer lado.",
  about_rights_t:"Direitos e paywall",about_rights:"Mostramos apenas título, um resumo próprio e o link para o original. Conteúdos fechados para assinantes aparecem só com título e link, sem resumo.",
  about_lang_t:"Idiomas",about_lang:"A interface está em inglês, português, espanhol, francês e italiano. Os resumos são gerados no idioma de quem lê, e o original fica a um clique.",
  proto:"Protótipo. Títulos, autores, datas e links das análises são reais e foram coletados em outubro de 2026. Os resumos foram escritos para demonstração.",
  footer_nav:"Navegar",footer_topics:"Temas",footer_about:"Sobre",footer_lang:"Idiomas",vp_kicker:"O que é o Global Village",vp_title:"Entenda o mundo pela lente da democracia liberal",
  vp_lede:"Há quase vinte anos o mundo perde democracias, empurrado por populismos autoritários de direita e de esquerda. Nas redes, tomadas pela desinformação, ficou difícil encontrar quem analisa esse cenário sem aceitar autoritarismo de lado nenhum. O Global Village acompanha dezenas de pensadores, economistas, jornalistas e políticos de diversos países em todos os continentes e entrega cada análise com um resumo curto no seu idioma e o link para o original.",

  nl_page_title:"Newsletter",nl_page_text:"Every weekday morning, three to five stories the most relevant analysts discussed the day before, each with a short summary in your language and a link to the original.",nl_lang:"Newsletter language",nl_preview:"Preview of the next issue",nl_edition:"Tomorrow morning’s issue",
  about_title:"How it works",about_lede:"Global Village gathers, organises and summarises what thinkers, economists, journalists and politicians committed to liberal democracy publish about the contemporary world.",
  step1_t:"Collection",step1:"We automatically monitor the websites, newsletters, video channels and podcasts of every person and organisation in the database.",step2_t:"Classification",step2:"Each new piece is classified by topic, format, origin and language.",step3_t:"Summary and translation",step3:"AI writes a short summary and translates it into the reader’s language. The original text is never reproduced.",step4_t:"Publication",step4:"The piece appears on the site with title, summary and a link to the original, and goes into the next morning’s newsletter.",
  about_lens_t:"The lens",about_lens:["For almost twenty years the world has been losing democracies. The V-Dem and Freedom House reports record this retreat year after year, and there are now more autocracies than democracies on the planet. Much of the shift came through the ballot box, with authoritarian populists of the right and the left who win power by vote and then dismantle, from within, the rules that would let voters remove them.", "The loss is large because liberal democracy works as infrastructure. Some of humanity’s greatest achievements were built on it, such as the expansion of individual freedoms, the fall in child mortality, access to education, academic freedom and a long period with fewer wars between countries. When that infrastructure wears down, the effects show quickly. Freedoms shrink and wars return, while politics turns into a contest between enemies.", "Following those who think clearly about all this has also become harder. Social media is overrun by disinformation produced by both poles, and algorithms reward whatever generates anger. Finding serious analysis from people who reject authoritarianism wherever it comes from has become work almost nobody has time to do.", "Global Village was born from this diagnosis. We follow thinkers, economists, journalists and politicians from many countries on every continent, gather what they publish in texts, videos and podcasts, and deliver each piece with a short summary in your language and a link to the original. It is for people who want to understand politics, geopolitics, economics and technology through the lens of liberal democracy without depending on social media algorithms or visiting dozens of sites a day."],about_cur_t:"Curation",about_cur:["Curation answers one question, whom it is worth following. It never decides what each author says, which is why Global Village shows voices that disagree with one another.", "To be included, a person or organisation must consistently defend free elections, the rule of law, free speech, an independent press and individual rights, and publicly criticise authoritarians in both camps, including the one closest to their own milieu. Supporting or downplaying a coup disqualifies.", "Each name goes to two curators with different profiles, who review it without seeing each other’s vote. When they disagree, a third breaks the tie. Approvals expire after twelve months and come back for review. Funders of the project never nominate curators or take part in decisions.", "When a curated analysis reads a country in a way the curators of that region consider mistaken, the summary stays faithful to the author and Global Village adds an editor’s note with the missing context. The goal is to have a curator for every region of the world."],step0_t:"Curation",step0:"A board of curators from different political traditions decides whom Global Village follows. Only voices that defend liberal democracy and criticise authoritarians on every side are included.",
  about_rights_t:"Rights and paywalls",about_rights:"We show only the title, our own summary and a link to the original. Subscriber-only content appears with title and link only.",
  about_lang_t:"Languages",about_lang:"The interface is in English, Portuguese, Spanish, French and Italian. Summaries are generated in the reader’s language, and the original is one click away.",
  proto:"Prototype. Titles, authors, dates and links are real, collected in October 2026. Summaries were written for demonstration.",
  footer_nav:"Browse",footer_topics:"Topics",footer_about:"About",footer_lang:"Languages",vp_kicker:"What Global Village is",vp_title:"Understand the world through the lens of liberal democracy",
  vp_lede:"For almost twenty years the world has been losing democracies, pushed by authoritarian populisms of the right and the left. On social media, overrun by disinformation, it has become hard to find people who analyse this landscape without accepting authoritarianism from any side. Global Village follows dozens of thinkers, economists, journalists and politicians from many countries on every continent and gives each piece a short summary in your language, with a link to the original.",

L.es=Object.assign({},L.en,{about_lede:"Global Village reúne, organiza y resume lo que pensadores, economistas, periodistas y políticos comprometidos con la democracia liberal publican sobre el mundo contemporáneo.",step0_t:"Curaduría",step0:"Un consejo de curadores de distintas tradiciones políticas decide a quién sigue Global Village. Solo entran voces que defienden la democracia liberal y critican a los autoritarios de cualquier lado.",step1_t:"Recopilación",step1:"Seguimos de forma automática los sitios, newsletters, canales de video y podcasts de cada persona y organización de la base.",step2_t:"Clasificación",step2:"Cada publicación nueva se clasifica por tema, formato, origen e idioma.",step3_t:"Resumen y traducción",step3:"Una IA escribe un resumen breve y lo traduce al idioma del lector. El texto original nunca se reproduce.",step4_t:"Publicación",step4:"El análisis aparece en el sitio con título, resumen y enlace al original, y entra en la newsletter de la mañana siguiente.",about_lens_t:"La lente",about_lens:["Desde hace casi veinte años el mundo pierde democracias. Los informes de V-Dem y de Freedom House registran ese retroceso año tras año, y hoy ya hay más autocracias que democracias en el planeta. Buena parte de ese giro llegó por las urnas, con populismos autoritarios de derecha y de izquierda que llegan al poder por el voto y después desmontan, desde dentro, las reglas que permitirían sacarlos.", "La pérdida es grande porque la democracia liberal funciona como una infraestructura. Sobre ella se construyeron algunas de las mayores conquistas de la humanidad, como la ampliación de las libertades individuales, la caída de la mortalidad infantil, el acceso a la educación, la libertad académica y un largo período con menos guerras entre países. Cuando esa infraestructura se desgasta, los efectos aparecen rápido. Las libertades se reducen y las guerras vuelven, mientras la política se convierte en una disputa entre enemigos.", "Seguir a quienes piensan con claridad sobre todo esto también se volvió más difícil. Las redes están tomadas por la desinformación que producen los dos polos, y los algoritmos premian lo que genera rabia. Encontrar análisis serios, de quienes rechazan el autoritarismo venga de donde venga, se convirtió en un trabajo que casi nadie tiene tiempo de hacer.", "Global Village nace de este diagnóstico. Seguimos a pensadores, economistas, periodistas y políticos de muchos países, en todos los continentes, reunimos lo que publican en textos, videos y podcasts y entregamos cada análisis con un resumen breve en tu idioma y el enlace al original. Es para quien quiere entender la política, la geopolítica, la economía y la tecnología con la lente de la democracia liberal sin depender del algoritmo de las redes ni visitar decenas de sitios al día."],about_cur_t:"La curaduría",about_cur:["La curaduría responde a una pregunta, a quién vale la pena seguir. Nunca decide lo que dice cada autor, y por eso Global Village muestra voces que discrepan entre sí.", "Para entrar, una persona u organización debe defender de forma constante las elecciones libres, el Estado de derecho, la libertad de expresión, la prensa independiente y los derechos individuales, y criticar públicamente a los autoritarios de los dos campos, incluido el más cercano a su entorno. Apoyar o relativizar un golpe descalifica.", "Cada nombre pasa por dos curadores de perfiles distintos, que evalúan sin ver el voto del otro. Cuando no coinciden, un tercero desempata. Las aprobaciones vencen a los doce meses y vuelven a evaluarse. Quien financia el proyecto no designa curadores ni participa en las decisiones.", "Cuando un análisis seleccionado lee un país de una forma que los curadores de esa región consideran equivocada, el resumen sigue fiel al autor y Global Village añade una nota del editor con el contexto que falta. La meta es tener un curador para cada región del mundo."],about_rights_t:"Derechos y muros de pago",about_rights:"Mostramos solo el título, un resumen propio y el enlace al original. Los contenidos exclusivos para suscriptores aparecen solo con título y enlace, sin resumen.",about_lang_t:"Idiomas",proto:"Prototipo. Los títulos, autores, fechas y enlaces son reales y se recopilaron en octubre de 2026. Los resúmenes se escribieron como demostración.",k1_doc:"Documental",k1_series:"Serie",k1_film:"Película",orgs_text:"Índices, think tanks, organizaciones de derechos, redacciones independientes y publicaciones que sostienen el debate sobre la democracia liberal.",ot_pub:"Publicaciones",ot_media:"Periodismo independiente",ot_net:"Derechos y sociedad civil",in_exile:"en el exilio",region_asia:"Asia y Pacífico",region_mena:"Oriente Medio",region_afr:"África",region_eu:"Europa",region_na:"América del Norte",region_latam:"América Latina",w_checked:"Por ahora la disponibilidad sigue el catálogo brasileño de JustWatch, consultado el 24/10/2026. En el sitio final seguirá el país del lector.",about_lang:"La interfaz está en inglés, portugués, español, francés e italiano. Los resúmenes se generan en el idioma del lector y el original está a un clic.",thd_geo:"Relaciones internacionales, guerras y bloques de poder en América Latina, América del Norte, Europa, Rusia, África, Oriente Medio y Asia.",see_all_orgs:"Ver todas las organizaciones",pubs_side:"Publicaciones independientes",watch_text:"Películas, series y documentales que ayudan a entender el autoritarismo, la guerra y la construcción de las democracias, con indicación de dónde verlos.",vp_p2:"Cada pieza recibe un resumen breve en inglés, portugués, español, francés o italiano.",vp_p1:"Elegimos a quién seguir por su compromiso con las elecciones libres, el Estado de derecho y la libertad de expresión, y por su crítica a los autoritarios de todos los signos. Cada voz habla por sí misma.",vp_lede:"Desde hace casi veinte años el mundo pierde democracias, empujado por populismos autoritarios de derecha y de izquierda. En las redes, invadidas por la desinformación, se ha vuelto difícil encontrar a quien analice este escenario sin aceptar el autoritarismo de ningún lado. Global Village sigue a decenas de pensadores, economistas, periodistas y políticos de diversos países en todos los continentes y ofrece cada análisis con un resumen breve en tu idioma y el enlace al original.",tab_all:"Todo",tab_following:"Siguiendo",tab_saved:"Guardados",new:"Nuevo",save:"Guardar",saved:"Guardado",copy_link:"Copiar enlace",copied:"Enlace copiado",follow_short:"Seguir",following:"Siguiendo",load_more:"Cargar más",b_today:"Hoy",b_yesterday:"Ayer",b_week:"Esta semana",b_lastweek:"La semana pasada",b_earlier:"Antes",who_follow:"A quién seguir",month_topics:"Temas del mes",vp_kicker:"Qué es Global Village",vp_title:"Entiende el mundo desde la democracia liberal",vp_cta_feed:"Ver el feed",vp_cta_nl:"Recibir el boletín",locale:"es-ES",tagline:"Análisis del mundo contemporáneo desde la democracia liberal",nav_home:"Inicio",nav_analyses:"Análisis",nav_analysts:"Analistas",nav_topics:"Temas",nav_watch:"Ver",nav_orgs:"Organizaciones",nav_newsletter:"Boletín",nav_about:"Cómo funciona",search:"Buscar",search_ph:"Buscar analista, análisis o título",close:"Cerrar",featured:"Destacado",radar:"En el radar",latest:"Lo más reciente",see_all_analyses:"Ver todos los análisis",all:"Todos",all_f:"Todas",original_in:"original en",summary_label:"Resumen automático",listen:"Escuchar el original",read:"Leer el original",watchv:"Ver el original",more_from:"Más de",paywall:"Contenido exclusivo para suscriptores. Mostramos título y enlace, sin resumen.",content_note:"En este prototipo los resúmenes aparecen en inglés. En el sitio final se generan en tu idioma.",analysts_title:"A quién seguimos",see_all_analysts:"Ver todos los analistas",observatories:"Observatorios",watch_title:"Para ver",watch_all:"Ver todos los títulos",nl_title:"El día en una lectura",nl_text:"De lunes a viernes, a primera hora, los hechos más importantes del día anterior, resumidos en tu id L.fr=Object.assign({},L.en,{about_lede:"Global Village rassemble, organise et résume ce que publient sur le monde contemporain des penseurs, économistes, journalistes et responsables politiques attachés à la démocratie libérale.",step0_t:"Curation",step0:"Un conseil de curateurs issus de différentes traditions politiques décide qui Global Village suit. Seules entrent les voix qui défendent la démocratie libérale et critiquent les autoritaires de tous bords.",step1_t:"Collecte",step1:"Nous suivons automatiquement les sites, newsletters, chaînes vidéo et podcasts de chaque personne et organisation de la base.",step2_t:"Classement",step2:"Chaque nouvelle publication est classée par thème, format, origine et langue.",step3_t:"Résumé et traduction",step3:"Une IA rédige un court résumé et le traduit dans la langue du lecteur. Le texte original n’est jamais reproduit.",step4_t:"Publication",step4:"L’analyse apparaît sur le site avec son titre, son résumé et le lien vers l’original, et entre dans la newsletter du lendemain matin.",about_lens_t:"Notre regard",about_lens:["Depuis près de vingt ans, le monde perd des démocraties. Les rapports de V-Dem et de Freedom House enregistrent ce recul année après année, et l’on compte aujourd’hui plus d’autocraties que de démocraties sur la planète. Une bonne partie de ce basculement est passée par les urnes, avec des populismes autoritaires de droite et de gauche qui arrivent au pouvoir par le vote puis démontent, de l’intérieur, les règles qui permettraient de les en écarter.", "La perte est grande parce que la démocratie libérale fonctionne comme une infrastructure. Certaines des plus grandes conquêtes de l’humanité se sont construites sur elle, comme l’élargissement des libertés individuelles, la baisse de la mortalité infantile, l’accès à l’éducation, la liberté académique et une longue période avec moins de guerres entre pays. Quand cette infrastructure s’use, les effets apparaissent vite. Les libertés reculent et les guerres reviennent, tandis que la politique devient un affrontement entre ennemis.", "Suivre ceux qui pensent clairement tout cela est aussi devenu plus difficile. Les réseaux sont envahis par la désinformation que produisent les deux pôles, et les algorithmes récompensent ce qui suscite la colère. Trouver des analyses sérieuses, de personnes qui rejettent l’autoritarisme d’où qu’il vienne, est devenu un travail que presque personne n’a le temps de faire.", "Global Village est né de ce constat. Nous suivons des penseurs, économistes, journalistes et responsables politiques de nombreux pays, sur tous les continents, nous rassemblons ce qu’ils publient en textes, vidéos et podcasts et nous livrons chaque analyse avec un court résumé dans votre langue et le lien vers l’original. C’est pour celles et ceux qui veulent comprendre la politique, la géopolitique, l’économie et la technologie à travers la démocratie libérale, sans dépendre de l’algorithme des réseaux ni visiter des dizaines de sites par jour."],about_cur_t:"La curation",about_cur:["La curation répond à une question, qui mérite d’être suivi. Elle ne décide jamais de ce que dit chaque auteur, et c’est pourquoi Global Village montre des voix qui ne sont pas d’accord entre elles.", "Pour entrer, une personne ou une organisation doit défendre de façon constante les élections libres, l’État de droit, la liberté d’expression, une presse indépendante et les droits individuels, et critiquer publiquement les autoritaires des deux camps, y compris celui qui est le plus proche de son milieu. Soutenir ou minimiser un coup d’État disqualifie.", "Chaque nom passe par deux curateurs aux profils différents, qui évaluent sans voir le vote de l’autre. En cas de désaccord, un troisième tranche. Les approbations expirent au bout de douze mois et sont réexaminées. Les financeurs du projet ne désignent pas de curateurs et ne participent pas aux décisions.", "Quand une analyse retenue lit un pays d’une manière que les curateurs de cette région jugent erronée, le résumé reste fidèle à l’auteur et Global Village ajoute une note de la rédaction avec le contexte qui manque. L’objectif est d’avoir un curateur pour chaque région du monde."],about_rights_t:"Droits et accès payant",about_rights:"Nous affichons seulement le titre, un résumé original et le lien vers la source. Les contenus réservés aux abonnés apparaissent avec le titre et le lien uniquement, sans résumé.",about_lang_t:"Langues",proto:"Prototype. Les titres, auteurs, dates et liens sont réels et ont été collectés en octobre 2026. Les résumés ont été rédigés pour la démonstration.",k1_doc:"Documentaire",k1_series:"Série",k1_film:"Film",orgs_text:"Indices, think tanks, organisations de défense des droits, rédactions indépendantes et publications qui nourrissent le débat sur la démocratie libérale.",ot_pub:"Publications",ot_media:"Journalisme indépendant",ot_net:"Droits et société civile",in_exile:"en exil",region_asia:"Asie-Pacifique",region_mena:"Moyen-Orient",region_afr:"Afrique",region_eu:"Europe",region_na:"Amérique du Nord",region_latam:"Amérique latine",w_checked:"Pour l’instant, la disponibilité suit le catalogue brésilien de JustWatch, consulté le 24/10/2026. Sur le site final, elle suivra le pays du lecteur.",about_lang:"L’interface est disponible en anglais, portugais, espagnol, français et italien. Les résumés sont générés dans la langue du lecteur, et l’original est à un clic.",thd_geo:"Relations internationales, guerres et blocs de puissance en Amérique latine, en Amérique du Nord, en Europe, en Russie, en Afrique, au Moyen-Orient et en Asie.",see_all_orgs:"Voir toutes les organisations",pubs_side:"Publications indépendantes",watch_text:"Films, séries et documentaires qui aident à comprendre l’autoritarisme, la guerre et la construction des démocraties, avec où les regarder.",vp_p2:"Chaque contribution reçoit un court résumé en anglais, portugais, espagnol, français ou italien.",vp_p1:"Nous choisissons qui suivre selon leur attachement aux élections libres, à l’État de droit et à la liberté d’expression, et selon leur critique des autoritaires de tous bords. Chaque voix parle pour elle-même.",vp_lede:"Depuis près de vingt ans, le monde perd des démocraties, poussé par des populismes autoritaires de droite comme de gauche. Sur les réseaux, envahis par la désinformation, il est devenu difficile de trouver qui analyse cette situation sans accepter l’autoritarisme d’aucun bord. Global Village suit des dizaines de penseurs, d’économistes, de journalistes et de responsables politiques de nombreux pays, sur tous les continents, et propose chaque analyse avec un court résumé dans votre langue et le lien vers l’original.",tab_all:"Tout",tab_following:"Abonnements",tab_saved:"Enregistrés",new:"Nouveau",save:"Enregistrer",saved:"Enregistré",copy_link:"Copier le lien",copied:"Lien copié",follow_short:"Suivre",following:"Suivi",load_more:"Charger plus",b_today:"Aujourd’hui",b_yesterday:"Hier",b_week:"Cette semaine",b_lastweek:"La semaine dernière",b_earlier:"Plus tôt",who_follow:"Qui suivre",month_topics:"Thèmes du mois",vp_kicker:"Ce qu’est Global Village",vp_title:"Comprendre le monde à travers la démocratie libérale",vp_cta_feed:"Voir le fil",vp_cta_nl:"Recevoir la newsletter",locale:"fr-FR",tagline:"Analyses du monde contemporain à travers le prisme de la démocratie libérale",nav_home:"Accueil",nav_analyses:"Analyses",nav_analysts:"Analystes",nav_topics:"Thèmes",nav_watch:"À voir",nav_orgs:"Organisations",nav_newsletter:"Newsletter",nav_about:"Comment ça marche",search:"Rechercher",search_ph:"Rechercher un analyste, une analyse ou un titre",close:"Fermer",featured:"À la une",radar:"Dans le radar",latest:"Les plus récentes",see_all_analyses:"Voir toutes les analyses",all:"Tous",all_f:"Toutes",original_in:"original en",summary_label:"Résumé automatique",listen:"Écouter l’original",read:"Lire l’original",watchv:"Voir l’original",more_from:"Plus de",paywall:"Contenu réservé aux abonnés. Nous affichons le titre L.it=Object.assign({},L.en,{about_lede:"Global Village raccoglie, organizza e riassume ciò che pensatori, economisti, giornalisti e politici impegnati per la democrazia liberale pubblicano sul mondo contemporaneo.",step0_t:"Curatela",step0:"Un consiglio di curatori di diverse tradizioni politiche decide chi Global Village segue. Entrano solo voci che difendono la democrazia liberale e criticano gli autoritari di ogni schieramento.",step1_t:"Raccolta",step1:"Seguiamo in modo automatico siti, newsletter, canali video e podcast di ogni persona e organizzazione della base.",step2_t:"Classificazione",step2:"Ogni nuova pubblicazione viene classificata per tema, formato, origine e lingua.",step3_t:"Riassunto e traduzione",step3:"Un’IA scrive un breve riassunto e lo traduce nella lingua di chi legge. Il testo originale non viene mai riprodotto.",step4_t:"Pubblicazione",step4:"L’analisi compare sul sito con titolo, riassunto e link all’originale, ed entra nella newsletter della mattina dopo.",about_lens_t:"La lente",about_lens:["Da quasi vent’anni il mondo perde democrazie. I rapporti di V-Dem e di Freedom House registrano questo arretramento anno dopo anno, e oggi nel mondo ci sono più autocrazie che democrazie. Buona parte di questa svolta è passata dalle urne, con populismi autoritari di destra e di sinistra che arrivano al potere con il voto e poi smontano, dall’interno, le regole che permetterebbero di mandarli via.", "La perdita è grande perché la democrazia liberale funziona come un’infrastruttura. Su di essa sono state costruite alcune delle più grandi conquiste dell’umanità, come l’ampliamento delle libertà individuali, il calo della mortalità infantile, l’accesso all’istruzione, la libertà accademica e un lungo periodo con meno guerre tra Paesi. Quando questa infrastruttura si logora, gli effetti si vedono in fretta. Le libertà si restringono e le guerre tornano, mentre la politica diventa uno scontro tra nemici.", "Seguire chi ragiona con lucidità su tutto questo è diventato anche più difficile. I social sono invasi dalla disinformazione prodotta dai due poli, e gli algoritmi premiano ciò che genera rabbia. Trovare analisi serie, di chi rifiuta l’autoritarismo da qualunque parte arrivi, è diventato un lavoro che quasi nessuno ha il tempo di fare.", "Global Village nasce da questa diagnosi. Seguiamo pensatori, economisti, giornalisti e politici di molti Paesi, in tutti i continenti, raccogliamo ciò che pubblicano in testi, video e podcast e offriamo ogni analisi con un breve riassunto nella tua lingua e il link all’originale. È per chi vuole capire politica, geopolitica, economia e tecnologia attraverso la lente della democrazia liberale senza dipendere dall’algoritmo dei social né visitare decine di siti al giorno."],about_cur_t:"La curatela",about_cur:["La curatela risponde a una domanda, chi vale la pena seguire. Non decide mai ciò che dice ciascun autore, ed è per questo che Global Village mostra voci in disaccordo tra loro.", "Per entrare, una persona o un’organizzazione deve difendere con coerenza elezioni libere, Stato di diritto, libertà di espressione, stampa indipendente e diritti individuali, e criticare pubblicamente gli autoritari di entrambi i campi, compreso quello più vicino al proprio ambiente. Sostenere o minimizzare un colpo di Stato squalifica.", "Ogni nome passa da due curatori con profili diversi, che valutano senza vedere il voto dell’altro. Quando non sono d’accordo, un terzo decide. Le approvazioni scadono dopo dodici mesi e tornano in valutazione. Chi finanzia il progetto non nomina curatori né partecipa alle decisioni.", "Quando un’analisi selezionata legge un Paese in un modo che i curatori di quella regione considerano sbagliato, il riassunto resta fedele all’autore e Global Village aggiunge una nota della redazione con il contesto che manca. L’obiettivo è avere un curatore per ogni regione del mondo."],about_rights_t:"Diritti e paywall",about_rights:"Mostriamo solo il titolo, un nostro riassunto /* ============ HELPERS ============ */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

s", "it": "Politica e istituzioni"}};
const avTheme=a=>S.lang==="pt"?a.theme:((AVTH[a.theme]||{})[S.lang]||a.theme);

const ARROW='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>';

function pills(group,key,opts,cur){return '<div class="pills" role="group">'+opts.map(([v,l])=>'<button type="button" class="pill" data-set="'+group+'.'+key+'" data-val="'+esc(v)+'" aria-pressed="'+(cur===v)+'">'+esc(l)+'</button>').join("")+'</div>'}

function avGroup(th){if(th==="Segunda Guerra e Holocausto")return"ww2";if(th==="Totalitarismo"||th==="Autoritarismo")return"auth";if(th==="Rússia e Ucrânia")return"rus";if(th==="Oriente Médio")return"me";if(th==="Política e instituições")return"pol";if(th==="Extremismo e radicalização")return"ext";return"other"}
function avKind(k){if(k==="Filme")return"film";if(/Document|Vídeo/.test(k))return"doc";return"series"}

function poster(a){
  const sitLbl={sub:t("w_sub"),free:t("w_free"),rent:t("w_rent"),none:t("w_none"),nf:t("w_nf")}[a.sit];
  const detail=a.sit==="sub"?a.sub:a.sit==="free"?a.free:a.sit==="rent"?a.rent:"";
  return '<article class="poster"><span class="kicker" style="color:var(--signal-text)">'+esc(avKindL(a))+(a.year?' · '+esc(a.year):"")+'</span>'+

  '<a class="see" href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(t("see_where"))+ARROW+'</a></div></article>';

/* ============ VIEWS ============ */
function relDay(d){
  const p=d.split("-").map(Number);const dt=Date.UTC(p[0],p[1]-1,p[2]||15);
  const now=new Date();const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((today-dt)/86400000);
}
function bucket(i){
  const n=relDay(i.date);
  if(i.date.length===7||n>45){try{const p=i.date.split("-").map(Number);return new Intl.DateTimeFormat(t("locale"),{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(p[0],p[1]-1,15)))}catch(e){return i.date.slice(0,7)}}
  if(n<=0)return t("b_today");if(n===1)return t("b_yesterday");if(n<7)return t("b_week");if(n<14)return t("b_lastweek");return t("b_earlier");
}
function ago(i){
  const n=relDay(i.date);if(i.date.length===7||n>6)return fdate(i.date);
  try{return new Intl.RelativeTimeFormat(t("locale"),{numeric:"auto"}).format(-n,"day")}catch(e){return fdate(i.date)}
}
function post(i){
  const pub=PUBS[i.pub];const p=i.who.length?byId[i.who[0]]:pub?{id:i.pub,name:pub.name,cat:"",isPub:true}:{id:"",name:i.src,cat:"",isPub:true,isSrc:true};const fol=!!S.follow[p.id];const saved=!!S.saved[i.id];const fresh=relDay(i.date)<=3&&i.date.length>7;
  const media=i.fmt==="video"||i.fmt==="podcast";
  return '<article class="post" id="post-'+i.id+'">'+
  '<div class="post-head"><a href="'+(p.isSrc?esc(i.url):(p.isPub?"#p-":"#a-")+p.id)+'" class="avatar'+(p.isPub?' pub':'')+'" aria-hidden="true" tabindex="-1" style="text-decoration:none">'+esc(p.isPub?pubIni(pub||{id:"",name:i.src}):ini(p.name))+'</a>'+
   '<div style="min-width:0;flex:1"><a href="'+authorHref(i)+'" class="pname">'+esc(authorName(i))+'</a><span class="pmeta">'+(p.isSrc&&!i.by?'':esc(p.isPub?t("columnist"):t("cat1_"+p.cat))+' · '+(pub?'<a href="#p-'+i.pub+'">'+esc(i.src)+'</a>':esc(i.src)))+'</span></div>'+
   '<div class="ptime">'+(fresh?'<span class="tag signal">'+esc(t("new"))+'</span>':'')+'<span>'+esc(ago(i))+'</span></div></div>'+
  '<div class="post-body"><span class="kicker">'+esc(t("th_"+i.theme))+' · '+esc(t("fmt_"+i.fmt))+' · '+esc(i.lang)+'</span>'+
   '<h3><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.title)+'</a></h3>'+
   (media?'<a class="media" href="'+esc(i.url)+'" target="_blank" rel="noopener"><span class="play" aria-hidden="true">'+(i.fmt==="video"?'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>':'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>')+'</span><span><b>'+esc(t("fmt_"+i.fmt))+'</b> · '+esc(i.src)+'</span></a>':'')+
   (i.paywall?'<p class="paywall">'+LOCK+'<span>'+esc(t("paywall"))+'</span></p>':'<p class="sum">'+esc(sumOf(i))+'</p>')+noteHTML(i)+'</div>'+
  '<div class="post-actions"><a class="act strong" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(cta(i.fmt))+ARROW+'</a>'+
   '<button type="button" class="act" data-save="'+i.id+'" aria-pressed="'+saved+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="'+(saved?"currentColor":"none")+'" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'+esc(saved?t("saved"):t("save"))+'</button>'+
   '<button type="button" class="act" data-copy="'+esc(i.url)+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>'+esc(t("copy_link"))+'</span></button>'+
   (p.isSrc?'':'<button type="button" class="act" data-follow="'+p.id+'" aria-pressed="'+fol+'">'+esc(fol?t("following"):t("follow_short")+" "+(p.isPub?p.name:p.name.split(" ")[0]))+'</button>')+'</div></article>';
}
function feedList(){
  const F=S.feed;const all=itemsSorted();
  let list=all.filter(i=>(F.theme==="all"||i.theme===F.theme)&&(F.fmt==="all"||i.fmt===F.fmt));
  if(F.tab==="following")list=list.filter(i=>i.who.some(id=>S.follow[id])||(i.pub&&S.follow[i.pub]));
  if(F.tab==="saved")list=list.filter(i=>S.saved[i.id]);
  return list;
}
function feedHTML(){
  const F=S.feed;const list=feedList();const shown=list.slice(0,F.n);
  if(!list.length){
    const msg=F.tab==="following"?t("empty_following"):F.tab==="saved"?t("empty_saved"):t("empty");
    return '<div class="empty">'+esc(msg)+(F.tab==="following"?'<div style="margin-top:14px" class="people">'+["timothy-snyder","anne-applebaum","ian-bremmer","ricardo-hausmann"].map(id=>followRow(byId[id])).join("")+'</div>':'')+'</div>';
  }
  let out="",last="";
  shown.forEach(i=>{const b=bucket(i);if(b!==last){out+='<h3 class="day"><span>'+esc(b)+'</span></h3>';last=b}out+=post(i)});
  if(list.length>shown.length)out+='<button type="button" class="btn" data-more="1" style="align-self:center">'+esc(t("load_more"))+' ('+(list.length-shown.length)+')</button>';
  return out;
}

  '<section class="block" id="feed" style="padding-top:40px"><div class="wrap feed-grid">'+
   '<div class="feed-col">'+
    '<div class="feed-head"><h2 class="display h-l">'+esc(t("feed_title"))+'</h2><p class="muted" style="margin:0;font-size:15px">'+esc(t("feed_sub"))+'</p></div>'+

   soc.map(a=>'<article><span class="kicker">'+esc(avKindL(a))+(a.year?' · '+esc(a.year):"")+'</span><h3>'+esc(avTitle(a))+'</h3><span class="muted" style="font-size:13px">'+esc(avTheme(a))+' · '+esc(a.sub||a.free||a.rent||t("w_none"))+'</span><a href="'+esc(a.url)+'" target="_blank" rel="noopener" style="font-weight:700;font-size:14px;min-height:44px;display:inline-flex;align-items:center;gap:6px">'+esc(t("see_where"))+ARROW+'</a></article>').join("")+
  '</div></div></div></section>';
}
function vNewsletter(){
  const sel=S.nl.themes;
  const pick=TH.filter(x=>sel.includes(x)).map(x=>[x,itemsSorted().filter(i=>i.theme===x&&!i.paywall).slice(0,2)]).filter(g=>g[1].length);
  return '<div class="wrap"><section class="block" style="padding-bottom:24px"><h1 class="display h-xl">'+esc(t("nl_page_title"))+'</h1><p class="lede muted" style="margin-top:14px">'+esc(t("nl_page_text"))+'</p></section>'+
  '<div class="split" style="padding-bottom:48px"><section class="main-col" style="display:flex;flex-direction:column;gap:24px">'+
  '<div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center"><label class="field" for="nl-lang" style="flex:0 1 220px"><span class="sr">'+esc(t("nl_lang"))+'</span><select id="nl-lang">'+["pt","en"].map(l=>'<option value="'+l+'"'+(l===(S.nl.lang||nlTag())?" selected":"")+'>'+({pt:"Português",en:"English"})[l]+'</option>').join("")+'</select></label>'+
  '<a class="btn primary" id="nl-go2" href="'+esc(nlHref(S.nl.lang))+'" target="_blank" rel="noopener">'+esc(t("nl_go"))+'</a></div><p class="muted" style="margin:0;font-size:14px">'+esc(t("nl_via"))+'</p></div>'+
  '</section><aside class="side-col"><div class="rule-top" style="display:flex;flex-direction:column;gap:14px"><span class="kicker muted">'+esc(t("nl_preview"))+'</span><div style="background:var(--surface);border:1.5px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px"><img class="logo logo-b" src="gv-logo-dark.png" alt="Global Village" style="height:28px"><img class="logo logo-w" src="gv-logo-light.png" alt="Global Village" style="height:28px"><span class="kicker">'+esc(t("nl_edition"))+'</span>'+
  pick.map(([x,is])=>'<div style="border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:8px"><b class="kicker" style="color:var(--signal-text)">'+esc(t("th_"+x))+'</b>'+is.map(i=>'<div><b class="serif" style="font-size:17px;display:block;line-height:1.3">'+esc(i.title)+'</b><span class="muted" style="font-size:13px">'+esc(authorName(i))+' · '+esc(i.src)+'</span></div>').join("")+'</div>').join("")+
  '</div></div></aside></div></div>';
}
function vAbout(){
  return '<div class="wrap"><section class="block" style="padding-bottom:24px"><h1 class="display h-xl">'+esc(t("about_title"))+'</h1><p class="lede" style="margin-top:14px">'+esc(t("about_lede"))+'</p></section>'+
  '<ol class="steps">'+[0,1,2,3,4].map(n=>'<li><b style="font-size:18px">'+esc(t("step"+n+"_t"))+'</b><span class="muted">'+esc(t("step"+n))+'</span></li>').join("")+'</ol>'+
  '<section class="block"><div class="prose">'+["lens","cur","rights","lang"].map(k=>'<h2 class="display h-m" style="margin-top:12px">'+esc(t("about_"+k+"_t"))+'</h2>'+[].concat(t("about_"+k)).map(p=>'<p>'+esc(p)+'</p>').join("")).join("")+'<p class="proto" style="margin-top:12px">'+esc(t("proto"))+'</p></div></section></div>';
}
function vNotFound(){return '<div class="wrap"><section class="block"><h1 class="display h-l">404</h1><p><a href="#inicio">'+esc(t("back"))+'</a></p></section></div>'}

/* ============ SHELL ============ */
function shell(route){
  document.documentElement.lang=S.lang==="pt"?"pt-BR":S.lang;
  try{document.getElementById("today").textContent=new Intl.DateTimeFormat(t("locale"),{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date())}catch(e){}
  document.getElementById("langs").innerHTML=["en","pt","es","fr","it"].map(l=>'<button type="button" data-lang="'+l+'" aria-pressed="'+(l===S.lang)+'">'+l.toUpperCase()+'</button>').join("");
  const sec=route.split("-")[0];
  const cur={inicio:"inicio","":"inicio",analises:"analises",analistas:"analistas",a:"analistas",tema:"tema",assistir:"assistir",organizacoes:"organizacoes",newsletter:"newsletter",sobre:"sobre"}[route.startsWith("a-")?"a":(route.startsWith("tema-")?"tema":(route.startsWith("p-")?"organizacoes":route))]||"";
  const links=[["analises",t("nav_analyses")],["analistas",t("nav_analysts")],["tema-dem",t("nav_topics"),"tema"],["assistir",t("nav_watch")],["organizacoes",t("nav_orgs")],["newsletter",t("nav_newsletter")],["sobre",t("nav_about")]];
  document.getElementById("nav").innerHTML=links.map(([h,l,k])=>'<a href="#'+h+'"'+((k||h)===cur?' aria-current="page"':"")+'>'+esc(l)+'</a>').join("");
  document.getElementById("searchBtn").setAttribute("aria-label",t("search"));
  document.getElementById("footer").innerHTML='<div class="wrap"><div class="cols">'+
   '<div style="display:flex;flex-direction:column;gap:12px"><img class="logo logo-b" src="gv-logo-dark.png" alt="Global Village" style="height:36px;align-self:flex-start"><img class="logo logo-w" src="gv-logo-light.png" alt="Global Village" style="height:36px;align-self:flex-start"><p class="muted" style="margin:0;font-size:14px">'+esc(t("tagline"))+'</p></div>'+
   '<div><h2>'+esc(t("footer_nav"))+'</h2><ul>'+links.filter(l=>!l[2]).map(([h,l])=>'<li><a href="#'+h+'">'+esc(l)+'</a></li>').join("")+'</ul></div>'+
   '<div><h2>'+esc(t("footer_topics"))+'</h2><ul>'+TH.map(x=>'<li><a href="#tema-'+x+'">'+esc(t("th_"+x))+'</a></li>').join("")+'</ul></div>'+
   '<div><h2>'+esc(t("footer_lang"))+'</h2><ul>'+["en","pt","es","fr","it"].map(l=>'<li><a href="#" data-lang="'+l+'">'+({pt:"Português",en:"English",es:"Español",fr:"Français",it:"Italiano"})[l]+'</a></li>').join("")+'</ul></div>'+
   '</div><p class="proto" style="margin:0 0 32px">'+esc(t("proto"))+'</p></div>';
}
function current(){const h=(location.hash||"").replace(/^#/,"");return h||"inicio"}
function render(scroll){
  const r=current();shell(r);
  let html;
  if(r==="inicio")html=vHome();
  else if(r==="analises")html=vAnalyses();
  else if(r==="analistas")html=vAnalysts();
  else if(r.startsWith("a-"))html=vProfile(r.slice(2));
  else if(r.startsWith("tema-"))html=vTopic(r.slice(5));
  else if(r.startsWith("p-"))html=vPub(r.slice(2));
  else if(r==="assistir")html=vWatch();
  else if(r==="organizacoes")html=vOrgs();
  else if(r==="newsletter")html=vNewsletter();
  else if(r==="sobre")html=vAbout();
  else html=vNotFound();
  const app=document.getElementById("app");app.innerHTML=html;
  const an=document.getElementById("an-res");if(an)an.innerHTML=anResults();
  const pe=document.getElementById("pe-res");if(pe)pe.innerHTML=peResults();
  const nav=document.getElementById("nav");nav.classList.remove("open");document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  if(scroll)window.scrollTo(0,0);
}
let lastRoute=null;
window.addEventListener("hashchange",()=>{const r=current();const routeOnly=r!==lastRoute;lastRoute=r;render(routeOnly)});

document.addEventListener("click",e=>{
  const lg=e.target.closest("[data-lang]");
  if(lg){e.preventDefault();S.lang=lg.getAttribute("data-lang");store.set("uilang",S.lang);render(false);return}
  const st=e.target.closest("[data-set]");
  if(st){const [g,k]=st.getAttribute("data-set").split(".");S[g][k]=st.getAttribute("data-val");if(g==="feed")S.feed.n=8;keep(()=>render(false));return}
  const fo=e.target.closest("[data-follow]");
  if(fo){const id=fo.getAttribute("data-follow");S.follow[id]=!S.follow[id];if(!S.follow[id])delete S.follow[id];store.set("follow",JSON.stringify(S.follow));keep(()=>render(false));return}
  const sv=e.target.closest("[data-save]");
  if(sv){const id=sv.getAttribute("data-save");if(S.saved[id])delete S.saved[id];else S.saved[id]=1;store.set("saved",JSON.stringify(S.saved));keep(()=>render(false));return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const u=cp.getAttribute("data-copy");try{navigator.clipboard.writeText(u).then(()=>toast(t("copied")),()=>toast(t("copy_fail")))}catch(err){toast(t("copy_fail"))}return}
  const mo=e.target.closest("[data-more]");
  if(mo){S.feed.n+=8;const fl=document.getElementById("feed-list");if(fl)fl.innerHTML=feedHTML();return}
  const sc=e.target.closest("[data-scroll]");
  if(sc){const el=document.getElementById(sc.getAttribute("data-scroll"));if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(e.target.closest("#menuBtn")){const nav=document.getElementById("nav");const o=nav.classList.toggle("open");document.getElementById("menuBtn").setAttribute("aria-expanded",String(o));return}
  if(e.target.closest("#searchBtn")){openSearch();return}
  if(e.target.closest("[data-close]")||e.target.id==="overlay"){closeSearch();return}
  const sr=e.target.closest("#overlay a");if(sr){closeSearch()}
});
document.addEventListener("input",e=>{
  const q=e.target.getAttribute&&e.target.getAttribute("data-q");
  if(q==="an"){S.an.q=e.target.value;document.getElementById("an-res").innerHTML=anResults()}
  if(q==="pe"){S.pe.q=e.target.value;document.getElementById("pe-res").innerHTML=peResults()}
  if(e.target.id==="gq")searchResults(e.target.value);
});
// A newsletter sai em português e inglês. Os botões da home seguem o idioma da interface.
function nlTag(){return S.lang==="pt"?"pt":"en"}
function nlHref(l){return SUBSTACK+"/s/"+NL_SECTION[l||nlTag()]}
document.addEventListener("change",e=>{if(e.target.id==="nl-lang"){S.nl.lang=e.target.value;const a=document.getElementById("nl-go2");if(a)a.href=nlHref(S.nl.lang)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("overlay").hidden)closeSearch()});

function keep(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
let toastT=null;function toast(msg){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2200)}
function openSearch(){
  const o=document.getElementById("overlay");
  o.innerHTML='<div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(t("search"))+'"><div class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><label for="gq" class="sr">'+esc(t("search"))+'</label><input id="gq" type="search" placeholder="'+esc(t("search_ph"))+'" autocomplete="off"><button type="button" class="icon-btn" data-close="1" aria-label="'+esc(t("close"))+'" style="border:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="res" id="gres"></div></div>';
  o.hidden=false;searchResults("");setTimeout(()=>{const i=document.getElementById("gq");if(i)i.focus()},0);
}
function closeSearch(){const o=document.getElementById("overlay");o.hidden=true;o.innerHTML="";const b=document.getElementById("searchBtn");if(b)b.focus()}
function searchResults(v){
  const q=norm(v.trim());const box=document.getElementById("gres");if(!box)return;
  const ps=(q?PEOPLE.filter(p=>norm(p.name+" "+pArea(p)+" "+p.area+" "+cname(p.cc)).includes(q)):PEOPLE.filter(p=>countBy(p.id))).slice(0,6);
  const is=(q?itemsSorted().filter(i=>norm(i.title+" "+(i.sum||"")+" "+(i.sum_en||"")+" "+authorName(i)+" "+i.src).includes(q)):itemsSorted()).slice(0,6);
  const as=q?AV.filter(a=>norm(a.title+" "+a.orig+" "+a.theme).includes(q)).slice(0,6):[];
  if(!ps.length&&!is.length&&!as.length){box.innerHTML='<p class="muted" style="padding:16px 0">'+esc(t("no_results"))+'</p>';return}
  box.innerHTML=(ps.length?'<h4>'+esc(t("results_people"))+'</h4>'+ps.map(p=>'<a href="#a-'+p.id+'"><b>'+esc(p.name)+'</b> <span class="muted">· '+esc(pArea(p))+'</span></a>').join(""):"")+
   (is.length?'<h4>'+esc(t("results_items"))+'</h4>'+is.map(i=>'<a href="'+authorHref(i)+'"><b class="serif">'+esc(i.title)+'</b> <span class="muted">· '+esc(authorName(i))+'</span></a>').join(""):"")+
   (as.length?'<h4>'+esc(t("results_av"))+'</h4>'+as.map(a=>'<a href="#assistir"><b>'+esc(avTitle(a))+'</b> <span class="muted">· '+esc(avKindL(a))+'</span></a>').join(""):"");
}

lastRoute=current();render(false);
})();
</script>
