 {id:"cpj-etiopia-the-reporter",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-05",lang:"EN",title:"Ethiopia suspends The Reporter indefinitely in escalating assault on independent media",sum_en:"CPJ calls on Ethiopia to lift the indefinite suspension of The Reporter, founded in 1996. The media regulator cited vague threats to “national interests” without naming a single story, two days after an editorial titled “Press Freedom Is Not A Luxury!”.",sum:"O CPJ pede que a Etiópia revogue a suspensão por tempo indeterminado do The Reporter, fundado em 1996. A autoridade de mídia alegou ameaças vagas aos “interesses nacionais” sem citar uma reportagem sequer, dois dias depois de um editorial intitulado “A liberdade de imprensa não é um luxo!”.",url:"https://cpj.org/2026/11/ethiopia-suspends-the-reporter-indefinitely-in-escalating-assault-on-independent-media/"},
 {id:"iss-russia-africa-paradoxo",who:[],by:"Priyal Singh e Denys Reva",theme:"geo",fmt:"text",src:"ISS Africa",date:"2026-11-05",lang:"EN",title:"Russia’s Africa paradox: growing influence, limited returns",sum_en:"ISS Africa notes that Putin again promised to double trade with Africa, as he did in 2019 without delivering, and argues that Moscow gained strategic influence without its rivals’ money while African governments learned to play the powers against each other.",sum:"O ISS Africa lembra que Putin voltou a prometer dobrar o comércio com a África, como em 2019, sem cumprir, e argumenta que Moscou ganhou influência estratégica sem o dinheiro dos rivais enquanto os governos africanos aprenderam a jogar uma potência contra a outra.",url:"https://issafrica.org/iss-today/russia-s-africa-paradox-growing-influence-limited-returns"},
 {id:"letraslibres-ine-crise",who:[],by:"Horacio Vives Segl",theme:"dem",fmt:"text",src:"Letras Libres",date:"2026-11-05",lang:"ES",title:"El INE: anatomía de una crisis y una infamia",sum_en:"Horacio Vives Segl argues that the credibility of Mexico’s electoral institute has never been so questioned. The crisis was triggered by its president, Guadalupe Taddei, but for him the political responsibility lies with the regime that undermined its autonomy.",sum:"Horacio Vives Segl argumenta que a credibilidade do instituto eleitoral do México nunca foi tão questionada. A crise foi provocada pela presidente do órgão, Guadalupe Taddei, mas para ele a responsabilidade política é do regime que minou sua autonomia.",url:"https://letraslibres.com/politica/el-ine-anatomia-de-una-crisis-y-una-infamia/05/11/2026/"},
 {id:"id-sem-oposicao-sem-democracia",who:[],pub:"revista-id",by:"Inteligência Democrática",theme:"dem",fmt:"text",src:"Revista ID",date:"2026-11-05",lang:"PT",title:"Sem oposição não há democracia",sum_en:"Revista ID argues that the midterms showed the importance of opposition, since voters found a way to rebuke Trump despite all his power, and asks what role opposition can and should play in Brazil.",sum:"A Revista ID argumenta que as midterms mostraram a importância da oposição, porque os eleitores acharam um jeito de reprovar Trump apesar de todo o poder dele, e pergunta que papel a oposição pode e deve ter no Brasil.",url:"https://www.revistaid.com.br/p/sem-oposicao-nao-ha-democracia"},
 {id:"trust-zappulla-ia-capital",who:[],by:"Antonio Zappulla",theme:"tec",fmt:"text",src:"Thomson Reuters Foundation",date:"2026-11-05",lang:"EN",title:"AI is the biggest reallocation of capital in a generation. Here's why that should concern all of us",sum_en:"On the second day of Trust Conference, Antonio Zappulla notes that global AI spending will reach $2.6 trillion this year and that five American tech companies are worth more than $20 trillion. For him, the question at the centre of democracy is who controls this infrastructure and who is accountable for it.",sum:"No segundo dia da Trust Conference, Antonio Zappulla lembra que o gasto mundial com IA chega a US$ 2,6 trilhões neste ano e que cinco empresas americanas de tecnologia valem mais de US$ 20 trilhões. Para ele, a pergunta central para a democracia é quem controla essa infraestrutura e quem presta contas por ela.",url:"https://www.trust.org/2026/11/05/ai-biggest-reallocation-capital-generation-trust-conference-2026/"},
 {id:"last-onda-azul-realinhamento",who:["jonathan-v-last"],theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-04",lang:"EN",title:"Emergency Triad: MAGA Drowns Under a Blue Wave",sum_en:"Jonathan V. Last calls the midterm result a generational realignment, warns that Trump keeps two years and a great deal of power, and sees in a 55-seat Senate a real chance to impeach members of the administration.",sum:"Jonathan V. Last chama o resultado das eleições de meio de mandato de realinhamento geracional, avisa que Trump ainda tem dois anos e muito poder, e vê num Senado de 55 cadeiras uma chance real de impeachment de integrantes do governo.",url:"https://www.thebulwark.com/p/emergency-triad-maga-drowns-under-blue-wave-democrats-2026-midterm-elections-tsunami"},
 {id:"noah-eleitores-puniram-maga",who:["noah-smith"],theme:"dem",fmt:"text",src:"Noahpinion",date:"2026-11-04",lang:"EN",title:"Normal Americans punished MAGA",sum_en:"Noah Smith argues that even white voters without a college degree abandoned the Republicans and that, without young men on his side, Trump is unlikely to try to overturn the result.",sum:"Noah Smith argumenta que até os eleitores brancos sem diploma universitário abandonaram os republicanos e que, sem os homens jovens do seu lado, Trump dificilmente tentará virar o resultado.",url:"https://www.noahpinion.blog/p/normal-americans-punished-maga"},
 {id:"lgc-5-pontos-midterms",who:[],by:"Ramona Bloj",theme:"dem",fmt:"text",src:"Le Grand Continent",date:"2026-11-04",lang:"FR",title:"5 points sur les résultats des élections de mi-mandat",sum_en:"Le Grand Continent sums up the night: Democrats take the House despite Republican redistricting and at least 54 Senate seats, with flips in Kansas, Texas, South Carolina, Iowa and Maine.",sum:"O Le Grand Continent resume a noite: os democratas ficam com a Câmara apesar do redesenho de distritos feito pelos republicanos e com ao menos 54 cadeiras no Senado, com viradas no Kansas, no Texas, na Carolina do Sul, em Iowa e no Maine.",url:"https://legrandcontinent.eu/fr/2026/11/04/5-points-sur-les-resultats-des-elections-de-mi-mandat/"},
 {id:"lgc-99-condados",who:[],by:"Marin Saillofest",theme:"dem",fmt:"text",src:"Le Grand Continent",date:"2026-11-04",lang:"FR",title:"Midterms : près de 99 % des comtés et circonscriptions ont glissé vers les démocrates",sum_en:"Le Grand Continent shows that almost 99% of counties and districts moved toward the Democrats, with the biggest swings in the most Republican areas, and quotes analyst Sean Trende calling it the worst defeat for a party since 1974.",sum:"O Le Grand Continent mostra que quase 99% dos condados e distritos se moveram na direção dos democratas, com as maiores viradas nas áreas mais republicanas, e cita o analista Sean Trende, para quem é a pior derrota de um partido desde 1974.",url:"https://legrandcontinent.eu/fr/2026/11/04/midterms-pres-de-99-des-comtes-et-circonscriptions-ont-glisse-vers-les-democrates/"},
 {id:"dm-candidatos-de-trump",who:[],theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-11-04",lang:"EN",title:"Trump hand-picked Senate candidates, Republicans paid the price",sum_en:"Reuters, carried by Daily Maverick, shows that the Senate candidates Trump picked in South Carolina, North Carolina, Texas and Michigan all lost, exposing the limits of his hold on voters.",sum:"A Reuters, publicada pelo Daily Maverick, mostra que os candidatos ao Senado escolhidos por Trump na Carolina do Sul, na Carolina do Norte, no Texas e no Michigan perderam todos, o que expõe os limites da influência dele sobre o eleitor.",url:"https://www.dailymaverick.co.za/article/2026-11-04-trump-hand-picked-senate-candidates-republicans-paid-the-price/"},
 {id:"kyiv-congresso-ucrania",who:[],by:"Tim Zadorozhnyy",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-04",lang:"EN",title:"Democrats seize control of Congress in blow to Trump, potential boost for Ukraine",sum_en:"The Kyiv Independent shows how key Senate races pitted pro-Ukraine Democrats against Republicans who opposed aid, as in Texas and Kansas, and notes that Trump told the New York Times he accepts the result.",sum:"O Kyiv Independent mostra como disputas decisivas pelo Senado opuseram democratas pró-Ucrânia a republicanos contrários à ajuda, como no Texas e no Kansas, e registra que Trump disse ao New York Times aceitar o resultado.",url:"https://kyivindependent.com/democrats-poised-to-sweep-us-congress-in-midterms-delivering-setback-to-trump/"},
 {id:"kyiv-spartz-perde",who:[],by:"Tamara Nowakowsky",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-04",lang:"EN",title:"Ukrainian-born US lawmaker Victoria Spartz loses congressional seat to Democrat",sum_en:"Victoria Spartz, the first Ukrainian-born member of Congress and a critic of US aid to Kyiv, lost her Indiana seat to Democrat J.D. Ford.",sum:"Victoria Spartz, primeira deputada nascida na Ucrânia e crítica da ajuda americana a Kyiv, perdeu a vaga em Indiana para o democrata J.D. Ford.",url:"https://kyivindependent.com/ukrainian-born-us-lawmaker-victoria-spartz-loses-congressional-seat-to-democrat/"},
 {id:"occrp-servia-alta-banka",who:[],theme:"eco",fmt:"text",src:"OCCRP",date:"2026-11-04",lang:"EN",title:"Serbian Bank Tied to Outgoing Regime Collapses After Internal Vault Theft",sum_en:"OCCRP reports that a Belgrade court put Alta Banka, tied to the outgoing regime, into bankruptcy a day after its executives were arrested over the alleged theft of more than $427 million from the vault.",sum:"O OCCRP relata que um tribunal de Belgrado decretou a falência do Alta Banka, ligado ao regime que sai, um dia depois da prisão de diretores pelo suposto desvio de mais de US$ 427 milhões do cofre.",url:"https://www.occrp.org/en/news/serbian-bank-tied-to-outgoing-regime-collapses-after-internal-vault-theft"},
 {id:"bulwark-grande-demais-para-fraudar",who:[],by:"Andrew Egger",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-04",lang:"EN",title:"Too Big to Rig",sum_en:"Andrew Egger argues that the Democratic wave was too big for Trump to steal, even though on election morning he was sending 1,000 Justice Department staff to watch polling places and pressing Alaska not to certify a Democratic win.",sum:"Andrew Egger argumenta que a onda democrata foi grande demais para Trump roubar, embora na manhã da eleição ele ainda mandasse mil funcionários do Departamento de Justiça vigiar seções e pressionasse o Alasca a não certificar uma vitória democrata.",url:"https://www.thebulwark.com/p/too-big-to-rig-midterms-democrats-house-senate-trump-maga"},
 {id:"kasparov-mandato-responsabilizacao",who:["garry-kasparov"],theme:"dem",fmt:"text",src:"The Next Move",date:"2026-11-04",lang:"EN",title:"A Mandate, If You Can Keep It",sum_en:"Kasparov warns that no victory over authoritarianism is complete without accountability, recalls how Russian democrats let euphoria cloud their judgment after the fall of the USSR, and compares the US margin to those that were too big for Orbán and Vučić to rig.",sum:"Kasparov avisa que nenhuma vitória sobre o autoritarismo se completa sem responsabilização, lembra como os democratas russos se deixaram levar pela euforia depois do fim da URSS e compara a margem americana às que foram grandes demais para Orbán e Vučić fraudarem.",url:"https://www.thenextmove.org/p/a-mandate-if-you-can-keep-it"},
 {id:"techdirt-listas-eleitores-ilegais",who:[],by:"Tim Cushing",theme:"dem",fmt:"text",src:"Techdirt",date:"2026-11-04",lang:"EN",title:"DOJ Admits Its ‘Illegal Voter’ Lists Can’t Be Trusted, Leading To Three Court Losses In 24 Hours",sum_en:"Tim Cushing shows how the Justice Department’s claim of 20,000 ‘illegal’ voters in California fell apart in court, with the department admitting its list could not be trusted.",sum:"Tim Cushing mostra como a acusação do Departamento de Justiça de que havia 20 mil eleitores “ilegais” na Califórnia desmoronou na Justiça, com o próprio departamento admitindo que sua lista não era confiável.",url:"https://www.techdirt.com/2026/11/04/doj-admits-its-illegal-voter-lists-cant-be-trusted-leading-to-three-court-losses-in-24-hours/"},
 {id:"mounk-seis-pensamentos-midterms",who:["yascha-mounk"],theme:"dem",fmt:"text",src:"Yascha Mounk (Substack)",date:"2026-11-04",lang:"EN",title:"Six Thoughts About a Big Night for Democrats and Democracy",sum_en:"Yascha Mounk writes that the Trump era likely ended on election night, but that Trumpism or some new populist insurgency will remain a big part of American politics.",sum:"Yascha Mounk escreve que a era Trump provavelmente terminou na noite da eleição, mas que o trumpismo ou alguma nova insurgência populista vai continuar com peso na política americana.",url:"https://writing.yaschamounk.com/p/six-thoughts-about-a-big-night-for"},
 {id:"bremmer-onda-maior-que-o-esperado",who:["ian-bremmer"],theme:"dem",fmt:"text",src:"GZERO Media",date:"2026-11-04",lang:"EN",title:"The blue wave was even bigger than we expected",sum_en:"Ian Bremmer counts at least 54 Senate seats and about 258 House seats for the Democrats, including wins in Kansas and Texas, and reads the result as a sweeping rejection of Trump.",sum:"Ian Bremmer conta ao menos 54 cadeiras no Senado e cerca de 258 na Câmara para os democratas, com vitórias no Kansas e no Texas, e lê o resultado como uma rejeição ampla a Trump.",url:"https://www.gzeromedia.com/news/by-ian-bremmer/what-does-the-blue-wave-mean-for-trump"},
 {id:"dalmia-kakistocracia",who:["shikha-dalmia"],theme:"dem",fmt:"text",src:"The UnPopulist",date:"2026-11-04",lang:"EN",title:"Trump’s Authoritarianism Gutted GOP Talent",sum_en:"The UnPopulist’s editors read the election as a contest between kakistocracy and meritocracy, in which Trump forced his party to field its worst candidates, such as Ken Paxton in Texas.",sum:"Os editores do The UnPopulist leem a eleição como uma disputa entre kakistocracia e meritocracia, em que Trump obrigou o partido a lançar seus piores candidatos, como Ken Paxton no Texas.",url:"https://www.theunpopulist.net/p/trumps-authoritarianism-gutted-gop"},
 {id:"persuasion-rohac-populismo-fica",who:[],by:"Dalibor Rohac",theme:"dem",fmt:"text",src:"Persuasion",date:"2026-11-04",lang:"EN",title:"After the Wave, Populism Will Linger",sum_en:"Dalibor Rohac revisits Juan Linz’s warnings about presidentialism to argue that the US system remains fragile when a weakened president faces a hostile Congress.",sum:"Dalibor Rohac retoma os alertas de Juan Linz sobre o presidencialismo para argumentar que o sistema americano continua frágil quando um presidente enfraquecido enfrenta um Congresso hostil.",url:"https://www.persuasion.community/p/after-the-wave-populism-will-linger"},

 {id:"trust-zappulla-democracia-recuo",who:[],by:"Antonio Zappulla",theme:"dem",fmt:"text",src:"Thomson Reuters Foundation",date:"2026-11-04",lang:"EN",title:"Democracy is in retreat. Here's why that should alarm us all",sum_en:"Opening Trust Conference 2026, Antonio Zappulla argues that three interconnected dynamics are accelerating democratic retreat. He notes that V-Dem now classifies the United States as an electoral democracy and that, according to Freedom House, global freedom has fallen for 20 consecutive years.",sum:"Na abertura da Trust Conference 2026, Antonio Zappulla diz que três dinâmicas interligadas aceleram o recuo democrático. Ele lembra que o V-Dem passou a classificar os Estados Unidos como democracia eleitoral e que, segundo a Freedom House, a liberdade no mundo cai há 20 anos seguidos.",url:"https://www.trust.org/2026/11/04/democracy-in-retreat-trust-conference-2026/"},
 {id:"trust-henriquez-sociedade-civil",who:[],by:"Carolina Henriquez-Schmitz",theme:"dem",fmt:"text",src:"Thomson Reuters Foundation",date:"2026-11-04",lang:"EN",title:"Three converging pressures facing civil society",sum_en:"Drawing on a survey of nearly 150 organisations in the TrustLaw network, Carolina Henriquez-Schmitz describes funding cuts, legal pressure and technological threats converging on civil society. Loss of funding is the leading concern, cited by 74% of the groups.",sum:"A partir de uma pesquisa com quase 150 organizações da rede TrustLaw, Carolina Henriquez-Schmitz descreve o corte de financiamento, a pressão jurídica e as ameaças tecnológicas que convergem sobre a sociedade civil. A perda de recursos é a maior preocupação, citada por 74% dos grupos.",url:"https://www.trust.org/2026/11/04/three-converging-pressures-facing-civil-society-trust-conference-2026/"},

 {id:"bulwark-saletan-certificacao",who:[],by:"Will Saletan",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-03",lang:"EN",title:"Heads We Win, Tails You’re Decertified",sum_en:"Will Saletan argues that Republicans are trying to turn the certification of results by the states and the seating of members by Congress, once formalities, into new chances to overturn elections, with Alaska as the first test.",sum:"Will Saletan argumenta que os republicanos tentam transformar a certificação dos resultados pelos estados e a posse dos eleitos no Congresso, antes formalidades, em novas chances de derrubar eleições, com o Alasca como primeiro teste.",url:"https://www.thebulwark.com/p/election-certification-seating-formalities-republicans"},

 {id:"protect-lei-marcial",who:[],theme:"dem",fmt:"text",src:"Protect Democracy",date:"2026-11-02",lang:"EN",title:"No, the president cannot declare martial law to interfere with elections",sum_en:"Protect Democracy explains that neither the Constitution nor any federal law gives the president the power to declare martial law, after people in Trump’s orbit suggested it if the midterm results go against his party.",sum:"A Protect Democracy explica que nem a Constituição nem lei federal alguma dão ao presidente o poder de decretar lei marcial, depois que pessoas do entorno de Trump sugeriram isso caso o resultado das eleições seja desfavorável ao partido dele.",url:"https://protectdemocracy.org/work/president-declare-martial-law-elections/"},

 {id:"dm-vanniekerk-trump-urnas",who:[],by:"Phillip van Niekerk",theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-10-28",lang:"EN",title:"As Trump staggers to the polls, Americans yearning for change prepare to say ‘enough’",sum_en:"For Phillip van Niekerk, the midterms are a referendum on Trump’s presidency, and his visible decline puts the MAGA movement to the test.",sum:"Para Phillip van Niekerk, as eleições de meio de mandato são um referendo sobre a presidência de Trump, e o declínio visível do presidente põe o movimento MAGA à prova.",url:"https://www.dailymaverick.co.za/opinionista/2026-10-28-as-trump-staggers-to-the-polls-americans-yearning-for-change-prepare-to-say-enough/"},
 {id:"cpj-eleicoes-eua-jornalistas",who:[],theme:"dem",fmt:"text",src:"Committee to Protect Journalists",date:"2026-10-28",lang:"EN",title:"How Journalists Can Stay Safe–And How We Can Protect America’s Press–On Midterm Election Day And Beyond",sum_en:"CPJ prepares US journalists for election day amid constant press freedom violations and hostility from the Trump administration, with attention to local reporters, who face the greatest risk.",sum:"O CPJ prepara jornalistas americanos para o dia da eleição em meio a violações constantes da liberdade de imprensa e à hostilidade do governo Trump, com atenção aos repórteres locais, que correm mais risco.",url:"https://cpj.org/2026/10/how-journalists-can-stay-safe-and-how-we-can-protect-americas-press-on-midterm-election-day-and-beyond/"},
 {id:"miller-enten-senado",who:["tim-miller"],theme:"dem",fmt:"podcast",src:"The Bulwark",date:"2026-10-28",lang:"EN",title:"Harry Enten Sees a Senate Result That Was Unthinkable Last Year",sum_en:"Less than a week before election day, pollster Harry Enten tells Tim Miller what the numbers show, including a Senate result that seemed unthinkable a year ago.",sum:"A menos de uma semana da eleição, o analista de pesquisas Harry Enten conta a Tim Miller o que os números mostram, incluindo um resultado no Senado que parecia impensável há um ano.",url:"https://www.thebulwark.com/p/harry-enten-and-julian-borger-voting"},
 {id:"gzero-israel-impasse",who:[],by:"Will Fitzpatrick",theme:"geo",fmt:"text",src:"GZERO Media",date:"2026-10-28",lang:"EN",title:"Israelis voted like never before. Now, they have to wait",sum_en:"With 77% turnout, the highest in over two decades, neither Netanyahu’s bloc (about 54 seats) nor Eisenkot’s (about 48) reaches 61, and the Arab parties, with a possible record 19 seats, could become pivotal.",sum:"Com 77% de comparecimento, o maior em mais de duas décadas, nem o bloco de Netanyahu (cerca de 54 assentos) nem o de Eisenkot (cerca de 48) chega a 61, e os partidos árabes, com um possível recorde de 19 assentos, podem virar fiel da balança.",url:"https://www.gzeromedia.com/news/analysis/israelis-voted-like-never-before-now-they-have-to-wait"},
 {id:"lgc-israel-negociacoes",who:[],by:"Marin Saillofest",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-10-28",lang:"FR",title:"Aucun gagnant clair en Israël : après les élections, vers de longues négociations ?",sum_en:"Le Grand Continent explains how President Herzog will choose who tries to form a government, why the opposition refuses to serve under Netanyahu and why Eisenkot would need the Arab parties.",sum:"O Le Grand Continent explica como o presidente Herzog vai escolher quem tenta formar o governo, por que a oposição se recusa a governar sob Netanyahu e por que Eisenkot precisaria dos partidos árabes.",url:"https://legrandcontinent.eu/fr/2026/10/28/aucun-gagnant-clair-en-israel-apres-les-elections-vers-de-longues-negociations/"},
 {id:"cpj-mada-masr-129-organizacoes",who:[],theme:"dem",fmt:"text",src:"Committee to Protect Journalists",date:"2026-10-28",lang:"EN",title:"CPJ, partners condemn Egyptian authorities’ shutdown of Mada Masr, stand with editor-in-chief Lina Attalah",sum_en:"CPJ and 129 organizations condemn the order to shut down Mada Masr, one of Egypt’s last independent newsrooms, and ask the authorities to stop using media permit laws to prosecute journalists. Egypt holds at least 25 journalists in prison.",sum:"O CPJ e outras 129 organizações condenam a ordem de fechar o Mada Masr, uma das últimas redações independentes do Egito, e pedem que as autoridades parem de usar as leis de licença de mídia para processar jornalistas. O Egito mantém pelo menos 25 jornalistas presos.",url:"https://cpj.org/2026/10/cpj-partners-condemn-egyptian-authorities-shutdown-of-mada-masr-stand-with-editor-in-chief-lina-attalah/"},
 {id:"article19-mada-masr",who:[],theme:"dem",fmt:"text",src:"Article 19",date:"2026-10-28",lang:"EN",title:"Egypt: We condemn Mada Masr shutdown, stand with editor-in-chief Lina Attalah",sum_en:"Article 19 joins the condemnation of the order to shut down Mada Masr and stands with its editor, Lina Attalah.",sum:"A Article 19 se junta à condenação da ordem de fechar o Mada Masr e apoia a editora Lina Attalah.",url:"https://www.article19.org/resources/egypt-we-condemn-mada-masr-shutdown-stand-with-editor-in-chief-lina-attalah/"},
 {id:"cpj-tunisia-el-heni",who:[],theme:"dem",fmt:"text",src:"Committee to Protect Journalists",date:"2026-10-28",lang:"EN",title:"Tunisia sentences journalist Zied el-Heni to 4 years on terrorism charges",sum_en:"CPJ reports that Tunisian journalist Zied el-Heni was sentenced to four years under counterterrorism law for his reporting on leaked recordings and for refusing to reveal his sources.",sum:"O CPJ relata que o jornalista tunisiano Zied el-Heni foi condenado a quatro anos com base na lei antiterrorismo por sua cobertura de gravações vazadas e por se recusar a revelar suas fontes.",url:"https://cpj.org/2026/10/tunisia-sentences-journalist-zied-el-heni-to-4-years-on-terrorism-charges/"},
 {id:"cpj-ira-espionagem",who:[],theme:"dem",fmt:"text",src:"Committee to Protect Journalists",date:"2026-10-28",lang:"EN",title:"Iran sentences journalists under espionage law",sum_en:"CPJ reports that Iranian journalists Artin Ghazanfari and Omid Faraghat received 26 and 10 years under a 2025 espionage law that also criminalises routine media work.",sum:"O CPJ relata que os jornalistas iranianos Artin Ghazanfari e Omid Faraghat foram condenados a 26 e 10 anos com base numa lei de espionagem de 2025 que também criminaliza o trabalho jornalístico comum.",url:"https://cpj.org/2026/10/iran-sentences-journalists-under-espionage-law/"},
 {id:"pd-spokane-3",who:[],by:"Michael Sandoval",theme:"dem",fmt:"text",src:"Protect Democracy",date:"2026-10-28",lang:"EN",title:"Pro-democracy groups stand with Spokane 3, denounce prosecutions as attack on dissent",sum_en:"Twelve pro-democracy groups back three protesters convicted of felony conspiracy after an immigrants’ rights protest in Spokane, a case the acting US attorney resigned rather than sign.",sum:"Doze grupos pró-democracia apoiam três manifestantes condenados por conspiração depois de um protesto pelos direitos de imigrantes em Spokane, num caso em que o procurador interino preferiu renunciar a assinar a denúncia.",url:"https://protectdemocracy.org/work/pro-democracy-groups-stand-with-spokane-3-denounce-prosecutions-as-attack-on-dissent/"},
 {id:"kyiv-oleshky-melania",who:[],by:"Tanya Kozyreva e Chris York",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-10-28",lang:"EN",title:"Exclusive: Putin 'wanted very much' for Melania Trump to broker Oleshky ceasefire, first lady adviser says",sum_en:"An adviser to Melania Trump says Putin asked for her to mediate the humanitarian ceasefire in occupied Oleshky. A former British defence attaché sees a move to win MAGA credit before the midterms.",sum:"Um assessor de Melania Trump diz que Putin pediu que ela mediasse o cessar-fogo humanitário em Oleshky, cidade ocupada. Um ex-adido militar britânico vê nisso um gesto para agradar à base MAGA antes das eleições.",url:"https://kyivindependent.com/exclusive-putin-wanted-very-much-for-melania-trump-to-broker-oleshky-ceasefire-first-lady-adviser-says/"},
 {id:"dm-labia-mercados-riscos",who:[],by:"Natale Labia",theme:"eco",fmt:"text",src:"Daily Maverick",date:"2026-10-28",lang:"EN",title:"Markets are waking up to the risks they have spent months ignoring",sum_en:"Natale Labia sees a turning point as doubts about AI valuations, growth and interest rates push investors from equities into government bonds, and says this week’s Fed signals and Big Tech earnings could decide what comes next.",sum:"Natale Labia vê uma virada, com as dúvidas sobre o valor das empresas de IA, o crescimento e os juros levando investidores das ações para os títulos públicos, e diz que os sinais do Fed e os balanços das grandes de tecnologia nesta semana podem decidir o que vem depois.",url:"https://www.dailymaverick.co.za/opinionista/2026-10-28-markets-are-waking-up-to-the-risks-they-have-spent-months-ignoring/"},
 {id:"lgc-bolsas-chinesas",who:[],theme:"eco",fmt:"text",src:"Le Grand Continent",date:"2026-10-28",lang:"FR",title:"Les bourses chinoises ont perdu près de 2 500 milliards de dollars depuis mai",sum_en:"Chinese stocks have lost nearly $2.5 trillion since their May peak, driven by doubts about the profitability of AI companies and weak consumption, despite state buying to prop up the market.",sum:"As bolsas chinesas perderam quase 2,5 trilhões de dólares desde o pico de maio, puxadas pelas dúvidas sobre a rentabilidade das empresas de IA e pelo consumo fraco, apesar das compras estatais para segurar o mercado.",url:"https://legrandcontinent.eu/fr/2026/10/28/les-bourses-chinoises-ont-perdu-pres-de-2-500-milliards-de-dollars-depuis-mai/"},
 {id:"lgc-ia-emprego",who:[],theme:"eco",fmt:"text",src:"Le Grand Continent",date:"2026-10-28",lang:"FR",title:"L’impact de l’IA sur l’emploi se diffuse au-delà du secteur technologique",sum_en:"Goldman Sachs sees clearer signs that AI is slowing job growth beyond tech in the US, half of Americans are very worried about AI’s role in the economy, and the Netherlands plans to cut about 25,000 civil service jobs.",sum:"O Goldman Sachs vê sinais mais claros de que a IA freia o emprego fora da tecnologia nos EUA, metade dos americanos se diz muito preocupada com o papel da IA na economia e a Holanda planeja cortar cerca de 25 mil cargos públicos.",url:"https://legrandcontinent.eu/fr/2026/10/28/limpact-de-lia-sur-lemploi-se-diffuse-au-dela-du-secteur-technologique/"},
 {id:"snyder-matrix-skynet",who:["timothy-snyder"],theme:"tec",fmt:"text",src:"Thinking about… (Substack)",date:"2026-10-28",lang:"EN",title:"Our American Matrix, Our American Skynet",sum_en:"Timothy Snyder argues that tech billionaires violated basic freedoms this month, from Musk throttling Starlink in Ukraine as Russian strikes intensified to Meta suspending the No Kings coalition’s account on a day of pro-voting rallies.",sum:"Timothy Snyder argumenta que bilionários da tecnologia violaram liberdades básicas neste mês, de Musk limitando o Starlink na Ucrânia enquanto os ataques russos se intensificavam à Meta suspendendo a conta da coalizão No Kings num dia de atos pelo voto.",url:"https://snyder.substack.com/p/our-american-matrix-our-american"},
 {id:"kristol-problema-musk",who:["bill-kristol"],theme:"tec",fmt:"text",src:"The Bulwark",date:"2026-10-28",lang:"EN",title:"How Do You Solve a Problem Like Elon Musk?",sum_en:"Bill Kristol asks what to do about Elon Musk’s power over politics and war.",sum:"Bill Kristol pergunta o que fazer com o poder de Elon Musk sobre a política e a guerra.",url:"https://www.thebulwark.com/p/how-do-you-solve-a-problem-like-elon-musk-talarico-texas-trans-money-senate"},
 {id:"masnick-chatbots-paywall",who:["mike-masnick"],theme:"tec",fmt:"text",src:"Techdirt",date:"2026-10-28",lang:"EN",title:"Never Mind The Deepfakes, Chatbots Have To Deal With Election Lies Being Free, While Truth Is Paywalled",sum_en:"Mike Masnick argues that the bigger election risk is not deepfakes but chatbots that search the web while reliable news sites block them, so that lies stay free and the truth sits behind paywalls.",sum:"Mike Masnick argumenta que o risco eleitoral maior não está nos deepfakes, mas nos chatbots que buscam na web enquanto os sites de notícia confiáveis os bloqueiam, de modo que a mentira fica de graça e a verdade fica atrás do paywall.",url:"https://www.techdirt.com/2026/10/28/never-mind-the-deepfakes-chatbots-have-to-deal-with-election-lies-being-free-while-truth-is-paywalled/"},
 {id:"meio-flavio-fuga-eua",who:[],by:"Flávia Tavares",theme:"dem",fmt:"text",src:"Meio",date:"2026-10-27",lang:"PT",title:"Flávio Bolsonaro foge para os EUA e abre disputa por liderança na oposição",sum_en:"Flávia Tavares compares Flávio Bolsonaro’s flight to the United States with Jair Bolsonaro’s silence after the 2022 defeat, argues that the son, under investigation for money laundering, holds none of the power his father had, and sees the race to lead the right wide open, with Tarcísio de Freitas in front.",sum:"Flávia Tavares compara a fuga de Flávio Bolsonaro para os Estados Unidos com o silêncio de Jair Bolsonaro depois da derrota de 2022, argumenta que o filho, investigado por lavagem de dinheiro, não tem o poder que o pai tinha e vê aberta a disputa pela liderança da direita, com Tarcísio de Freitas à frente.",url:"https://www.canalmeio.com.br/2026/10/27/flavio-bolsonaro-foge-para-os-eua-e-abre-disputa-por-lideranca-na-oposicao/"},
 {id:"14ymedio-eua-acolhe-flavio",who:[],theme:"geo",fmt:"text",src:"14ymedio",date:"2026-10-27",lang:"ES",title:"Estados Unidos anuncia que acogerá a Flávio Bolsonaro y a su familia",sum_en:"14ymedio reports that the Trump administration will issue visas to Flávio Bolsonaro and his family even though Brazil’s Federal Police cancelled his passports, and that Trump called Brazil’s election fraudulent.",sum:"O 14ymedio relata que o governo Trump vai conceder vistos a Flávio Bolsonaro e à família, mesmo com os passaportes cancelados pela Polícia Federal, e que Trump chamou a eleição brasileira de fraudulenta.",url:"https://www.14ymedio.com/internacional/estados-unidos-anuncia-acogera-flavio_1_1132510.html"},
 {id:"cpj-egito-mada-masr",who:[],theme:"dem",fmt:"text",src:"Committee to Protect Journalists",date:"2026-10-27",lang:"EN",title:"CPJ outraged by Egypt court conviction of journalist Lina Attalah, order of Mada Masr’s closure",sum_en:"CPJ condemns the conviction of Lina Attalah, editor of the independent outlet Mada Masr, for running an unlicensed website, along with a fine, the order to close the outlet and her detention until the fine is paid, and describes a trial without basic guarantees of defence.",sum:"O CPJ condena a condenação de Lina Attalah, editora do site independente Mada Masr, por manter um site sem licença, com multa, ordem de fechamento do veículo e prisão até que a multa seja paga, e descreve um julgamento sem as garantias básicas de defesa.",url:"https://cpj.org/2026/10/cpj-outraged-by-egypt-court-conviction-of-journalist-lina-attalah-order-of-mada-masrs-closure/"},
 {id:"article19-servia-imprensa",who:[],theme:"dem",fmt:"text",src:"Article 19",date:"2026-10-27",lang:"EN",title:"Serbia: Elections could mark a turning point for media freedom",sum_en:"Article 19 and its partners in the Media Freedom Rapid Response see the Student List’s win and Vučić’s concession after 12 years in power as an opportunity to rebuild media freedom in Serbia.",sum:"A Article 19 e seus parceiros na rede Media Freedom Rapid Response veem na vitória da Lista Estudantil e no reconhecimento da derrota por Vučić, depois de 12 anos no poder, uma oportunidade para reconstruir a liberdade de imprensa na Sérvia.",url:"https://www.article19.org/resources/serbia-elections-could-mark-a-turning-point-for-media-freedom/"},
 {id:"occrp-servia-krik",who:[],theme:"dem",fmt:"text",src:"OCCRP",date:"2026-10-27",lang:"EN",title:"‘Is This Real?’: A Serbian Investigative Journalist Reflects on the Country’s Stunning Election",sum_en:"Stevan Dojčinović, editor of the investigative outlet KRIK, recalls a decade of surveillance, lawsuits and threats under Vučić and says the newsroom can now talk freely, while the hard part of cleaning up the state lies ahead.",sum:"Stevan Dojčinović, editor do site investigativo KRIK, relembra uma década de vigilância, processos e ameaças sob Vučić e conta que a redação agora pode conversar livremente, mas que a parte difícil, limpar o Estado, ainda está por vir.",url:"https://www.occrp.org/en/feature/is-this-real-a-serbian-investigative-journalist-reflects-on-the-countrys-stunning-election"},
 {id:"lgc-servia-plano-estudantes",who:[],by:"Ramona Bloj",theme:"dem",fmt:"text",src:"Le Grand Continent",date:"2026-10-27",lang:"FR",title:"Le plan des étudiants serbes qui ont renversé Vučić (texte intégral)",sum_en:"Le Grand Continent publishes the eleven-point programme of the Serbian students and explains how assemblies chose 250 candidates, none of them students, with the stated aim of changing the rules that allowed power to be monopolised.",sum:"O Le Grand Continent publica o programa de onze pontos dos estudantes sérvios e explica como assembleias escolheram 250 candidatos, nenhum deles estudante, com o objetivo declarado de mudar as regras que permitiram monopolizar o poder.",url:"https://legrandcontinent.eu/fr/2026/10/27/le-plan-des-etudiants-serbes-qui-ont-renverse-vucic-texte-integral/"},
 {id:"gupta-servia-estudantes",who:["shekhar-gupta"],theme:"dem",fmt:"podcast",src:"ThePrint",date:"2026-10-27",lang:"EN",title:"CutTheClutter: Serbia election: How a canopy collapse triggered a student protest & ended strongman Vučić's rule",sum_en:"Shekhar Gupta explains how the student movement born from the Novi Sad canopy collapse turned street protest into political power, and what challenges it now faces.",sum:"Shekhar Gupta explica como o movimento estudantil nascido do desabamento da marquise de Novi Sad transformou o protesto de rua em poder político e quais desafios tem pela frente.",url:"https://theprint.podbean.com/e/cuttheclutter-serbia-election-how-a-canopy-collapse-triggered-a-student-protest-ended-strongman-vucics-rule/"},
 {id:"lgc-nordicos-putin",who:[],by:"Marin Saillofest",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-10-27",lang:"FR",title:"Pourquoi les dirigeants finlandais et norvégien ont-ils repris le dialogue avec Poutine",sum_en:"Le Grand Continent explains the first call between Stubb, Støre and Putin, ahead of talks in Abu Dhabi, and quotes analysts who fear the Kremlin will use such contacts to divide Europeans.",sum:"O Le Grand Continent explica a primeira conversa de Stubb e Støre com Putin, antes das negociações de Abu Dhabi, e cita analistas que temem que o Kremlin use esses contatos para dividir os europeus.",url:"https://legrandcontinent.eu/fr/2026/10/27/pourquoi-les-dirigeants-finlandais-et-norvegien-ont-ils-repris-le-dialogue-avec-poutine/"},
 {id:"kristol-onda-azul",who:["bill-kristol"],theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-10-27",lang:"EN",title:"Wave Goodbye to a Republican Congress",sum_en:"A week before the midterms, Bill Kristol reads early voting and the polls as signs of a Democratic wave and says Trump’s schemes to subvert the election have so far been ineffective.",sum:"A uma semana das eleições de meio de mandato, Bill Kristol lê o voto antecipado e as pesquisas como sinais de uma onda democrata e diz que as manobras de Trump para subverter a eleição até agora não funcionaram.",url:"https://www.thebulwark.com/p/wave-goodbye-to-a-republican-congress-midterms-polling-early-vote-comey-indictment"},
 {id:"gzero-el-fasher-um-ano",who:[],by:"Will Fitzpatrick",theme:"geo",fmt:"text",src:"GZERO Media",date:"2026-10-27",lang:"EN",title:"One year since the El Fasher massacre",sum_en:"A year after the RSF siege of El Fasher, tens of thousands remain missing, the city is still under RSF control and the UK has sanctioned 15 commanders from both sides over sexual violence.",sum:"Um ano depois do cerco das RSF a El Fasher, dezenas de milhares de pessoas seguem desaparecidas, a cidade continua sob controle das RSF e o Reino Unido sancionou 15 comandantes dos dois lados por violência sexual.",url:"https://www.gzeromedia.com/news/hard-numbers/one-year-since-the-el-fasher-massacre"},
 {id:"dm-mocambique-cromo",who:[],theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-10-27",lang:"EN",title:"FORBIDDEN STORIES: Killed while livestreaming — the blogger who exposed Mozambique’s toxic chromium mining corridor",sum_en:"With Forbidden Stories, Daily Maverick shows that after blogger Mano Shottas was shot dead while livestreaming a protest against chromium pollution, illegal dumping continued on the border with South Africa and whistleblowers received death threats.",sum:"Com o Forbidden Stories, o Daily Maverick mostra que, depois que o blogueiro Mano Shottas foi morto a tiros enquanto transmitia um protesto contra a poluição do cromo, o despejo ilegal continuou na fronteira com a África do Sul e quem denuncia recebe ameaças de morte.",url:"https://www.dailymaverick.co.za/article/2026-10-27-killed-while-livestreaming-the-blogger-who-exposed-mozambiques-toxic-chromium-mining-corridor/"},
 {id:"occrp-changan-caminhoes-russia",who:[],theme:"geo",fmt:"text",src:"OCCRP",date:"2026-10-12",lang:"EN",title:"A Chinese Auto Giant Sponsors Portugal’s National Football Team. Its Trucks Are Used by Russia to Attack Ukraine.",sum_en:"OCCRP reporters found that the Russian military uses civilian trucks from China’s Changan, sponsor of Portugal’s national football team, to launch drone strikes against Ukraine. The Portuguese federation says the deal went through a strict compliance process.",sum:"Repórteres da OCCRP mostram que o exército russo usa caminhões civis da chinesa Changan, patrocinadora da seleção de Portugal, para lançar drones contra a Ucrânia. A federação portuguesa diz que o contrato passou por um processo rigoroso de conformidade.",url:"https://www.occrp.org/en/scoop/a-chinese-auto-giant-sponsors-portugals-national-football-team-its-trucks-are-used-by-russia-to-attack-ukraine"},
 {id:"person-eixo-da-desordem",who:[],by:"Robert Person",theme:"geo",fmt:"text",src:"Journal of Democracy",date:"2026-06-01",lang:"EN",title:"A New American Grand Strategy for the 21st Century",sum_en:"Robert Person, of the Foreign Policy Research Institute, calls China, Iran, North Korea and Belarus an “Axis of Upheaval” behind Russia’s war. For him, Chinese energy purchases and financial networks pay for the war, and he proposes a “defensive liberalism” with collective tariffs on China, joint weapons production among allies and NATO spending at 5% of GDP.",sum:"Robert Person, do Foreign Policy Research Institute, chama de \"Eixo da Desordem\" o grupo formado por China, Irã, Coreia do Norte e Belarus em torno da guerra russa. Para ele, as compras chinesas de energia e as redes financeiras de Pequim pagam a guerra, e ele propõe um \"liberalismo defensivo\", com tarifas coletivas contra a China, produção conjunta de armas entre aliados e gasto de 5% do PIB na OTAN.",url:"https://www.journalofdemocracy.org/online-exclusive/a-new-american-grand-strategy-for-the-21st-century/"},
 {id:"cheeseman-potencias-medias-autoritarias",who:["nic-cheeseman"],by:"Marie-Eve Desrosiers e Nic Cheeseman",theme:"geo",fmt:"text",src:"Journal of Democracy",date:"2026-04-01",lang:"EN",title:"The Rise of Authoritarian Middle Powers",sum_en:"Marie-Eve Desrosiers and Nic Cheeseman argue that authoritarian middle powers such as the UAE, Saudi Arabia, Turkey and Egypt hedge between blocs and erode the rules-based order through regional bodies and an “authoritarian multilateralism”. For them, these states are not simply proxies of Beijing or Moscow.",sum:"Marie-Eve Desrosiers e Nic Cheeseman argumentam que potências médias autoritárias, como Emirados, Arábia Saudita, Turquia e Egito, jogam entre os blocos e corroem a ordem baseada em regras por meio de organismos regionais e de um \"multilateralismo autoritário\". Para eles, esses países não são meras extensões de Pequim ou de Moscou.",url:"https://www.journalofdemocracy.org/articles/the-rise-of-authoritarian-middle-powers/"},
 {id:"dm-fabricius-anc-ira",who:[],by:"Peter Fabricius",theme:"geo",fmt:"text",src:"Daily Maverick",date:"2026-03-01",lang:"EN",title:"ANC’s long friendship with Iran has come at a cost",sum_en:"Peter Fabricius shows how South Africa has shielded Iran at the UN for years, voting against or abstaining on every resolution condemning its human rights abuses, and argues that this alliance has cost the country its relations with the West.",sum:"Peter Fabricius mostra como a África do Sul protege o Irã na ONU há anos, votando contra ou se abstendo em todas as resoluções que condenam suas violações de direitos humanos, e argumenta que essa aliança custou ao país suas relações com o Ocidente.",url:"https://www.dailymaverick.co.za/article/2026-03-01-ancs-long-friendship-with-iran-has-come-at-a-cost/"},
 {id:"protect-mesarios-ordem-judicial",who:[],theme:"dem",fmt:"text",src:"Protect Democracy",date:"2026-10-30",lang:"EN",title:"DOJ and DHS sued over baseless threats to prosecute election workers",sum_en:"Protect Democracy and a coalition of unions and civil rights groups sued the Justice and Homeland Security departments over threats to prosecute election workers who count ballots from voters on a DOJ list. A federal court issued a temporary restraining order the same night.",sum:"A Protect Democracy e uma coalizão de sindicatos e grupos de direitos civis processaram os departamentos de Justiça e de Segurança Interna pelas ameaças de processar quem apurasse votos de eleitores de uma lista do DOJ. Um tribunal federal concedeu uma ordem provisória na mesma noite.",url:"https://protectdemocracy.org/work/doj-dhs-sued-threats-election-workers/"},
 {id:"bulwark-aclu-simulacoes",who:[],by:"Lauren Egan",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-02",lang:"EN",title:"Inside the Wargaming to Foil Trump’s Election Meddling",sum_en:"Lauren Egan reports how the ACLU and other pro-democracy groups rehearsed 25 scenarios of interference in the midterms, from armed agents at the polls to Congress refusing to seat the winners, and asked what happens if no response comes together.",sum:"Lauren Egan conta como a ACLU e outros grupos pró-democracia ensaiaram 25 cenários de interferência nas eleições de meio de mandato, de agentes armados nas seções à recusa do Congresso em empossar os eleitos, e perguntaram o que acontece se nenhuma resposta funcionar.",url:"https://www.thebulwark.com/p/inside-the-pro-democracy-groups-wargaming-to-foil-trump-midterm-election-meddling"},
 {id:"kasparov-mark-wolf-eleicoes",who:["garry-kasparov"],theme:"dem",fmt:"video",src:"The Next Move",date:"2026-10-31",lang:"EN",title:"Trick or Threat: The Midterms Are in Danger",sum_en:"On Kasparov’s The Next Move, former federal judge Mark Wolf explains why armed federal agents at the polls would break US law and how the administration has laid the groundwork to call the election stolen.",sum:"No The Next Move, de Kasparov, o ex-juiz federal Mark Wolf explica por que agentes federais armados nas seções violariam a lei americana e como o governo preparou o terreno para dizer que a eleição foi roubada.",url:"https://www.thenextmove.org/p/trick-or-threat-the-midterms-are"},
 {id:"bulwark-young-derrota-republicana",who:[],by:"Cathy Young",theme:"dem",fmt:"text",src:"The Bulwark",date:"2026-11-02",lang:"EN",title:"Republicans Have Earned a Rout",sum_en:"Cathy Young argues that Republicans deserve a heavy defeat, pointing to Trump’s courting of Putin, the deportation of Afghan allies toward the Taliban and the Justice Department’s repeated cases against James Comey.",sum:"Cathy Young argumenta que os republicanos merecem uma derrota pesada e aponta a aproximação de Trump com Putin, a deportação de afegãos aliados rumo ao Talibã e os sucessivos processos do Departamento de Justiça contra James Comey.",url:"https://www.thebulwark.com/p/republicans-have-earned-a-rout-2026-midterms-blue-wave"},
 {id:"kristol-longwell-tres-dias",who:["bill-kristol"],theme:"dem",fmt:"podcast",src:"The Bulwark",date:"2026-11-01",lang:"EN",title:"Three Days Until the Midterms. How Bad Could It Get for Republicans?",sum_en:"Bill Kristol and Sarah Longwell explain why they think Republicans may be heading for a historic defeat, drawing on Longwell’s focus groups with disillusioned Trump voters.",sum:"Bill Kristol e Sarah Longwell explicam por que acham que os republicanos podem caminhar para uma derrota histórica, a partir dos grupos focais de Longwell com eleitores desiludidos de Trump.",url:"https://www.thebulwark.com/p/three-days-until-the-midterms-how"},
 {id:"snyder-podhorzer-midterms",who:["timothy-snyder"],theme:"dem",fmt:"video",src:"Thinking about… (Substack)",date:"2026-11-01",lang:"EN",title:"The Midterms and the Aftermath with Michael Podhorzer",sum_en:"Timothy Snyder talks with political strategist Michael Podhorzer about the larger meaning of the midterms and what must come after the vote.",sum:"Timothy Snyder conversa com o estrategista político Michael Podhorzer sobre o sentido mais amplo das eleições de meio de mandato e o que precisa vir depois da votação.",url:"https://snyder.substack.com/p/the-midterms-and-the-aftermath-with"},
 {id:"kyiv-midterms-ucrania",who:[],by:"Martin Fornusek",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-02",lang:"EN",title:"What the US midterms could mean for Ukraine",sum_en:"Martin Fornusek hears experts who expect a Democratic Congress to scrutinize Trump’s easing of sanctions on Russia more closely, while noting that the president keeps firm control of foreign policy.",sum:"Martin Fornusek ouve especialistas que esperam de um Congresso democrata mais fiscalização sobre o alívio das sanções à Rússia, mas lembram que o presidente mantém firme o controle da política externa.",url:"https://kyivindependent.com/what-the-us-midterms-could-mean-for-ukraine/"},
 {id:"confidencial-feeley-congresso",who:[],by:"Carlos F. Chamorro",theme:"geo",fmt:"text",src:"Confidencial",date:"2026-11-02",lang:"ES",title:"Si los demócratas ganan el Congreso, investigarán a Trump por corrupción",sum_en:"In an interview with Carlos F. Chamorro, former US ambassador John Feeley says Trump will not accept defeat and that a Democratic Congress would block his government and investigate it for corruption.",sum:"Em entrevista a Carlos F. Chamorro, o ex-embaixador americano John Feeley diz que Trump não aceitará a derrota e que um Congresso democrata travaria o governo e o investigaria por corrupção.",url:"https://confidencial.digital/entrevistas/si-los-democratas-ganan-el-congreso-investigaran-a-trump-por-corrupcion/"},
 {id:"leonard-politica-externa-democrata",who:["mark-leonard"],theme:"geo",fmt:"podcast",src:"ECFR",date:"2026-10-30",lang:"EN",title:"After Trump: The future of Democratic foreign policy",sum_en:"Mark Leonard, Nevada Joan Lee and Stephen Wertheim discuss what the midterms mean for US foreign policy until the end of Trump’s term and what kind of foreign policy the Democrats would bring afterwards.",sum:"Mark Leonard, Nevada Joan Lee e Stephen Wertheim discutem o que as eleições de meio de mandato significam para a política externa americana até o fim do mandato de Trump e que política externa os democratas trariam depois.",url:"https://ecfr.eu/podcasts/episode/after-trump-the-future-of-democratic-foreign-policy/"},
 {id:"carnegie-israel-sem-vencedor",who:[],by:"Carnegie Middle East Program",theme:"dem",fmt:"text",src:"Carnegie Endowment for International Peace",date:"2026-10-28",lang:"EN",title:"Israel’s Election Had No Clear Winner. What Comes Next for the Region?",sum_en:"Carnegie’s Middle East scholars say neither the pro-Netanyahu nor the anti-Netanyahu bloc has a clear path to 61 seats, that Arab parties won more seats than ever but remain sidelined, and that little will change on Gaza, Lebanon or Iran whoever governs.",sum:"Os pesquisadores do programa de Oriente Médio do Carnegie dizem que nem o bloco pró-Netanyahu nem o contrário têm caminho claro para 61 cadeiras, que os partidos árabes nunca tiveram tantas cadeiras e seguem isolados, e que pouco mudará em Gaza, no Líbano ou no Irã, governe quem governar.",url:"https://carnegieendowment.org/emissary/2026/10/israel-election-no-winner-what-next-middle-east"},
 {id:"ari-prefeituras-zonas-seguranca",who:[],by:"Said Haddadi",theme:"geo",fmt:"text",src:"Arab Reform Initiative",date:"2026-10-30",lang:"EN",title:"Municipalities Under Fire: Local Governance in Israel’s “Security Zones” in Southern Lebanon and Syria",sum_en:"Said Haddadi shows municipalities in southern Lebanon and Syria holding civilian life together inside Israel’s self-declared security zones, and argues that the campaign weakens the state-building efforts of both Beirut and Damascus.",sum:"Said Haddadi mostra as prefeituras do sul do Líbano e da Síria segurando a vida civil dentro das zonas de segurança declaradas por Israel e argumenta que a campanha enfraquece a reconstrução do Estado em Beirute e em Damasco.",url:"https://www.arab-reform.net/publication/municipalities-under-fire-local-governance-in-israels-security-zones-in-southern-lebanon-and-syria/"},
 {id:"kyiv-bulgaria-yotova",who:[],by:"Martin Fornusek",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-02",lang:"EN",title:"Russia-friendly Yotova wins Bulgaria’s presidential runoff",sum_en:"Iliana Yotova, who opposes military aid to Ukraine and calls for dialogue with Moscow, won Bulgaria’s runoff with 57.6% against pro-Western former prime minister Andrey Gyurov, in a NATO and EU country on the eastern flank of both.",sum:"Iliana Yotova, que se opõe à ajuda militar à Ucrânia e defende diálogo com Moscou, venceu o segundo turno na Bulgária com 57,6% contra o ex-premiê pró-Ocidente Andrey Gyurov, num país da Otan e da UE no flanco leste dos dois.",url:"https://kyivindependent.com/russia-friendly-yotova-wins-bulgarias-presidential-runoff/"},
 {id:"lgc-bulgaria-moscou",who:[],by:"Ramona Bloj",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-01",lang:"FR",title:"Avec la victoire d’Iliana Yotova à la présidentielle, la Bulgarie bascule-t-elle dans le camp de Moscou ?",sum_en:"Le Grand Continent asks whether Yotova’s victory, which strengthens prime minister Rumen Radev, moves Bulgaria into Moscow’s camp after years of instability.",sum:"O Le Grand Continent pergunta se a vitória de Yotova, que fortalece o premiê Rumen Radev, leva a Bulgária para o campo de Moscou depois de anos de instabilidade.",url:"https://legrandcontinent.eu/fr/2026/11/01/avec-la-victoire-diliana-yotova-a-la-presidentielle-la-bulgarie-bascule-t-elle-dans-le-camp-de-moscou/"},

 {id:"mounk-dan-williams-ia",who:["yascha-mounk"],theme:"tec",fmt:"podcast",src:"Persuasion",date:"2026-10-31",lang:"EN",title:"Dan Williams on Why AI (Probably) Won’t Kill Us",sum_en:"Yascha Mounk and philosopher Dan Williams discuss whether AI is truly transformative, how outsourcing thinking to it may erode young people’s skills and why today’s political fights over AI miss the important questions.",sum:"Yascha Mounk e o filósofo Dan Williams discutem se a IA é de fato transformadora, como terceirizar o pensamento a ela pode corroer as habilidades dos jovens e por que as brigas políticas de hoje sobre IA deixam de lado as questões importantes.",url:"https://www.persuasion.community/p/dan-williams-3"},

 {id:"dm-africa-do-sul-prefeituras",who:[],theme:"dem",fmt:"text",src:"Daily Maverick",date:"2026-11-01",lang:"EN",title:"New mayors beware — SA’s local government revolt is waiting for a spark",sum_en:"Ahead of South Africa’s 4 November local elections, Daily Maverick warns that whoever wins Johannesburg will inherit a crisis of legitimacy, with 73% of people trusting local government little or not at all, according to Afrobarometer.",sum:"Antes das eleições locais de 4 de novembro na África do Sul, o Daily Maverick avisa que quem vencer em Joanesburgo herdará uma crise de legitimidade, com 73% das pessoas confiando pouco ou nada no governo local, segundo o Afrobarometer.",url:"https://www.dailymaverick.co.za/article/2026-11-01-new-mayors-beware-sas-local-government-revolt-is-waiting-for-a-spark/"},

 {id:"bti-sul-asia-protestos",who:[],theme:"dem",fmt:"text",src:"Bertelsmann Transformation Index (BTI)",date:"2026-10-30",lang:"EN",title:"Mobilized but not Democratized? Protest and Political Regimes in South Asia",sum_en:"The BTI blog asks how far protest in South Asia has translated into democratic change, noting that India’s democracy score fell from 8.1 in 2014 to 6.10 and has not moved since.",sum:"O blog do BTI pergunta até que ponto os protestos no Sul da Ásia viraram mudança democrática e lembra que a nota de democracia da Índia caiu de 8,1 em 2014 para 6,10 e não se mexeu desde então.",url:"https://blog.bti-project.org/2026/10/30/mobilized-but-not-democratized-protest-and-political-regimes-in-south-asia/"},

 {id:"id-carta-fukuyama",who:[],pub:"revista-id",by:"Inteligência Democrática",theme:"dem",fmt:"text",src:"Revista ID",date:"2026-10-27",lang:"EN",title:"Carta a Francis Fukuyama",sum_en:"Revista ID replies to Fukuyama’s reading of Brazil’s election and argues, with eight reasons set out by Augusto de Franco, that Lula and the PT belong to electoral democracy but not to liberal democracy.",sum:"A Revista ID responde à leitura de Fukuyama sobre a eleição brasileira e argumenta, com oito razões apresentadas por Augusto de Franco, que Lula e o PT pertencem à democracia eleitoral, mas não à democracia liberal.",url:"https://www.revistaid.com.br/p/carta-a-francis-fukuyama"},
 {id:"fukuyama-espirito-democracia",who:["francis-fukuyama"],theme:"dem",fmt:"text",src:"Persuasion",date:"2026-10-26",lang:"EN",title:"The Spirit of Democracy Remains Strong",sum_en:"Fukuyama reads the news from Brazil, Serbia and Venezuela as a possible reversal of the authoritarian-populist wave, while warning that it is too soon to know whether these victories will last.",sum:"Fukuyama lê as notícias do Brasil, da Sérvia e da Venezuela como uma possível virada da onda populista autoritária, mas avisa que ainda é cedo para saber se essas vitórias vão durar.",url:"https://www.persuasion.community/p/the-spirit-of-democracy-remains-strong",nota:"O Global Village lê o Brasil de outro modo. Para nós, Lula e o PT representam um populismo de esquerda, e a eleição opôs dois populismos de sinais contrários. Por isso não tratamos o resultado como uma vitória da democracia liberal.",nota_en:"Global Village reads Brazil differently. In our view, Lula and the PT represent a left-wing populism, and the election pitted two populisms of opposite signs against each other. That is why we do not treat the result as a victory for liberal democracy.",nota_url:"https://www.revistaid.com.br/p/carta-a-francis-fukuyama"},

  about_lens_t:"A lente",about_lens:["Há quase vinte anos o mundo perde democracias. Os relatórios do V-Dem e da Freedom House registram esse recuo ano após ano, e hoje já existem mais autocracias do que democracias no planeta. Boa parte dessa virada veio pelas urnas, com populismos autoritários de direita e de esquerda que chegam ao poder pelo voto e depois desmontam, por dentro, as regras que permitiriam tirá-los de lá.", "A perda é grande porque a democracia liberal funciona como uma infraestrutura. Foi sobre ela que se construíram algumas das maiores conquistas da humanidade, como a ampliação das liberdades individuais, a queda da mortalidade infantil, o acesso à educação, a liberdade acadêmica e um longo período com menos guerras entre países. Quando essa infraestrutura se desgasta, os efeitos aparecem depressa. As liberdades encolhem e as guerras voltam, enquanto a política se transforma numa disputa entre inimigos.", "Acompanhar quem pensa com clareza sobre tudo isso também ficou mais difícil. As redes estão tomadas pela desinformação que os dois polos produzem, e os algoritmos premiam o que gera raiva. Encontrar análises sérias, de quem rejeita o autoritarismo venha de onde vier, virou um trabalho que quase ninguém tem tempo de fazer.", "O Global Village nasce desse diagnóstico. Acompanhamos pensadores, economistas, jornalistas e políticos de diversos países, em todos os continentes, reunimos o que eles publicam em textos, vídeos e podcasts e entregamos cada análise com um resumo curto no seu idioma e o link para o original. É para quem quer entender política, geopolítica, economia e tecnologia pela lente da democracia liberal sem depender do algoritmo das redes nem visitar dezenas de sites por dia."],about_cur_t:"A curadoria",about_cur:["A curadoria responde a uma pergunta, quem vale a pena acompanhar. Ela nunca decide o que cada autor diz, e por isso o Global Village mostra vozes que discordam entre si.", "Para entrar, uma pessoa ou organização precisa defender de forma consistente eleições livres, Estado de direito, liberdade de expressão, imprensa independente e direitos individuais, e criticar publicamente os autoritários dos dois campos, inclusive o mais próximo do seu meio. Apoiar ou relativizar um golpe desqualifica.", "Cada nome passa por dois curadores de perfis diferentes, que avaliam sem ver o voto um do outro. Quando eles discordam, um terceiro desempata. As aprovações vencem em doze meses e voltam para nova avaliação. Quem financia o projeto não indica curadores nem participa das decisões.", "Quando uma análise curada lê um país de um jeito que os curadores daquela região consideram equivocado, o resumo continua fiel ao autor e o Global Village acrescenta uma nota do editor com o contexto que falta. A meta é ter um curador para cada região do mundo."],step0_t:"Curadoria",step0:"Um conselho de curadores de diferentes tradições políticas decide quem o Global Village acompanha. Só entram vozes que defendem a democracia liberal e criticam autoritários de qualquer lado.",

  about_lang_t:"Idiomas",about_lang:"A interface está em inglês, português, espanhol, francês e italiano. Os resumos são gerados no idioma de quem lê, e o original fica a um clique.",

  footer_nav:"Navegar",footer_topics:"Temas",footer_about:"Sobre",footer_lang:"Idiomas",vp_kicker:"O que é o Global Village",vp_title:"Uma rede para entender e fortalecer a democracia liberal",
  vp_lede:"O Global Village é uma rede internacional de pessoas que querem entender o mundo pela lente da democracia liberal e fortalecê-la onde vivem. A democracia se sustenta ou se enfraquece em escala global, e cada país só cuida bem da sua quando entende a realidade dos outros sem projetar neles a sua. Por isso a rede junta um observatório de análises em cinco idiomas, grupos locais que se reúnem com materiais comuns e conversas frequentes entre pessoas de países diferentes.",

  nl_page_title:"Newsletter",nl_page_text:"Every weekday morning, three to five stories the most relevant analysts discussed the day before, each with a short summary in your language and a link to the original.",nl_lang:"Newsletter language",nl_preview:"Preview of the next issue",nl_edition:"Tomorrow morning’s issue",
  about_title:"How it works",about_lede:"Global Village is an international network of people who want to understand the world through the lens of liberal democracy and strengthen it where they live. It works on three fronts that support one another.",
  step1_t:"Collection",step1:"We automatically monitor the websites, newsletters, video channels and podcasts of every person and organisation in the database.",step2_t:"Classification",step2:"Each new piece is classified by topic, format, origin and language.",step3_t:"Summary and translation",step3:"AI writes a short summary and translates it into the reader’s language. The original text is never reproduced.",step4_t:"Publication",step4:"The piece appears on the site with title, summary and a link to the original, and goes into the next morning’s newsletter.",
  about_lens_t:"The lens",about_lens:["For almost twenty years the world has been losing democracies. The V-Dem and Freedom House reports record this retreat year after year, and there are now more autocracies than democracies on the planet. Much of the shift came through the ballot box, with authoritarian populists of the right and the left who win power by vote and then dismantle, from within, the rules that would let voters remove them.", "The loss is large because liberal democracy works as infrastructure. Some of humanity’s greatest achievements were built on it, such as the expansion of individual freedoms, the fall in child mortality, access to education, academic freedom and a long period with fewer wars between countries. When that infrastructure wears down, the effects show quickly. Freedoms shrink and wars return, while politics turns into a contest between enemies.", "Following those who think clearly about all this has also become harder. Social media is overrun by disinformation produced by both poles, and algorithms reward whatever generates anger. Finding serious analysis from people who reject authoritarianism wherever it comes from has become work almost nobody has time to do.", "Global Village was born from this diagnosis. We follow thinkers, economists, journalists and politicians from many countries on every continent, gather what they publish in texts, videos and podcasts, and deliver each piece with a short summary in your language and a link to the original. It is for people who want to understand politics, geopolitics, economics and technology through the lens of liberal democracy without depending on social media algorithms or visiting dozens of sites a day."],about_cur_t:"Curation",about_cur:["Curation answers one question, whom it is worth following. It never decides what each author says, which is why Global Village shows voices that disagree with one another.", "To be included, a person or organisation must consistently defend free elections, the rule of law, free speech, an independent press and individual rights, and publicly criticise authoritarians in both camps, including the one closest to their own milieu. Supporting or downplaying a coup disqualifies.", "Each name goes to two curators with different profiles, who review it without seeing each other’s vote. When they disagree, a third breaks the tie. Approvals expire after twelve months and come back for review. Funders of the project never nominate curators or take part in decisions.", "When a curated analysis reads a country in a way the curators of that region consider mistaken, the summary stays faithful to the author and Global Village adds an editor’s note with the missing context. The goal is to have a curator for every region of the world."],step0_t:"Curation",step0:"A board of curators from different political traditions decides whom Global Village follows. Only voices that defend liberal democracy and criticise authoritarians on every side are included.",
  about_rights_t:"Rights and paywalls",about_rights:"We show only the title, our own summary and a link to the original. Subscriber-only content appears with title and link only.",
  about_lang_t:"Languages",about_lang:"The interface is in English, Portuguese, Spanish, French and Italian. Summaries are generated in the reader’s language, and the original is one click away.",

  footer_nav:"Browse",footer_topics:"Topics",footer_about:"About",footer_lang:"Languages",vp_kicker:"What Global Village is",vp_title:"A network to understand and strengthen liberal democracy",
  vp_lede:"Global Village is an international network of people who want to understand the world through the lens of liberal democracy and strengthen it where they live. Democracy holds or weakens on a global scale, and each country only looks after its own when it understands the reality of others without projecting its own onto them. That is why the network brings together an observatory of analysis in five languages, local groups that meet around shared materials, and regular conversations between people from different countries.",
