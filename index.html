<head>

<link rel="preload" href="fonts/Newsreader-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Identidade do Villa (brand/villa/tokens.css): tinta sobre papel, cantos retos, sem sombras nem degradês. O verde-veneziana marca links, botões e estados ativos; o ocre-airbel só aparece como preenchimento (a faixa da newsletter) e vira ocre-texto quando precisa ser letra. */
@font-face{font-family:"Newsreader";src:url("fonts/Newsreader-Variable.woff2") format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url("fonts/Newsreader-Italic-Variable.woff2") format("woff2");font-weight:200 800;font-style:italic;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Courier Prime";src:url("fonts/CourierPrime-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Courier Prime";src:url("fonts/CourierPrime-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  color-scheme:light;
  /* papel, papel-2, tinta, tinta-suave e linha do Villa */
  --paper:#F3EBDD; --surface:#F3EBDD; --soft:#E8DCC6; --ink:#1E1A16; --ink-2:#5E5547; --rule:#CDBFA6;
  --band:#E8DCC6; --band-2:#F3EBDD; --band-ink:#1E1A16; --band-muted:#5E5547; --band-rule:#CDBFA6;
  /* verde-veneziana e sobre-verde */
  --signal:#415E3A; --signal-ink:#F3EBDD; --signal-text:#415E3A; --ok:#415E3A; --bad:#1E1A16; --focus:#415E3A;
  --ocre:#C19440; --ocre-text:#7A5718; --carimbo:#55478A;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-serif:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"Courier Prime", "Courier New", monospace;
  --wrap:1240px;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:inherit}
a:hover{color:var(--signal-text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* logos */
.logo{display:block;height:44px;width:auto}
.logo-w{display:none}

/* top strip + header */
.strip{background:var(--soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--rule)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:6px}
.langs{display:flex;gap:4px}
.langs button{min-width:40px;min-height:32px;font:inherit;font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
header.site .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
header.site .brand{display:flex;align-items:center;text-decoration:none}
nav.main{display:flex;gap:4px 20px;flex-wrap:wrap;font-weight:600;font-size:15px;margin-left:auto}
nav.main a{text-decoration:none;padding:6px 0;border-bottom:3px solid transparent}
nav.main a[aria-current="page"]{border-bottom-color:var(--signal)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--ink);color:var(--paper)}
.menu-btn{display:none}
@media (max-width:900px){
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:2px solid var(--ink);flex-direction:column;gap:0;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:12px 0;border-bottom:1px solid var(--rule);font-size:17px}
  .menu-btn{display:inline-flex}
  .hdr-actions{margin-left:auto}
}

/* type */
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.display{font-family:var(--f-display);font-weight:500;line-height:1.02;letter-spacing:-.01em;margin:0}
.h-xl{font-size:clamp(48px,8vw,104px)}
.h-l{font-size:clamp(34px,5vw,56px)}
.h-m{font-size:clamp(26px,3.4vw,38px)}
.serif{font-family:var(--f-serif)}
.lede{font-family:var(--f-serif);font-size:clamp(18px,2vw,21px);line-height:1.5;max-width:44em;margin:0}
.muted{color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--ink)}
.tag.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:hover{color:inherit}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.band .pill{border-color:var(--band-rule);color:var(--band-ink)}
.band .pill[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.field{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--surface);min-height:48px;padding:0 12px}
.field input,.field select{border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:15px;width:100%;min-width:0}
.filters{display:flex;flex-direction:column;gap:14px;padding-block:16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.filter-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filter-row>.kicker{min-width:88px}
.count{font-size:14px;color:var(--ink-2)}

/* sections */
section.block{padding-block:48px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.rule-top{border-top:6px solid var(--ink);padding-top:14px}
.band{background:var(--band);color:var(--band-ink)}
.band .muted{color:var(--band-muted)}
.band a:hover{color:var(--signal-text)}
.band{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.split{display:flex;flex-wrap:wrap;gap:40px}
.split>.main-col{flex:999 1 560px;min-width:0}
.split>.side-col{flex:1 1 300px;min-width:0}

/* cards */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1.5px solid var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-family:var(--f-serif);font-size:23px;line-height:1.22;font-weight:600}
.card .meta{font-size:14px;color:var(--ink-2);margin:0}
.card .meta a{font-weight:700;color:var(--ink);text-decoration:none}
.card .meta a:hover{color:var(--signal-text)}
.card p.sum{margin:0;font-size:15px;line-height:1.55}
.card .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.card .tags{display:inline-flex;gap:6px;flex-wrap:wrap}
.card .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;min-height:44px}
.paywall{margin:0;font-size:14px;line-height:1.5;padding:10px 12px;background:var(--soft);display:flex;gap:8px;align-items:flex-start}
.empty{padding:28px;border:1.5px dashed var(--ink);font-size:16px;line-height:1.5}

/* hero */
.hero{display:flex;flex-wrap:wrap;gap:40px;padding-block:40px 32px}
.hero .lead{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.hero h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(36px,5.4vw,64px);line-height:1.03;letter-spacing:-.01em;margin:0}
.sumbox{background:var(--surface);border:1.5px solid var(--ink);padding:20px 22px;display:flex;flex-direction:column;gap:10px;max-width:780px}
.sumbox p{margin:0;font-family:var(--f-serif);font-size:20px;line-height:1.5}
.radar{flex:1 1 320px;min-width:0}
.radar ol{list-style:none;margin:0;padding:0}
.radar li a{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.radar .n{font-family:var(--f-ui);font-weight:700;font-size:28px;line-height:1;color:var(--ocre-text);min-width:22px}
.radar .t{font-family:var(--f-serif);font-size:19px;line-height:1.3;font-weight:600}

/* stats */
.stats{display:grid;gap:20px 32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));padding-block:28px}
.stat{display:flex;align-items:baseline;gap:12px}
.stat b{font-family:var(--f-ui);font-weight:700;font-size:52px;line-height:1;color:var(--ocre-text);font-variant-numeric:tabular-nums}
.stat span{font-size:15px;line-height:1.35;color:var(--band-muted)}

/* people */
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.person{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);background:var(--surface);text-decoration:none;min-height:68px}
.person:hover{border-color:var(--ink);color:inherit}
.avatar{width:44px;height:44px;flex:none;border-radius:0;background:var(--signal);color:var(--signal-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:18px}
.avatar.pub{background:var(--ocre);color:var(--ink)}
.avatar.xl{width:132px;height:132px;font-size:52px}
.person .nm{font-weight:700;font-size:15px;display:block}
.person .ar{font-size:13px;color:var(--ink-2);display:block}
.person .ct{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.person .ct.pending{color:var(--ink-2);font-weight:500}

/* profile */
.profile{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-start;padding-block:24px 32px;border-bottom:2px solid var(--ink)}
.profile .info{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px 24px;margin:0}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.facts dd{margin:2px 0 0;font-weight:600}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;flex-wrap:wrap;gap:8px 24px;padding:22px 0;border-top:1px solid var(--rule)}
.timeline .when{flex:0 0 110px}
.timeline .when b{display:block;font-family:var(--f-mono);font-weight:700;font-size:20px;line-height:1.1;letter-spacing:.04em}
.timeline .body{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:8px}
.timeline h3{margin:0;font-family:var(--f-serif);font-size:23px;line-height:1.25}
.src{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--rule)}
.status-ok{font-size:12px;font-weight:700;padding:5px 9px;background:var(--ink);color:var(--paper);white-space:nowrap}
.status-pend{font-size:12px;font-weight:700;padding:4px 8px;border:1.5px dashed var(--ink);white-space:nowrap}
.side-stack{display:flex;flex-direction:column;gap:28px}
.side-stack h2{margin:0 0 10px;font-size:18px;font-weight:700}
.crumbs{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;padding-top:20px}

/* watch */
.posters{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.poster{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:330px}
.poster h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.poster .orig{font-size:13px;font-style:italic;color:var(--band-muted)}
.poster .foot{border-top:1px solid var(--band-rule);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.avail i{width:9px;height:9px;display:inline-block}
.av-sub i,.av-free i{background:var(--ok)}
.av-rent i{background:var(--ocre)}
.av-none i,.av-nf i{background:transparent;border:1.5px solid var(--band-muted)}
.poster a.see{font-weight:700;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.soc{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.soc article{background:var(--surface);border:1px solid var(--rule);color:var(--ink);padding:18px;display:flex;flex-direction:column;gap:8px}
.soc h3{margin:0;font-family:var(--f-serif);font-size:21px}

/* orgs */
.orgs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.org{display:flex;flex-direction:column;gap:6px;padding:16px;border:1.5px solid var(--ink);background:var(--surface);text-decoration:none}
.org b{font-size:16px}
.org span{font-size:14px;color:var(--ink-2);line-height:1.4}

/* newsletter */
.nl{background:var(--ocre);color:var(--ink)}
.nl .wrap{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;padding-block:48px}
.nl form{flex:1 1 380px;display:flex;flex-wrap:wrap;gap:10px}
.nl input{flex:1 1 240px;min-height:52px;border:2px solid var(--ink);padding:0 16px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.nl button{min-height:52px;padding:0 24px;background:var(--signal);color:var(--signal-ink);border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.nl a{color:var(--ink)}
.nl .nl-cta{flex:1 1 380px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.nl .nl-go{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;background:var(--signal);color:var(--signal-ink);font-weight:700;font-size:16px;text-decoration:none}
.ok-msg{font-weight:700}
.err-msg{font-weight:700;margin:0 0 8px}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--ink);cursor:pointer;font-weight:600;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--ink)}

/* about */
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{border-top:6px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-ui);font-weight:700;font-size:40px;line-height:1;color:var(--ocre-text)}
.prose{max-width:44em;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.6}
.prose p{margin:0}

/* search overlay */
.overlay{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 56px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.overlay .panel{background:var(--paper);border:2px solid var(--ink);width:min(760px,100%);max-height:80vh;display:flex;flex-direction:column}
.overlay .panel .field{border:0;border-bottom:2px solid var(--ink)}
.overlay .res{overflow:auto;padding:8px 16px 16px}
.overlay .res h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.overlay .res a{display:block;padding:10px 0;border-bottom:1px solid var(--rule);text-decoration:none}


/* value proposition */
.vp{border-bottom:1px solid var(--rule)}
.vp-grid{display:flex;flex-wrap:wrap;gap:32px 56px;padding-block:44px 28px;align-items:flex-start}
.vp-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.vp-title{font-size:clamp(40px,6vw,78px)}
#feed{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.vp-pillars{flex:1 1 340px;min-width:0;list-style:none;margin:0;padding:0;display:grid;gap:0}
.vp-pillars li{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-top:1px solid var(--rule)}
.vp-pillars li:first-child{border-top:6px solid var(--ink)}
.vp-pillars b{font-size:17px}
.vp-pillars span{font-size:15px;color:var(--ink-2);line-height:1.5}
.vp-stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));padding-block:0 32px}
.vp-stats .stat{background:var(--surface);border:1px solid var(--rule);padding:14px 16px}
.vp-stats .stat b{font-size:44px}
.vp-stats .stat span{color:var(--ink-2)}
.soft-band{background:var(--soft);border-top:1px solid var(--rule)}

/* feed */
.feed-grid{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.feed-col{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:760px}
.feed-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
@media (max-width:1000px){.feed-side{position:static}.feed-col{max-width:none}}
.feed-head{display:flex;flex-direction:column;gap:6px}
.feed-controls{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{min-height:46px;padding:0 18px;font:inherit;font-weight:700;font-size:15px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.feed{display:flex;flex-direction:column;gap:16px}
.day{margin:12px 0 0;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.post{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column}

 {id:"iss-quenia-campanha-antecipada",who:[],by:"Guyo Chepe Turi",theme:"dem",fmt:"text",src:"ISS Africa",date:"2026-11-24",lang:"EN",title:"Unregulated early campaigns put Kenya’s electoral process to the test",sum_en:"Guyo Chepe Turi, of ISS in Nairobi, says Kenya lives in permanent campaign mode more than eight months before the August 2027 election, despite a court ruling that bans campaigning before 29 May. He cites attacks on hotels and religious gatherings and 284 human rights violations recorded between January and July, most of them attributed to the police.",sum:"Guyo Chepe Turi, do ISS em Nairóbi, diz que o Quênia vive em campanha permanente a mais de oito meses da eleição de agosto de 2027, apesar de uma decisão judicial que proíbe campanha antes de 29 de maio. Ele cita ataques a hotéis e a cultos e 284 violações de direitos registradas entre janeiro e julho, a maioria atribuída à polícia.",url:"https://issafrica.org/iss-today/unregulated-early-campaigns-put-kenya-s-electoral-process-to-the-test"},
 {id:"afrobarometer-quenia-medo-protestos",who:[],by:"Shannon van Wyk",theme:"dem",fmt:"text",src:"Afrobarometer",date:"2026-11-24",lang:"EN",title:"Majority of Kenyans fear repression or violence if they join public protests",sum_en:"The latest Afrobarometer survey shows that most Kenyans fear intimidation, arrest or violence if they join a protest, consider police force at demonstrations unjustified and blame hired “goons” for the violence. Most also believe the government ignores the concerns raised in the streets.",sum:"A pesquisa mais recente do Afrobarometer mostra que a maioria dos quenianos teme intimidação, prisão ou violência se for a um protesto, acha injustificada a força policial nas manifestações e culpa \"goons\" contratados pela violência. A maioria também acha que o governo ignora o que se cobra nas ruas.",url:"https://www.afrobarometer.org/articles/majority-of-kenyans-fear-repression-or-violence-if-they-join-public-protests-afrobarometer-survey-finds/"},
 {id:"letraslibres-gascon-legislatura",who:["daniel-gascon"],theme:"dem",fmt:"text",src:"Letras Libres",date:"2026-11-23",lang:"ES",title:"El colofón de la legislatura y las rimas del procés",sum_en:"A week before Spain votes, Daniel Gascón argues that Pedro Sánchez reached power in 2023 through a “corrupt transaction of impunity for votes”, the amnesty for the Catalan secession attempt, and that the result was a sterile legislature without a budget, with attacks on judges and journalists and a record 41 decree-laws this year.",sum:"A uma semana da eleição espanhola, Daniel Gascón sustenta que Pedro Sánchez chegou ao poder em 2023 por uma “transação corrupta de impunidade por votos”, a anistia aos envolvidos na tentativa de secessão catalã, e que o resultado foi uma legislatura estéril, sem orçamento, com ataques a juízes e jornalistas e um recorde de 41 decretos-leis no ano.",url:"https://letraslibres.com/politica/el-colofon-de-la-legislatura-y-las-rimas-del-proces/23/11/2026/"},
 {id:"bremmer-volta-huang",who:["ian-bremmer"],theme:"tec",fmt:"video",src:"GZERO Media",date:"2026-11-23",lang:"EN",title:"What Jensen Huang’s return means for Trump and China",sum_en:"For Ian Bremmer, Jensen Huang’s return to Nvidia is a win for Trump and for tech executives who want fewer rules, but it will bring more scrutiny of chip exports, of the financial ties between the industry and the administration and of China’s access to advanced AI.",sum:"Para Ian Bremmer, a volta de Jensen Huang à Nvidia é uma vitória de Trump e dos executivos que querem menos regras, mas vai trazer mais escrutínio sobre a exportação de chips, sobre os laços financeiros entre o setor e o governo e sobre o acesso da China à IA avançada.",url:"https://www.gzeromedia.com/video/quick-take/what-jensen-huangs-return-means-for-trump-and-china"},
 {id:"last-huang-comunismo",who:["jonathan-v-last"],theme:"tec",fmt:"text",src:"The Bulwark",date:"2026-11-23",lang:"EN",title:"Trump, Jensen Huang, and American Communism",sum_en:"Jonathan V. Last notes that Trump discussed Huang with Xi Jinping and then called into the Nvidia board meeting to vouch for him, and argues that a country where the leader decides who runs private companies has a name, communism.",sum:"Jonathan V. Last lembra que Trump discutiu o caso Huang com Xi Jinping e depois ligou para a reunião do conselho da Nvidia para garantir o executivo, e argumenta que um país em que o líder decide quem comanda empresas privadas tem nome, comunismo.",url:"https://www.thebulwark.com/p/trump-jensen-huang-and-american-communism"},
 {id:"oneill-custos-volta-huang",who:[],by:"Brian O’Neill",theme:"tec",fmt:"text",src:"The Contrarian",date:"2026-11-23",lang:"EN",title:"The Hidden Costs of Jensen Huang’s Comeback",sum_en:"Brian O’Neill, a former CIA official, says the Nvidia board reversed itself days after rejecting Huang’s return, citing senior US officials, and asks whether the counterintelligence concerns were resolved or simply outweighed by commercial interests.",sum:"Brian O’Neill, ex-dirigente da CIA, diz que o conselho da Nvidia mudou de ideia dias depois de recusar a volta de Huang, citando altos funcionários do governo, e pergunta se as suspeitas de contraespionagem foram resolvidas ou só pesaram menos que os interesses comerciais.",url:"https://www.contrariannews.org/p/the-hidden-costs-of-jensen-huangs"},
 {id:"pinheiro-huang-trumpismo",who:["joel-pinheiro-da-fonseca"],theme:"tec",fmt:"text",src:"Folha de S.Paulo",date:"2026-11-23",lang:"PT",title:"Jensen Huang comprova: O trumpismo não morreu",sum_en:"Joel Pinheiro da Fonseca says Trump’s intervention was decisive for Huang’s return after 11 days and sees a philosophical alignment between the president and the CEO, both on the side of AI accelerationism while other tech leaders call for regulation.",sum:"Joel Pinheiro da Fonseca diz que a intervenção de Trump foi decisiva para a volta de Huang depois de 11 dias e vê um alinhamento filosófico entre o presidente e o executivo, os dois do lado do aceleracionismo da IA enquanto outros líderes do setor pedem regulação.",url:"https://www1.folha.uol.com.br/colunas/joel-pinheiro-da-fonseca/2026/11/jensen-huang-comprova-o-trumpismo-nao-morreu.shtml"},
 {id:"article19-microsoft-cma",who:[],theme:"tec",fmt:"text",src:"Article 19",date:"2026-11-23",lang:"EN",title:"United Kingdom: Time to address Microsoft’s ecosystem power",sum_en:"Article 19 and the Balanced Economy Project back the UK competition authority’s plan to give Microsoft strategic market status in business software. They argue that relying on one supplier for identity, documents, communications, security and AI creates problems of choice, access to information and resilience.",sum:"A Article 19 e o Balanced Economy Project apoiam o plano da autoridade de concorrência britânica de dar à Microsoft o status de mercado estratégico no software de empresas. Para elas, depender de um só fornecedor para identidade, documentos, comunicação, segurança e IA cria problemas de escolha, de acesso à informação e de resiliência.",url:"https://www.article19.org/resources/united-kingdom-time-to-address-microsofts-ecosystem-power/"},
 {id:"bulwark-kristol-kagan-otan",who:["bill-kristol"],theme:"geo",fmt:"video",src:"The Bulwark",date:"2026-11-22",lang:"EN",title:"Putin Got Everything He Wanted From Trump (w/ Robert Kagan)",sum_en:"Bill Kristol and Robert Kagan assess the fallout of the Shenzhen summit. Kagan warns that Putin may test NATO within months, that Iran is tightening its grip on the Strait of Hormuz and that an isolationist America is unprepared for the crises multiplying around the world.",sum:"Bill Kristol e Robert Kagan avaliam as consequências da cúpula de Shenzhen. Kagan alerta que Putin pode testar a OTAN em poucos meses, que o Irã aperta o controle sobre o estreito de Ormuz e que uma América isolacionista não está preparada para as crises que se multiplicam pelo mundo.",url:"https://www.thebulwark.com/p/putin-got-everything-he-wanted-from"},
 {id:"snyder-himes-investigacoes",who:["timothy-snyder"],theme:"dem",fmt:"video",src:"Thinking about… (Substack)",date:"2026-11-21",lang:"EN",title:"Now We Act (From Ukraine 2/2): With Rep. Jim Himes on Investigation and Reform",sum_en:"Speaking from Lviv, Timothy Snyder talks with Representative Jim Himes, who will chair the House Intelligence Committee, about what the new Democratic majorities can do. Himes sees investigations as the way to reveal the truth and deter bad actors, and says he would “without question” support radical campaign finance reform.",sum:"De Lviv, Timothy Snyder conversa com o deputado Jim Himes, que vai presidir o Comitê de Inteligência da Câmara, sobre o que as novas maiorias democratas podem fazer. Himes vê nas investigações o caminho para revelar a verdade e deter os maus atores, e diz apoiar “sem dúvida” uma reforma radical do financiamento de campanha.",url:"https://snyder.substack.com/p/now-we-act-from-ukraine-22-with-rep"},
 {id:"persuasion-mcfaul-shenzhen",who:[],by:"Michael McFaul",theme:"geo",fmt:"text",src:"Persuasion",date:"2026-11-20",lang:"EN",title:"There Was One Winner of the Trump-Putin-Xi Summit",sum_en:"Former US ambassador to Russia Michael McFaul argues that the Shenzhen summit delivered nothing for American interests and that its real outcome was a gift to Putin, a photo that presents him as the respected leader of a third great power. He rejects talk of a “G3” or a “Yalta 2.0”, since all three leaders are weakened at home or at war.",sum:"O ex-embaixador dos EUA na Rússia Michael McFaul sustenta que a cúpula de Shenzhen não rendeu nada aos interesses americanos e que seu resultado real foi um presente a Putin, uma foto que o apresenta como líder respeitado de uma terceira grande potência. Ele rejeita a ideia de um “G3” ou de uma “Ialta 2.0”, porque os três líderes estão enfraquecidos em casa ou na guerra.",url:"https://www.persuasion.community/p/a-joint-declaration-of-nothing"},
 {id:"contrarian-oneill-yalta",who:[],by:"Brian O’Neill",theme:"geo",fmt:"text",src:"The Contrarian",date:"2026-11-20",lang:"EN",title:"Trump Got His Yalta Photograph, but Little Else",sum_en:"Brian O’Neill, a retired senior CIA official, says the coverage promised a new Yalta but the summit produced meagre results. Putin won another measure of diplomatic rehabilitation without concessions, Xi kept the status quo by flattering Trump, and the declaration left Ukraine, Taiwan and Iran where they stood.",sum:"Brian O’Neill, ex-dirigente da CIA, diz que a cobertura prometeu uma nova Ialta, mas a cúpula teve resultados magros. Putin ganhou mais uma dose de reabilitação diplomática sem fazer concessões, Xi manteve o status quo bajulando Trump, e a declaração deixou Ucrânia, Taiwan e Irã onde estavam.",url:"https://www.contrariannews.org/p/trump-got-his-yalta-photograph-but"},
 {id:"magnoli-ialta-2",who:["demetrio-magnoli"],theme:"geo",fmt:"text",src:"Folha de S.Paulo",date:"2026-11-20",lang:"PT",title:"Ialta 2.0 premiou a guerra de Putin",sum_en:"Demétrio Magnoli calls Shenzhen a caricature of the caricature of Yalta. Unlike Stalin in 1945, he writes, Putin has not won on the battlefield the sphere of influence he seeks in Ukraine, yet he obtained from Trump, without giving anything in return, the implicit promise that US sanctions will be lifted.",sum:"Demétrio Magnoli chama Shenzhen de caricatura da caricatura de Ialta. Diferentemente de Stálin em 1945, escreve, Putin não conquistou no campo de batalha a esfera de influência que busca na Ucrânia, e mesmo assim obteve de Trump, sem dar nada em troca, a promessa implícita do fim das sanções americanas.",url:"https://www1.folha.uol.com.br/colunas/demetriomagnoli/2026/11/ialta-20-premiou-a-guerra-de-putin.shtml"},
 {id:"insider-schabas-mianmar",who:[],theme:"dem",fmt:"text",src:"The Insider",date:"2026-11-20",lang:"EN",title:"UN court ruling on genocide in Myanmar could complicate Israel’s defense in case brought by South Africa, expert says",sum_en:"Genocide scholar William Schabas tells The Insider that the ICJ ruling against Myanmar, which accepts that genocidal intent can coexist with other motives, could complicate Israel’s defence in the case brought by South Africa. He stresses that the ruling establishes the responsibility of a state, not of its leaders, and says it could improve the prospects for the Rohingya’s return.",sum:"O especialista em genocídio William Schabas diz ao The Insider que a decisão da CIJ contra Mianmar, ao aceitar que a intenção genocida pode conviver com outros motivos, pode complicar a defesa de Israel no caso aberto pela África do Sul. Ele lembra que a decisão responsabiliza um Estado, não seus dirigentes, e acha que ela pode melhorar as chances de retorno dos rohingyas.",url:"https://theins.press/en/news/299839"},
 {id:"letraslibres-sarukhan-bukele-haiti",who:[],by:"Arturo Sarukhán",theme:"dem",fmt:"text",src:"Letras Libres",date:"2026-11-20",lang:"ES",title:"La apuesta haitiana de Bukele",sum_en:"Former Mexican ambassador to Washington Arturo Sarukhán argues that Bukele’s deployment of more than 2,000 troops to Haiti has become a unilateral military intervention with no exit date. He sees three motives, distracting Salvadorans from the economy before the February election, showcasing the “Bukele model” and serving Trump’s regional strategy, and warns that the Salvadoran recipe cannot be transplanted to Haiti.",sum:"O ex-embaixador do México em Washington Arturo Sarukhán sustenta que o envio de mais de 2 mil soldados de Bukele ao Haiti virou uma intervenção militar unilateral, sem prazo de saída. Ele vê três motivos, desviar a atenção da economia antes da eleição de fevereiro, exibir o “modelo Bukele” e servir à estratégia regional de Trump, e alerta que a receita salvadorenha não se transplanta para o Haiti.",url:"https://letraslibres.com/politica/la-apuesta-haitiana-de-bukele/20/11/2026/"},
 {id:"gzero-bukele-terceiro-mandato",who:[],by:"Alex Kliment",theme:"dem",fmt:"text",src:"GZERO Media",date:"2026-11-20",lang:"EN",title:"El Salvador’s president launches bid for third term",sum_en:"GZERO’s weekly watch list notes that Nayib Bukele has registered to run for an unprecedented third consecutive term in February 2027. His crackdown on gangs made him widely popular, while watchdogs say mass arrests skirted due process and the opposition says he packed the courts to scrap term limits.",sum:"A lista semanal do GZERO registra que Nayib Bukele inscreveu a candidatura a um inédito terceiro mandato seguido, em fevereiro de 2027. A ofensiva contra as gangues o tornou muito popular, enquanto organizações de vigilância dizem que as prisões em massa atropelaram o devido processo e a oposição o acusa de lotar os tribunais para derrubar o limite de mandatos.",url:"https://www.gzeromedia.com/news/watching/el-salvadors-president-launches-bid-for-third-term-kenya-hands-us-rare-victory-on-rare-earths-uk-and-eu-agree-to-brexit-reset-deal"},
 {id:"kas-reismann-russia-africa",who:[],by:"Anna Reismann",theme:"geo",fmt:"text",src:"Konrad-Adenauer-Stiftung",date:"2026-11-20",lang:"EN",title:"Is Russia expanding its influence in Africa?",sum_en:"Anna Reismann, head of the KAS office in Addis Ababa, reviews what each African country took home from the Russia-Africa summit in Moscow. She finds a pragmatic African approach, many memoranda and few verifiable financial commitments, with deals centred on nuclear energy, raw materials, arms and security, and urges Europe to show results and not cut scholarships and university ties, where Moscow is advancing.",sum:"Anna Reismann, que dirige o escritório da KAS em Adis Abeba, revisa o que cada país africano levou da cúpula Rússia-África em Moscou. Ela vê uma postura africana pragmática, muitos memorandos e poucos compromissos financeiros verificáveis, com acordos centrados em energia nuclear, matérias-primas, armas e segurança, e pede que a Europa mostre resultados e não corte bolsas e cooperação universitária, área em que Moscou avança.",url:"https://news.google.com/rss/articles/CBMinwFBVV95cUxPQ1dSRC1xN3A4Tl9Ld1FqS284UXpmZGwwUDFfbGJrUkR4bUpnRzNQdHktZ2lPdkk4ejdCb25IUFc2U0lrV2xaYlJKcDd1TE5GVmJQWkZLc1lmYU9HLVlRWkt0NjV4YS1teVpmSTJuakhKNUlwMml6aDBveTRkdFNGOHE2cWNlRWVjNG9sQ21VZGVzZnhDeUlLb2FQMWVzcEE?oc=5"},
 {id:"letraslibres-domingo-vox-alianca",who:[],by:"Carmen Domingo",theme:"dem",fmt:"text",src:"Letras Libres",date:"2026-11-20",lang:"ES",title:"Cuando tu “enemigo” te puede dar los votos. De Aliança Catalana y Vox",sum_en:"Carmen Domingo looks at how two opposing far-right nationalisms, Spain’s Vox and the Catalan separatist Aliança Catalana, converge on immigration. Since Aliança does not run in the 29 November general election, she argues, part of its voters could end up backing Vox.",sum:"Carmen Domingo mostra como dois nacionalismos de extrema direita opostos, o Vox espanhol e o separatista Aliança Catalana, convergem na imigração. Como o Aliança não disputa a eleição geral de 29 de novembro, diz ela, parte de seus eleitores pode acabar votando no Vox.",url:"https://letraslibres.com/politica/cuando-tu-enemigo-te-puedes-dar-los-votos-de-alianca-catalana-y-vox/20/11/2026/"},
 {id:"unpopulist-sargent-miller-ice",who:[],by:"Greg Sargent",theme:"dem",fmt:"text",src:"The UnPopulist",date:"2026-11-20",lang:"EN",title:"Democrats Must Claw Back Miller’s Ungodly Billions for His Lawless Mass Deportations",sum_en:"Greg Sargent reports that ICE still has $91 billion in no-strings deportation funds and that Stephen Miller, now White House chief of staff, plans to expand mass deportations. He urges the incoming Democratic majority to claw the money back.",sum:"Greg Sargent mostra que o ICE ainda tem US$ 91 bilhões livres de condições para deportações e que Stephen Miller, agora chefe de gabinete da Casa Branca, planeja ampliar as deportações em massa. Ele pede que a nova maioria democrata no Congresso retome esse dinheiro.",url:"https://www.theunpopulist.net/p/democrats-must-claw-back-millers"},
 {id:"kyiv-zadorozhnyy-declaracao-paz",who:[],by:"Tim Zadorozhnyy",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-19",lang:"EN",title:"Trump joins Putin, Xi in signing ‘declaration of peace’ as summit largely sidesteps Ukraine",sum_en:"After a 90-minute meeting in Shenzhen, Trump, Putin and Xi adopted a four-point “declaration of peace” on UN reform, oil supply, international law and nuclear risk, which also defends the immunity of state officials and warns against abuses by the ICC, the court that issued an arrest warrant for Putin in 2023. Ukraine was left largely aside, and Trump greeted Putin as “my friend”.",sum:"Depois de uma reunião de uma hora e meia em Shenzhen, Trump, Putin e Xi assinaram uma “declaração de paz” de quatro pontos sobre reforma da ONU, oferta de petróleo, direito internacional e risco nuclear, que também defende a imunidade de autoridades de Estado e alerta contra abusos do TPI, o tribunal que emitiu mandado de prisão contra Putin em 2023. A Ucrânia ficou praticamente de fora, e Trump saudou Putin como “meu amigo”.",url:"https://kyivindependent.com/trump-sits-down-with-his-friend-putin-chinas-xi-for-unprecedented-trilateral-talks/"},
 {id:"kyiv-davies-china-shenzhen",who:[],by:"Katie Marie Davies",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-19",lang:"EN",title:"What China hopes to gain from the Trump-Putin summit",sum_en:"Katie Marie Davies notes that Putin and Trump arrive in Shenzhen under pressure at home, while Xi can play host and peacemaker. Quoting Temur Umarov of the Carnegie Russia Eurasia Center, she writes that Beijing wants to show itself as a superpower without committing to peace in Ukraine, because real mediation would require pressure and guarantees China does not give.",sum:"Katie Marie Davies observa que Putin e Trump chegam a Shenzhen pressionados em casa, enquanto Xi pode posar de anfitrião e pacificador. Citando Temur Umarov, do Carnegie Russia Eurasia Center, ela escreve que Pequim quer se mostrar superpotência sem se comprometer com a paz na Ucrânia, porque mediar de verdade exigiria pressão e garantias que a China não dá.",url:"https://kyivindependent.com/what-china-hopes-to-gain-from-the-trump-putin-summit/"},
 {id:"lgc-bloj-shenzhen-vitoria-putin",who:[],by:"Ramona Bloj",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-18",lang:"FR",title:"À Shenzhen, la première rencontre de l’histoire entre les dirigeants des États-Unis, de la Chine et de la Russie",sum_en:"Ramona Bloj calls the Shenzhen trilateral an “immense victory” for Putin, who can present Russia as a superpower even though Ukraine is off the agenda. Beside a host who shrank the summit’s format, she writes, a Putin bogged down in Ukraine and a Trump fresh from midterm defeat risk looking much diminished.",sum:"Ramona Bloj chama o encontro trilateral de Shenzhen de “imensa vitória” para Putin, que pode apresentar a Rússia como superpotência mesmo com a Ucrânia fora da pauta. Ao lado de um anfitrião que encolheu o formato da cúpula, escreve ela, um Putin atolado na Ucrânia e um Trump recém-derrotado nas eleições de meio de mandato correm o risco de parecer bem menores.",url:"https://legrandcontinent.eu/fr/2026/11/18/a-shenzhen-la-premiere-rencontre-de-lhistoire-entre-les-dirigeants-des-etats-unis-de-la-chine-et-de-la-russie/"},
 {id:"bulwark-young-shenzhen-ponte",who:[],by:"Cathy Young",theme:"geo",fmt:"text",src:"The Bulwark",date:"2026-11-18",lang:"EN",title:"Putin and the Two Stooges’ Fake Negotiations",sum_en:"Cathy Young writes that Putin sees Shenzhen as proof he belongs “at the big boys’ table”, but two days earlier the collapse of the Kerch Bridge showed he cannot protect even a prized possession.",sum:"Cathy Young escreve que Putin vê Shenzhen como prova de que merece lugar “na mesa dos grandes”, mas dois dias antes a queda da ponte de Kerch mostrou que ele não consegue proteger nem um bem tão estimado.",url:"https://www.thebulwark.com/p/putin-and-the-two-trump-stooges-kushner-witkoff-fake-negotiations-ukraine-kerch-bridge"},
 {id:"contrarian-malinowski-shenzhen",who:[],by:"Tom Malinowski",theme:"geo",fmt:"text",src:"The Contrarian",date:"2026-11-18",lang:"EN",title:"Why Trump Is Meeting with Putin and Xi",sum_en:"Former congressman Tom Malinowski argues that little of immediate consequence will come out of Shenzhen, but that the meeting will be read as the US president switching sides, toward a world run by a council of great powers “unconstrained by morality or law”. For him, Trump is not an amoral realist, since he openly prefers dictatorships to democracies.",sum:"O ex-deputado Tom Malinowski sustenta que pouco de imediato sairá de Shenzhen, mas que o encontro será lido como o presidente americano mudando de lado, rumo a um mundo governado por um conselho de grandes potências “sem limite de moral ou de lei”. Para ele, Trump não é um realista amoral, porque prefere abertamente as ditaduras às democracias.",url:"https://www.contrariannews.org/p/why-trump-is-meeting-with-putin-and"},
 {id:"lgc-puel-fim-hegemonia",who:[],by:"Louis Puel",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-18",lang:"FR",title:"« Cette réunion marque la fin de l’hégémonie américaine »",sum_en:"Louis Puel translates and comments line by line a text by Rong Ping, one of China’s most followed nationalist accounts, which reads Shenzhen as America’s capitulation and the start of a world of “three kingdoms” in which Europe has no seat. The commentary points out what the text hides, such as Russia’s powerlessness in Ukraine and the ability of republics to resist empires.",sum:"Louis Puel traduz e comenta linha a linha um texto de Rong Ping, uma das contas nacionalistas mais seguidas da China, que lê Shenzhen como a capitulação americana e o início de um mundo de “três reinos” em que a Europa não tem assento. O comentário aponta o que o texto esconde, como a impotência russa na Ucrânia e a capacidade das repúblicas de resistir aos impérios.",url:"https://legrandcontinent.eu/fr/2026/11/18/cette-reunion-marque-la-fin-de-lhegemonie-americaine/"},
 {id:"cpj-turquia-sozcu-tv",who:[],theme:"dem",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-18",lang:"EN",title:"Turkey seizes control of independent broadcaster Sözcü TV in widening media crackdown",sum_en:"Turkish police raided Sözcü TV on November 17 and a state trustee took over the channel and its website, a month after the same happened to Halk TV. The case rests on a decade-old probe into the owner’s alleged links to the Gülen network. For the CPJ, the authorities are placing independent broadcasters under state control “one by one”.",sum:"A polícia turca invadiu a Sözcü TV em 17 de novembro, e um administrador nomeado pelo Estado assumiu o canal e o site, um mês depois de o mesmo acontecer com a Halk TV. O caso se apoia num inquérito de dez anos sobre supostas ligações do dono com a rede de Gülen. Para o CPJ, as autoridades estão pondo as emissoras independentes sob controle do Estado “uma a uma”.",url:"https://cpj.org/2026/11/turkey-seizes-control-of-independent-broadcaster-sozcu-tv-in-widening-media-crackdown/"},
 {id:"persuasion-toro-aquecimento",who:[],by:"Quico Toro",theme:"eco",fmt:"text",src:"Persuasion",date:"2026-11-18",lang:"EN",title:"The Most Confusing Fact About Climate Change",sum_en:"Quico Toro notes that, as COP31 meets in Antalya without the United States, warming is running at about 0.27°C per decade, the fastest on record, even though emissions may already have peaked and are far below the worst-case scenario. That basic fact, he writes, is going mostly unmentioned.",sum:"Quico Toro observa que, enquanto a COP31 se reúne em Antalya sem os Estados Unidos, o aquecimento corre a cerca de 0,27 °C por década, o ritmo mais rápido já registrado, embora as emissões talvez já tenham atingido o pico e estejam muito abaixo do pior cenário. Esse fato básico, escreve ele, mal é mencionado.",url:"https://www.persuasion.community/p/a-whole-other-climate-change"},
 {id:"dm-ozabor-petroleiras-justica",who:[],by:"Ephraim Ozabor",theme:"eco",fmt:"text",src:"Daily Maverick",date:"2026-11-18",lang:"EN",title:"Big Oil is weaponising the law, and it’s critical that Africa fights back",sum_en:"Ephraim Ozabor recounts how Wild Coast fishing communities beat Shell before South Africa’s Constitutional Court after nearly five years, in the first African top-court ruling to cite the ICJ’s 2025 climate opinion. For him, oil companies use slow, costly litigation to wear down communities that lack money and time.",sum:"Ephraim Ozabor conta como comunidades pesqueiras da Wild Coast venceram a Shell na Corte Constitucional da África do Sul depois de quase cinco anos, na primeira decisão de uma corte superior africana a citar o parecer climático da CIJ de 2025. Para ele, as petroleiras usam processos lentos e caros para vencer pelo cansaço comunidades sem dinheiro nem tempo.",url:"https://www.dailymaverick.co.za/opinionista/2026-11-18-big-oil-is-weaponising-the-law-and-its-critical-that-africa-fights-back/"},
 {id:"bremmer-nvidia-spygate",who:["ian-bremmer"],theme:"tec",fmt:"text",src:"GZERO Media",date:"2026-11-18",lang:"EN",title:"The Trump-Xi summit can’t escape the fallout of Nvidia’s spygate",sum_en:"Bremmer explains the new US rule against Chinese access to American chips, prompted by Jensen Huang’s affair with an alleged Chinese intelligence asset. The rule is calibrated to tighten weak export controls without antagonising Beijing before Shenzhen, a line he says both Trump and the next president will find hard to hold.",sum:"Bremmer explica a nova regra americana contra o acesso chinês aos chips dos EUA, provocada pelo caso de Jensen Huang com uma suposta agente da inteligência chinesa. A regra foi calibrada para apertar controles de exportação frouxos sem irritar Pequim antes de Shenzhen, um equilíbrio que, segundo ele, Trump e o próximo presidente terão dificuldade de manter.",url:"https://www.gzeromedia.com/news/by-ian-bremmer/the-trump-xi-summit-cant-escape-the-fallout-of-nvidias-spygate"},
 {id:"bulwark-charen-china-encenacao",who:[],by:"Mona Charen",theme:"tec",fmt:"text",src:"The Bulwark",date:"2026-11-18",lang:"EN",title:"Trump’s Tough-on-China Talk Was Always Just an Act",sum_en:"Mona Charen recalls the years of Trumpist rhetoric about being tough on China and argues that it was always an act. The West won the Cold War partly through technological superiority guarded by export controls, she writes, and Trump keeps backing down when Beijing pushes back.",sum:"Mona Charen relembra os anos de retórica trumpista sobre ser duro com a China e sustenta que tudo sempre foi encenação. O Ocidente venceu a Guerra Fria em parte pela superioridade tecnológica protegida por controles de exportação, escreve ela, e Trump recua sempre que Pequim reage.",url:"https://www.thebulwark.com/p/trump-tough-on-china-talk-was-always-just-an-act-xi-jinping-tik-tok-nvidia"},
 {id:"dispatch-isgur-french-intimacoes",who:[],by:"Sarah Isgur e David French",theme:"dem",fmt:"podcast",src:"The Dispatch",date:"2026-11-17",lang:"EN",title:"White House Warns Against Congressional Subpoenas",sum_en:"In Advisory Opinions, recorded live at the University of Virginia, Sarah Isgur and David French discuss what congressional subpoenas are worth after the White House warned against them, as the new Democratic majorities prepare to investigate the administration.",sum:"No Advisory Opinions, gravado ao vivo na Universidade da Virgínia, Sarah Isgur e David French discutem quanto valem as intimações do Congresso depois do aviso da Casa Branca contra elas, no momento em que as novas maiorias democratas se preparam para investigar o governo.",url:"https://thedispatch.com/podcast/advisoryopinions/white-house-warns-against-congressional-subpoenas/"},
 {id:"dispatch-sawyer-negacionismo",who:[],by:"Mark Sawyer",theme:"dem",fmt:"text",src:"The Dispatch",date:"2026-11-17",lang:"EN",title:"Has Election Denialism Run Its Course?",sum_en:"Mark Sawyer notes that, despite the administration’s warnings about voting machines, mail ballots and voter rolls before November 3, questioning of the midterm results has been subdued online, largely because the Democratic margins were so wide.",sum:"Mark Sawyer observa que, apesar dos alertas do governo sobre urnas, voto pelo correio e cadastros antes de 3 de novembro, o questionamento do resultado das eleições de meio de mandato foi fraco nas redes, em boa parte porque as margens democratas foram largas.",url:"https://thedispatch.com/article/election-denialism-2026-midterms/"},
 {id:"kyiv-hyatt-ponte-crimeia",who:[],by:"Lachlan Hyatt",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-17",lang:"EN",title:"Entire section of Crimean Bridge collapses after ‘seven-phase operation,’ Zelensky reveals",sum_en:"A section of the 19-km bridge linking Russia to occupied Crimea collapsed after a Ukrainian Flamingo missile strike. Zelensky called it the seventh phase of a weeks-long operation against air defences and radars, and an expert heard by Lachlan Hyatt expects repairs to take a year or more.",sum:"Um trecho da ponte de 19 km que liga a Rússia à Crimeia ocupada desabou depois de um ataque com o míssil ucraniano Flamingo. Zelensky falou na sétima fase de uma operação de semanas contra defesas aéreas e radares, e um especialista ouvido por Lachlan Hyatt calcula que o reparo leve um ano ou mais.",url:"https://kyivindependent.com/ukrainian-forces-reportedly-strike-crimean-bridge-after-russian-missiles-hit-kyiv-bridges/"},
 {id:"kyiv-doluda-stubb",who:[],by:"Yevgeniya Doluda",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-17",lang:"EN",title:"Finland’s Stubb urges Europe to take Russia talks into its own hands",sum_en:"Finnish President Alexander Stubb told the Financial Times that European leaders should talk directly to Putin rather than rely “irresponsibly” on the United States, while warning there will be no deal without Moscow’s agreement. The Kremlin has so far rejected widening the talks.",sum:"O presidente finlandês, Alexander Stubb, disse ao Financial Times que os líderes europeus devem falar direto com Putin em vez de depender de forma “irresponsável” dos Estados Unidos, e lembrou que não haverá acordo sem o aval de Moscou. O Kremlin até agora recusou ampliar as negociações.",url:"https://kyivindependent.com/finlands-stubb-urges-europe-to-take-russia-talks-into-its-own-hands/"},
 {id:"lgc-estonia-arquitetura-europeia",who:[],theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-17",lang:"FR",title:"« Poutine veut démanteler l’architecture de sécurité européenne »",sum_en:"The secretary general of Estonia’s defence ministry says Russia’s return to the 2021 ultimatums in Abu Dhabi, such as pulling NATO back to its 1997 borders, shows Moscow feels strong thanks to its strikes on Ukraine’s energy grid, although it is losing ground and men at the front. For him, a ceasefire is the first test of seriousness.",sum:"O secretário-geral do Ministério da Defesa da Estônia diz que a volta da Rússia aos ultimatos de 2021 em Abu Dhabi, como o recuo da OTAN às fronteiras de 1997, mostra que Moscou se sente forte graças aos bombardeios contra a rede elétrica ucraniana, embora perca terreno e homens no front. Para ele, o cessar-fogo é o primeiro teste de seriedade.",url:"https://legrandcontinent.eu/fr/2026/11/17/poutine-veut-demanteler-larchitecture-de-securite-europeenne/"},
 {id:"lgc-louis-dugin-tripolaridade",who:[],by:"Florian Louis",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-17",lang:"FR",title:"L’hallucination douguinienne de la tripolarité",sum_en:"Florian Louis traces the AI-made map Alexander Dugin posted before Shenzhen, a world split between the US, Russia and China, back to Carl Schmitt’s “great spaces”, Haushofer and Orwell’s 1984. For him it lulls Russians into believing their country is a superpower, though its army has failed to conquer Ukraine in four years.",sum:"Florian Louis mostra que o mapa feito por IA que Alexandr Dugin publicou antes de Shenzhen, com o mundo dividido entre EUA, Rússia e China, descende dos “grandes espaços” de Carl Schmitt, de Haushofer e do 1984 de Orwell. Para ele, o mapa embala os russos na ilusão de serem uma superpotência, embora seu exército não tenha conseguido conquistar a Ucrânia em quatro anos.",url:"https://legrandcontinent.eu/fr/2026/11/17/lhallucination-douguinienne-de-la-tripolarite/"},
 {id:"elcano-milosevich-hombres-fuertes",who:[],by:"Mira Milosevich-Juaristi",theme:"geo",fmt:"text",src:"Real Instituto Elcano",date:"2026-11-17",lang:"ES",title:"Trump, Putin, y Xi: la diplomacia de los “hombres fuertes”",sum_en:"Mira Milosevich-Juaristi notes that New START’s expiry in February left US and Russian arsenals without legal limits and that China resists equal caps. For Putin, she writes, Shenzhen brings recognition as an indispensable interlocutor despite his war on Ukraine, and its real use may be opening a nuclear dialogue, not a deal.",sum:"Mira Milosevich-Juaristi lembra que o fim do tratado New START, em fevereiro, deixou os arsenais de EUA e Rússia sem limite legal e que a China resiste a tetos iguais. Para Putin, escreve ela, Shenzhen traz o reconhecimento de interlocutor indispensável apesar da guerra contra a Ucrânia, e a utilidade real pode ser abrir um diálogo nuclear, não fechar um acordo.",url:"https://www.realinstitutoelcano.org/comentarios/trump-putin-y-xi-la-diplomacia-de-los-hombres-fuertes/"},
 {id:"bremmer-ponte-crimeia-shenzhen",who:["ian-bremmer"],theme:"geo",fmt:"video",src:"GZERO Media",date:"2026-11-17",lang:"EN",title:"Ukraine strikes Crimean Bridge ahead of Trump, Putin, and Xi meeting",sum_en:"Bremmer says the timing of the Kerch Bridge strike was designed to “embarrass Putin maximally” and expects “a lot less than meets the eye” from the Shenzhen meeting, with Moscow and Kyiv still focused on escalation rather than a ceasefire.",sum:"Bremmer diz que o ataque à ponte de Kerch foi marcado para “constranger Putin ao máximo” e espera de Shenzhen “muito menos do que parece”, com Moscou e Kiev ainda concentradas em escalar em vez de buscar um cessar-fogo.",url:"https://www.gzeromedia.com/video/quick-take/ukraine-strikes-crimean-bridge-ahead-of-trump-putin-and-xi-meeting"},
 {id:"krauze-ine-ignominia",who:["enrique-krauze"],theme:"dem",fmt:"text",src:"Letras Libres",date:"2026-11-17",lang:"ES",title:"El INE de la ignominia",sum_en:"Krauze argues that Mexico’s electoral institute, once the pride of its democracy, was captured and, after 2024, gave the ruling parties more seats than the vote allowed and endorsed the judicial election. With the regime set to name a docile new head, he sees only peaceful civic protest across the country as a way to rebuild it.",sum:"Krauze sustenta que o instituto eleitoral do México, antes orgulho da democracia do país, foi capturado e, a partir de 2024, deu aos partidos governistas mais cadeiras do que o voto permitia e avalizou a eleição judicial. Com o regime prestes a nomear uma presidência dócil, ele vê na protesta cívica pacífica em todo o país o único caminho para reconstruí-lo.",url:"https://letraslibres.com/politica/el-ine-de-la-ignominia/17/11/2026/"},
 {id:"letraslibres-juarez-ine",who:[],by:"Julio Juárez Gámiz",theme:"dem",fmt:"text",src:"Letras Libres",date:"2026-11-17",lang:"ES",title:"Erosionar desde adentro al INE",sum_en:"Julio Juárez Gámiz describes how, since 2023, Morena-aligned appointments and wider powers for the council presidency hollowed out the deliberation of the INE, the last autonomous body left in the Mexican state, with consequences he calls irreparable for the country’s democracy.",sum:"Julio Juárez Gámiz descreve como, desde 2023, nomeações alinhadas ao Morena e mais poderes para a presidência do conselho esvaziaram a deliberação do INE, o último órgão autônomo que restava no Estado mexicano, com consequências que ele chama de irreparáveis para a democracia do país.",url:"https://letraslibres.com/politica/erosionar-desde-adentro-al-ine/17/11/2026/"},
 {id:"jod-broning-afd-governar",who:[],by:"Michael Bröning",theme:"dem",fmt:"text",src:"Journal of Democracy",date:"2026-11-17",lang:"EN",title:"How the AfD Is Getting Ready to Rule",sum_en:"Michael Bröning shows the AfD, now Germany’s strongest party, practising selective moderation, softening on the EU and the euro while holding firm against aid to Ukraine, as the firewall cracks in Saxony-Anhalt. In power, he warns, it could look much like Viktor Orbán’s model.",sum:"Michael Bröning mostra a AfD, hoje o partido mais forte da Alemanha, praticando uma moderação seletiva, mais branda com a UE e o euro e firme contra a ajuda à Ucrânia, enquanto o cordão sanitário se rompe na Saxônia-Anhalt. No poder, alerta ele, ela poderia se parecer muito com o modelo de Viktor Orbán.",url:"https://www.journalofdemocracy.org/online-exclusive/how-the-afd-is-getting-ready-to-rule/"},
 {id:"bulwark-hertling-guerra-assimetrica",who:[],by:"Mark Hertling",theme:"geo",fmt:"text",src:"The Bulwark",date:"2026-11-17",lang:"EN",title:"Putin’s Asymmetric War on Europe",sum_en:"Retired general Mark Hertling reads the wave of bomb threats against European airports, newsrooms and schools, which the ISW calls “consistent with Russian approaches”, against Moscow’s long record of intimidation, and argues that an aggressor’s security concerns cannot weigh the same as the rights of the countries it threatens.",sum:"O general da reserva Mark Hertling lê a onda de ameaças de bomba contra aeroportos, redações e escolas europeias, que o ISW chama de “compatível com os métodos russos”, à luz do longo histórico de intimidação de Moscou, e defende que as preocupações de segurança de um agressor não podem pesar o mesmo que os direitos dos países que ele ameaça.",url:"https://www.thebulwark.com/p/putins-asymmetric-war-on-europe"},
 {id:"kyiv-tsurkan-moldova-drones",who:[],by:"Kate Tsurkan",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-17",lang:"EN",title:"7 drones cross into Moldovan airspace during latest Russian attack against Ukraine",sum_en:"Seven Russian drones entered Moldovan airspace, one of them over the capital, Chisinau. President Maia Sandu said Moscow “cares neither about neutrality, nor sovereignty, nor human life.”",sum:"Sete drones russos entraram no espaço aéreo da Moldávia, um deles sobre a capital, Chisinau. A presidente Maia Sandu disse que Moscou “não se importa nem com a neutralidade, nem com a soberania, nem com a vida humana”.",url:"https://kyivindependent.com/7-drones-cross-into-moldovan-airspace-during-latest-russian-attack-against-ukraine-1-spotted-over-chisinau/"},
 {id:"lgc-saillofest-pannes-eua",who:[],by:"Marin Saillofest",theme:"tec",fmt:"text",src:"Le Grand Continent",date:"2026-11-17",lang:"FR",title:"Les pannes et piratages informatiques se multiplient aux États-Unis",sum_en:"Marin Saillofest lists a week of US failures: all FAA departures halted, Microsoft 365 down in more than 70 countries, Workday and Chase offline, and a malicious script injected via Optimizely into 178 organisations. None has been attributed to a cyberattack, and Trump blamed “old broken equipment”.",sum:"Marin Saillofest lista uma semana de falhas nos EUA: todas as decolagens suspensas pela FAA, o Microsoft 365 fora do ar em mais de 70 países, Workday e Chase inacessíveis e um script malicioso injetado pela Optimizely em 178 organizações. Nenhuma foi atribuída a ataque, e Trump culpou “equipamento velho quebrado”.",url:"https://legrandcontinent.eu/fr/2026/11/17/les-pannes-et-piratages-informatiques-se-multiplient-aux-etats-unis/"},
 {id:"bulwark-egger-faa",who:[],by:"Andrew Egger e Bill Kristol",theme:"tec",fmt:"text",src:"The Bulwark",date:"2026-11-17",lang:"EN",title:"Trump Can’t Even Make the Planes Run On Time",sum_en:"Andrew Egger concedes that the ancient air traffic control system and Friday’s outage are not squarely the administration’s fault, but argues that real governing is boring, hard work that Trump is too distractible and too focused on blaming Democrats to do.",sum:"Andrew Egger admite que o sistema antigo de controle aéreo e a pane de sexta não são culpa direta do governo, mas argumenta que governar de verdade é um trabalho chato e difícil, que Trump, distraído e ocupado em culpar os democratas, não faz.",url:"https://www.thebulwark.com/p/trump-cant-even-make-the-planes-run-on-time-faa-atc-duffy-ai-congress-ukraine-russia-china"},
 {id:"last-eixo-do-mal-atualizado",who:["jonathan-v-last"],theme:"geo",fmt:"text",src:"The Bulwark",date:"2026-11-17",lang:"EN",title:"The Axis of Evil Got an Upgrade",sum_en:"Jonathan V. Last dates to around 2012 the axis of Russia, China and Iran that worked for a decade to deter the liberal powers. In the opening of the piece, he argues that Putin and Xi have found in Trump’s America a bigger prize than Iran itself, backing Tehran in its war while also gaining Washington’s acquiescence.",sum:"Jonathan V. Last data de cerca de 2012 o eixo entre Rússia, China e Irã, que passou uma década tentando conter as potências liberais. Na abertura do texto, ele sustenta que Putin e Xi encontraram na América de Trump um ganho maior que o próprio Irã, apoiando Teerã na guerra e contando ao mesmo tempo com a complacência de Washington.",url:"https://www.thebulwark.com/p/the-axis-of-evil-got-an-upgrade"},
 {id:"cpj-panama-rolando-rodriguez",who:[],theme:"dem",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-16",lang:"EN",title:"Home of Panamanian journalist Rolando Rodríguez damaged in arson attack",sum_en:"The CPJ asks Panama for a swift investigation into the arson attack on the home of Rolando Rodríguez, associate deputy editor of La Prensa, on November 14, as the paper was about to publish a story linking officials of José Raúl Mulino’s government to contractors. Rodríguez said the attack “changes the rules of the game” in the country.",sum:"O CPJ pede ao Panamá uma investigação rápida do incêndio criminoso na casa de Rolando Rodríguez, subeditor do La Prensa, em 14 de novembro, quando o jornal ia publicar uma reportagem ligando funcionários do governo de José Raúl Mulino a empresas contratadas pelo Estado. Para Rodríguez, o ataque “muda as regras do jogo” no país.",url:"https://cpj.org/2026/11/home-of-panamanian-journalist-rolando-rodriguez-damaged-in-arson-attack/"},
 {id:"contrarian-stier-gao",who:[],by:"Max Stier",theme:"dem",fmt:"text",src:"The Contrarian",date:"2026-11-16",lang:"EN",title:"Congress Can’t Let the President Muzzle Its Watchdog",sum_en:"Max Stier warns that Senator Rand Paul seems ready to rush the choice of the head of the GAO, Congress’s independent auditor, with a 15-year term, weeks before the change of majority, which could let Trump install a loyalist. He asks Congress to change the law and keep the choice in its own hands.",sum:"Max Stier alerta que o senador Rand Paul parece disposto a apressar a escolha do chefe do GAO, o auditor independente do Congresso, com mandato de 15 anos, semanas antes da troca de maioria, o que abriria espaço para Trump nomear um aliado. Ele pede que o Congresso mude a lei e fique com a escolha.",url:"https://www.contrariannews.org/p/congress-cant-let-the-president-muzzle"},
 {id:"unpopulist-craig-impeachment",who:[],by:"Andy Craig",theme:"dem",fmt:"text",src:"The UnPopulist",date:"2026-11-16",lang:"EN",title:"There Is No Good Reason Not to Impeach Trump’s Rogue Cabinet Members",sum_en:"Andy Craig argues that the Democrats, who will control both chambers, cannot shelve the articles of impeachment against Defense Secretary Pete Hegseth, which the House sent to committee by 211 to 204. For him, failing to act in the face of open lawlessness would weaken the Constitution and Congress itself.",sum:"Andy Craig defende que os democratas, que vão controlar as duas Casas, não podem engavetar o pedido de impeachment do secretário de Defesa, Pete Hegseth, que a Câmara mandou para a comissão por 211 a 204. Para ele, não agir diante de ilegalidades abertas enfraquece a Constituição e o próprio Congresso.",url:"https://www.theunpopulist.net/p/there-is-no-good-reason-not-to-impeach"},
 {id:"kyiv-heins-le-pen",who:[],by:"Jonas Heins",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-16",lang:"EN",title:"Le Pen wants to end Ukraine financial aid if elected",sum_en:"Marine Le Pen, who leads the polls for France’s April 2027 presidential election, told Ukraine’s ambassador Vadym Omelchenko that French public finances no longer allow financial aid to Kyiv, but that she would honour commitments already made, including the EU’s €90 billion loan, according to Le Monde.",sum:"Marine Le Pen, que lidera as pesquisas para a eleição presidencial francesa de abril de 2027, disse ao embaixador ucraniano Vadym Omelchenko que as finanças públicas da França não permitem mais ajuda financeira a Kiev, mas que honraria os compromissos assumidos, como o empréstimo europeu de 90 bilhões de euros, segundo o Le Monde.",url:"https://kyivindependent.com/le-pen-wants-to-end-ukraine-financial-aid-if-elected/"},
 {id:"lgc-saillofest-bab-el-mandeb",who:[],by:"Marin Saillofest",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-16",lang:"FR",title:"Les forces yéménites se sont retirées du détroit de Bab el-Mandeb",sum_en:"Marin Saillofest reports that Yemen’s Saudi-backed government pulled its forces from the Bab el-Mandeb strait to defend Aden, now less than 100 km from the Houthis, who have gained more than 1,600 km² since October. Riyadh sacked the coalition commander, and for the review the advance strengthens Tehran’s hand.",sum:"Marin Saillofest relata que o governo do Iêmen, apoiado pela Arábia Saudita, retirou as tropas do estreito de Bab el-Mandeb para defender Áden, agora a menos de 100 km dos houthis, que ganharam mais de 1.600 km² desde outubro. Riad demitiu o comandante da coalizão, e para a revista o avanço fortalece a mão de Teerã.",url:"https://legrandcontinent.eu/fr/2026/11/16/les-forces-yemenites-se-sont-retirees-du-detroit-de-bab-el-mandeb/"},
 {id:"gzero-houthis-bab-el-mandeb",who:[],theme:"geo",fmt:"text",src:"GZERO Media",date:"2026-11-16",lang:"EN",title:"Saudi-backed forces concede control of key waterway to Houthis",sum_en:"GZERO explains why the retreat matters beyond Yemen: the Bab el-Mandeb carries about 5% of world maritime trade, from Asia to Europe through Suez, and became Saudi Arabia’s oil outlet after the Iran war disrupted Hormuz.",sum:"O GZERO explica por que o recuo pesa além do Iêmen. O Bab el-Mandeb leva cerca de 5% do comércio marítimo mundial, da Ásia para a Europa pelo canal de Suez, e virou a saída do petróleo saudita desde que a guerra com o Irã travou o Estreito de Ormuz.",url:"https://www.gzeromedia.com/news/watching/hundreds-of-thousands-protest-czech-republic-over-press-freedom-saudi-backed-forces-concede-control-of-key-waterway-to-houthis-us-tightens-ai-chip-export-controls-ahead-of-trump-xi-summit"},
 {id:"theprint-gupta-quad-g3",who:["shekhar-gupta"],theme:"geo",fmt:"podcast",src:"ThePrint",date:"2026-11-16",lang:"EN",title:"CutTheClutter: Geopolitics in focus this week with Quad & G3 summits",sum_en:"Shekhar Gupta reads the week from New Delhi, with Modi meeting Trump at the Quad in Manila before the first summit between Xi, Trump and Putin in Shenzhen, and explains the three points that concern India.",sum:"Shekhar Gupta lê a semana pelo lado de Nova Délhi, com Modi encontrando Trump na reunião do Quad em Manila antes da primeira cúpula entre Xi, Trump e Putin em Shenzhen, e explica os três pontos que preocupam a Índia.",url:"https://theprint.podbean.com/e/cuttheclutter-geopolitics-in-focus-this-week-with-quad-g3-summitsmodi-in-manila-what-matters-for-india-why/"},
 {id:"kyiv-goncharova-estonia-fronteira",who:[],by:"Olena Goncharova",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-15",lang:"EN",title:"Estonia to close border with Russia after Moscow-linked sabotage attempt on drone maker",sum_en:"Estonia will close all border crossings with Russia from Dec. 1 after an attempted arson and explosion on Nov. 14 at Threod Systems, a maker of drones used by Ukraine. Estonian security services blame Russian military intelligence.",sum:"A Estônia vai fechar todas as passagens de fronteira com a Rússia a partir de 1º/12, depois de uma tentativa de incêndio e explosão, em 14/11, na Threod Systems, fabricante de drones usados pela Ucrânia. O serviço de segurança estoniano atribui a ação à inteligência militar russa.",url:"https://kyivindependent.com/estonia-to-close-border-with-russia-after-moscow-linked-sabotage-attempt-on-drone-maker/"},
 {id:"theins-praga-protesto-babis",who:[],theme:"dem",fmt:"text",src:"The Insider",date:"2026-11-15",lang:"RU",title:"В Праге до 450 тысяч человек вышли на протест против правительства Бабиша и в защиту независимых СМИ",sum_en:"Between 350,000 and 450,000 people marched in Prague on Nov. 15 against Andrej Babiš's plan to scrap the licence fee that funds Czech public television and radio, which would leave the government deciding their budget. It may be the largest protest since 1989.",sum:"Entre 350 mil e 450 mil pessoas foram às ruas de Praga em 15/11 contra o plano de Andrej Babiš de acabar com a taxa que financia a TV e a Rádio públicas tchecas, o que deixaria o governo decidir quanto elas recebem. Pode ter sido o maior protesto desde 1989.",url:"https://theins.ru/news/299613"},
 {id:"lgc-puel-guangdong",who:[],by:"Louis Puel",theme:"eco",fmt:"text",src:"Le Grand Continent",date:"2026-11-15",lang:"FR",title:"Guangdong, aux sources du nouveau choc chinois",sum_en:"Louis Puel looks at Guangdong, the southern Chinese province behind the new wave of Chinese exports.",sum:"Louis Puel olha para Guangdong, a província do sul da China de onde sai a nova onda de exportações chinesas.",url:"https://legrandcontinent.eu/fr/2026/11/15/guangdong-aux-sources-du-nouveau-choc-chinois/"},
 {id:"lgc-bloj-exigencias-russia",who:[],by:"Ramona Bloj",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-14",lang:"FR",title:"Les demandes brutales de la Russie sur l'Ukraine",sum_en:"Analysing the leaked Russian document from the Abu Dhabi talks, Le Grand Continent argues that Moscow asks for far more than Ukraine, including NATO's withdrawal to its 1997 positions and an end to arms for Kyiv, which amounts to demanding Europe's strategic capitulation.",sum:"Ao analisar o documento russo vazado das conversas de Abu Dhabi, o Le Grand Continent diz que Moscou pede muito além da Ucrânia, com a retirada da OTAN para as posições de 1997 e o fim das armas para Kiev, o que equivale a exigir a capitulação estratégica da Europa.",url:"https://legrandcontinent.eu/fr/2026/11/14/les-demandes-brutales-de-la-russie-sur-lukraine/"},
 {id:"kyiv-fenbert-cupula-shenzhen",who:[],by:"Abbey Fenbert",theme:"geo",fmt:"text",src:"The Kyiv Independent",date:"2026-11-14",lang:"EN",title:"Historic first summit for Trump, Xi, Putin will not focus on Ukraine, White House says",sum_en:"A US official said the first trilateral meeting of Trump, Xi Jinping and Putin, planned for the APEC summit in Shenzhen on Nov. 19, will focus on nuclear non-proliferation and the war in Iran rather than Ukraine. The Kremlin had said Trump and Putin would discuss a peace settlement.",sum:"Um funcionário americano disse que o primeiro encontro a três de Trump, Xi Jinping e Putin, previsto para a cúpula da APEC em Shenzhen em 19/11, vai tratar de não proliferação nuclear e da guerra no Irã, e não da Ucrânia. O Kremlin tinha dito que Trump e Putin discutiriam um acordo de paz.",url:"https://kyivindependent.com/historic-first-summit-among-trump-xi-putin-will-not-focus-on-ukraine-white-house-says/"},
 {id:"bulwark-polymeropoulos-diplomatas",who:[],by:"Marc Polymeropoulos e Michael Weiss",theme:"geo",fmt:"video",src:"The Bulwark",date:"2026-11-14",lang:"EN",title:"Trump's Amateur Diplomats Get Played",sum_en:"Former CIA officer Marc Polymeropoulos and Michael Weiss argue that Trump's envoys are being outplayed by Moscow in the Ukraine talks.",sum:"O ex-agente da CIA Marc Polymeropoulos e Michael Weiss dizem que os enviados de Trump estão sendo enganados por Moscou nas negociações sobre a Ucrânia.",url:"https://www.thebulwark.com/p/trumps-amateur-diplomats-get-played"},
 {id:"lgc-bloj-europeus-negociacoes",who:[],by:"Ramona Bloj",theme:"geo",fmt:"text",src:"Le Grand Continent",date:"2026-11-13",lang:"FR",title:"Guerre en Ukraine : quel est le plan des Européens pour revenir dans le jeu des négociations ?",sum_en:"Ramona Bloj explains that the informal European Council in Dublin, called after the Abu Dhabi talks, will discuss at Meloni's request who represents Europe, with Estonia backing Kallas and Costa and Paris and Berlin reluctant to name a single envoy.",sum:"Ramona Bloj explica que o Conselho Europeu informal de Dublin, convocado depois das conversas de Abu Dhabi, vai discutir a pedido de Meloni quem representa a Europa. A Estônia apoia Kallas e Costa, e Paris e Berlim resistem a nomear um enviado único.",url:"https://legrandcontinent.eu/fr/2026/11/13/guerre-en-ukraine-quel-est-le-plan-des-europeens-pour-revenir-dans-le-jeu-des-negociations"},
 {id:"dm-cop31-prioridades",who:[],by:"Reuters",theme:"eco",fmt:"text",src:"Daily Maverick",date:"2026-11-13",lang:"EN",title:"World leaders set out clashing priorities as COP31 turns to negotiations",sum_en:"After two days of speeches in Antalya, small island states demanded urgent emission cuts, European leaders backed global electrification, developing countries asked for more finance and fossil fuel producers, Venezuela among them, defended oil and gas, leaving negotiators a hard deal to draft.",sum:"Depois de dois dias de discursos em Antália, as pequenas ilhas pediram cortes urgentes de emissões, os europeus defenderam a eletrificação global, os países em desenvolvimento cobraram mais dinheiro e os produtores de combustíveis fósseis, a Venezuela entre eles, defenderam o petróleo e o gás. Os negociadores ficam com um acordo difícil de fechar.",url:"https://www.dailymaverick.co.za/article/2026-11-13-world-leaders-set-out-clashing-priorities-as-cop31-turns-to-negotiations/"},
 {id:"cpj-espioes-iran-international",who:[],theme:"tec",fmt:"text",src:"Committee to Protect Journalists",date:"2026-11-13",lang:"EN",title:"CPJ welcomes conviction of two Iranians who spied on journalists in the UK",sum_en:"CPJ welcomed the conviction in London of Mostafa Sepahvand and Farhad Javadi Manesh, two Iranian men, for spying on journalists of Iran International, a Persian-language broadcaster repeatedly targeted by the Iranian authorities.",sum:"O CPJ comemorou a condenação em Londres dos iranianos Mostafa Sepahvand e Farhad Javadi Manesh por espionar jornalistas da Iran International, emissora em persa que as autoridades do Irã já tentaram atingir várias vezes.",url:"https://cpj.org/2026/11/cpj-welcomes-conviction-of-two-iranians-who-spied-on-journalists-in-the-uk/"},
 {id:"ispi-dossie-takaichi",who:[],by:"Axel Berkofsky e Guido Alberto Casanova",theme:"geo",fmt:"text",src:"ISPI",date:"2026-11-13",lang:"EN",title:"Transforming Japan: Takaichi's Ambitious Yet Contentious Gamble",sum_en:"ISPI's dossier on Sanae Takaichi's first year finds one of Japan's strongest leaders in a long time, pursuing a conservative and often controversial agenda. The authors examine her security strategy, the strained alliance with Trump, Chinese economic coercion after her remarks on Taiwan and her slow push to revise the pacifist constitution.",sum:"O dossiê do ISPI sobre o primeiro ano de Sanae Takaichi vê uma das líderes mais fortes do Japão em muito tempo, com uma agenda conservadora e muitas vezes polêmica. Os autores tratam da estratégia de segurança, da aliança tensionada com Trump, da coerção econômica chinesa depois das falas dela sobre Taiwan e do avanço lento da revisão da Constituição pacifista.",url:"https://www.ispionline.it/en/publication/transforming-japan-takaichis-ambitious-yet-contentious-gamble-251718"},
 {id:"ispi-berkofsky-takaichi-pequim",who:[],by:"Axel Berkofsky",theme:"geo",fmt:"text",src:"ISPI",date:"2026-11-13",lang:"EN",title:"Between a Rock and a Hard Place. Takaichi Tries to Mend Fences with Beijing.",sum_en:"Axel Berkofsky recounts how China punished Japan after Takaichi suggested in November 2025 that Tokyo could intervene in a Taiwan crisis, with a seafood ban, fewer flights and rare earth curbs that cut yttrium exports to Japan by 98%. For him, economic coercion is China's method.",sum:"Axel Berkofsky conta como a China puniu o Japão depois que Takaichi sugeriu, em novembro de 2025, que Tóquio poderia intervir numa crise em Taiwan, com veto a frutos do mar, menos voos e restrições a terras raras que derrubaram em 98% a exportação de ítrio ao Japão. Para ele, a coerção econômica é o método chinês.",url:"https://www.ispionline.it/en/publication/between-a-rock-and-a-hard-place-takaichi-tries-to-mend-fences-with-beijing-251410"},
 {id:"persuasion-gershman-havel",who:[],by:"Carl Gershman",theme:"dem",fmt:"text",src:"Persuasion",date:"2026-11-13",lang:"EN",title:"What Havel Teaches Us About Freedom",sum_en:"Carl Gershman, founding president of the National Endowment for Democracy, writes that democracy is more threatened now than at any time in the last 30 years, but finds in Václav Havel's example reasons for hope.",sum:"Carl Gershman, que fundou o National Endowment for Democracy, escreve que a democracia está mais ameaçada do que em qualquer momento dos últimos 30 anos, mas vê no exemplo de Václav Havel motivos para ter esperança.",url:"https://www.persuasion.community/p/what-havel-teaches-us-about-freedom"},
 {id:"dispatch-lipinski-watergate-babies",who:[],by:"Daniel Lipinski",theme:"dem",fmt:"text",src:"The Dispatch",date:"2026-11-12",lang:"EN",title:"New House Democrats Can Be Today’s ‘Watergate Babies’",sum_en:"Daniel Lipinski, a former Democratic congressman, argues that Congress has let its lawmaking power wither and failed to defend its authority against the executive, and urges the new House Democrats to push reforms as the class elected after Watergate did in 1974.",sum:"Daniel Lipinski, ex-deputado democrata, argumenta que o Congresso deixou definhar o seu poder de legislar e não defendeu a própria autoridade diante do Executivo, e propõe que os novos deputados democratas forcem reformas como fez a turma eleita depois de Watergate, em 1974.",url:"https://thedispatch.com/article/house-democrats-reform-watergate-babies/"},
