L.es=Object.assign({},L.en,{wg_ww:"Guerras mundiales y Holocausto",wg_tot:"Totalitarismo en el siglo XX",wg_aut:"Autocracias de hoy",wg_rus:"Rusia y Ucrania",wg_me:"Oriente Medio",wg_res:"Resistencia y transiciones democráticas",wg_pol:"Política e instituciones",wg_imp:"Prensa y verdad",wg_tec:"Tecnología y libertades",wg_eco:"Economía y prosperidad",wg_ext:"Extremismo y radicalización",about_lede:"Global Village es una red internacional de personas que quieren entender el mundo desde la democracia liberal y fortalecerla donde viven. Trabaja en tres frentes que se apoyan entre sí.",step0_t:"Curaduría",step0:"Un consejo de curadores de distintas tradiciones políticas decide a quién sigue Global Village. Solo entran voces que defienden la democracia liberal y critican a los autoritarios de cualquier lado.",step1_t:"Recopilación",step1:"Seguimos de forma automática los sitios, newsletters, canales de video y podcasts de cada persona y organización de la base.",step2_t:"Clasificación",step2:"Cada publicación nueva se clasifica por tema, formato, origen e idioma.",step3_t:"Resumen y traducción",step3:"Una IA escribe un resumen breve y lo traduce al idioma del lector. El texto original nunca se reproduce.",step4_t:"Publicación",step4:"El análisis aparece en el sitio con título, resumen y enlace al original, y entra en la newsletter de la mañana siguiente.",about_lens_t:"La lente",about_lens:["Desde hace casi veinte años el mundo pierde democracias. Los informes de V-Dem y de Freedom House registran ese retroceso año tras año, y hoy ya hay más autocracias que democracias en el planeta. Buena parte de ese giro llegó por las urnas, con populismos autoritarios de derecha y de izquierda que llegan al poder por el voto y después desmontan, desde dentro, las reglas que permitirían sacarlos.", "La pérdida es grande porque la democracia liberal funciona como una infraestructura. Sobre ella se construyeron algunas de las mayores conquistas de la humanidad, como la ampliación de las libertades individuales, la caída de la mortalidad infantil, el acceso a la educación, la libertad académica y un largo período con menos guerras entre países. Cuando esa infraestructura se desgasta, los efectos aparecen rápido. Las libertades se reducen y las guerras vuelven, mientras la política se convierte en una disputa entre enemigos.", "Seguir a quienes piensan con claridad sobre todo esto también se volvió más difícil. Las redes están tomadas por la desinformación que producen los dos polos, y los algoritmos premian lo que genera rabia. Encontrar análisis serios, de quienes rechazan el autoritarismo venga de donde venga, se convirtió en un trabajo que casi nadie tiene tiempo de hacer.", "Global Village nace de este diagnóstico. Seguimos a pensadores, economistas, periodistas y políticos de muchos países, en todos los continentes, reunimos lo que publican en textos, videos y podcasts y entregamos cada análisis con un resumen breve en tu idioma y el enlace al original. Es para quien quiere entender la política, la geopolítica, la economía y la tecnología con la lente de la democracia liberal sin depender del algoritmo de las redes ni visitar decenas de sitios al día."],about_cur_t:"La curaduría",about_cur:["La curaduría responde a una pregunta, a quién vale la pena seguir. Nunca decide lo que dice cada autor, y por eso Global Village muestra voces que discrepan entre sí.", "Para entrar, una persona u organización debe defender de forma constante las elecciones libres, el Estado de derecho, la libertad de expresión, la prensa independiente y los derechos individuales, y criticar públicamente a los autoritarios de los dos campos, incluido el más cercano a su entorno. Apoyar o relativizar un golpe descalifica.", "Cada nombre pasa por dos curadores de perfiles distintos, que evalúan sin ver el voto del otro. Cuando no coinciden, un tercero desempata. Las aprobaciones vencen a los doce meses y vuelven a evaluarse. Quien financia el proyecto no designa curadores ni participa en las decisiones.", "Cuando un análisis seleccionado lee un país de una forma que los curadores de esa región consideran equivocada, el resumen sigue fiel al autor y Global Village añade una nota del editor con el contexto que falta. La meta es tener un curador para cada región del mundo."],about_rights_t:"Derechos y muros de pago",about_rights:"Mostramos solo el título, un resumen propio y el enlace al original. Los contenidos exclusivos para suscriptores aparecen solo con título y enlace, sin resumen.",about_lang_t:"Idiomas",proto:"Prototipo. Los títulos, autores, fechas y enlaces son reales y se recopilaron en octubre de 2026. Los resúmenes se escribieron como demostración.",k1_doc:"Documental",k1_series:"Serie",k1_film:"Película",orgs_text:"Índices, think tanks, organizaciones de derechos, redacciones independientes y publicaciones que sostienen el debate sobre la democracia liberal.",ot_pub:"Publicaciones",ot_media:"Periodismo independiente",ot_net:"Derechos y sociedad civil",in_exile:"en el exilio",region_asia:"Asia y Pacífico",region_mena:"Oriente Medio",region_afr:"África",region_eu:"Europa",region_na:"América del Norte",region_latam:"América Latina",w_checked:"Por ahora la disponibilidad sigue el catálogo brasileño de JustWatch, consultado el 24/10/2026. En el sitio final seguirá el país del lector.",about_lang:"La interfaz está en inglés, portugués, español, francés e italiano. Los resúmenes se generan en el idioma del lector y el original está a un clic.",thd_geo:"Relaciones internacionales, guerras y bloques de poder en América Latina, América del Norte, Europa, Rusia, África, Oriente Medio y Asia.",see_all_orgs:"Ver todas las organizaciones",pubs_side:"Publicaciones independientes",watch_text:"Películas, series y documentales que ayudan a entender el autoritarismo, la guerra y la construcción de las democracias, con indicación de dónde verlos.",vp_p2:"Cada pieza recibe un resumen breve en inglés, portugués, español, francés o italiano.",vp_p1:"Elegimos a quién seguir por su compromiso con las elecciones libres, el Estado de derecho y la libertad de expresión, y por su crítica a los autoritarios de todos los signos. Cada voz habla por sí misma.",vp_lede:"Global Village es una red internacional de personas que quieren entender el mundo desde la democracia liberal y fortalecerla donde viven. La democracia se sostiene o se debilita a escala global, y cada país solo cuida bien la suya cuando entiende la realidad de los demás sin proyectar en ellos la propia. Por eso la red reúne un observatorio de análisis en cinco idiomas, grupos locales que se encuentran con materiales comunes y conversaciones frecuentes entre personas de países distintos.",tab_all:"Todo",tab_following:"Siguiendo",tab_saved:"Guardados",new:"Nuevo",save:"Guardar",saved:"Guardado",copy_link:"Copiar enlace",copied:"Enlace copiado",follow_short:"Seguir",following:"Siguiendo",load_more:"Cargar más",b_today:"Hoy",b_yesterday:"Ayer",b_week:"Esta semana",b_lastweek:"La semana pasada",b_earlier:"Antes",who_follow:"A quién seguir",month_topics:"Temas del mes",vp_kicker:"Qué es Global Village",vp_title:"Una red para entender y fortalecer la democracia liberal",vp_cta_feed:"Ver el feed",vp_cta_nl:"Recibir el boletín",locale:"es-ES",tagline:"Una red internacional para entender y fortalecer la democracia liberal",nav_home:"Inicio",nav_analyses:"Análisis",nav_analysts:"Analistas",nav_topics:"Temas",nav_watch:"Ver",nav_orgs:"Organizaciones",nav_newsletter:"Boletín",nav_about:"Cómo funciona",search:"Buscar",search_ph:"Buscar analista, análisis o título",close:"Cerrar",featured:"Destacado",radar:"En el radar",latest:"Lo más reciente",see_all_analyses:"Ver todos los análisis",all:"Todos",all_f:"Todas",original_in:"original en",summary_label:"Resumen automático",listen:"Escuchar el original",read:"Leer el original",watchv:"Ver el original",more_from:"Más de",paywall:"Contenido exclusivo para suscriptores. Mostramos título y enlace, sin resumen.",content_note:"En este prototipo los resúmenes aparecen en inglés. En el sitio final se generan en tu idioma.",analysts_title:"A quién seguimos",see_all_analysts:"Ver todos los analistas",observatories:"Observatorios",watch_title:"Para ver",watch_all:"Ver todos los títulos",nl_title:"El día en una lectura",nl_text:"De lunes a viernes, a primera hora, los hechos más importantes del día anterior, resumidos en tu idioma.",nl_go:"Suscribirse en Substack",nl_via:"La newsletter se publica en el Substack de Projeto Villa. La suscripción es gratuita.",subscribe:"Suscribirse",th_dem:"Democracia e instituciones",th_geo:"Geopolítica",th_eco:"Economía",th_tec:"Tecnología y libertades",fmt_text:"Texto",fmt_video:"Vídeo",fmt_podcast:"Pódcast",cat_think:"Pensadores y académicos",cat_econ:"Economistas",cat_journo:"Periodistas y analistas",cat_pol:"Políticos y activistas",region:"Región",region_int:"Global",format:"Formato",topic:"Tema",language:"Idioma",category:"Categoría",n_results:n=>n===1?"1 resultado":n+" resultados",analyses_title:"Análisis",n_analyses:n=>n===1?"1 análisis":n+" análisis",publications:"Publicaciones recientes",related:"Sigue también",orgs_title:"Organizaciones",w_where:"Dónde",w_sub:"Suscripción",w_free:"Gratis",w_rent:"Alquiler o compra",w_none:"Sin streaming disponible",w_nf:"No encontrado",w_kind:"Tipo",k_film:"Películas",k_series:"Series",k_doc:"Documentales",platform:"Plataforma",any_platform:"Cualquier plataforma",see_where:"Ver dónde",society_title:"Sociedad y comunidad",about_title:"Cómo funciona",footer_nav:"Navegar",footer_topics:"Temas",footer_about:"Acerca de",footer_lang:"Idiomas",ed_note:"Nota del editor",ed_note_link:"Lee el contrapunto",nl_page_text:"Cada mañana de lunes a viernes, de tres a cinco hechos que los analistas más relevantes discutieron el día anterior, cada uno con un resumen breve en tu idioma y el enlace al original.",nl_edition:"Edición de mañana temprano"});
L.fr=Object.assign({},L.en,{wg_ww:"Guerres mondiales et Shoah",wg_tot:"Totalitarisme au XXe siècle",wg_aut:"Autocraties d’aujourd’hui",wg_rus:"Russie et Ukraine",wg_me:"Moyen-Orient",wg_res:"Résistance et transitions démocratiques",wg_pol:"Politique et institutions",wg_imp:"Presse et vérité",wg_tec:"Technologie et libertés",wg_eco:"Économie et prospérité",wg_ext:"Extrémisme et radicalisation",about_lede:"Global Village est un réseau international de personnes qui veulent comprendre le monde à travers la démocratie libérale et la renforcer là où elles vivent. Il agit sur trois fronts qui se soutiennent les uns les autres.",step0_t:"Curation",step0:"Un conseil de curateurs issus de différentes traditions politiques décide qui Global Village suit. Seules entrent les voix qui défendent la démocratie libérale et critiquent les autoritaires de tous bords.",step1_t:"Collecte",step1:"Nous suivons automatiquement les sites, newsletters, chaînes vidéo et podcasts de chaque personne et organisation de la base.",step2_t:"Classement",step2:"Chaque nouvelle publication est classée par thème, format, origine et langue.",step3_t:"Résumé et traduction",step3:"Une IA rédige un court résumé et le traduit dans la langue du lecteur. Le texte original n’est jamais reproduit.",step4_t:"Publication",step4:"L’analyse apparaît sur le site avec son titre, son résumé et le lien vers l’original, et entre dans la newsletter du lendemain matin.",about_lens_t:"Notre regard",about_lens:["Depuis près de vingt ans, le monde perd des démocraties. Les rapports de V-Dem et de Freedom House enregistrent ce recul année après année, et l’on compte aujourd’hui plus d’autocraties que de démocraties sur la planète. Une bonne partie de ce basculement est passée par les urnes, avec des populismes autoritaires de droite et de gauche qui arrivent au pouvoir par le vote puis démontent, de l’intérieur, les règles qui permettraient de les en écarter.", "La perte est grande parce que la démocratie libérale fonctionne comme une infrastructure. Certaines des plus grandes conquêtes de l’humanité se sont construites sur elle, comme l’élargissement des libertés individuelles, la baisse de la mortalité infantile, l’accès à l’éducation, la liberté académique et une longue période avec moins de guerres entre pays. Quand cette infrastructure s’use, les effets apparaissent vite. Les libertés reculent et les guerres reviennent, tandis que la politique devient un affrontement entre ennemis.", "Suivre ceux qui pensent clairement tout cela est aussi devenu plus difficile. Les réseaux sont envahis par la désinformation que produisent les deux pôles, et les algorithmes récompensent ce qui suscite la colère. Trouver des analyses sérieuses, de personnes qui rejettent l’autoritarisme d’où qu’il vienne, est devenu un travail que presque personne n’a le temps de faire.", "Global Village est né de ce constat. Nous suivons des penseurs, économistes, journalistes et responsables politiques de nombreux pays, sur tous les continents, nous rassemblons ce qu’ils publient en textes, vidéos et podcasts et nous livrons chaque analyse avec un court résumé dans votre langue et le lien vers l’original. C’est pour celles et ceux qui veulent comprendre la politique, la géopolitique, l’économie et la technologie à travers la démocratie libérale, sans dépendre de l’algorithme des réseaux ni visiter des dizaines de sites par jour."],about_cur_t:"La curation",about_cur:["La curation répond à une question, qui mérite d’être suivi. Elle ne décide jamais de ce que dit chaque auteur, et c’est pourquoi Global Village montre des voix qui ne sont pas d’accord entre elles.", "Pour entrer, une personne ou une organisation doit défendre de façon constante les élections libres, l’État de droit, la liberté d’expression, une presse indépendante et les droits individuels, et critiquer publiquement les autoritaires des deux camps, y compris celui qui est le plus proche de son milieu. Soutenir ou minimiser un coup d’État disqualifie.", "Chaque nom passe par deux curateurs aux profils différents, qui évaluent sans voir le vote de l’autre. En cas de désaccord, un troisième tranche. Les approbations expirent au bout de douze mois et sont réexaminées. Les financeurs du projet ne désignent pas de curateurs et ne participent pas aux décisions.", "Quand une analyse retenue lit un pays d’une manière que les curateurs de cette région jugent erronée, le résumé reste fidèle à l’auteur et Global Village ajoute une note de la rédaction avec le contexte qui manque. L’objectif est d’avoir un curateur pour chaque région du monde."],about_rights_t:"Droits et accès payant",about_rights:"Nous affichons seulement le titre, un résumé original et le lien vers la source. Les contenus réservés aux abonnés apparaissent avec le titre et le lien uniquement, sans résumé.",about_lang_t:"Langues",proto:"Prototype. Les titres, auteurs, dates et liens sont réels et ont été collectés en octobre 2026. Les résumés ont été rédigés pour la démonstration.",k1_doc:"Documentaire",k1_series:"Série",k1_film:"Film",orgs_text:"Indices, think tanks, organisations de défense des droits, rédactions indépendantes et publications qui nourrissent le débat sur la démocratie libérale.",ot_pub:"Publications",ot_media:"Journalisme indépendant",ot_net:"Droits et société civile",in_exile:"en exil",region_asia:"Asie-Pacifique",region_mena:"Moyen-Orient",region_afr:"Afrique",region_eu:"Europe",region_na:"Amérique du Nord",region_latam:"Amérique latine",w_checked:"Pour l’instant, la disponibilité suit le catalogue brésilien de JustWatch, consulté le 24/10/2026. Sur le site final, elle suivra le pays du lecteur.",about_lang:"L’interface est disponible en anglais, portugais, espagnol, français et italien. Les résumés sont générés dans la langue du lecteur, et l’original est à un clic.",thd_geo:"Relations internationales, guerres et blocs de puissance en Amérique latine, en Amérique du Nord, en Europe, en Russie, en Afrique, au Moyen-Orient et en Asie.",see_all_orgs:"Voir toutes les organisations",pubs_side:"Publications indépendantes",watch_text:"Films, séries et documentaires qui aident à comprendre l’autoritarisme, la guerre et la construction des démocraties, avec où les regarder.",vp_p2:"Chaque contribution reçoit un court résumé en anglais, portugais, espagnol, français ou italien.",vp_p1:"Nous choisissons qui suivre selon leur attachement aux élections libres, à l’État de droit et à la liberté d’expression, et selon leur critique des autoritaires de tous bords. Chaque voix parle pour elle-même.",vp_lede:"Global Village est un réseau international de personnes qui veulent comprendre le monde à travers la démocratie libérale et la renforcer là où elles vivent. La démocratie tient ou s’affaiblit à l’échelle mondiale, et chaque pays ne prend bien soin de la sienne que s’il comprend la réalité des autres sans y projeter la sienne. C’est pourquoi le réseau réunit un observatoire d’analyses en cinq langues, des groupes locaux qui se retrouvent autour de supports communs et des conversations régulières entre personnes de pays différents.",tab_all:"Tout",tab_following:"Abonnements",tab_saved:"Enregistrés",new:"Nouveau",save:"Enregistrer",saved:"Enregistré",copy_link:"Copier le lien",copied:"Lien copié",follow_short:"Suivre",following:"Suivi",load_more:"Charger plus",b_today:"Aujourd’hui",b_yesterday:"Hier",b_week:"Cette semaine",b_lastweek:"La semaine dernière",b_earlier:"Plus tôt",who_follow:"Qui suivre",month_topics:"Thèmes du mois",vp_kicker:"Ce qu’est Global Village",vp_title:"Un réseau pour comprendre et renforcer la démocratie libérale",vp_cta_feed:"Voir le fil",vp_cta_nl:"Recevoir la newsletter",locale:"fr-FR",tagline:"Un réseau international pour comprendre et renforcer la démocratie libérale",nav_home:"Accueil",nav_analyses:"Analyses",nav_analysts:"Analystes",nav_topics:"Thèmes",nav_watch:"À voir",nav_orgs:"Organisations",nav_newsletter:"Newsletter",nav_about:"Comment ça marche",search:"Rechercher",search_ph:"Rechercher un analyste, une analyse ou un titre",close:"Fermer",featured:"À la une",radar:"Dans le radar",latest:"Les plus récentes",see_all_analyses:"Voir toutes les analyses",all:"Tous",all_f:"Toutes",original_in:"original en",summary_label:"Résumé automatique",listen:"Écouter l’original",read:"Lire l’original",watchv:"Voir l’original",more_from:"Plus de",paywall:"Contenu réservé aux abonnés. Nous affichons le titre et le lien, sans résumé.",content_note:"Dans ce prototype, les résumés s’affichent en anglais. Sur le site final, ils sont générés dans votre langue.",analysts_title:"Qui nous suivons",see_all_analysts:"Voir tous les analystes",observatories:"Observatoires",watch_title:"À voir",watch_all:"Voir tous les titres",nl_title:"La journée en une lecture",nl_text:"Du lundi au vendredi, tôt le matin, les faits les plus importants de la veille, résumés dans votre langue.",nl_go:"S’abonner sur Substack",nl_via:"La newsletter est publiée sur le Substack de Projeto Villa. L’abonnement est gratuit.",subscribe:"S’abonner",th_dem:"Démocratie et institutions",th_geo:"Géopolitique",th_eco:"Économie",th_tec:"Technologie et libertés",fmt_text:"Texte",fmt_video:"Vidéo",fmt_podcast:"Podcast",cat_think:"Penseurs et universitaires",cat_econ:"Économistes",cat_journo:"Journalistes et analystes",cat_pol:"Responsables politiques et militants",region:"Région",region_int:"Monde",format:"Format",topic:"Thème",language:"Langue",category:"Catégorie",n_results:n=>n<=1?n+" résultat":n+" résultats",analyses_title:"Analyses",n_analyses:n=>n<=1?n+" analyse":n+" analyses",publications:"Publications récentes",related:"À suivre aussi",orgs_title:"Organisations",w_where:"Où",w_sub:"Abonnement",w_free:"Gratuit",w_rent:"Location ou achat",w_none:"Pas de streaming trouvé",w_nf:"Introuvable",w_kind:"Type",k_film:"Films",k_series:"Séries",k_doc:"Documentaires",platform:"Plateforme",any_platform:"Toutes les plateformes",see_where:"Voir où regarder",society_title:"Société et communauté",about_title:"Comment ça marche",footer_nav:"Naviguer",footer_topics:"Thèmes",footer_about:"À propos",footer_lang:"Langues",ed_note:"Note de la rédaction",ed_note_link:"Lire le contrepoint",nl_page_text:"Chaque matin du lundi au vendredi, trois à cinq faits dont les analystes les plus importants ont débattu la veille, chacun avec un court résumé dans votre langue et le lien vers l’original.",nl_edition:"Édition de demain matin"});
L.it=Object.assign({},L.en,{wg_ww:"Guerre mondiali e Olocausto",wg_tot:"Totalitarismo nel Novecento",wg_aut:"Autocrazie di oggi",wg_rus:"Russia e Ucraina",wg_me:"Medio Oriente",wg_res:"Resistenza e transizioni democratiche",wg_pol:"Politica e istituzioni",wg_imp:"Stampa e verità",wg_tec:"Tecnologia e libertà",wg_eco:"Economia e prosperità",wg_ext:"Estremismo e radicalizzazione",about_lede:"Global Village è una rete internazionale di persone che vogliono capire il mondo attraverso la democrazia liberale e rafforzarla dove vivono. Lavora su tre fronti che si sostengono a vicenda.",step0_t:"Curatela",step0:"Un consiglio di curatori di diverse tradizioni politiche decide chi Global Village segue. Entrano solo voci che difendono la democrazia liberale e criticano gli autoritari di ogni schieramento.",step1_t:"Raccolta",step1:"Seguiamo in modo automatico siti, newsletter, canali video e podcast di ogni persona e organizzazione della base.",step2_t:"Classificazione",step2:"Ogni nuova pubblicazione viene classificata per tema, formato, origine e lingua.",step3_t:"Riassunto e traduzione",step3:"Un’IA scrive un breve riassunto e lo traduce nella lingua di chi legge. Il testo originale non viene mai riprodotto.",step4_t:"Pubblicazione",step4:"L’analisi compare sul sito con titolo, riassunto e link all’originale, ed entra nella newsletter della mattina dopo.",about_lens_t:"La lente",about_lens:["Da quasi vent’anni il mondo perde democrazie. I rapporti di V-Dem e di Freedom House registrano questo arretramento anno dopo anno, e oggi nel mondo ci sono più autocrazie che democrazie. Buona parte di questa svolta è passata dalle urne, con populismi autoritari di destra e di sinistra che arrivano al potere con il voto e poi smontano, dall’interno, le regole che permetterebbero di mandarli via.", "La perdita è grande perché la democrazia liberale funziona come un’infrastruttura. Su di essa sono state costruite alcune delle più grandi conquiste dell’umanità, come l’ampliamento delle libertà individuali, il calo della mortalità infantile, l’accesso all’istruzione, la libertà accademica e un lungo periodo con meno guerre tra Paesi. Quando questa infrastruttura si logora, gli effetti si vedono in fretta. Le libertà si restringono e le guerre tornano, mentre la politica diventa uno scontro tra nemici.", "Seguire chi ragiona con lucidità su tutto questo è diventato anche più difficile. I social sono invasi dalla disinformazione prodotta dai due poli, e gli algoritmi premiano ciò che genera rabbia. Trovare analisi serie, di chi rifiuta l’autoritarismo da qualunque parte arrivi, è diventato un lavoro che quasi nessuno ha il tempo di fare.", "Global Village nasce da questa diagnosi. Seguiamo pensatori, economisti, giornalisti e politici di molti Paesi, in tutti i continenti, raccogliamo ciò che pubblicano in testi, video e podcast e offriamo ogni analisi con un breve riassunto nella tua lingua e il link all’originale. È per chi vuole capire politica, geopolitica, economia e tecnologia attraverso la lente della democrazia liberale senza dipendere dall’algoritmo dei social né visitare decine di siti al giorno."],about_cur_t:"La curatela",about_cur:["La curatela risponde a una domanda, chi vale la pena seguire. Non decide mai ciò che dice ciascun autore, ed è per questo che Global Village mostra voci in disaccordo tra loro.", "Per entrare, una persona o un’organizzazione deve difendere con coerenza elezioni libere, Stato di diritto, libertà di espressione, stampa indipendente e diritti individuali, e criticare pubblicamente gli autoritari di entrambi i campi, compreso quello più vicino al proprio ambiente. Sostenere o minimizzare un colpo di Stato squalifica.", "Ogni nome passa da due curatori con profili diversi, che valutano senza vedere il voto dell’altro. Quando non sono d’accordo, un terzo decide. Le approvazioni scadono dopo dodici mesi e tornano in valutazione. Chi finanzia il progetto non nomina curatori né partecipa alle decisioni.", "Quando un’analisi selezionata legge un Paese in un modo che i curatori di quella regione considerano sbagliato, il riassunto resta fedele all’autore e Global Village aggiunge una nota della redazione con il contesto che manca. L’obiettivo è avere un curatore per ogni regione del mondo."],about_rights_t:"Diritti e paywall",about_rights:"Mostriamo solo il titolo, un nostro riassunto e il link all’originale. I contenuti riservati agli abbonati compaiono solo con titolo e link, senza riassunto.",about_lang_t:"Lingue",proto:"Prototipo. Titoli, autori, date e link sono reali e sono stati raccolti nell’ottobre 2026. I riassunti sono stati scritti a scopo dimostrativo.",k1_doc:"Documentario",k1_series:"Serie",k1_film:"Film",orgs_text:"Indici, think tank, organizzazioni per i diritti, redazioni indipendenti e pubblicazioni che alimentano il dibattito sulla democrazia liberale.",ot_pub:"Pubblicazioni",ot_media:"Giornalismo indipendente",ot_net:"Diritti e società civile",in_exile:"in esilio",region_asia:"Asia e Pacifico",region_mena:"Medio Oriente",region_afr:"Africa",region_eu:"Europa",region_na:"Nord America",region_latam:"America Latina",w_checked:"Per ora la disponibilità segue il catalogo brasiliano di JustWatch, consultato il 24/10/2026. Nel sito definitivo seguirà il paese di chi legge.",about_lang:"L’interfaccia è in inglese, portoghese, spagnolo, francese e italiano. I riassunti sono generati nella lingua di chi legge e l’originale è a un clic.",thd_geo:"Relazioni internazionali, guerre e blocchi di potere in America Latina, Nord America, Europa, Russia, Africa, Medio Oriente e Asia.",see_all_orgs:"Vedi tutte le organizzazioni",pubs_side:"Pubblicazioni indipendenti",watch_text:"Film, serie e documentari che aiutano a capire l’autoritarismo, la guerra e la costruzione delle democrazie, con indicazione di dove vederli.",vp_p2:"Ogni contributo riceve un breve riassunto in inglese, portoghese, spagnolo, francese o italiano.",vp_p1:"Scegliamo chi seguire in base all’impegno per elezioni libere, Stato di diritto e libertà di espressione, e alla critica degli autoritari di ogni colore. Ogni voce parla per sé.",vp_lede:"Global Village è una rete internazionale di persone che vogliono capire il mondo attraverso la democrazia liberale e rafforzarla dove vivono. La democrazia regge o si indebolisce su scala globale, e ogni paese si prende davvero cura della propria solo quando capisce la realtà degli altri senza proiettarvi la sua. Per questo la rete riunisce un osservatorio di analisi in cinque lingue, gruppi locali che si incontrano con materiali comuni e conversazioni frequenti tra persone di paesi diversi.",tab_all:"Tutto",tab_following:"Seguiti",tab_saved:"Salvati",new:"Nuovo",save:"Salva",saved:"Salvato",copy_link:"Copia link",copied:"Link copiato",follow_short:"Segui",following:"Segui già",load_more:"Carica altro",b_today:"Oggi",b_yesterday:"Ieri",b_week:"Questa settimana",b_lastweek:"La settimana scorsa",b_earlier:"Prima",who_follow:"Chi seguire",month_topics:"Temi del mese",vp_kicker:"Cos’è Global Village",vp_title:"Una rete per capire e rafforzare la democrazia liberale",vp_cta_feed:"Vedi il feed",vp_cta_nl:"Ricevi la newsletter",locale:"it-IT",tagline:"Una rete internazionale per capire e rafforzare la democrazia liberale",nav_home:"Home",nav_analyses:"Analisi",nav_analysts:"Analisti",nav_topics:"Temi",nav_watch:"Da vedere",nav_orgs:"Organizzazioni",nav_newsletter:"Newsletter",nav_about:"Come funziona",search:"Cerca",search_ph:"Cerca analista, analisi o titolo",close:"Chiudi",featured:"In evidenza",radar:"Sul radar",latest:"Più recenti",see_all_analyses:"Vedi tutte le analisi",all:"Tutti",all_f:"Tutte",original_in:"originale in",summary_label:"Riassunto automatico",listen:"Ascolta l’originale",read:"Leggi l’originale",watchv:"Guarda l’originale",more_from:"Altro di",paywall:"Contenuto riservato agli abbonati. Mostriamo titolo e link, senza riassunto.",content_note:"In questo prototipo i riassunti compaiono in inglese. Nel sito definitivo ven    steps:["Elijan el título y comprueben dónde está disponible en su país, porque el catálogo cambia de un lugar a otro.","Acuerden el lugar y aseguren un sonido y una imagen razonables. Sirven una sala, una casa o una biblioteca.","Antes de empezar, alguien presenta el contexto histórico en cinco minutos, con una o dos fuentes.","Después de la sesión, hagan una pausa corta y abran la conversación con las preguntas de abajo.","Para cerrar, completen el registro del encuentro y elijan un análisis del Observatorio sobre el mismo tema."],
   questions:["¿Qué escena mostró mejor cómo el poder se concentra o se contiene?","¿Qué arriesgaban los personajes al decir la verdad?","¿Qué institución o persona marcó la diferencia en la historia?","¿Qué deja fuera la película y dónde encontrar esa parte?","¿Ocurre hoy algo parecido, aquí o en otro país?"]},
  fr:{title:"Projection de film ou de série",short:"Le groupe regarde ensemble un film, un documentaire ou un épisode et parle de ce qu’il montre de la vie sous l’autoritarisme et en démocratie.",
   purpose:"Un film fait sentir ce que les chiffres ne montrent pas, comme la peur de parler, le courage de ceux qui résistent et le travail lent des institutions. La discussion après la projection relie l’histoire au monde d’aujourd’hui.",
   time:"De 2 à 3 heures, projection comprise",people:"De 4 à 20",
   steps:["Choisissez le titre et vérifiez où il est disponible dans votre pays, car les catalogues changent d’un endroit à l’autre.","Convenez d’un lieu avec un son et une image corrects. Un salon, une salle ou une bibliothèque conviennent.","Avant de commencer, quelqu’un présente le contexte historique en cinq minutes, avec une ou deux sources.","Après la projection, faites une courte pause et ouvrez la discussion avec les questions ci-dessous.","Pour finir, remplissez le compte rendu de la rencontre et choisissez une analyse de l’Observatoire sur le même thème."],
   questions:["Quelle scène a le mieux montré comment le pouvoir se concentre ou est contenu ?","Que risquaient les personnages en disant la vérité ?","Quelle institution ou quelle personne a fait la différence dans l’histoire ?","Que laisse de côté le film, et où trouver cette partie ?","Se passe-t-il aujourd’hui quelque chose de semblable, ici ou ailleurs ?"]},
  it:{title:"Proiezione di film o serie",short:"Il gruppo guarda insieme un film, un documentario o un episodio e parla di ciò che mostra della vita sotto l’autoritarismo e in democrazia.",
   purpose:"Un film aiuta a sentire ciò che i numeri non mostrano, come la paura di parlare, il coraggio di chi resiste e il lavoro lento delle istituzioni. La conversazione dopo la proiezione collega la storia al mondo di oggi.",
   time:"Da 2 a 3 ore, proiezione compresa",people:"Da 4 a 20",
   steps:["Scegliete il titolo e verificate dove è disponibile nel vostro paese, perché i cataloghi cambiano da un luogo all’altro.","Accordatevi su un luogo con audio e immagine accettabili. Vanno bene un salotto, una sala o una biblioteca.","Prima di iniziare, qualcuno presenta il contesto storico in cinque minuti, con una o due fonti.","Dopo la proiezione, fate una breve pausa e aprite la conversazione con le domande qui sotto.","Per chiudere, compilate il verbale dell’incontro e scegliete un’analisi dell’Osservatorio sullo stesso tema."],
   questions:["Quale scena ha mostrato meglio come il potere si concentra o viene contenuto?","Che cosa rischiavano i personaggi dicendo la verità?","Quale istituzione o persona ha fatto la differenza nella storia?","Che cosa lascia fuori il film, e dove trovare quella parte?","Sta succedendo oggi qualcosa di simile, qui o in un altro paese?"]}

 {id:"conversa",extra:"themes",txt:{
  pt:{title:"Conversa entre países",short:"Dois grupos de países diferentes se encontram online para que cada um conheça a realidade do outro pela voz de quem vive lá.",
   purpose:"De longe, é comum ler outro país com as lentes do próprio. Na conversa, cada grupo conta como vê o seu país e ouve como é visto de fora, e os dois corrigem juntos as leituras apressadas.",
   time:"1h30, online",people:"Dois grupos, de 3 a 10 pessoas cada",
   steps:["Os dois grupos combinam a data, o horário, o idioma da conversa e um tema comum.","Antes do encontro, cada grupo prepara três fatos sobre o próprio país, cada um com fonte, e anota uma ideia que imagina que o outro grupo tenha sobre ele.","Na abertura, cada grupo apresenta o seu país em dez minutos.","Em seguida, cada grupo conta como imaginava o outro país, e o outro responde o que confere e o que não confere.","No fim, os dois grupos procuram o que têm em comum e o que podem aprender um com o outro.","Cada grupo preenche o seu registro, e os dois trocam os registros depois do encontro."],
   questions:["O que mais se lê errado sobre o seu país lá fora?","De onde vem essa leitura, e quem ganha com ela?","Que fonte vocês indicariam para quem quer entender o seu país?","O que surpreendeu vocês no relato do outro grupo?"],
   themes:["Como a imprensa de cada país cobre o outro","Eleições e a confiança no resultado","A presença da China e da Rússia em cada região","Polarização e redes sociais","Como cada país lida com os autoritários mais próximos"],
   lang_tip:"Se os grupos não falam a mesma língua, escolham um idioma comum ou convidem alguém para ajudar na tradução."},
  en:{title:"Conversation between countries",short:"Two groups from different countries meet online so that each one learns about the other’s reality from the people who live there.",
   purpose:"From a distance, it is easy to read another country through the lens of your own. In the conversation, each group explains how it sees its country and hears how it is seen from outside, and together they correct hasty readings.",
   time:"1h30, online",people:"Two groups of 3 to 10 people each",
   steps:["The two groups agree on a date, a time, the language of the conversation and a shared topic.","Before the meeting, each group prepares three facts about its own country, each with a source, and notes one idea it thinks the other group has about it.","To open, each group presents its country in ten minutes.","Then each group says how it imagined the other country, and the other replies with what holds and what does not.","At the end, the two groups look for what they have in common and what they can learn from each other.","Each group fills in its record, and the two exchange records after the meeting."],
   questions:["What is most often misread about your country abroad?","Where does that reading come from, and who gains from it?","Which source would you recommend to someone who wants to understand your country?","What surprised you in the other group’s account?"],
   themes:["How each country’s press covers the other","Elections and trust in the result","China’s and Russia’s presence in each region","Polarisation and social media","How each country deals with the authoritarians closest to it"],
   lang_tip:"If the groups do not share a language, choose a common one or invite someone to help with translation."},
  es:{title:"Conversación entre países",short:"Dos grupos de países distintos se encuentran en línea para que cada uno conozca la realidad del otro por la voz de quien vive allí.",
   purpose:"De lejos, es habitual leer otro país con los lentes del propio. En la conversación, cada grupo cuenta cómo ve su país y escucha cómo lo ven desde fuera, y los dos corrigen juntos las lecturas apresuradas.",
   time:"1h30, en línea",people:"Dos grupos, de 3 a 10 personas cada uno",
   steps:["Los dos grupos acuerdan la fecha, la hora, el idioma de la conversación y un tema común.","Antes del encuentro, cada grupo prepara tres hechos sobre su propio país, cada uno con su fuente, y anota una idea que cree que el otro grupo tiene sobre él.","Para abrir, cada grupo presenta su país en diez minutos.","Después, cada grupo cuenta cómo imaginaba el otro país, y el otro responde qué se confirma y qué no.","Al final, los dos grupos buscan lo que tienen en común y lo que pueden aprender uno del otro.","Cada grupo completa su registro, y los dos los intercambian después del encuentro."],
   questions:["¿Qué es lo que más se lee mal sobre su país en el exterior?","¿De dónde viene esa lectura y quién gana con ella?","¿Qué fuente recomendarían a quien quiere entender su país?","¿Qué les sorprendió del relato del otro grupo?"],
   themes:["Cómo cubre la prensa de cada país al otro","Las elecciones y la confianza en el resultado","La presencia de China y Rusia en cada región","Polarización y redes sociales","Cómo trata cada país a los autoritarios más cercanos"],
   lang_tip:"Si los grupos no hablan el mismo idioma, elijan uno común o inviten a alguien que ayude con la traducción."},
  fr:{title:"Conversation entre pays",short:"Deux groupes de pays différents se retrouvent en ligne pour que chacun découvre la réalité de l’autre par la voix de ceux qui y vivent.",
   purpose:"De loin, on lit facilement un autre pays avec les lunettes du sien. Dans la conversation, chaque groupe raconte comment il voit son pays et entend comment il est vu de l’extérieur, et les deux corrigent ensemble les lectures hâtives.",
   time:"1h30, en ligne",people:"Deux groupes de 3 à 10 personnes",
   steps:["Les deux groupes conviennent de la date, de l’heure, de la langue de la conversation et d’un thème commun.","Avant la rencontre, chaque groupe prépare trois faits sur son propre pays, chacun avec sa source, et note une idée qu’il pense que l’autre groupe a de lui.","Pour ouvrir, chaque groupe présente son pays en dix minutes.","Ensuite, chaque groupe dit comment il imaginait l’autre pays, et l’autre répond sur ce qui est juste et ce qui ne l’est pas.","À la fin, les deux groupes cherchent ce qu’ils ont en commun et ce qu’ils peuvent apprendre l’un de l’autre.","Chaque groupe remplit son compte rendu, et les deux les échangent après la rencontre."],
   questions:["Qu’est-ce qui est le plus souvent mal compris de votre pays à l’étranger ?","D’où vient cette lecture, et à qui profite-t-elle ?","Quelle source conseilleriez-vous à qui veut comprendre votre pays ?","Qu’est-ce qui vous a surpris dans le récit de l’autre groupe ?"],
   themes:["Comment la presse de chaque pays couvre l’autre","Les élections et la confiance dans le résultat","La présence de la Chine et de la Russie dans chaque région","Polarisation et réseaux sociaux","Comment chaque pays traite les autoritaires les plus proches"],
   lang_tip:"Si les groupes ne parlent pas la même langue, choisissez une langue commune ou invitez quelqu’un pour aider à traduire."},
  it:{title:"Conversazione tra paesi",short:"Due gruppi di paesi diversi si incontrano online perché ognuno conosca la realtà dell’altro dalla voce di chi ci vive.",
   purpose:"Da lontano è facile leggere un altro paese con le lenti del proprio. Nella conversazione ogni gruppo racconta come vede il suo paese e ascolta come viene visto da fuori, e i due correggono insieme le letture affrettate.",
   time:"1h30, online",people:"Due gruppi da 3 a 10 persone ciascuno",
   steps:["I due gruppi concordano data, orario, lingua della conversazione e un tema comune.","Prima dell’incontro ogni gruppo prepara tre fatti sul proprio paese, ciascuno con la sua fonte, e annota un’idea che pensa l’altro gruppo abbia di lui.","In apertura, ogni gruppo presenta il suo paese in dieci minuti.","Poi ogni gruppo racconta come immaginava l’altro paese, e l’altro risponde su che cosa torna e che cosa no.","Alla fine, i due gruppi cercano che cosa hanno in comune e che cosa possono imparare l’uno dall’altro.","Ogni gruppo compila il suo verbale, e i due se li scambiano dopo l’incontro."],
   questions:["Che cosa si legge più spesso in modo sbagliato sul vostro paese all’estero?","Da dove viene quella lettura, e chi ci guadagna?","Quale fonte consigliereste a chi vuole capire il vostro paese?","Che cosa vi ha sorpreso nel racconto dell’altro gruppo?"],
   themes:["Come la stampa di ciascun paese racconta l’altro","Le elezioni e la fiducia nel risultato","La presenza di Cina e Russia in ogni regione","Polarizzazione e social network","Come ogni paese tratta gli autoritari più vicini"],
   lang_tip:"Se i gruppi non parlano la stessa lingua, scegliete una lingua comune o invitate qualcuno che aiuti con la traduzione."}
 }}
];

function relDay(d){
  const p=d.split("-").map(Number);const dt=Date.UTC(p[0],p[1]-1,p[2]||15);
  const now=new Date();const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((today-dt)/86400000);
}
function bucket(i){
  const n=relDay(i.date);
  if(i.date.length===7||n>45){try{const p=i.date.split("-").map(Number);return new Intl.DateTimeFormat(t("locale"),{month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(Date.UTC(p[0],p[1]-1,15)))}catch(e){return i.date.slice(0,7)}}
  if(n<=0)return t("b_today");if(n===1)return t("b_yesterday");if(n<7)return t("b_week");if(n<14)return t("b_lastweek");return t("b_earlier");
}
function ago(i){
  const n=relDay(i.date);if(i.date.length===7||n>6)return fdate(i.date);
  try{return new Intl.RelativeTimeFormat(t("locale"),{numeric:"auto"}).format(-n,"day")}catch(e){return fdate(i.date)}
}

function vNet(){
  const regs=REGIONS.filter(r=>NODES.some(n=>regOf(n.cc)===r));
  return '<div class="wrap"><section class="block" style="padding-bottom:24px"><h1 class="display h-xl">'+esc(t("net_title"))+'</h1><p class="lede muted" style="margin-top:14px">'+esc(t("net_lede"))+'</p></section>'+
  '<div class="vp-stats net-stats">'+[[netCountries(),t("st_reps")],[netGroups(),t("st_groups")(netGroups())]].map(([n,l])=>'<div class="stat"><b>'+n+'</b><span>'+esc(l)+'</span></div>').join("")+'</div>'+
  '<section aria-label="'+esc(t("map_label"))+'"><div class="netmap-scroll"><div class="netmap">'+
   '<svg viewBox="'+MAP_VB.join(" ")+'" xmlns="http://www.w3.org/2000/svg"><title>'+esc(t("map_label"))+'</title>'+
   '<path class="land" d="'+worldPath(WORLD.land)+'"/><path class="sea" d="'+worldPath(WORLD.sea)+'"/>'+
   NODES.map(nodeMark).join("")+'</svg><div class="nd-tip" id="nd-tip" role="status" hidden></div></div></div>'+
   '<div class="map-foot"><ul class="legend">'+["rep","group","partner"].map(k=>'<li>'+legendMark(k,"active")+esc(t("kind_"+k))+'</li>').join("")+'<li>'+legendMark("rep","forming")+esc(t("status_forming"))+'</li></ul><p class="muted" style="margin:0;font-size:14px">'+esc(t("map_hint"))+'</p></div></section>'+
  '<section class="block"><h2 class="display h-m" style="margin:0 0 20px">'+esc(t("net_list_t"))+'</h2><div class="net-regions">'+regs.map(r=>'<div><h3 class="kicker region-k">'+esc(t("region_"+r))+'</h3><ul class="net-list">'+NODES.filter(n=>regOf(n.cc)===r).map(n=>
    '<li id="node-'+esc(n.id)+'"><div class="nl-top"><span class="avatar node-av" aria-hidden="true">'+esc(n.cc)+'</span><span style="min-width:0"><b>'+esc(nodeCity(n))+'</b><span class="muted">'+esc(cname(n.cc))+(n.provisional?' · '+esc(t("provisional")):'')+'</span></span></div>'+
    '<span class="kicker">'+esc(nodeKind(n))+' · '+esc(t("status_"+n.status))+'</span><span>'+esc(nodeDoes(n))+'</span>'+(n.note?'<span class="muted">'+esc(t("note_"+n.note))+'</span>':'')+nodePeople(n)+'</li>').join("")+'</ul></div>').join("")+'</div></section>'+
  '<section class="block soft-band partners-band"><h2 class="display h-m" style="margin:0 0 8px">'+esc(t("partners_t"))+'</h2><p class="muted" style="margin:0 0 20px;max-width:44em">'+esc(t("partners_lede"))+'</p><div class="orgs">'+PARTNERS.map(p=>'<div class="org"><b>'+esc(p.name)+'</b><span>'+esc(t("partner_casas"))+'</span></div>').join("")+'</div></section>'+
  '<section class="block"><h2 class="display h-m" style="margin:0 0 8px">'+esc(t("rhythm_t"))+'</h2><p class="muted" style="margin:0 0 20px;max-width:44em">'+esc(t("rhythm_lede"))+'</p><ol class="rhythm">'+["day","week","month","year"].map(k=>'<li><b>'+esc(t("r_"+k+"_t"))+'</b><span>'+esc(t("r_"+k))+'</span></li>').join("")+'</ol></section>'+
  '<div style="padding-bottom:48px">'+principlesHTML(false)+'</div></div>';
}
const kitT=k=>k.txt[S.lang]||k.txt.en;
function vKits(){
  return '<div class="wrap"><section class="block" style="padding-bottom:24px"><h1 class="display h-xl">'+esc(t("kits_title"))+'</h1><p class="lede muted" style="margin-top:14px">'+esc(t("kits_lede"))+'</p></section>'+
  '<div class="grid" style="padding-bottom:40px">'+KITS.map(k=>{const x=kitT(k);return '<article class="card"><h2 class="display h-m">'+esc(x.title)+'</h2><p class="sum">'+esc(x.short)+'</p><p class="meta">'+esc(t("kit_time"))+': '+esc(x.time)+' · '+esc(t("kit_people"))+': '+esc(x.people)+'</p><a class="go" href="#materiais-'+k.id+'">'+esc(t("kit_open"))+' →</a></article>'}).join("")+'</div>'+
  '<div style="padding-bottom:48px">'+principlesHTML(false)+'</div></div>';
}
function kitExtra(k,x){
  if(k.extra==="books"){
    const obs=TH.map(th=>itemsSorted().find(i=>i.theme===th&&!i.paywall)).filter(Boolean);
    return '<h3>'+esc(t("kit_obs"))+'</h3><ul class="kit-src">'+obs.map(i=>'<li><span class="kicker">'+esc(t("th_"+i.theme))+'</span><a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.title)+'</a><span class="muted">'+esc(authorName(i))+' · '+esc(i.src)+' · '+esc(fdate(i.date))+'</span></li>').join("")+'</ul>'+
    '<h3>'+esc(t("kit_books"))+'</h3><ul class="kit-src">'+BOOKS.map(b=>'<li><b class="serif" style="font-size:17px">'+esc(b.title)+'</b><span class="muted">'+esc(b.by)+' · '+esc(b.year)+'</span></li>').join("")+'</ul><p class="muted kit-note">'+esc(t("kit_books_note"))+'</p>';
  }
  if(k.extra==="films"){
    return '<h3>'+esc(t("kit_films"))+'</h3>'+KIT_FILM_GROUPS.map(g=>{const list=AV.filter(a=>a.cat==="n"&&avGroup(a.theme)===g&&(a.sit==="sub"||a.sit==="free")).slice(0,2);return list.length?'<p class="kicker" style="margin:14px 0 6px;color:var(--signal-text)">'+esc(t("wg_"+g))+'</p><ul class="kit-src">'+list.map(a=>'<li><a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(avTitle(a))+'</a><span class="muted">'+esc(avKindL(a))+(a.year?' · '+esc(a.year):'')+' · '+esc(t("w_where"))+': '+esc(a.sub||a.free)+'</span></li>').join("")+'</ul>':""}).join("")+
    '<p class="muted kit-note">'+esc(t("kit_films_note"))+'</p>';
  }
  if(k.extra==="themes")return '<h3>'+esc(t("kit_themes"))+'</h3><ul class="kit-list">'+x.themes.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul><p class="kit-note">'+esc(x.lang_tip)+'</p>';
  return "";
}
function recordText(){return ["rec_date","rec_city","rec_n","rec_disc","rec_idea"].map(f=>t(f)+":\n").join("\n")}
function vKit(id){
  const k=KIT[id];if(!k)return vNotFound();const x=kitT(k);
  return '<div class="wrap"><nav class="crumbs no-print" aria-label="Breadcrumb"><a href="#inicio">'+esc(t("nav_home"))+'</a><span aria-hidden="true">/</span><a href="#materiais">'+esc(t("nav_kits"))+'</a><span aria-hidden="true">/</span><span>'+esc(x.title)+'</span></nav>'+
  '<article class="kit"><header class="kit-head"><span class="kicker" style="color:var(--signal-text)">Global Village · '+esc(t("kits_title"))+'</span><h1 class="display h-l">'+esc(x.title)+'</h1><p class="lede">'+esc(x.short)+'</p>'+
   '<dl class="kit-meta"><div><dt>'+esc(t("kit_time"))+'</dt><dd>'+esc(x.time)+'</dd></div><div><dt>'+esc(t("kit_people"))+'</dt><dd>'+esc(x.people)+'</dd></div></dl>'+
   '<button type="button" class="btn no-print" data-print="1">'+esc(t("kit_print"))+'</button></header>'+
   principlesHTML(true)+
   '<section><h2>'+esc(t("kit_purpose"))+'</h2><p>'+esc(x.purpose)+'</p></section>'+
   '<section><h2>'+esc(t("kit_steps"))+'</h2><ol class="kit-steps">'+x.steps.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol></section>'+
   '<section><h2>'+esc(t("kit_questions"))+'</h2><ul class="kit-list">'+x.questions.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul></section>'+
   '<section><h2>'+esc(t("kit_tips"))+'</h2>'+kitExtra(k,x)+'</section>'+
   '<section class="kit-record"><h2>'+esc(t("kit_record"))+'</h2><p class="muted kit-note">'+esc(t("kit_record_note"))+'</p><dl>'+["rec_date","rec_city","rec_n","rec_disc","rec_idea"].map(f=>'<div class="rec-row'+(f==="rec_disc"||f==="rec_idea"?' tall':'')+'"><dt>'+esc(t(f))+'</dt><dd></dd></div>').join("")+'</dl>'+
   '<button type="button" class="btn no-print" data-copytext="'+esc(recordText())+'">'+esc(t("kit_copy"))+'</button></section>'+
  '</article><p class="no-print" style="padding-bottom:48px"><a href="#materiais" style="font-weight:700">← '+esc(t("kit_all"))+'</a></p></div>';
}
function vNotFound(){return '<div class="wrap"><section class="block"><h1 class="display h-l">404</h1><p><a href="#inicio">'+esc(t("back"))+'</a></p></section></div>'}

/* ============ SHELL ============ */
function shell(route){
  document.documentElement.lang=S.lang==="pt"?"pt-BR":S.lang;
  try{document.getElementById("today").textContent=new Intl.DateTimeFormat(t("locale"),{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date())}catch(e){}
  document.getElementById("langs").innerHTML=["en","pt","es","fr","it"].map(l=>'<button type="button" data-lang="'+l+'" aria-pressed="'+(l===S.lang)+'">'+l.toUpperCase()+'</button>').join("");
  const sec=route.split("-")[0];
  const cur={inicio:"inicio","":"inicio",rede:"rede",materiais:"materiais",analises:"analises",analistas:"analistas",a:"analistas",tema:"tema",assistir:"assistir",organizacoes:"organizacoes",newsletter:"newsletter",sobre:"sobre"}[route.startsWith("a-")?"a":(route.startsWith("tema-")?"tema":(route.startsWith("p-")?"organizacoes":(route.startsWith("materiais-")?"materiais":route)))]||"";
  const links=[["rede",t("nav_net")],["materiais",t("nav_kits")],["analises",t("nav_analyses")],["analistas",t("nav_analysts")],["tema-dem",t("nav_topics"),"tema"],["assistir",t("nav_watch")],["organizacoes",t("nav_orgs")],["newsletter",t("nav_newsletter")],["sobre",t("nav_about")]];
  document.getElementById("nav").innerHTML=links.map(([h,l,k])=>'<a href="#'+h+'"'+((k||h)===cur?' aria-current="page"':"")+'>'+esc(l)+'</a>').join("");
  document.getElementById("searchBtn").setAttribute("aria-label",t("search"));
  document.getElementById("footer").innerHTML='<div class="wrap"><div class="cols">'+
   '<div style="display:flex;flex-direction:column;gap:12px"><img class="logo logo-b" src="gv-logo-dark.png" alt="Global Village" style="height:36px;align-self:flex-start"><img class="logo logo-w" src="gv-logo-light.png" alt="Global Village" style="height:36px;align-self:flex-start"><p class="muted" style="margin:0;font-size:14px">'+esc(t("tagline"))+'</p></div>'+
   '<div><h2>'+esc(t("footer_nav"))+'</h2><ul>'+links.filter(l=>!l[2]).map(([h,l])=>'<li><a href="#'+h+'">'+esc(l)+'</a></li>').join("")+'</ul></div>'+
   '<div><h2>'+esc(t("footer_topics"))+'</h2><ul>'+TH.map(x=>'<li><a href="#tema-'+x+'">'+esc(t("th_"+x))+'</a></li>').join("")+'</ul></div>'+
   '<div><h2>'+esc(t("footer_lang"))+'</h2><ul>'+["en","pt","es","fr","it"].map(l=>'<li><a href="#" data-lang="'+l+'">'+({pt:"Português",en:"English",es:"Español",fr:"Français",it:"Italiano"})[l]+'</a></li>').join("")+'</ul></div>'+
   '</div><p class="proto" style="margin:0 0 32px">'+esc(t("proto"))+'</p></div>';
}
function current(){const h=(location.hash||"").replace(/^#/,"");return h||"inicio"}
function render(scroll){
  const r=current();shell(r);
  let html;
  if(r==="inicio")html=vHome();
  else if(r==="analises")html=vAnalyses();
  else if(r==="analistas")html=vAnalysts();
  else if(r.startsWith("a-"))html=vProfile(r.slice(2));
  else if(r.startsWith("tema-"))html=vTopic(r.slice(5));
  else if(r.startsWith("p-"))html=vPub(r.slice(2));
  else if(r==="assistir")html=vWatch();
  else if(r==="organizacoes")html=vOrgs();
  else if(r==="newsletter")html=vNewsletter();
  else if(r==="sobre")html=vAbout();
  else if(r==="rede")html=vNet();
  else if(r==="materiais")html=vKits();
  else if(r.startsWith("materiais-"))html=vKit(r.slice(10));
  else html=vNotFound();
  const app=document.getElementById("app");app.innerHTML=html;
  const an=document.getElementById("an-res");if(an)an.innerHTML=anResults();
  const pe=document.getElementById("pe-res");if(pe)pe.innerHTML=peResults();
  const nav=document.getElementById("nav");nav.classList.remove("open");document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  if(scroll)window.scrollTo(0,0);
}
let lastRoute=null;
window.addEventListener("hashchange",()=>{const r=current();const routeOnly=r!==lastRoute;lastRoute=r;render(routeOnly)});

document.addEventListener("click",e=>{
  const nd=e.target.closest("[data-node]");
  if(nd){const tip=document.getElementById("nd-tip");const id=nd.getAttribute("data-node");if(tip&&!tip.hidden&&tip.dataset.id===id&&tip.dataset.pin)hideTip(true);else showTip(id,true);return}
  if(!e.target.closest("#nd-tip"))hideTip(true);
  if(e.target.closest("[data-print]")){window.print();return}
  const ct=e.target.closest("[data-copytext]");
  if(ct){const v=ct.getAttribute("data-copytext");try{navigator.clipboard.writeText(v).then(()=>toast(t("kit_copied")),()=>toast(t("copy_fail")))}catch(err){toast(t("copy_fail"))}return}
  const lg=e.target.closest("[data-lang]");
  if(lg){e.preventDefault();S.lang=lg.getAttribute("data-lang");store.set("uilang",S.lang);render(false);return}
  const st=e.target.closest("[data-set]");
  if(st){const [g,k]=st.getAttribute("data-set").split(".");S[g][k]=st.getAttribute("data-val");if(g==="feed")S.feed.n=8;keep(()=>render(false));return}
  const fo=e.target.closest("[data-follow]");
  if(fo){const id=fo.getAttribute("data-follow");S.follow[id]=!S.follow[id];if(!S.follow[id])delete S.follow[id];store.set("follow",JSON.stringify(S.follow));keep(()=>render(false));return}
  const sv=e.target.closest("[data-save]");
  if(sv){const id=sv.getAttribute("data-save");if(S.saved[id])delete S.saved[id];else S.saved[id]=1;store.set("saved",JSON.stringify(S.saved));keep(()=>render(false));return}
  const cp=e.target.closest("[data-copy]");
  if(cp){const u=cp.getAttribute("data-copy");try{navigator.clipboard.writeText(u).then(()=>toast(t("copied")),()=>toast(t("copy_fail")))}catch(err){toast(t("copy_fail"))}return}
  const mo=e.target.closest("[data-more]");
  if(mo){S.feed.n+=8;const fl=document.getElementById("feed-list");if(fl)fl.innerHTML=feedHTML();return}
  const sc=e.target.closest("[data-scroll]");
  if(sc){const el=document.getElementById(sc.getAttribute("data-scroll"));if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  if(e.target.closest("#menuBtn")){const nav=document.getElementById("nav");const o=nav.classList.toggle("open");document.getElementById("menuBtn").setAttribute("aria-expanded",String(o));return}
  if(e.target.closest("#searchBtn")){openSearch();return}
  if(e.target.closest("[data-close]")||e.target.id==="overlay"){closeSearch();return}
  const sr=e.target.closest("#overlay a");if(sr){closeSearch()}
});
document.addEventListener("input",e=>{
  const q=e.target.getAttribute&&e.target.getAttribute("data-q");
  if(q==="an"){S.an.q=e.target.value;document.getElementById("an-res").innerHTML=anResults()}
  if(q==="pe"){S.pe.q=e.target.value;document.getElementById("pe-res").innerHTML=peResults()}
  if(e.target.id==="gq")searchResults(e.target.value);
});
// A newsletter sai em português e inglês. Os botões da home seguem o idioma da interface.
function nlTag(){return S.lang==="pt"?"pt":"en"}
function nlHref(l){return SUBSTACK+"/s/"+NL_SECTION[l||nlTag()]}
document.addEventListener("change",e=>{if(e.target.id==="nl-lang"){S.nl.lang=e.target.value;const a=document.getElementById("nl-go2");if(a)a.href=nlHref(S.nl.lang)}});
// Mapa da rede: o ponto mostra a ficha ao passar o mouse ou receber o foco.
document.addEventListener("mouseover",e=>{const nd=e.target.closest&&e.target.closest("[data-node]");if(nd){const tip=document.getElementById("nd-tip");if(tip&&tip.dataset.pin&&!tip.hidden)return;showTip(nd.getAttribute("data-node"),false)}});
document.addEventListener("mouseout",e=>{const nd=e.target.closest&&e.target.closest("[data-node]");if(nd&&!(e.relatedTarget&&nd.contains(e.relatedTarget)))hideTip(false)});
document.addEventListener("focusin",e=>{const nd=e.target.closest&&e.target.closest("[data-node]");if(nd)showTip(nd.getAttribute("data-node"),false)});
document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest("[data-node]"))hideTip(true)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest("[data-node]")){e.preventDefault();showTip(e.target.closest("[data-node]").getAttribute("data-node"),true);return}if(e.key==="Escape")hideTip(true);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("overlay").hidden)closeSearch()});

function keep(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
let toastT=null;function toast(msg){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2200)}
function openSearch(){
  const o=document.getElementById("overlay");
  o.innerHTML='<div class="panel" role="dialog" aria-modal="true" aria-label="'+esc(t("search"))+'"><div class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><label for="gq" class="sr">'+esc(t("search"))+'</label><input id="gq" type="search" placeholder="'+esc(t("search_ph"))+'" autocomplete="off"><button type="button" class="icon-btn" data-close="1" aria-label="'+esc(t("close"))+'" style="border:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="res" id="gres"></div></div>';
  o.hidden=false;searchResults("");setTimeout(()=>{const i=document.getElementById("gq");if(i)i.focus()},0);
}
function closeSearch(){const o=document.getElementById("overlay");o.hidden=true;o.innerHTML="";const b=document.getElementById("searchBtn");if(b)b.focus()}
function searchResults(v){
  const q=norm(v.trim());const box=document.getElementById("gres");if(!box)return;
  const ps=(q?PEOPLE.filter(p=>norm(p.name+" "+pArea(p)+" "+p.area+" "+cname(p.cc)).includes(q)):PEOPLE.filter(p=>countBy(p.id))).slice(0,6);
  const is=(q?itemsSorted().filter(i=>norm(i.title+" "+(i.sum||"")+" "+(i.sum_en||"")+" "+authorName(i)+" "+i.src).includes(q)):itemsSorted()).slice(0,6);
  const as=q?AV.filter(a=>norm(a.title+" "+a.orig+" "+a.theme).includes(q)).slice(0,6):[];
  if(!ps.length&&!is.length&&!as.length){box.innerHTML='<p class="muted" style="padding:16px 0">'+esc(t("no_results"))+'</p>';return}
  box.innerHTML=(ps.length?'<h4>'+esc(t("results_people"))+'</h4>'+ps.map(p=>'<a href="#a-'+p.id+'"><b>'+esc(p.name)+'</b> <span class="muted">· '+esc(pArea(p))+'</span></a>').join(""):"")+
   (is.length?'<h4>'+esc(t("results_items"))+'</h4>'+is.map(i=>'<a href="'+authorHref(i)+'"><b class="serif">'+esc(i.title)+'</b> <span class="muted">· '+esc(authorName(i))+'</span></a>').join(""):"")+
   (as.length?'<h4>'+esc(t("results_av"))+'</h4>'+as.map(a=>'<a href="#assistir"><b>'+esc(avTitle(a))+'</b> <span class="muted">· '+esc(avKindL(a))+'</span></a>').join(""):"");
}

lastRoute=current();render(false);
})();
</script>
