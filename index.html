<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Global Village is an international network to understand and strengthen liberal democracy, with an observatory of analysis in five languages, local groups and conversations between countries.">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta property="og:type" content="website">

<meta property="og:image:alt" content="Global Village. Understand the world through the lens of liberal democracy.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/Newsreader-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Identidade do Villa (brand/villa/tokens.css): tinta sobre papel, cantos retos, sem sombras nem degradês. O verde-veneziana marca links, botões e estados ativos; o ocre-airbel só aparece como preenchimento (a faixa da newsletter) e vira ocre-texto quando precisa ser letra. */
@font-face{font-family:"Newsreader";src:url("fonts/Newsreader-Variable.woff2") format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url("fonts/Newsreader-Italic-Variable.woff2") format("woff2");font-weight:200 800;font-style:italic;font-display:swap}
@font-face{font-family:"Archivo";src:url("fonts/Archivo-Variable.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Courier Prime";src:url("fonts/CourierPrime-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Courier Prime";src:url("fonts/CourierPrime-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  color-scheme:light;
  /* papel, papel-2, tinta, tinta-suave e linha do Villa */
  --paper:#F3EBDD; --surface:#F3EBDD; --soft:#E8DCC6; --ink:#1E1A16; --ink-2:#5E5547; --rule:#CDBFA6;
  --band:#E8DCC6; --band-2:#F3EBDD; --band-ink:#1E1A16; --band-muted:#5E5547; --band-rule:#CDBFA6;
  /* verde-veneziana e sobre-verde */
  --signal:#415E3A; --signal-ink:#F3EBDD; --signal-text:#415E3A; --ok:#415E3A; --bad:#1E1A16; --focus:#415E3A;
  --ocre:#C19440; --ocre-text:#7A5718; --carimbo:#55478A;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-serif:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"Courier Prime", "Courier New", monospace;
  --wrap:1240px;
}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:inherit}
a:hover{color:var(--signal-text)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* logos */
.logo{display:block;height:44px;width:auto}
.logo-w{display:none}

/* top strip + header */
.strip{background:var(--soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--rule)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:6px}
.langs{display:flex;gap:4px}
.langs button{min-width:40px;min-height:32px;font:inherit;font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer;border:1px solid var(--rule);background:transparent;color:var(--ink)}
.langs button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:2px solid var(--ink)}
header.site .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
header.site .brand{display:flex;align-items:center;text-decoration:none}
nav.main{display:flex;gap:4px 20px;flex-wrap:wrap;font-weight:600;font-size:15px;margin-left:auto}
nav.main a{text-decoration:none;padding:6px 0;border-bottom:3px solid transparent}
nav.main a[aria-current="page"]{border-bottom-color:var(--signal)}
.hdr-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--ink);color:var(--paper)}
.menu-btn{display:none}
@media (max-width:900px){
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:2px solid var(--ink);flex-direction:column;gap:0;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));margin:0}
  nav.main.open{display:flex}
  nav.main a{padding:12px 0;border-bottom:1px solid var(--rule);font-size:17px}
  .menu-btn{display:inline-flex}
  .hdr-actions{margin-left:auto}
}

/* type */
.kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.display{font-family:var(--f-display);font-weight:500;line-height:1.02;letter-spacing:-.01em;margin:0}
.h-xl{font-size:clamp(48px,8vw,104px)}
.h-l{font-size:clamp(34px,5vw,56px)}
.h-m{font-size:clamp(26px,3.4vw,38px)}
.serif{font-family:var(--f-serif)}
.lede{font-family:var(--f-serif);font-size:clamp(18px,2vw,21px);line-height:1.5;max-width:44em;margin:0}
.muted{color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--ink)}
.tag.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.signal{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 20px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.primary:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn:hover{color:inherit}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.band .pill{border-color:var(--band-rule);color:var(--band-ink)}
.band .pill[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.field{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--surface);min-height:48px;padding:0 12px}
.field input,.field select{border:0;outline:none;background:transparent;color:var(--ink);font:inherit;font-size:15px;width:100%;min-width:0}
.filters{display:flex;flex-direction:column;gap:14px;padding-block:16px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.filter-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.filter-row>.kicker{min-width:88px}
.count{font-size:14px;color:var(--ink-2)}

/* sections */
section.block{padding-block:48px}
.sec-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
.rule-top{border-top:6px solid var(--ink);padding-top:14px}
.band{background:var(--band);color:var(--band-ink)}
.band .muted{color:var(--band-muted)}
.band a:hover{color:var(--signal-text)}
.band{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.split{display:flex;flex-wrap:wrap;gap:40px}
.split>.main-col{flex:999 1 560px;min-width:0}
.split>.side-col{flex:1 1 300px;min-width:0}

/* cards */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.card{background:var(--surface);border:1.5px solid var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-family:var(--f-serif);font-size:23px;line-height:1.22;font-weight:600}
.card .meta{font-size:14px;color:var(--ink-2);margin:0}
.card .meta a{font-weight:700;color:var(--ink);text-decoration:none}
.card .meta a:hover{color:var(--signal-text)}
.card p.sum{margin:0;font-size:15px;line-height:1.55}
.card .top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.card .tags{display:inline-flex;gap:6px;flex-wrap:wrap}
.card .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;min-height:44px}
.paywall{margin:0;font-size:14px;line-height:1.5;padding:10px 12px;background:var(--soft);display:flex;gap:8px;align-items:flex-start}
.empty{padding:28px;border:1.5px dashed var(--ink);font-size:16px;line-height:1.5}

/* hero */
.hero{display:flex;flex-wrap:wrap;gap:40px;padding-block:40px 32px}
.hero .lead{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.hero h1{font-family:var(--f-serif);font-weight:500;font-size:clamp(36px,5.4vw,64px);line-height:1.03;letter-spacing:-.01em;margin:0}
.sumbox{background:var(--surface);border:1.5px solid var(--ink);padding:20px 22px;display:flex;flex-direction:column;gap:10px;max-width:780px}
.sumbox p{margin:0;font-family:var(--f-serif);font-size:20px;line-height:1.5}
.radar{flex:1 1 320px;min-width:0}
.radar ol{list-style:none;margin:0;padding:0}
.radar li a{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.radar .n{font-family:var(--f-ui);font-weight:700;font-size:28px;line-height:1;color:var(--ocre-text);min-width:22px}
.radar .t{font-family:var(--f-serif);font-size:19px;line-height:1.3;font-weight:600}

/* stats */
.stats{display:grid;gap:20px 32px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));padding-block:28px}
.stat{display:flex;align-items:baseline;gap:12px}
.stat b{font-family:var(--f-ui);font-weight:700;font-size:52px;line-height:1;color:var(--ocre-text);font-variant-numeric:tabular-nums}
.stat span{font-size:15px;line-height:1.35;color:var(--band-muted)}

/* people */
.people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.person{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);background:var(--surface);text-decoration:none;min-height:68px}
.person:hover{border-color:var(--ink);color:inherit}
.avatar{width:44px;height:44px;flex:none;border-radius:0;background:var(--signal);color:var(--signal-ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:18px}
.avatar.pub{background:var(--ocre);color:var(--ink)}
.avatar.xl{width:132px;height:132px;font-size:52px}
.person .nm{font-weight:700;font-size:15px;display:block}
.person .ar{font-size:13px;color:var(--ink-2);display:block}
.person .ct{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.person .ct.pending{color:var(--ink-2);font-weight:500}

/* profile */
.profile{display:flex;flex-wrap:wrap;gap:28px 40px;align-items:flex-start;padding-block:24px 32px;border-bottom:2px solid var(--ink)}
.profile .info{flex:999 1 480px;min-width:0;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px 24px;margin:0}
.facts dt{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.facts dd{margin:2px 0 0;font-weight:600}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;flex-wrap:wrap;gap:8px 24px;padding:22px 0;border-top:1px solid var(--rule)}
.timeline .when{flex:0 0 110px}
.timeline .when b{display:block;font-family:var(--f-mono);font-weight:700;font-size:20px;line-height:1.1;letter-spacing:.04em}
.timeline .body{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:8px}
.timeline h3{margin:0;font-family:var(--f-serif);font-size:23px;line-height:1.25}
.src{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--rule)}
.status-ok{font-size:12px;font-weight:700;padding:5px 9px;background:var(--ink);color:var(--paper);white-space:nowrap}
.status-pend{font-size:12px;font-weight:700;padding:4px 8px;border:1.5px dashed var(--ink);white-space:nowrap}
.side-stack{display:flex;flex-direction:column;gap:28px}
.side-stack h2{margin:0 0 10px;font-size:18px;font-weight:700}
.crumbs{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;padding-top:20px}

/* watch */
.posters{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.poster{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:330px}
.poster h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.1;overflow-wrap:anywhere}
.poster .orig{font-size:13px;font-style:italic;color:var(--band-muted)}
.poster .foot{border-top:1px solid var(--band-rule);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.avail{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.avail i{width:9px;height:9px;display:inline-block}
.av-sub i,.av-free i{background:var(--ok)}
.av-rent i{background:var(--ocre)}
.av-none i,.av-nf i{background:transparent;border:1.5px solid var(--band-muted)}
.poster a.see{font-weight:700;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.soc{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.soc article{background:var(--surface);border:1px solid var(--rule);color:var(--ink);padding:18px;display:flex;flex-direction:column;gap:8px}
.soc h3{margin:0;font-family:var(--f-serif);font-size:21px}

/* orgs */
.orgs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.org{display:flex;flex-direction:column;gap:6px;padding:16px;border:1.5px solid var(--ink);background:var(--surface);text-decoration:none}
.org b{font-size:16px}
.org span{font-size:14px;color:var(--ink-2);line-height:1.4}

/* newsletter */
.nl{background:var(--ocre);color:var(--ink)}
.nl .wrap{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between;padding-block:48px}
.nl form{flex:1 1 380px;display:flex;flex-wrap:wrap;gap:10px}
.nl input{flex:1 1 240px;min-height:52px;border:2px solid var(--ink);padding:0 16px;font:inherit;font-size:16px;background:var(--surface);color:var(--ink)}
.nl button{min-height:52px;padding:0 24px;background:var(--signal);color:var(--signal-ink);border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.nl a{color:var(--ink)}
.nl .nl-cta{flex:1 1 380px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.nl .nl-go{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;background:var(--signal);color:var(--signal-ink);font-weight:700;font-size:16px;text-decoration:none}
.ok-msg{font-weight:700}
.err-msg{font-weight:700;margin:0 0 8px}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1.5px solid var(--ink);cursor:pointer;font-weight:600;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--ink)}

/* about */
.steps{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{border-top:6px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--f-ui);font-weight:700;font-size:40px;line-height:1;color:var(--ocre-text)}
.prose{max-width:44em;display:flex;flex-direction:column;gap:14px;font-size:17px;line-height:1.6}
.prose p{margin:0}

/* search overlay */
.overlay{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 56px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.overlay .panel{background:var(--paper);border:2px solid var(--ink);width:min(760px,100%);max-height:80vh;display:flex;flex-direction:column}
.overlay .panel .field{border:0;border-bottom:2px solid var(--ink)}
.overlay .res{overflow:auto;padding:8px 16px 16px}
.overlay .res h4{margin:14px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.overlay .res a{display:block;padding:10px 0;border-bottom:1px solid var(--rule);text-decoration:none}


/* value proposition */
.vp{border-bottom:1px solid var(--rule)}
.vp-grid{display:flex;flex-wrap:wrap;gap:32px 56px;padding-block:44px 28px;align-items:flex-start}
.vp-main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.vp-title{font-size:clamp(40px,6vw,78px)}
#feed{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px)}
.vp-stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));padding-block:0 32px}
.vp-stats .stat{background:var(--surface);border:1px solid var(--rule);padding:14px 16px}
.vp-stats .stat b{font-size:44px}
.vp-stats .stat span{color:var(--ink-2)}
.soft-band{background:var(--soft);border-top:1px solid var(--rule)}

/* feed */
.feed-grid{display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.feed-col{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:760px}
.feed-side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
@media (max-width:1000px){.feed-side{position:static}.feed-col{max-width:none}}
.feed-head{display:flex;flex-direction:column;gap:6px}
.feed-controls{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{min-height:46px;padding:0 18px;font:inherit;font-weight:700;font-size:15px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.feed{display:flex;flex-direction:column;gap:16px}
.day{margin:12px 0 0;font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:12px}
.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.post{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column}
.post:hover{border-color:var(--ink)}
.post-head{display:flex;gap:12px;align-items:center;padding:16px 18px 0}
.pname{display:block;font-weight:700;font-size:15px;text-decoration:none;line-height:1.3}
.pmeta{display:block;font-size:13px;color:var(--ink-2);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptime{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.post-body{padding:14px 18px 6px;display:flex;flex-direction:column;gap:10px}
.post-body h3{margin:0;font-family:var(--f-serif);font-size:24px;line-height:1.22;font-weight:600}
.post-body h3 a{text-decoration:none}
.post-body .sum{margin:0;font-size:16px;line-height:1.55}
.ed-note{margin:0;font-size:14px;line-height:1.5;padding:10px 12px;background:var(--soft)}
.ed-note b{color:var(--ocre-text)}
.media{display:flex;gap:12px;align-items:center;padding:12px;background:var(--soft);text-decoration:none;font-size:14px}
.play{width:44px;height:44px;flex:none;border-radius:0;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center}
.post-actions{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:6px 10px 10px;border-top:1px solid var(--soft);margin-top:8px}
.act{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;font:inherit;font-size:14px;font-weight:600;background:transparent;border:0;color:var(--ink-2);cursor:pointer;text-decoration:none}
.act:hover{color:var(--ink);background:var(--soft)}
.act.strong{color:var(--ink);font-weight:700}
.act[aria-pressed="true"]{color:var(--ink)}
.side-box{background:var(--surface);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:4px}
.side-box h2{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.side-box .more{font-weight:700;font-size:14px;margin-top:8px}
.frow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--soft)}
.frow .avatar{width:38px;height:38px;font-size:15px}
.mini{min-height:36px;padding:0 12px;font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.mini[aria-pressed="true"],.act[data-follow][aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.bars a{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 28px;gap:10px;align-items:center;text-decoration:none;font-size:14px;min-height:32px}
.bt{height:8px;background:var(--soft);display:block}
.bt i{display:block;height:100%;background:var(--ink)}
.bn{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.wrow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--soft);text-decoration:none;font-size:14px}
.nl-mini{background:var(--ocre);border-color:var(--ocre);color:var(--ink)}
.nl-mini input{min-height:46px;border:2px solid var(--ink);padding:0 12px;font:inherit;background:var(--surface);color:var(--ink)}
.nl-mini .btn.primary{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;font-weight:700;font-size:14px;z-index:90}
footer.site{border-top:2px solid var(--ink);margin-top:24px}
footer.site .cols{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));padding-block:40px}
footer.site h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
footer.site ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px}
footer.site a{text-decoration:none}
.proto{font-size:13px;line-height:1.5;color:var(--ink-2);padding:10px 12px;border:1px dashed var(--ink-2)}
.notice{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
/* rede: mapa e lista */
.net-stats{padding-block:0 24px}
.netmap-scroll{overflow-x:auto;border:1.5px solid var(--ink);background:var(--surface)}
.netmap{position:relative;min-width:640px}
.netmap svg{display:block;width:100%;height:auto}
.netmap .land{fill:var(--soft);stroke:var(--rule);stroke-width:.4;stroke-linejoin:round}
.netmap .sea{fill:var(--surface);stroke:var(--rule);stroke-width:.4}
.nd{cursor:pointer;outline:none}
.nd .nd-hit{fill:transparent;stroke:none}
.nd circle:not(.nd-hit),.nd rect,.nd path{stroke:var(--paper);stroke-width:.7}
svg.nd circle,svg.nd rect,svg.nd path{stroke-width:1.5}
.nd-rep circle:not(.nd-hit){fill:var(--signal)}
.nd-group rect{fill:var(--ink)}
.nd-partner path{fill:var(--ocre)}
.nd-forming circle:not(.nd-hit),.nd-forming rect,.nd-forming path{fill:var(--paper);stroke:var(--signal)}
.nd:hover circle:not(.nd-hit),.nd:focus-visible circle:not(.nd-hit),.nd:hover rect,.nd:focus-visible rect{stroke:var(--ink);stroke-width:1}
.nd:focus-visible .nd-hit{stroke:var(--focus);stroke-width:.8}
.nd-tip{position:absolute;z-index:5;pointer-events:none;background:var(--paper);border:1.5px solid var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.35;min-width:180px;max-width:260px}
.nd-tip b{font-size:16px}
.map-foot{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-top:12px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.legend li{display:inline-flex;align-items:center;gap:6px}
.net-regions{display:grid;gap:28px 32px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.region-k{margin:0 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.net-list{list-style:none;margin:0;padding:0}
.net-list li{display:flex;flex-direction:column;gap:4px;padding:14px 0;border-bottom:1px solid var(--rule);font-size:15px}
.nl-top{display:flex;gap:12px;align-items:center}
.nl-top b{display:block;font-size:17px}
.nl-top .muted{display:block;font-size:14px}
.node-av{font-family:var(--f-ui);font-weight:700;font-size:13px;letter-spacing:.06em;background:var(--soft);color:var(--ink);border:1px solid var(--rule)}
.np{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:4px}
.np-p{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.np-p .avatar{width:32px;height:32px;font-size:14px;object-fit:cover}
.np-pending{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.partners-band{padding:32px 24px;border:1px solid var(--rule)}
.rhythm{list-style:none;margin:0;padding:0;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.rhythm li{border-top:6px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.rhythm b{font-size:20px}
.rhythm span{color:var(--ink-2);line-height:1.5}
.principles{display:flex;flex-direction:column;gap:12px}
.principles h2{margin:0}
.principles ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;max-width:48em;font-size:16px;line-height:1.55}

/* desenhos de pontos: pessoas como pontos, como no mapa da rede */
.glyph{width:64px;height:40px;flex:none;overflow:visible}
.glyph .g-dot{fill:var(--signal)}
.glyph .g-line{fill:none;stroke:var(--ink);stroke-width:1.5}
.glyph .g-dash{stroke-dasharray:3 3}
.glyph .g-fill{fill:var(--ink)}

/* frentes (home e Como funciona) */
.fronts2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative;padding-block:12px 8px}
.fronts2::before{content:"";position:absolute;left:32px;right:calc(33.33% - 32px);top:32px;border-top:1.5px dashed var(--rule)}
.front2{position:relative;display:flex;flex-direction:column;gap:8px;padding-right:32px}
.front2 .glyph{background:var(--paper);padding-right:8px;box-sizing:content-box}
.front2 h3{margin:6px 0 0;font-family:var(--f-serif);font-size:28px;font-weight:500;line-height:1.1}
.front2 p{margin:0;font-size:16px;line-height:1.5;max-width:28em}
.f-go{font:inherit;font-weight:700;font-size:15px;color:var(--signal-text);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start;min-height:44px}
.pillars-s{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2)}
.pillars-s li::before{content:"";display:inline-block;width:6px;height:6px;background:var(--signal);margin:0 8px 2px 0}
@media (max-width:820px){.fronts2{grid-template-columns:1fr;gap:28px}.fronts2::before{display:none}.front2{padding-right:0}}
.figs{display:flex;flex-wrap:wrap;gap:12px 36px;padding:28px 0 36px;margin:0;list-style:none}
.figs li{display:flex;align-items:baseline;gap:8px}
.figs b{font-family:var(--f-serif);font-weight:500;font-size:40px;line-height:1;color:var(--ocre-text);font-variant-numeric:tabular-nums}
.figs span{font-size:14px;color:var(--ink-2)}
.net-note{margin:16px 0 0;font-size:14px;color:var(--ink-2)}
.about-more{border-top:1px solid var(--rule)}
.about-more:last-of-type{border-bottom:1px solid var(--rule)}
.about-more summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;font-family:var(--f-serif);font-size:26px;font-weight:500}
.about-more summary::-webkit-details-marker{display:none}
.about-more summary::after{content:"+";font-family:var(--f-ui);font-size:24px;color:var(--signal-text)}
.about-more[open] summary::after{content:"−"}
.about-more .prose{padding-bottom:20px}

/* página Materiais */
.kit-cards{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kit-card{display:flex;flex-direction:column;gap:12px;padding:22px;border:1.5px solid var(--ink);background:var(--surface);text-decoration:none;color:var(--ink)}
.kit-card:hover{background:var(--soft);color:var(--ink)}
.kit-card h2{margin:0;font-family:var(--f-serif);font-size:28px;font-weight:500;line-height:1.1}
.kit-card p{margin:0;font-size:16px;line-height:1.5}
.kit-card .ag-bar{height:12px}
.kc-go{margin-top:auto;font-weight:700;color:var(--signal-text);text-decoration:underline;text-underline-offset:3px}
.start{list-style:none;margin:0;padding:0;counter-reset:st;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.start li{counter-increment:st;display:flex;flex-direction:column;gap:8px;font-size:17px;font-weight:600;line-height:1.35;padding-top:12px;border-top:6px solid var(--ink)}
.start li::before{content:counter(st);font-family:var(--f-serif);font-size:40px;font-weight:500;line-height:1;color:var(--ocre-text)}
.rec-empty{display:flex;gap:16px;align-items:center;padding:18px 20px;border:1.5px dashed var(--ink-2);max-width:760px}
.rec-empty p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.rec-list{list-style:none;margin:0;padding:0}
.rec-list li{display:flex;flex-wrap:wrap;gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule)}

/* fatos do kit: tempo, pessoas, formato */
.facts-row{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 24px;font-size:14px;font-weight:600}
.facts-row li{display:inline-flex;align-items:center;gap:8px}
.fi{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:1.6}
.pdots{display:inline-flex;gap:3px;align-items:center}
.pd{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--signal);display:inline-block}
.pd.on{background:var(--signal)}
.pdots b{font-size:12px;color:var(--signal-text)}
.pdots-pair{display:inline-flex;align-items:center;gap:4px}
.pd-link{width:14px;border-top:1.5px dashed var(--ink-2)}

/* página do kit */
.kit{max-width:1000px;display:flex;flex-direction:column;gap:40px;padding-block:20px 32px}
.kit-head{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:24px}
.kh-main{display:flex;flex-direction:column;gap:12px;flex:1 1 460px;min-width:0}
.kh-main .lede{max-width:34em}
.kit h2{margin:0 0 16px;font-family:var(--f-serif);font-size:30px;font-weight:500;line-height:1.15}
.kit h3{margin:0 0 10px;font-size:16px;font-weight:700}
.kit-note{margin:12px 0 0;font-size:14px}
.pstrip{display:flex;flex-direction:column;gap:10px}
.pchips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.pchips li{font-size:13px;font-weight:600;padding:6px 10px;background:var(--soft);border:1px solid var(--rule)}
.pstrip details summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--signal-text);min-height:32px;display:inline-flex;align-items:center}
.pstrip ol{margin:6px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.5;max-width:48em}
.print-only{display:none!important}

/* roteiro */
.ag-bar{display:flex;gap:2px;height:44px}
.ag-b{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.ag-b b{font-size:14px}
.ag-edge{background:var(--soft);color:var(--ink)}
.ag-talk{background:var(--signal);color:var(--signal-ink)}
.ag-watch{background:var(--ocre);color:var(--ink)}
.ag-list{list-style:none;margin:16px 0 0;padding:0}
.ag-list li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--rule)}
.ag-n{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;align-self:center}
.ag-t{display:flex;flex-direction:column;gap:2px}
.ag-t b{font-size:16px}
.ag-t span{font-size:15px;color:var(--ink-2);line-height:1.45}
.ag-m{font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ag-m small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.ag-total{margin:8px 0 0;text-align:right;font-weight:700;font-size:14px}

/* papel do facilitador */
.roles{display:grid;gap:0;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--ink)}
.role{padding:16px 18px;border-left:1px solid var(--rule)}
.role:first-child{border-left:0}
.role h3{font-family:var(--f-serif);font-size:22px;font-weight:500;margin:0 0 10px}
.role ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.4}
.role li{display:flex;gap:10px;align-items:flex-start}
.box{width:14px;height:14px;border:1.5px solid var(--ink);flex:none;margin-top:3px}
@media (max-width:760px){.roles{grid-template-columns:1fr}.role{border-left:0;border-top:1px solid var(--rule)}.role:first-child{border-top:0}}

/* seletor de livro ou filme e perguntas */
.picker{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));margin-bottom:20px}
.pick{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;min-height:64px;font:inherit;cursor:pointer;background:var(--surface);color:var(--ink);border:1.5px solid var(--rule)}
.pick b{font-family:var(--f-serif);font-size:17px;font-weight:600;line-height:1.2}
.pick span{font-size:13px;color:var(--ink-2)}
.pick:hover{border-color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--signal);background:var(--signal);color:var(--signal-ink)}
.pick[aria-pressed="true"] span{color:var(--signal-ink)}
.qpanel{background:var(--soft);border-left:6px solid var(--signal);padding:20px 24px}
.q-for{margin:0;font-size:14px;font-weight:700;color:var(--ink-2)}
.q-title{margin:2px 0 14px!important;font-family:var(--f-serif)!important;font-size:26px!important;font-weight:500!important;line-height:1.15}
.q-title span{display:block;font-family:var(--f-ui);font-size:14px;font-weight:400;color:var(--ink-2);margin-top:4px}
.qs{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:12px}
.qs li{font-family:var(--f-serif);font-size:20px;line-height:1.4;padding-left:4px}
.qs li::marker{font-family:var(--f-ui);font-size:14px;font-weight:700;color:var(--signal-text)}
.where{margin:16px 0 0;font-size:14px}
.where a{font-weight:700;margin-left:6px}
.alt{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.alt .qs li{font-size:17px}
.alt-list{list-style:none;margin:0 0 8px;padding:0}
.alt-list li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--rule);font-size:15px}
.alt-list a{font-weight:700}

/* conversa entre países */
.flow{display:grid;gap:0;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1.5px solid var(--ink)}
.flow-step{display:flex;flex-direction:column;gap:6px;padding:16px 14px 0 0}
.flow-step .glyph{width:56px;height:35px}
.fs-n{font-family:var(--f-serif);font-size:15px;color:var(--ocre-text);font-weight:600}
.flow-step b{font-size:16px}
.flow-step span:last-child{font-size:14px;color:var(--ink-2);line-height:1.45}
@media (max-width:760px){.flow{grid-template-columns:1fr}.flow-step{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--rule)}.flow-step span:last-child{flex-basis:100%}}
.bank-wrap{display:grid;gap:24px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.bank-wrap{grid-template-columns:1fr}}
.bank{display:flex;flex-direction:column;gap:18px}
.bank fieldset{border:0;margin:0;padding:0}
.bank legend{font-weight:700;font-size:15px;padding:0;margin-bottom:6px}
.bq{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--rule);cursor:pointer;font-size:15px;line-height:1.45}
.bq input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--signal);flex:none}
.pauta{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);background:var(--soft);border-left:6px solid var(--signal);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.pauta h3{font-family:var(--f-serif);font-size:22px;font-weight:500;margin:0}
.pauta p{margin:0;font-size:14px}
.pauta .qs li{font-size:17px}
.pauta .btn{align-self:flex-start}

/* registro do encontro, como uma ficha datilografada */
.ficha{border:1.5px solid var(--ink);padding:22px 24px;background:var(--surface)}
.ficha-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ficha h2{margin:0}
.stamp{width:72px;height:72px;border-radius:50%;border:2px solid var(--carimbo);color:var(--carimbo);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:11px;line-height:1.2;transform:rotate(-8deg);flex:none}
.ficha dl{margin:16px 0 18px;display:flex;flex-direction:column}
.rec-row{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:12px;align-items:start;border-bottom:1px solid var(--ink);min-height:48px;padding-top:12px}
.rec-row.tall{min-height:96px}
.rec-row dt{font-family:var(--f-mono);font-size:14px}
.rec-row dd{margin:0}

@media print{
  @page{margin:14mm}
  .strip,header.site,footer.site,.overlay,.toast,.no-print{display:none!important}
  .print-only{display:block!important}
  body{background:#fff;color:#000;font-size:10.5pt}
  body::before{display:none}
  main{animation:none!important}
  .wrap{max-width:none;padding:0}
  .kit{max-width:none;padding:0;gap:16px}
  .kit a{color:#000;text-decoration:none}
  .kit h1{font-size:26pt}
  .kit h2{font-size:15pt;margin-bottom:8px;break-after:avoid}
  .kit-head{padding-bottom:12px}
  .kit .lede{font-size:12pt}
  .pchips li{background:#fff;border-color:#000}
  .pstrip ol{font-size:9.5pt;gap:2px}
  .ag-bar{height:22px;print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .ag-n,.pd.on,.glyph,.qpanel,.pauta,.stamp{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .ag-list li{padding:4px 0}
  .ag-t span{font-size:9.5pt}
  .role{padding:10px 12px}
  .role ul{font-size:10pt;gap:4px}
  .qpanel,.pauta{background:#fff;border-left-color:#000;position:static}

  about_lens_t:"A lente",about_lens:["Há quase vinte anos o mundo perde democracias. Os relatórios do V-Dem e da Freedom House registram esse recuo ano após ano, e hoje já existem mais autocracias do que democracias no planeta. Boa parte dessa virada veio pelas urnas, com populismos autoritários de direita e de esquerda que chegam ao poder pelo voto e depois desmontam, por dentro, as regras que permitiriam tirá-los de lá.", "A perda é grande porque a democracia liberal funciona como uma infraestrutura. Foi sobre ela que se construíram algumas das maiores conquistas da humanidade, como a ampliação das liberdades individuais, a queda da mortalidade infantil, o acesso à educação, a liberdade acadêmica e um longo período com menos guerras entre países. Quando essa infraestrutura se desgasta, os efeitos aparecem depressa. As liberdades encolhem e as guerras voltam, enquanto a política se transforma numa disputa entre inimigos.", "Acompanhar quem pensa com clareza sobre tudo isso também ficou mais difícil. As redes estão tomadas pela desinformação que os dois polos produzem, e os algoritmos premiam o que gera raiva. Encontrar análises sérias, de quem rejeita o autoritarismo venha de onde vier, virou um trabalho que quase ninguém tem tempo de fazer.", "O Global Village nasce desse diagnóstico. Acompanhamos pensadores, economistas, jornalistas e políticos de diversos países, em todos os continentes, reunimos o que eles publicam em textos, vídeos e podcasts e entregamos cada análise com um resumo curto no seu idioma e o link para o original. É para quem quer entender política, geopolítica, economia e tecnologia pela lente da democracia liberal sem depender do algoritmo das redes nem visitar dezenas de sites por dia."],about_cur_t:"A curadoria",about_cur:["A curadoria responde a uma pergunta, quem vale a pena acompanhar. Ela nunca decide o que cada autor diz, e por isso o Global Village mostra vozes que discordam entre si.", "Para entrar, uma pessoa ou organização precisa defender de forma consistente eleições livres, Estado de direito, liberdade de expressão, imprensa independente e direitos individuais, e criticar publicamente os autoritários dos dois campos, inclusive o mais próximo do seu meio. Apoiar ou relativizar um golpe desqualifica.", "Cada nome passa por dois curadores de perfis diferentes, que avaliam sem ver o voto um do outro. Quando eles discordam, um terceiro desempata. As aprovações vencem em doze meses e voltam para nova avaliação. Quem financia o projeto não indica curadores nem participa das decisões.", "Quando uma análise curada lê um país de um jeito que os curadores daquela região consideram equivocado, o resumo continua fiel ao autor e o Global Village acrescenta uma nota do editor com o contexto que falta. A meta é ter um curador para cada região do mundo."],step0_t:"Curadoria",step0:"Um conselho de curadores de diferentes tradições políticas decide quem o Global Village acompanha. Só entram vozes que defendem a democracia liberal e criticam autoritários de qualquer lado.",

  see_where:"See where to watch",society_title:"Society and community",society_text:"Titles outside the political core about community life, place and everyday life.",w_checked:"For now, availability follows the Brazilian JustWatch catalogue, checked on 24 Oct 2026. In the live site it will follow the reader’s country.",
  wg_ww:"World wars and the Holocaust",wg_tot:"Twentieth-century totalitarianism",wg_aut:"Today’s autocracies",wg_rus:"Russia and Ukraine",wg_me:"Middle East",wg_res:"Resistance and democratic transitions",wg_pol:"Politics and institutions",wg_imp:"Press and truth",wg_tec:"Technology and freedoms",wg_eco:"Economy and prosperity",wg_ext:"Extremism and radicalisation",wg_other:"Other topics",

  nl_page_title:"Newsletter",nl_page_text:"Every weekday morning, three to five stories the most relevant analysts discussed the day before, each with a short summary in your language and a link to the original.",nl_lang:"Newsletter language",nl_preview:"Preview of the next issue",nl_edition:"Tomorrow morning’s issue",
  about_title:"How it works",about_lede:"Global Village is an international network of people who want to understand the world through the lens of liberal democracy and strengthen it where they live. Democracy holds or weakens on a global scale, and each country only looks after its own when it understands the reality of others without projecting its own onto them. That is why the network brings together an observatory of analysis in five languages, local groups that meet around shared materials, and regular conversations between people from different countries.",
  step1_t:"Collection",step1:"We automatically monitor the websites, newsletters, video channels and podcasts of every person and organisation in the database.",step2_t:"Classification",step2:"Each new piece is classified by topic, format, origin and language.",step3_t:"Summary and translation",step3:"AI writes a short summary and translates it into the reader’s language. The original text is never reproduced.",step4_t:"Publication",step4:"The piece appears on the site with title, summary and a link to the original, and goes into the next morning’s newsletter.",
  about_lens_t:"The lens",about_lens:["For almost twenty years the world has been losing democracies. The V-Dem and Freedom House reports record this retreat year after year, and there are now more autocracies than democracies on the planet. Much of the shift came through the ballot box, with authoritarian populists of the right and the left who win power by vote and then dismantle, from within, the rules that would let voters remove them.", "The loss is large because liberal democracy works as infrastructure. Some of humanity’s greatest achievements were built on it, such as the expansion of individual freedoms, the fall in child mortality, access to education, academic freedom and a long period with fewer wars between countries. When that infrastructure wears down, the effects show quickly. Freedoms shrink and wars return, while politics turns into a contest between enemies.", "Following those who think clearly about all this has also become harder. Social media is overrun by disinformation produced by both poles, and algorithms reward whatever generates anger. Finding serious analysis from people who reject authoritarianism wherever it comes from has become work almost nobody has time to do.", "Global Village was born from this diagnosis. We follow thinkers, economists, journalists and politicians from many countries on every continent, gather what they publish in texts, videos and podcasts, and deliver each piece with a short summary in your language and a link to the original. It is for people who want to understand politics, geopolitics, economics and technology through the lens of liberal democracy without depending on social media algorithms or visiting dozens of sites a day."],about_cur_t:"Curation",about_cur:["Curation answers one question, whom it is worth following. It never decides what each author says, which is why Global Village shows voices that disagree with one another.", "To be included, a person or organisation must consistently defend free elections, the rule of law, free speech, an independent press and individual rights, and publicly criticise authoritarians in both camps, including the one closest to their own milieu. Supporting or downplaying a coup disqualifies.", "Each name goes to two curators with different profiles, who review it without seeing each other’s vote. When they disagree, a third breaks the tie. Approvals expire after twelve months and come back for review. Funders of the project never nominate curators or take part in decisions.", "When a curated analysis reads a country in a way the curators of that region consider mistaken, the summary stays faithful to the author and Global Village adds an editor’s note with the missing context. The goal is to have a curator for every region of the world."],step0_t:"Curation",step0:"A board of curators from different political traditions decides whom Global Village follows. Only voices that defend liberal democracy and criticise authoritarians on every side are included.",

L.es=Object.assign({},L.en,{wg_ww:"Guerras mundiales y Holocausto",wg_tot:"Totalitarismo en el siglo XX",wg_aut:"Autocracias de hoy",wg_rus:"Rusia y Ucrania",wg_me:"Oriente Medio",wg_res:"Resistencia y transiciones democráticas",wg_pol:"Política e instituciones",wg_imp:"Prensa y verdad",wg_tec:"Tecnología y libertades",wg_eco:"Economía y prosperidad",wg_ext:"Extremismo y radicalización",about_lede:"Global Village es una red internacional de personas que quieren entender el mundo desde la democracia liberal y fortalecerla donde viven. La democracia se sostiene o se debilita a escala global, y cada país solo cuida bien la suya cuando entiende la realidad de los demás sin proyectar en ellos la propia. Por eso la red reúne un observatorio de análisis en cinco idiomas, grupos locales que se encuentran con materiales comunes y conversaciones frecuentes entre personas de países distintos.",step0_t:"Curaduría",step0:"Un consejo de curadores de distintas tradiciones políticas decide a quién sigue Global Village. Solo entran voces que defienden la democracia liberal y critican a los autoritarios de cualquier lado.",step1_t:"Recopilación",step1:"Seguimos de forma automática los sitios, newsletters, canales de video y podcasts de cada persona y organización de la base.",step2_t:"Clasificación",step2:"Cada publicación nueva se clasifica por tema, formato, origen e idioma.",step3_t:"Resumen y traducción",step3:"Una IA escribe un resumen breve y lo traduce al idioma del lector. El texto original nunca se reproduce.",step4_t:"Publicación",step4:"El análisis aparece en el sitio con título, resumen y enlace al original, y entra en la newsletter de la mañana siguiente.",about_lens_t:"La lente",about_lens:["Desde hace casi veinte años el mundo pierde democracias. Los informes de V-Dem y de Freedom House registran ese retroceso año tras año, y hoy ya hay más autocracias que democracias en el planeta. Buena parte de ese giro llegó por las urnas, con populismos autoritarios de derecha y de izquierda que llegan al poder por el voto y después desmontan, desde dentro, las reglas que permitirían sacarlos.", "La pérdida es grande porque la democracia liberal funciona como una infraestructura. Sobre ella se construyeron algunas de las mayores conquistas de la humanidad, como la ampliación de las libertades individuales, la caída de la mortalidad infantil, el acceso a la educación, la libertad académica y un largo período con menos guerras entre países. Cuando esa infraestructura se desgasta, los efectos aparecen rápido. Las libertades se reducen y las guerras vuelven, mientras la política se convierte en una disputa entre enemigos.", "Seguir a quienes piensan con claridad sobre todo esto también se volvió más difícil. Las redes están tomadas por la desinformación que producen los dos polos, y los algoritmos premian lo que genera rabia. Encontrar análisis serios, de quienes rechazan el autoritarismo venga de donde venga, se convirtió en un trabajo que casi nadie tiene tiempo de hacer.", "Global Village nace de este diagnóstico. Seguimos a pensadores, economistas, periodistas y políticos de muchos países, en todos los continentes, reunimos lo que publican en textos, videos y podcasts y entregamos cada análisis con un resumen breve en tu idioma y el enlace al original. Es para quien quiere entender la política, la geopolítica, la economía y la tecnología con la lente de la democracia liberal sin depender del algoritmo de las redes ni visitar decenas de sitios al día."],about_cur_t:"La curaduría",about_cur:["La curaduría responde a una pregunta, a quién vale la pena seguir. Nunca decide lo que dice cada autor, y por eso Global Village muestra voces que discrepan entre sí.", "Para entrar, una persona u organización debe defender de forma constante las elecciones libres, el Estado de derecho, la libertad de expresión, la prensa independiente y los derechos individuales, y criticar públicamente a los autoritarios de los dos campos, incluido el más cercano a su entorno. Apoyar o relativizar un golpe descalifica.", "Cada nombre pasa por dos curadores de perfiles distintos, que evalúan sin ver el voto del otro. Cuando no coinciden, un tercero desempata. Las aprobaciones vencen a los doce meses y vuelven a evaluarse. Quien financia el proyecto no designa curadores ni participa en las decisiones.", "Cuando un análisis seleccionado lee un país de una forma que los curadores de esa región consideran equivocada, el resumen sigue fiel al autor y Global Village añade una nota del editor con el contexto que falta. La meta es tener un curador para cada región del mundo."],about_rights_t:"Derechos y muros de pago",about_rights:"Mostramos solo el título, un resumen propio y el enlace al original. Los contenidos exclusivos para suscriptores aparecen solo con título y enlace, sin resumen.",about_lang_t:"Idiomas",proto:"Prototipo. Los títulos, autores, fechas y enlaces son reales y se recopilaron en octubre de 2026. Los resúmenes se escribieron como demostración.",k1_doc:"Documental",k1_series:"Serie",k1_film:"Película",orgs_text:"Índices, think tanks, organizaciones de derechos, redacciones independientes y publicaciones que sostienen el debate sobre la democracia liberal.",ot_pub:"Publicaciones",ot_media:"Periodismo independiente",ot_net:"Derechos y sociedad civil",in_exile:"en el exilio",region_asia:"Asia y Pacífico",region_mena:"Oriente Medio",region_afr:"África",region_eu:"Europa",region_na:"América del Norte",region_latam:"América Latina",w_checked:"Por ahora la disponibilidad sigue el catálogo brasileño de JustWatch, consultado el 24/10/2026. En el sitio final seguirá el país del lector.",about_lang:"La interfaz está en inglés, portugués, español, francés e italiano. Los resúmenes se generan en el idioma del lector y el original está a un clic.",thd_geo:"Relaciones internacionales, guerras y bloques de poder en América Latina, América del Norte, Europa, Rusia, África, Oriente Medio y Asia.",see_all_orgs:"Ver todas las organizaciones",pubs_side:"Publicaciones independientes",watch_text:"Películas, series y documentales que ayudan a entender el autoritarismo, la guerra y la construcción de las democracias, con indicación de dónde verlos.",vp_p2:"Cada pieza recibe un resumen breve en inglés, portugués, español, francés o italiano.",vp_p1:"Elegimos a quién seguir por su compromiso con las elecciones libres, el Estado de derecho y la libertad de expresión, y por su crítica a los autoritarios de todos los signos. Cada voz habla por sí misma.",vp_lede:"Global Village es una red internacional de personas que quieren entender el mundo desde la democracia liberal y fortalecerla donde viven.",tab_all:"Todo",tab_following:"Siguiendo",tab_saved:"Guardados",new:"Nuevo",save:"Guardar",saved:"Guardado",copy_link:"Copiar enlace",copied:"Enlace copiado",follow_short:"Seguir",following:"Siguiendo",load_more:"Cargar más",b_today:"Hoy",b_yesterday:"Ayer",b_week:"Esta semana",b_lastweek:"La semana pasada",b_earlier:"Antes",who_follow:"A quién seguir",month_topics:"Temas del mes",vp_kicker:"Qué es Global Village",vp_title:"Una red para entender y fortalecer la democracia liberal",vp_cta_feed:"Ver el feed",vp_cta_nl:"Recibir el boletín",locale:"es-ES",tagline:"Una red internacional para entender y fortalecer la democracia liberal",nav_home:"Inicio",nav_analyses:"Análisis",nav_analysts:"Analistas",nav_topics:"Temas",nav_watch:"Ver",nav_orgs:"Organizaciones",nav_newsletter:"Boletín",nav_about:"Cómo funciona",search:"Buscar",search_ph:"Buscar analista, análisis o título",close:"Cerrar",featured:"Destacado",radar:"En el radar",latest:"Lo más reciente",see_all_analyses:"Ver todos los análisis",all:"Todos",all_f:"Todas",original_in:"original en",summary_label:"Resumen automático",listen:"Escuchar el original",read:"Leer el original",watchv:"Ver el original",more_from:"Más de",paywall:"Contenido exclusivo para suscriptores. Mostramos título y enlace, sin resumen.",content_note:"En este prototipo los resúmenes aparecen en in L.fr=Object.assign({},L.en,{wg_ww:"Guerres mondiales et Shoah",wg_tot:"Totalitarisme au XXe siècle",wg_aut:"Autocraties d’aujourd’hui",wg_rus:"Russie et Ukraine",wg_me:"Moyen-Orient",wg_res:"Résistance et transitions démocratiques",wg_pol:"Politique et institutions",wg_imp:"Presse et vérité",wg_tec:"Technologie et libertés",wg_eco:"Économie et prospérité",wg_ext:"Extrémisme et radicalisation",about_lede:"Global Village est un réseau international de personnes qui veulent comprendre le monde à travers la démocratie libérale et la renforcer là où elles vivent. La démocratie tient ou s’affaiblit à l’échelle mondiale, et chaque pays ne prend bien soin de la sienne que s’il comprend la réalité des autres sans y projeter la sienne. C’est pourquoi le réseau réunit un observatoire d’analyses en cinq langues, des groupes locaux qui se retrouvent autour de supports communs et des conversations régulières entre personnes de pays différents.",step0_t:"Curation",step0:"Un conseil de curateurs issus de différentes traditions politiques décide qui Global Village suit. Seules entrent les voix qui défendent la démocratie libérale et critiquent les autoritaires de tous bords.",step1_t:"Collecte",step1:"Nous suivons automatiquement les sites, newsletters, chaînes vidéo et podcasts de chaque personne et organisation de la base.",step2_t:"Classement",step2:"Chaque nouvelle publication est classée par thème, format, origine et langue.",step3_t:"Résumé et traduction",step3:"Une IA rédige un court résumé et le traduit dans la langue du lecteur. Le texte original n’est jamais reproduit.",step4_t:"Publication",step4:"L’analyse apparaît sur le site avec son titre, son résumé et le lien vers l’original, et entre dans la newsletter du lendemain matin.",about_lens_t:"Notre regard",about_lens:["Depuis près de vingt ans, le monde perd des démocraties. Les rapports de V-Dem et de Freedom House enregistrent ce recul année après année, et l’on compte aujourd’hui plus d’autocraties que de démocraties sur la planète. Une bonne partie de ce basculement est passée par les urnes, avec des populismes autoritaires de droite et de gauche qui arrivent au pouvoir par le vote puis démontent, de l’intérieur, les règles qui permettraient de les en écarter.", "La perte est grande parce que la démocratie libérale fonctionne comme une infrastructure. Certaines des plus grandes conquêtes de l’humanité se sont construites sur elle, comme l’élargissement des libertés individuelles, la baisse de la mortalité infantile, l’accès à l’éducation, la liberté académique et une longue période avec moins de guerres entre pays. Quand cette infrastructure s’use, les effets apparaissent vite. Les libertés reculent et les guerres reviennent, tandis que la politique devient un affrontement entre ennemis.", "Suivre ceux qui pensent clairement tout cela est aussi devenu plus difficile. Les réseaux sont envahis par la désinformation que produisent les deux pôles, et les algorithmes récompensent ce qui suscite la colère. Trouver des analyses sérieuses, de personnes qui rejettent l’autoritarisme d’où qu’il vienne, est devenu un travail que presque personne n’a le temps de faire.", "Global Village est né de ce constat. Nous suivons des penseurs, économistes, journalistes et responsables politiques de nombreux pays, sur tous les continents, nous rassemblons ce qu’ils publient en textes, vidéos et podcasts et nous livrons chaque analyse avec un court résumé dans votre langue et le lien vers l’original. C’est pour celles et ceux qui veulent comprendre la politique, la géopolitique, l’économie et la technologie à travers la démocratie libérale, sans dépendre de l’algorithme des réseaux ni visiter des dizaines de sites par jour."],about_cur_t:"La curation",about_cur:["La curation répond à une question, qui mérite d’être suivi. Elle ne décide jamais de ce que dit chaque auteur, et c’est pourquoi Global Village montre des voix qui ne sont pas d’accord entre elles.", "Pour entrer, une personne ou une organisation doit défendre de façon constante les élections libres, l’État de droit, la liberté d’expression, une presse indépendante et les droits individuels, et critiquer publiquement les autoritaires des deux camps, y compris celui qui est le plus proche de son milieu. Soutenir ou minimiser un coup d’État disqualifie.", "Chaque nom passe par deux curateurs aux profils différents, qui évaluent sans voir le vote de l’autre. En cas de désaccord, un troisième tranche. Les approbations expirent au bout de douze mois et sont réexaminées. Les financeurs du projet ne désignent pas de curateurs et ne participent pas aux décisions.", "Quand une analyse retenue lit un pays d’une manière que les curateurs de cette région jugent erronée, le résumé reste fidèle à l’auteur et Global Village ajoute une note de la rédaction avec le contexte qui manque. L’objectif est d’avoir un curateur pour chaque région du monde."],about_rights_t:"Droits et accès payant",about_rights:"Nous affichons seulement le titre, un résumé original et le lien vers la source. Les contenus réservés aux abonnés apparaissent avec le titre et le lien uniquement, sans résumé.",about_lang_t:"Langues",proto:"Prototype. Les titres, auteurs, dates et liens sont réels et ont été collectés en octobre 2026. Les résumés ont été rédigés pour la démonstration.",k1_doc:"Documentaire",k1_series:"Série",k1_film:"Film",orgs_text:"Indices, think tanks, organisations de défense des droits, rédactions indépendantes et publications qui nourrissent le débat sur la démocratie libérale.",ot_pub:"Publications",ot_media:"Journalisme indépendant",ot_net:"Droits et société civile",in_exile:"en exil",region_asia:"Asie-Pacifique",region_mena:"Moyen-Orient",region_afr:"Afrique",region_eu:"Europe",region_na:"Amérique du Nord",region_latam:"Amérique latine",w_checked:"Pour l’instant, la disponibilité suit le catalogue brésilien de JustWatch, consulté le 24/10/2026. Sur le site final, elle suivra le pays du lecteur.",about_lang:"L’interface est disponible en anglais, portugais, espagnol, français et italien. Les résumés sont générés dans la langue du lecteur, et l’original est à un clic.",thd_geo:"Relations internationales, guerres et blocs de puissance en Amérique latine, en Amérique du Nord, en Europe, en Russie, en Afrique, au Moyen-Orient et en Asie.",see_all_orgs:"Voir toutes les organisations",pubs_side:"Publications indépendantes",watch_text:"Films, séries et documentaires qui aident à comprendre l’autoritarisme, la guerre et la construction des démocraties, avec où les regarder.",vp_p2:"Chaque contribution reçoit un court résumé en anglais, portugais, espagnol, français ou italien.",vp_p1:"Nous choisissons qui suivre selon leur attachement aux élections libres, à l’État de droit et à la liberté d’expression, et selon leur critique des autoritaires de tous bords. Chaque voix parle pour elle-même.",vp_lede:"Global Village est un réseau international de personnes qui veulent comprendre le monde à travers la démocratie libérale et la renforcer là où elles vivent.",tab_all:"Tout",tab_following:"Abonnements",tab_saved:"Enregistrés",new:"Nouveau",save:"Enregistrer",saved:"Enregistré",copy_link:"Copier le lien",copied:"Lien copié",follow_short:"Suivre",following:"Suivi",load_more:"Charger plus",b_today:"Aujourd’hui",b_yesterday:"Hier",b_week:"Cette semaine",b_lastweek:"La semaine dernière",b_earlier:"Plus tôt",who_follow:"Qui suivre",month_topics:"Thèmes du mois",vp_kicker:"Ce qu’est Global Village",vp_title:"Un réseau pour comprendre et renforcer la démocratie libérale",vp_cta_feed:"Voir le fil",vp_cta_nl:"Recevoir la newsletter",locale:"fr-FR",tagline:"Un réseau international pour comprendre et renforcer la démocratie libérale",nav_home:"Accueil",nav_analyses:"Analyses",nav_analysts:"Analystes",nav_topics:"Thèmes",nav_watch:"À voir",nav_orgs:"Organisations",nav_newsletter:"Newsletter",nav_about:"Comment ça marche",search:"Rechercher",search_ph:"Rechercher un analyste, une analyse ou un titre",close:"Fermer L.it=Object.assign({},L.en,{wg_ww:"Guerre mondiali e Olocausto",wg_tot:"Totalitarismo nel Novecento",wg_aut:"Autocrazie di oggi",wg_rus:"Russia e Ucraina",wg_me:"Medio Oriente",wg_res:"Resistenza e transizioni democratiche",wg_pol:"Politica e istituzioni",wg_imp:"Stampa e verità",wg_tec:"Tecnologia e libertà",wg_eco:"Economia e prosperità",wg_ext:"Estremismo e radicalizzazione",about_lede:"Global Village è una rete internazionale di persone che vogliono capire il mondo attraverso la democrazia liberale e rafforzarla dove vivono. La democrazia regge o si indebolisce su scala globale, e ogni paese si prende davvero cura della propria solo quando capisce la realtà degli altri senza proiettarvi la sua. Per questo la rete riunisce un osservatorio di analisi in cinque lingue, gruppi locali che si incontrano con materiali comuni e conversazioni frequenti tra persone di paesi diversi.",step0_t:"Curatela",step0:"Un consiglio di curatori di diverse tradizioni politiche decide chi Global Village segue. Entrano solo voci che difendono la democrazia liberale e criticano gli autoritari di ogni schieramento.",step1_t:"Raccolta",step1:"Seguiamo in modo automatico siti, newsletter, canali video e podcast di ogni persona e organizzazione della base.",step2_t:"Classificazione",step2:"Ogni nuova pubblicazione viene classificata per tema, formato, origine e lingua.",step3_t:"Riassunto e traduzione",step3:"Un’IA scrive un breve riassunto e lo traduce nella lingua di chi legge. Il testo originale non viene mai riprodotto.",step4_t:"Pubblicazione",step4:"L’analisi compare sul sito con titolo, riassunto e link all’originale, ed entra nella newsletter della mattina dopo.",about_lens_t:"La lente",about_lens:["Da quasi vent’anni il mondo perde democrazie. I rapporti di V-Dem e di Freedom House registrano questo arretramento anno dopo anno, e oggi nel mondo ci sono più autocrazie che democrazie. Buona parte di questa svolta è passata dalle urne, con populismi autoritari di destra e di sinistra che arrivano al potere con il voto e poi smontano, dall’interno, le regole che permetterebbero di mandarli via.", "La perdita è grande perché la democrazia liberale funziona come un’infrastruttura. Su di essa sono state costruite alcune delle più grandi conquiste dell’umanità, come l’ampliamento delle libertà individuali, il calo della mortalità infantile, l’accesso all’istruzione, la libertà accademica e un lungo periodo con meno guerre tra Paesi. Quando questa infrastruttura si logora, gli effetti si vedono in fretta. Le libertà si restringono e le guerre tornano, mentre la politica diventa uno scontro tra nemici.", "Seguire chi ragiona con lucidità su tutto questo è diventato anche più difficile. I social sono invasi dalla disinformazione prodotta dai due poli, e gli algoritmi premiano ciò che genera rabbia. Trovare analisi serie, di chi rifiuta l’autoritarismo da qualunque parte arrivi, è diventato un lavoro che quasi nessuno ha il tempo di fare.", "Global Village nasce da questa diagnosi. Seguiamo pensatori, economisti, giornalisti e politici di molti Paesi, in tutti i continenti, raccogliamo ciò che pubblicano in testi, video e podcast e offriamo ogni analisi con un breve riassunto nella tua lingua e il link all’originale. È per chi vuole capire politica, geopolitica, economia e tecnologia attraverso la lente della democrazia liberale senza dipendere dall’algoritmo dei social né visitare decine di siti al giorno."],about_cur_t:"La curatela",about_cur:["La curatela risponde a una domanda, chi vale la pena seguire. Non decide mai ciò che dice ciascun autore, ed è per questo che Global Village mostra voci in disaccordo tra loro.", "Per entrare, una persona o un’organizzazione deve difendere con coerenza elezioni libere, Stato di diritto, libertà di espressione, stampa indipendente e diritti individuali, e criticare pubblicamente gli autoritari di entrambi i campi, compreso quello più vicino al proprio ambiente. Sostenere o minimizzare un colpo di Stato squalifica.", "Ogni nome passa da due curatori con profili diversi, che valutano senza vedere il voto dell’altro. Quando non sono d’accordo, un terzo decide. Le approvazioni scadono dopo dodici mesi e tornano in valutazione. Chi finanzia il progetto non nomina curatori né partecipa alle decisioni.", "Quando un’analisi selezionata legge un Paese in un modo che i curatori di quella regione considerano sbagliato, il riassunto resta fedele all’autore e Global Village aggiunge una nota della redazione con il contesto che manca. L’obiettivo è avere un curatore per ogni regione del mondo."],about_rights_t:"Diritti e paywall",about_rights:"Mostriamo solo il titolo, un nostro riassunto e il link all’originale. I contenuti riservati agli abbonati compaiono solo con titolo e link, senza riassunto.",about_lang_t:"Lingue",proto:"Prototipo. Titoli, autori, date e link sono reali e sono stati raccolti nell’ottobre 2026. I riassunti sono stati scritti a scopo dimostrativo.",k1_doc:"Documentario",k1_series:"Serie",k1_film:"Film",orgs_text:"Indici, think tank, organizzazioni per i diritti, redazioni indipendenti e pubblicazioni che alimentano il dibattito sulla democrazia liberale.",ot_pub:"Pubblicazioni",ot_media:"Giornalismo indipendente",ot_net:"Diritti e società civile",in_exile:"in esilio",region_asia:"Asia e Pacifico",region_mena:"Medio Oriente",region_afr:"Africa",region_eu:"Europa",region_na:"Nord America",region_latam:"America Latina",w_checked:"Per ora la disponibilità segue il catalogo brasiliano di JustWatch, consultato il 24/10/2026. Nel sito definitivo seguirà il paese di chi legge.",about_lang:"L’interfaccia è in inglese, portoghese, spagnolo, francese e italiano. I riassunti sono generati nella lingua di chi legge e l’originale è a un clic.",thd_geo:"Relazioni internazionali, guerre e blocchi di potere in America Latina, Nord America, Europa, Russia, Africa, Medio Oriente e Asia.",see_all_orgs:"Vedi tutte le organizzazioni",pubs_side:"Pubblicazioni indipendenti",watch_text:"Fil  {id:"liberalism-discontents",title:"Liberalism and Its Discontents",by:"Francis Fukuyama",year:"2022",q:{

  en:["Fukuyama identifies critiques of liberalism from the right and from the left. Which carry most weight in your country?","Which excesses of liberalism itself does the author acknowledge?","What does he mean by defending moderation as a liberal virtue?","Which argument from the book would you use with someone disillusioned with democracy?"],
  es:["Fukuyama identifica críticas al liberalismo que vienen de la derecha y de la izquierda. ¿Cuáles tienen más fuerza en su país?", "¿Qué excesos del propio liberalismo reconoce el autor?", "¿Qué quiere decir cuando defiende la moderación como virtud liberal?", "¿Qué argumento del libro usarían en una conversación con alguien desilusionado con la democracia?"],
  fr:["Fukuyama relève des critiques du libéralisme venues de la droite et de la gauche. Lesquelles pèsent le plus dans votre pays ?", "Quels excès du libéralisme lui-même l’auteur reconnaît-il ?", "Que veut-il dire en défendant la modération comme vertu libérale ?", "Quel argument du livre utiliseriez-vous face à quelqu’un de déçu par la démocratie ?"],
  it:["Fukuyama individua critiche al liberalismo che vengono da destra e da sinistra. Quali hanno più forza nel vostro paese?", "Quali eccessi del liberalismo stesso riconosce l’autore?", "Che cosa intende quando difende la moderazione come virtù liberale?", "Quale argomento del libro usereste con qualcuno deluso dalla democrazia?"]}},
 {id:"people-vs-democracy",title:"The People vs. Democracy",by:"Yascha Mounk",year:"2018",q:{
  pt:["Mounk separa a democracia iliberal do liberalismo antidemocrático. Que exemplos de cada um vocês conhecem?","Entre as causas que ele aponta, como a renda estagnada, as redes sociais e a ansiedade com a identidade, qual pesa mais onde vocês vivem?","Segundo os dados do livro, os jovens confiam menos na democracia. Isso aparece entre as pessoas que vocês conhecem?","Que proposta do autor vocês testariam primeiro?"],
  en:["Mounk separates illiberal democracy from undemocratic liberalism. Which examples of each do you know?","Among the causes he names, such as stagnant incomes, social media and anxiety about identity, which weighs most where you live?","According to the book’s data, young people trust democracy less. Do you see that among people you know?","Which of the author’s proposals would you try first?"],
  es:["Mounk separa la democracia iliberal del liberalismo antidemocrático. ¿Qué ejemplos de cada uno conocen?", "Entre las causas que señala, como los ingresos estancados, las redes sociales y la ansiedad por la identidad, ¿cuál pesa más donde viven?", "Según los datos del libro, los jóvenes confían menos en la democracia. ¿Lo ven entre las personas que conocen?", "¿Qué propuesta del autor probarían primero?"],
  fr:["Mounk distingue la démocratie illibérale du libéralisme antidémocratique. Quels exemples de chacun connaissez-vous ?", "Parmi les causes qu’il cite, comme la stagnation des revenus, les réseaux sociaux et l’inquiétude identitaire, laquelle pèse le plus là où vous vivez ?", "Selon les données du livre, les jeunes font moins confiance à la démocratie. Le voyez-vous autour de vous ?", "Quelle proposition de l’auteur essaieriez-vous en premier ?"],
  it:["Mounk separa la democrazia illiberale dal liberalismo antidemocratico. Quali esempi di ciascuno conoscete?", "Tra le cause che indica, come i redditi fermi, i social network e l’ansia per l’identità, quale pesa di più dove vivete?", "Secondo i dati del libro, i giovani si fidano meno della democrazia. Lo vedete tra le persone che conoscete?", "Quale proposta dell’autore provereste per prima?"]}},
 {id:"revenge-of-power",title:"The Revenge of Power",by:"Moisés Naím",year:"2022",q:{
  pt:["Naím fala em populismo, polarização e pós-verdade. Como os três aparecem juntos num caso que vocês conhecem?","O que é um autocrata furtivo, e como reconhecê-lo?","Por que, para o autor, a pós-verdade ajuda quem quer concentrar poder?","Que antídotos o livro propõe, e quais dependem de pessoas comuns?"],
  en:["Naím speaks of populism, polarisation and post-truth. How do the three appear together in a case you know?","What is a stealth autocrat, and how do you recognise one?","Why, for the author, does post-truth help those who want to concentrate power?","Which remedies does the book propose, and which depend on ordinary people?"],
  es:["Naím habla de populismo, polarización y posverdad. ¿Cómo aparecen juntos en un caso que conozcan?", "¿Qué es un autócrata sigiloso y cómo reconocerlo?", "¿Por qué, para el autor, la posverdad ayuda a quien quiere concentrar poder?", "¿Qué antídotos propone el libro, y cuáles dependen de la gente común?"],
  fr:["Naím parle de populisme, de polarisation et de post-vérité. Comment les trois apparaissent-ils ensemble dans un cas que vous connaissez ?", "Qu’est-ce qu’un autocrate furtif, et comment le reconnaître ?", "Pourquoi, selon l’auteur, la post-vérité aide-t-elle ceux qui veulent concentrer le pouvoir ?", "Quels remèdes le livre propose-t-il, et lesquels dépendent des citoyens ordinaires ?"],
  it:["Naím parla di populismo, polarizzazione e post-verità. Come compaiono insieme in un caso che conoscete?", "Che cos’è un autocrate furtivo, e come riconoscerlo?", "Perché, per l’autore, la post-verità aiuta chi vuole concentrare il potere?", "Quali antidoti propone il libro, e quali dipendono dalle persone comuni?"]}}
];

function relDay(d){
  const p=d.split("-").map(Number);const dt=Date.UTC(p[0],p[1]-1,p[2]||15);

}
function bucket(i){

}
function ago(i){

function glyph(kind){
  const dot=(x,y,r)=>'<circle cx="'+x+'" cy="'+y+'" r="'+(r||3.2)+'" class="g-dot"/>';
  let b="";
  if(kind==="obs")b='<circle cx="32" cy="20" r="15" class="g-line"/>'+dot(26,16)+dot(37,15)+dot(30,26)+dot(39,24,2.4);
  if(kind==="grp"){b='<circle cx="32" cy="20" r="6" class="g-line"/>';for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/2;b+=dot((32+14*Math.cos(a)).toFixed(1),(20+14*Math.sin(a)).toFixed(1))}}
  if(kind==="conv")b='<path d="M17 20H47" class="g-line g-dash"/>'+dot(8,14)+dot(14,22)+dot(6,27)+dot(56,14)+dot(50,22)+dot(58,27);
  if(kind==="propose")b=dot(10,20)+'<path d="M17 20H45M39 14l6 6-6 6" class="g-line"/>'+'<circle cx="54" cy="20" r="3.2" class="g-line"/>';
  if(kind==="list")b='<path d="M20 9h26M20 17h26M20 25h26M20 33h16" class="g-line"/>'+dot(14,9,2)+dot(14,17,2)+dot(14,25,2)+dot(14,33,2);
  if(kind==="invite")b=dot(10,14)+dot(16,22)+'<circle cx="8" cy="28" r="3.2" class="g-line"/>'+dot(54,14)+dot(48,22)+'<circle cx="56" cy="28" r="3.2" class="g-line"/>';
  if(kind==="share")b='<rect x="16" y="8" width="32" height="24" class="g-line"/><path d="M28 14v12l10-6z" class="g-fill"/>';
  return '<svg class="glyph" viewBox="0 0 64 40" aria-hidden="true">'+b+'</svg>';
}
