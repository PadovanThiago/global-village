<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; background: #141414; overflow: hidden; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; }
  /* Recorta só o V do logo (o V ocupa ~25% da largura do arquivo) */
  .v { width: 520px; height: 720px; overflow: hidden; position: relative; }
  .v img { position: absolute; height: 720px; left: -14px; top: 0; }
  .bar { width: 520px; height: 40px; background: #FF5A36; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="v"><img src="../../../villa-white.png" alt=""></div>
    <div class="bar"></div>
  </div>
</body>
</html>
