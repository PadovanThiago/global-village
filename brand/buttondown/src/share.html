<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #F7F6F2; color: #141414; overflow: hidden; }
  .page { position: absolute; inset: 0; padding: 64px 72px 0; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #141414; padding-bottom: 24px; }
  .top img { height: 72px; display: block; }
  .kicker { font: 700 22px/1 Archivo, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #B8361A; }
  h1 { font: 400 112px/1 Anton, sans-serif; text-transform: uppercase; margin: 44px 0 0; letter-spacing: .005em; }
  p { font: 400 30px/1.35 "Source Serif 4", serif; margin: 26px 0 0; max-width: 960px; color: #2b2a27; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #FF5A36; }
</style>
</head>
<body>
  <div class="page">
    <div class="top">
      <img src="../../../villa-black.png" alt="Villa">
      <span class="kicker">Newsletter · Every Friday</span>
    </div>
    <h1>The week in one read</h1>
    <p>The most relevant analysis on democracy, geopolitics, the economy and technology, summarised in English or Portuguese.</p>
  </div>
  <div class="band"></div>
</body>
</html>
