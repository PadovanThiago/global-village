<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@700&display=block">
<style>
  /* Arte quadrada das seções do Global Village no Substack do Projeto Villa, 1024 × 1024.
     O rótulo vem da URL: secao.html?rotulo=Diário  ou  secao.html?rotulo=Daily */
  html, body { margin: 0; width: 1024px; height: 1024px; background: #14213D; color: #F5F2EA; overflow: hidden; }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
  svg { width: 440px; height: 440px; }
  h1 { font: 600 128px/1 Fraunces, Georgia, serif; font-variation-settings: "opsz" 144; letter-spacing: -.02em; margin: 56px 0 0; }
  .label { margin-top: 36px; padding-top: 28px; border-top: 6px solid #C4411F; font: 700 52px/1 Inter, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #E8A08A; padding-left: .22em; }
</style>
</head>
<body>
  <div class="page">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#F5F2EA" stroke-width="7"/>
      <ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke="#F5F2EA" stroke-width="7"/>
      <line x1="8" y1="60" x2="112" y2="60" stroke="#F5F2EA" stroke-width="7"/>
      <circle cx="60" cy="60" r="13" fill="#C4411F" stroke="#14213D" stroke-width="5"/>
    </svg>
    <h1>Global Village</h1>
    <div class="label" id="label"></div>
  </div>
<script>document.getElementById("label").textContent = new URLSearchParams(location.search).get("rotulo") || "";</script>
</body>
</html>
