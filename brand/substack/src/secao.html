<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Arte quadrada das seções do Global Village no Substack do Projeto Villa, 1024 × 1024. Segue o verso do baralho do Villa:
     verde-veneziana com o monograma em sobre-verde. O rótulo vem da URL: secao.html?rotulo=Diário  ou  secao.html?rotulo=Daily */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Archivo"; src: url("../../../fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1024px; height: 1024px; background: #415E3A; color: #F3EBDD; overflow: hidden; }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  svg { height: 380px; width: auto; fill: #F3EBDD; }
  h1 { font: 500 124px/1 Newsreader, Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -2.5px; margin: 64px 0 0; }
  .label { margin-top: 40px; font: 700 44px/1 Archivo, sans-serif; letter-spacing: 9px; text-transform: uppercase; padding-left: 9px; }
</style>
</head>
<body>
  <div class="page">
    <svg viewBox="-6 -6 100 112" aria-hidden="true"><polygon points="35,0 53,0 88,100 70,100 44,24 18,100 0,100"/><circle cx="44" cy="61" r="8"/><polygon points="41.0,64.2 47.0,64.2 50.5,88 37.5,88"/></svg>
    <h1>Global Village</h1>
    <div class="label" id="label"></div>
  </div>
<script>document.getElementById("label").textContent = new URLSearchParams(location.search).get("rotulo") || "";</script>
</body>
</html>
