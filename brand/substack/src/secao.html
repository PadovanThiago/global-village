<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Arte quadrada das seções do Global Village no Substack do Projeto Villa, 1024 × 1024, sobre verde-veneziana como o favicon do Villa.
     O rótulo vem da URL: secao.html?rotulo=Diário  ou  secao.html?rotulo=Daily */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Archivo"; src: url("../../../fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1024px; height: 1024px; background: #415E3A; color: #F3EBDD; overflow: hidden; }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; }
  svg { width: 440px; height: 440px; }
  h1 { font: 500 128px/1 Newsreader, Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -.01em; margin: 56px 0 0; }
  .label { margin-top: 36px; padding-top: 28px; border-top: 6px solid #C19440; font: 700 52px/1 Archivo, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #F3EBDD; padding-left: .22em; }
</style>
</head>
<body>
  <div class="page">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#F3EBDD" stroke-width="7"/>
      <ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke="#F3EBDD" stroke-width="7"/>
      <line x1="8" y1="60" x2="112" y2="60" stroke="#F3EBDD" stroke-width="7"/>
      <circle cx="60" cy="60" r="13" fill="#C19440" stroke="#415E3A" stroke-width="5"/>
    </svg>
    <h1>Global Village</h1>
    <div class="label" id="label"></div>
  </div>
<script>document.getElementById("label").textContent = new URLSearchParams(location.search).get("rotulo") || "";</script>
</body>
</html>
