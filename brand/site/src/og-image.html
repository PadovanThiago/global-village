<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #F5F2EA; color: #14213D; overflow: hidden; }
  .page { position: absolute; inset: 0; padding: 60px 72px 0; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid #14213D; padding-bottom: 22px; }
  .top img { height: 64px; display: block; }
  .kicker { font: 700 20px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #A3361A; }
  h1 { font: 600 76px/1.02 Fraunces, Georgia, serif; font-variation-settings: "opsz" 144; letter-spacing: -.02em; margin: 40px 0 0; max-width: 1000px; }
  p { font: 400 28px/1.4 "Source Serif 4", serif; margin: 24px 0 0; max-width: 940px; color: #4A5068; }
  .globe { position: absolute; right: -150px; bottom: -190px; width: 520px; height: 520px; opacity: .10; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #C4411F; }
</style>
</head>
<body>
  <svg class="globe" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="#14213D" stroke-width="5"/><ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke="#14213D" stroke-width="5"/><line x1="8" y1="60" x2="112" y2="60" stroke="#14213D" stroke-width="5"/></svg>
  <div class="page">
    <div class="top">
      <img src="../../../gv-logo-dark.png" alt="Global Village">
      <span class="kicker">Analysis in five languages</span>
    </div>
    <h1>Understand the world through the lens of liberal democracy</h1>
    <p>Analysts, think tanks, publications and films, each piece summarised in your language with a link to the original.</p>
  </div>
  <div class="band"></div>
</body>
</html>
