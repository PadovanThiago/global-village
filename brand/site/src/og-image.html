<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Prévia de link do site, 1200 × 630. Segue o componente Cover do Villa: a fachada em blocos à direita e o nome em Newsreader à esquerda. */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Archivo"; src: url("../../../fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #F3EBDD; color: #1E1A16; overflow: hidden; }
  svg.fachada { position: absolute; inset: 0; }
  .txt { position: absolute; left: 72px; top: 72px; bottom: 72px; width: 560px; display: flex; flex-direction: column; }
  .rotulo { font: 700 16px/20px Archivo, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #5E5547; }
  .nome { font: 500 132px/.92 Newsreader, Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -2.5px; margin-top: auto; }
  .linha { font: 400 24px/34px Newsreader, serif; font-style: normal; font-variation-settings: "opsz" 16; color: #5E5547; margin-top: 24px; max-width: 520px; }
</style>
</head>
<body>
  <svg class="fachada" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
    <rect x="680" y="0" width="360" height="630" fill="#C19440"/>
    <g fill="#415E3A">
      <rect x="728" y="124" width="48" height="72"/><rect x="836" y="124" width="48" height="72"/><rect x="944" y="124" width="48" height="72"/>
      <rect x="728" y="279" width="48" height="72"/><rect x="836" y="279" width="48" height="72"/><rect x="944" y="279" width="48" height="72"/>
      <rect x="728" y="434" width="48" height="72"/><rect x="836" y="434" width="48" height="72"/><rect x="944" y="434" width="48" height="72"/>
    </g>
    <rect x="1040" y="0" width="160" height="380" fill="#1E1A16"/>
    <rect x="1040" y="380" width="160" height="250" fill="#E8DCC6"/>
    <line x1="1040" y1="530" x2="1200" y2="530" stroke="#CDBFA6" stroke-width="1"/>
  </svg>
  <div class="txt">
    <span class="rotulo">Analysis in five languages</span>
    <div class="nome">Global<br>Village</div>
    <p class="linha">The contemporary world through the lens of liberal democracy.</p>
  </div>
</body>
</html>
