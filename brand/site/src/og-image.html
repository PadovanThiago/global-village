<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Prévia de link do site, 1200 × 630, na identidade do Villa. */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Archivo"; src: url("../../../fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #F3EBDD; color: #1E1A16; overflow: hidden; }
  .page { position: absolute; inset: 0; padding: 60px 72px 0; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1E1A16; padding-bottom: 22px; }
  .top img { height: 64px; display: block; }
  .kicker { font: 700 19px/1 Archivo, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #415E3A; }
  h1 { font: 500 76px/1.02 Newsreader, Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -.01em; margin: 44px 0 0; max-width: 1000px; }
  p { font: 400 28px/1.4 Newsreader, serif; font-variation-settings: "opsz" 16; margin: 24px 0 0; max-width: 940px; color: #5E5547; }
  .globe { position: absolute; right: -150px; bottom: -190px; width: 520px; height: 520px; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #C19440; }
</style>
</head>
<body>
  <svg class="globe" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="#CDBFA6" stroke-width="3"/><ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke="#CDBFA6" stroke-width="3"/><line x1="8" y1="60" x2="112" y2="60" stroke="#CDBFA6" stroke-width="3"/></svg>
  <div class="page">
    <div class="top">
      <img src="../../../gv-logo-dark.png" alt="Global Village">
      <span class="kicker">Analysis in five languages</span>
    </div>
    <h1>Understand the world through the lens of liberal democracy</h1>
    <p>Analysts, think tanks, publications and films, each piece summarised in your language with a link to the original.</p>
  </div>
  <div class="band"></div>
</body>
</html>
