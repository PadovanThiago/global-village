<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Capa da edição especial "Como fazer guerra às democracias sem disparar um tiro diretamente", 1200 × 600.
     Segue o CabecalhoArtigo do Villa à esquerda e leva uma ilustração própria sobre ocre-airbel à direita.
     O violeta-carimbo aparece uma vez, no carimbo USO CIVIL do caixote. */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Archivo"; src: url("../../../fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Courier Prime"; src: url("../../../fonts/CourierPrime-Bold.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; width: 1200px; height: 600px; background: #F3EBDD; color: #1E1A16; overflow: hidden; font-family: Archivo, sans-serif; }
  .texto { position: absolute; left: 0; top: 0; width: 700px; height: 600px; padding: 48px 48px 44px 64px; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .rotulo { display: inline-flex; align-items: center; gap: 10px; font: 700 17px/20px Archivo, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #5E5547; }
  .rotulo svg { height: 22px; width: auto; fill: #1E1A16; }
  .rotulo .sep { color: #CDBFA6; }
  .data { font: 700 18px/22px "Courier Prime", monospace; letter-spacing: 1.2px; color: #5E5547; }
  h1 { font: 500 58px/1.04 Newsreader, Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -.4px; margin: 30px 0 0; }
  hr { border: 0; border-top: 1px solid #CDBFA6; margin: auto 0 0; width: 100%; }
  .nums { display: flex; gap: 22px; padding-top: 14px; }
  .n { flex: 1; min-width: 0; }
  .n b { display: block; font: 700 30px/30px Archivo, sans-serif; color: #7A5718; }
  .n span { display: block; margin-top: 8px; font: 400 17px/22px Newsreader, serif; font-variation-settings: "opsz" 16; }
  .arte { position: absolute; right: 0; top: 0; width: 500px; height: 600px; background: #C19440; }
  .arte svg { display: block; }
</style>
</head>
<body>
  <div class="texto">
    <div class="top">
      <span class="rotulo"><svg viewBox="-6 -6 100 112" aria-hidden="true"><polygon points="35,0 53,0 88,100 70,100 44,24 18,100 0,100"/><circle cx="44" cy="61" r="8"/><polygon points="41.0,64.2 47.0,64.2 50.5,88 37.5,88"/></svg>Global Village <span class="sep">·</span> Edição especial</span>
      <span class="data">25.XI.2026</span>
    </div>
    <h1>Como fazer guerra às democracias sem disparar um tiro diretamente</h1>
    <hr>
    <div class="nums">
      <div class="n"><b>~90%</b><span>dos componentes críticos dos drones russos vêm da China</span></div>
      <div class="n"><b>80%+</b><span>do petróleo que o Irã exportava por mar ia para a China</span></div>
      <div class="n"><b>~200</b><span>militares russos treinados em bases chinesas em 2025</span></div>
    </div>
  </div>

  <div class="arte">
    <svg width="500" height="600" viewBox="0 0 500 600" aria-hidden="true">
      <!-- drone de asa delta saindo do caixote -->
      <g transform="translate(352 128) rotate(32)">
        <rect x="-7" y="-62" width="14" height="112" fill="#1E1A16"/>
        <polygon points="0,-40 62,34 62,44 0,30 -62,44 -62,34" fill="#1E1A16"/>
        <rect x="56" y="22" width="9" height="30" fill="#1E1A16"/>
        <rect x="-65" y="22" width="9" height="30" fill="#1E1A16"/>
        <rect x="-18" y="52" width="36" height="7" fill="#1E1A16"/>
      </g>
      <!-- rastro -->
      <g stroke="#1E1A16" stroke-width="4" stroke-linecap="butt">
        <line x1="318" y1="206" x2="298" y2="238"/>
        <line x1="300" y1="196" x2="282" y2="224"/>
        <line x1="336" y1="214" x2="320" y2="240"/>
      </g>
      <!-- caixote -->
      <g>
        <rect x="80" y="318" width="340" height="212" fill="#E8DCC6" stroke="#1E1A16" stroke-width="4"/>
        <line x1="80" y1="388" x2="420" y2="388" stroke="#1E1A16" stroke-width="3"/>
        <line x1="80" y1="458" x2="420" y2="458" stroke="#1E1A16" stroke-width="3"/>
        <!-- tampa entreaberta -->
        <polygon points="70,318 250,318 262,296 82,296" fill="#E8DCC6" stroke="#1E1A16" stroke-width="4"/>
        <polygon points="300,318 430,318 446,250 316,250" fill="#E8DCC6" stroke="#1E1A16" stroke-width="4"/>
        <!-- etiqueta -->
        <rect x="112" y="404" width="168" height="40" fill="#F3EBDD" stroke="#1E1A16" stroke-width="3"/>
        <text x="196" y="430" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="17" letter-spacing="2.4" fill="#1E1A16">PEÇAS</text>
        <!-- carimbo -->
        <g transform="translate(330 492) rotate(-9)">
          <rect x="-92" y="-26" width="184" height="52" fill="none" stroke="#55478A" stroke-width="4"/>
          <text x="0" y="9" text-anchor="middle" font-family="Courier Prime" font-weight="700" font-size="26" letter-spacing="2" fill="#55478A">USO CIVIL</text>
        </g>
      </g>
      <!-- pomba pousada na tampa, com o ramo -->
      <g transform="translate(120 296)">
        <path d="M0,0 C6,-30 30,-46 58,-44 C70,-58 88,-60 98,-50 L114,-48 L100,-40 C102,-22 92,-4 70,0 Z" fill="#F3EBDD" stroke="#1E1A16" stroke-width="4" stroke-linejoin="miter"/>
        <path d="M22,-12 C34,-40 60,-48 78,-34 C62,-30 44,-20 22,-12 Z" fill="#E8DCC6" stroke="#1E1A16" stroke-width="3"/>
        <rect x="88" y="-48" width="5" height="5" fill="#1E1A16"/>
        <line x1="112" y1="-47" x2="146" y2="-58" stroke="#415E3A" stroke-width="4"/>
        <polygon points="124,-52 132,-66 136,-56" fill="#415E3A"/>
        <polygon points="134,-56 146,-68 146,-58" fill="#415E3A"/>
        <polygon points="126,-50 136,-42 138,-52" fill="#415E3A"/>
        <line x1="44" y1="0" x2="40" y2="8" stroke="#1E1A16" stroke-width="4"/>
        <line x1="60" y1="0" x2="58" y2="8" stroke="#1E1A16" stroke-width="4"/>
      </g>
    </svg>
  </div>
</body>
</html>
