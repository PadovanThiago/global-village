<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600;700&display=block">
<style>
  /* Imagem de abertura de uma edição, 1200 × 600. O conteúdo vem da URL:
     edicao.html?data=27%20de%20outubro%20de%202026&titulo=...&fato=...&fato=...  (de 3 a 5 "fato") */
  html, body { margin: 0; width: 1200px; height: 600px; background: #14213D; color: #F5F2EA; overflow: hidden; font-family: Inter, sans-serif; }
  .globe { position: absolute; right: 64px; top: 108px; width: 248px; height: 248px; opacity: .22; }
  .page { position: absolute; inset: 0; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { height: 52px; }
  .date { font-weight: 700; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: #E8A08A; }
  h1 { font: 600 76px/1.02 Fraunces, Georgia, serif; font-variation-settings: "opsz" 144; letter-spacing: -.02em; margin: 52px 0 0; max-width: 860px; }
  h1.long { font-size: 64px; }
  .topics { margin-top: auto; display: flex; gap: 20px; }
  .t { flex: 1; min-width: 0; border-top: 3px solid #C4411F; padding-top: 14px; }
  .t b { display: block; font: 600 34px/1 Fraunces, Georgia, serif; color: #E8A08A; }
  .t span { display: block; margin-top: 8px; font-weight: 600; font-size: 20px; line-height: 1.3; }
  .many .t span { font-size: 17px; }
</style>
</head>
<body>
  <svg class="globe" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="#F5F2EA" stroke-width="3"/><ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke="#F5F2EA" stroke-width="3"/><line x1="8" y1="60" x2="112" y2="60" stroke="#F5F2EA" stroke-width="3"/></svg>
  <div class="page">
    <div class="top"><img src="../../../gv-logo-light.png" alt="Global Village"><span class="date" id="date"></span></div>
    <h1 id="title"></h1>
    <div class="topics" id="topics"></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const fatos = q.getAll("fato").slice(0, 5);
  document.getElementById("date").textContent = q.get("data") || "";
  const h = document.getElementById("title");
  h.textContent = q.get("titulo") || "";
  if (h.textContent.length > 40) h.classList.add("long");
  const box = document.getElementById("topics");
  if (fatos.length > 3) box.classList.add("many");
  fatos.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "t";
    const n = document.createElement("b"); n.textContent = "0" + (i + 1);
    const s = document.createElement("span"); s.textContent = f;
    d.append(n, s); box.append(d);
  });
</script>
</body>
</html>
