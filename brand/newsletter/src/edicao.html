<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600;700&display=block">
<style>
  /* Imagem de abertura de uma edição, 1200 × 600. O conteúdo vem da URL:
     edicao.html?data=27%20de%20outubro%20de%202026&titulo=...&fato=...&fato=...  (de 3 a 5 "fato")
     Opcionais, para a capa mudar de um dia para o outro:
       paleta=noite | papel | terracota | oliva   (fundo; noite é a padrão)
       imagem=<endereço file:// ou https>        (charge, meme, post ou foto do dia, à direita)
       credito=<texto>                            (crédito da imagem, sempre visível)
       enquadre=post                              (mostra a imagem inteira, sem cortar, para posts e charges) */
  :root { --fundo: #14213D; --texto: #F5F2EA; --data: #E8A08A; --linha: #C4411F; --num: #E8A08A; --globo: #F5F2EA; }
  body.papel { --fundo: #F5F2EA; --texto: #14213D; --data: #C4411F; --linha: #C4411F; --num: #C4411F; --globo: #14213D; }
  body.terracota { --fundo: #C4411F; --texto: #F5F2EA; --data: #14213D; --linha: #14213D; --num: #14213D; --globo: #F5F2EA; }
  body.oliva { --fundo: #2F3B2A; --texto: #F5F2EA; --data: #D9C27A; --linha: #D9C27A; --num: #D9C27A; --globo: #F5F2EA; }
  html, body { margin: 0; width: 1200px; height: 600px; background: var(--fundo); color: var(--texto); overflow: hidden; font-family: Inter, sans-serif; }
  .globe { position: absolute; right: 64px; top: 108px; width: 248px; height: 248px; opacity: .22; }
  .globe * { stroke: var(--globo); }
  .page { position: absolute; inset: 0; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { height: 52px; }
  .logo-escuro { display: none; }
  body.papel .logo-claro { display: none; }
  body.papel .logo-escuro { display: block; }
  .date { font-weight: 700; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--data); }
  h1 { font: 600 76px/1.02 Fraunces, Georgia, serif; font-variation-settings: "opsz" 144; letter-spacing: -.02em; margin: 52px 0 0; max-width: 860px; }
  h1.long { font-size: 64px; }
  .topics { margin-top: auto; display: flex; gap: 20px; }
  .t { flex: 1; min-width: 0; border-top: 3px solid var(--linha); padding-top: 14px; }
  .t b { display: block; font: 600 34px/1 Fraunces, Georgia, serif; color: var(--num); }
  .t span { display: block; margin-top: 8px; font-weight: 600; font-size: 20px; line-height: 1.3; }
  .many .t span { font-size: 17px; }

  /* Com imagem: a imagem ocupa a direita, e os fatos viram uma lista à esquerda. */
  .foto { display: none; position: absolute; top: 0; right: 0; bottom: 0; width: 520px; background: #0b1324; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .post .foto { background: #fff; }
  .post .foto img { object-fit: contain; }
  .credito { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 18px 10px; font-size: 13px; font-weight: 600; color: #F5F2EA;
             background: linear-gradient(transparent, rgba(0,0,0,.72)); }
  body.com-imagem .foto { display: block; }
  body.com-imagem .globe { display: none; }
  body.com-imagem .page { right: 520px; padding-right: 40px; }
  body.com-imagem .top { flex-direction: column; align-items: flex-start; gap: 18px; }
  body.com-imagem h1 { font-size: 54px; margin-top: 30px; max-width: none; }
  body.com-imagem h1.long { font-size: 46px; }
  body.com-imagem .topics { flex-direction: column; gap: 8px; }
  body.com-imagem .t { display: flex; align-items: baseline; gap: 14px; border-top: 0; padding-top: 0; }
  body.com-imagem .t b { font-size: 22px; flex: none; }
  body.com-imagem .t span { margin-top: 0; font-size: 18px; line-height: 1.25; }
  body.com-imagem .many .t span { font-size: 16px; }
</style>
</head>
<body>
  <svg class="globe" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke-width="3"/><ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke-width="3"/><line x1="8" y1="60" x2="112" y2="60" stroke-width="3"/></svg>
  <div class="foto"><img id="img" alt=""><div class="credito" id="credito"></div></div>
  <div class="page">
    <div class="top"><img class="logo-claro" src="../../../gv-logo-light.png" alt="Global Village"><img class="logo-escuro" src="../../../gv-logo-dark.png" alt="Global Village"><span class="date" id="date"></span></div>
    <h1 id="title"></h1>
    <div class="topics" id="topics"></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const fatos = q.getAll("fato").slice(0, 5);
  const paleta = q.get("paleta");
  if (["papel", "terracota", "oliva"].includes(paleta)) document.body.classList.add(paleta);
  const imagem = q.get("imagem");
  if (imagem) {
    document.body.classList.add("com-imagem");
    if (q.get("enquadre") === "post") document.body.classList.add("post");
    document.getElementById("img").src = imagem;
    document.getElementById("credito").textContent = q.get("credito") || "";
  }
  document.getElementById("date").textContent = q.get("data") || "";
  const h = document.getElementById("title");
  h.textContent = q.get("titulo") || "";
  if (h.textContent.length > 40) h.classList.add("long");
  const box = document.getElementById("topics");
  if (fatos.length > 3) box.classList.add("many");
  fatos.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "t";
    const n = document.createElement("b"); n.textContent = "0" + (i + 1);
    const s = document.createElement("span"); s.textContent = f;
    d.append(n, s); box.append(d);
  });
</script>
</body>
</html>
