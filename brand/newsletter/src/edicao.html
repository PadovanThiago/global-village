<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Imagem de abertura de uma edição, 1200 × 600, na identidade do Villa. O conteúdo vem da URL:
     edicao.html?data=27%20de%20outubro%20de%202026&titulo=...&fato=...&fato=...  (de 3 a 5 "fato")
     A data sai em Courier Prime e violeta-carimbo, a única marca de carimbo da peça. */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Archivo"; src: url("../../../fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Courier Prime"; src: url("../../../fonts/CourierPrime-Bold.woff2") format("woff2"); font-weight: 700; }
  html, body { margin: 0; width: 1200px; height: 600px; background: #F3EBDD; color: #1E1A16; overflow: hidden; font-family: Archivo, sans-serif; }
  .globe { position: absolute; right: 64px; top: 112px; width: 248px; height: 248px; }
  .page { position: absolute; inset: 0; padding: 56px 64px; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #1E1A16; padding-bottom: 20px; }
  .top img { height: 52px; }
  .date { font: 700 22px/1 "Courier Prime", monospace; letter-spacing: .06em; text-transform: uppercase; color: #55478A; }
  h1 { font: 500 74px/1.02 Newsreader, Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -.01em; margin: 44px 0 0; max-width: 860px; }
  h1.long { font-size: 62px; }
  .topics { margin-top: auto; display: flex; gap: 20px; }
  .t { flex: 1; min-width: 0; border-top: 6px solid #C19440; padding-top: 14px; }
  .t b { display: block; font: 700 30px/1 Archivo, sans-serif; color: #7A5718; }
  .t span { display: block; margin-top: 8px; font-weight: 600; font-size: 20px; line-height: 1.3; }
  .many .t span { font-size: 17px; }
</style>
</head>
<body>
  <svg class="globe" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" fill="none" stroke="#CDBFA6" stroke-width="3"/><ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke="#CDBFA6" stroke-width="3"/><line x1="8" y1="60" x2="112" y2="60" stroke="#CDBFA6" stroke-width="3"/></svg>
  <div class="page">
    <div class="top"><img src="../../../gv-logo-dark.png" alt="Global Village"><span class="date" id="date"></span></div>
    <h1 id="title"></h1>
    <div class="topics" id="topics"></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  const fatos = q.getAll("fato").slice(0, 5);
  document.getElementById("date").textContent = q.get("data") || "";
  const h = document.getElementById("title");
  h.textContent = q.get("titulo") || "";
  if (h.textContent.length > 40) h.classList.add("long");
  const box = document.getElementById("topics");
  if (fatos.length > 3) box.classList.add("many");
  fatos.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "t";
    const n = document.createElement("b"); n.textContent = "0" + (i + 1);
    const s = document.createElement("span"); s.textContent = f;
    d.append(n, s); box.append(d);
  });
</script>
</body>
</html>
