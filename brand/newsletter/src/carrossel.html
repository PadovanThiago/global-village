<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Slide do carrossel do Instagram, 1080 × 1350, no sistema do Villa. O conteúdo vem da URL em ?d=<JSON em base64 UTF-8>.
     Tipos: "capa" (janela de aviso, para a piada do dia), "fato" (título, blocos e números), "duelo" (duas vozes) e "fim".
     Cantos retos, sem sombra, sem degradê. Ocre-airbel só como preenchimento; violeta-carimbo só na data. */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Newsreader"; font-style: italic; src: url("../../../fonts/Newsreader-Italic-Variable.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Archivo"; src: url("../../../fonts/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Courier Prime"; src: url("../../../fonts/CourierPrime-Bold.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Courier Prime"; src: url("../../../fonts/CourierPrime-Regular.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; width: 1080px; height: 1350px; background: #F3EBDD; color: #1E1A16; overflow: hidden; font-family: Archivo, sans-serif; }
  body.verde { background: #415E3A; color: #F3EBDD; }
  .page { position: absolute; inset: 0; padding: 72px 80px; box-sizing: border-box; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 56px; }
  .rotulo { display: inline-flex; align-items: center; gap: 12px; font: 700 22px/26px Archivo, sans-serif; letter-spacing: 2.5px; text-transform: uppercase; color: #5E5547; }
  .rotulo svg { height: 30px; width: auto; fill: #1E1A16; }
  .verde .rotulo { color: #F3EBDD; } .verde .rotulo svg { fill: #F3EBDD; }
  .carimbo { font: 700 24px/28px "Courier Prime", monospace; letter-spacing: 1.5px; color: #55478A; }
  .num { font: 700 24px/28px Archivo, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #7A5718; }
  .kicker { font: 700 22px/26px Archivo, sans-serif; letter-spacing: 2.5px; text-transform: uppercase; color: #7A5718; margin-bottom: 20px; }
  .faixa { display: inline-block; background: #C19440; color: #1E1A16; padding: 8px 14px; }
  h1 { font: 500 78px/1.02 Newsreader, Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -.6px; margin: 0 0 40px; }
  h1.m { font-size: 66px; }
  .bloco { margin-bottom: 30px; }
  .bloco b { display: block; font: 700 20px/24px Archivo, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #5E5547; margin-bottom: 10px; }
  .bloco p { margin: 0; font: 400 33px/1.32 Newsreader, serif; font-variation-settings: "opsz" 24; }
  .solto .bloco { margin-bottom: 44px; } .solto .bloco p { font-size: 40px; } .solto h1 { font-size: 86px; margin-bottom: 56px; }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid #1E1A16; margin-top: auto; }
  .nums div { padding: 22px 20px 0 0; }
  .nums strong { display: block; font: 700 58px/1 Archivo, sans-serif; color: #7A5718; }
  .nums span { display: block; margin-top: 10px; font: 400 24px/1.25 Newsreader, serif; }
  .fonte { margin-top: auto; padding-top: 24px; border-top: 1px solid #CDBFA6; font: 400 21px/1.35 "Courier Prime", monospace; color: #5E5547; }
  .nums + .fonte { margin-top: 28px; }

  .janela { border: 3px solid #1E1A16; background: #F3EBDD; margin: 10px 0 56px; }
  .barra { background: #C19440; border-bottom: 3px solid #1E1A16; display: flex; justify-content: space-between; padding: 14px 22px; font: 700 24px/28px "Courier Prime", monospace; }
  .corpo { padding: 36px 36px 36px; }
  .corpo .msg { font: 500 62px/1.05 Newsreader, Georgia, serif; font-variation-settings: "opsz" 60; margin: 0 0 22px; }
  .corpo .det { font: 400 25px/1.5 "Courier Prime", monospace; color: #5E5547; margin: 0 0 34px; }
  .botoes { display: flex; gap: 18px; justify-content: flex-end; }
  .b { font: 700 22px/26px Archivo, sans-serif; letter-spacing: 1.2px; text-transform: uppercase; padding: 16px 24px; border: 3px solid #1E1A16; }
  .b.p { background: #415E3A; color: #F3EBDD; border-color: #415E3A; }
  .capa h1 { font-size: 92px; margin-bottom: 18px; }
  .capa .sub { font: 400 30px/1.3 Newsreader, serif; color: #5E5547; }
  .arrasta { margin-top: auto; font: 700 22px/26px Archivo, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: #5E5547; }

  .duelo { display: grid; grid-template-rows: 1fr auto 1fr; flex: 1; }
  .voz { border: 2px solid #1E1A16; padding: 34px 36px; display: flex; flex-direction: column; }
  .voz.a { background: #E8DCC6; }
  .voz q { quotes: none; font: 500 44px/1.15 Newsreader, serif; font-variation-settings: "opsz" 48; margin-bottom: auto; }
  .voz small { display: block; margin-top: 24px; font: 700 21px/26px Archivo, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: #5E5547; }
  .vs { text-align: center; font: 700 26px/26px "Courier Prime", monospace; letter-spacing: 3px; padding: 22px 0; color: #7A5718; }

  .fim h1 { font-size: 96px; margin-top: auto; }
  .fim p { font: 400 34px/1.35 Newsreader, serif; margin: 0 0 18px; max-width: 860px; }
  .fim .url { margin-top: 40px; font: 700 26px/30px "Courier Prime", monospace; }
</style>
</head>
<body>
<div class="page" id="p"></div>
<script>
  const MONO = '<svg viewBox="-6 -6 100 112" aria-hidden="true"><polygon points="35,0 53,0 88,100 70,100 44,24 18,100 0,100"/><circle cx="44" cy="61" r="8"/><polygon points="41.0,64.2 47.0,64.2 50.5,88 37.5,88"/></svg>';
  const raw = new URLSearchParams(location.search).get("d") || "";
  const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(raw), c => c.charCodeAt(0))));
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const p = document.getElementById("p");
  const cab = right => `<div class="top"><span class="rotulo">${MONO}Global Village</span>${right}</div>`;
  if (d.tipo === "capa") {
    p.className = "page capa";
    p.innerHTML = cab(`<span class="carimbo">${esc(d.data)}</span>`) +
      `<div class="janela"><div class="barra"><span>${esc(d.barra)}</span><span>×</span></div><div class="corpo">
        <p class="msg">${esc(d.msg)}</p><p class="det">${d.det.map(esc).join("<br>")}</p>
        <div class="botoes">${d.botoes.map((b, i) => `<span class="b${i === d.botoes.length - 1 ? " p" : ""}">${esc(b)}</span>`).join("")}</div></div></div>
      <h1>${esc(d.titulo)}</h1><div class="sub">${esc(d.sub)}</div><div class="arrasta">${esc(d.arrasta)} →</div>`;
  } else if (d.tipo === "fato") {
    if (!d.nums) p.className = "page solto";
    p.innerHTML = cab(`<span class="num">${esc(d.n)}</span>`) +
      `<div class="kicker">${d.destaque ? `<span class="faixa">${esc(d.kicker)}</span>` : esc(d.kicker)}</div>
       <h1 class="${d.titulo.length > 42 ? "m" : ""}">${esc(d.titulo)}</h1>` +
      d.blocos.map(b => `<div class="bloco"><b>${esc(b[0])}</b><p>${esc(b[1])}</p></div>`).join("") +
      (d.nums ? `<div class="nums">${d.nums.map(x => `<div><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join("")}</div>` : "") +
      `<div class="fonte">${esc(d.fonte)}</div>`;
  } else if (d.tipo === "duelo") {
    p.innerHTML = cab(`<span class="num">${esc(d.n)}</span>`) +
      `<div class="kicker">${esc(d.kicker)}</div><h1 class="m">${esc(d.titulo)}</h1>
       <div class="duelo"><div class="voz a"><q>${esc(d.a[0])}</q><small>${esc(d.a[1])}</small></div>
       <div class="vs">× ${esc(d.vs || "OU")} ×</div>
       <div class="voz"><q>${esc(d.b[0])}</q><small>${esc(d.b[1])}</small></div></div>`;
  } else {
    document.body.className = "verde"; p.className = "page fim";
    p.innerHTML = cab("") + `<h1>${esc(d.titulo)}</h1>${d.linhas.map(l => `<p>${esc(l)}</p>`).join("")}<div class="url">${esc(d.url)}</div>`;
  }
</script>
</body>
</html>
