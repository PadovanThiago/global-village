<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Logotipo horizontal: símbolo + nome, na identidade do Villa. #light inverte as cores para fundos escuros. */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  html, body { margin: 0; width: 720px; height: 160px; background: transparent; overflow: hidden; }
  .lockup { height: 160px; display: flex; align-items: center; gap: 26px; padding-left: 8px; }
  .lockup svg { width: 120px; height: 120px; flex: none; }
  .name { font: 500 90px/1 "Newsreader", Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -0.01em; color: #1E1A16; white-space: nowrap; }
  .light .name { color: #F3EBDD; }
</style>
</head>
<body>
<div class="lockup" id="l">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="52" fill="none" stroke="#1E1A16" stroke-width="7"/>
    <ellipse cx="60" cy="60" rx="23" ry="52" fill="none" stroke="#1E1A16" stroke-width="7"/>
    <line x1="8" y1="60" x2="112" y2="60" stroke="#1E1A16" stroke-width="7"/>
    <circle id="d" cx="60" cy="60" r="13" fill="#C19440" stroke="#F3EBDD" stroke-width="5"/>
  </svg>
  <span class="name">Global Village</span>
</div>
<script>
  if (location.hash === "#light") {
    document.getElementById("l").classList.add("light");
    document.querySelectorAll("circle[fill=none], ellipse, line").forEach(e => e.setAttribute("stroke", "#F3EBDD"));
    document.getElementById("d").setAttribute("stroke", "#1E1A16");
  }
</script>
</body>
</html>
