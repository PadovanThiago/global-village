<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Logotipo do Global Village feito só com o sistema do Villa: o monograma do Villa (brand/villa/logos/villa-monograma.svg, copiado sem alteração)
     e o nome em Newsreader 500, como o nome Villa na capa do sistema. #light usa papel, para tinta e verde-veneziana. */
  @font-face { font-family: "Newsreader"; src: url("../../../fonts/Newsreader-Variable.woff2") format("woff2"); font-weight: 200 800; }
  html, body { margin: 0; width: 700px; height: 160px; background: transparent; overflow: hidden; }
  .lockup { height: 160px; display: flex; align-items: center; gap: 30px; padding-left: 8px; color: #1E1A16; }
  .lockup svg { height: 112px; width: auto; flex: none; fill: currentColor; }
  .name { font: 500 92px/1 "Newsreader", Georgia, serif; font-variation-settings: "opsz" 72; letter-spacing: -2px; white-space: nowrap; }
  .light { color: #F3EBDD; }
</style>
</head>
<body>
<div class="lockup" id="l">
  <svg viewBox="-6 -6 100 112" aria-hidden="true"><polygon points="35,0 53,0 88,100 70,100 44,24 18,100 0,100"/><circle cx="44" cy="63" r="6"/><circle cx="37.5" cy="68.5" r="5"/><circle cx="50.5" cy="68.5" r="5"/><circle cx="44" cy="70" r="5"/><polygon points="42.5,76 45.5,76 46.8,100 41.2,100"/><polygon points="43.2,86 44.8,87.6 37.6,73.6 36,74.6"/><polygon points="44.8,86 43.2,87.6 50.4,73.6 52,74.6"/></svg>
  <span class="name">Global Village</span>
</div>
<script>if (location.hash === "#light") document.getElementById("l").classList.add("light");</script>
</body>
</html>
